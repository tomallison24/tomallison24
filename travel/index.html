<!--
  Travel - a hub for every trip: flights, hotels and rental cars, read from the
  booking emails in Gmail, with live flight status and links to search for
  more on Google Flights, Google Hotels, Marriott and rental car sites.

  Data: bookings live in this browser's localStorage and, once connected, in
  a Google Sheet both phones share (the same set-up as Notes). Emails are read
  on the phone, straight from Gmail; nothing about them is sent anywhere but
  the bookings found in them. Code: app.js (the app) and parse.js (reading
  the emails).
  Two designs, picked in Settings > Design (../home/design.js, as in Clock):
  Vintage (mid-century modern, the default: the <style id="vintage"> block)
  and Standard (Sea glass: that block switched off, Notes' own style block,
  unchanged, plus a few pieces of its own at the end). The old Travel Vintage
  address opens this same app.
-->
<style>
/* Allison OS family look, shared with Mail and News: frosted glass over a slow aurora. */
:root{

  --accent:#3B7366; --on-accent:#FFFFFF; --cta:linear-gradient(100deg,#6FA597 0%,#8193BC 34%,#BE918F 67%,#BC9C68 100%); --cta-ink:#10181A; --accent-ink:#2B5A4F; --sel-ink:#24493F; --danger:#E5281D; --danger-ink:#AE2117; --flag:#D97706;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.86); --sheet:rgba(248,250,249,.90); --toast:rgba(255,255,255,.84);
  --gb-edge:rgba(255,255,255,.95); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 60%);
  --hair:rgba(60,60,67,.14); --hair-2:rgba(60,60,67,.09); --fill:rgba(118,118,128,.11); --pill:rgba(255,255,255,.96);
  --hi:rgba(255,255,255,.8); --lift:rgba(40,40,80,.08); --lift-strong:rgba(40,40,80,.16);
  --scrim:rgba(0,0,0,.22); --grab:rgba(60,60,67,.30); --ring:rgba(60,60,67,.32);
  --tint-mix:16%; --note-mix:30%; --tl:32%; --aurora:.40; --mark:rgba(255,204,0,.45);
  --blur:blur(30px) saturate(180%); --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --flag-tint:#C8913F; --arch-tint:#8C79CF; --bin-tint:#C9625B; --tag-tint:#7B6CF6;
  --flag-ink:#855412; --arch-ink:#5A45B0; --bin-ink:#9E3A32; --tag-ink:#4A3FC4; --gi-mix:18%;
  --icon:#3B7366; --accent-text:#3B7366; --danger-text:#AE2117;
  --bar-top:rgba(255,255,255,.16); --bar-bottom:rgba(255,255,255,.05); --bar-rim:rgba(255,255,255,.85); --bar-solid:rgba(247,249,248,.97);
  --seg-thumb:rgba(255,255,255,.92); --gb-shadow:0 4px 14px rgba(40,40,80,.10);
  --lg-bg:linear-gradient(180deg,var(--bar-top),var(--bar-bottom)); --lg-filter:blur(14px) saturate(190%) brightness(1.04);
  --lg-rim:inset 0 0 0 1px var(--bar-rim),inset 0 1px 1px var(--hi);
  --n-yellow:#FFCC00; --n-green:#34C759; --n-blue:#0A84FF; --n-pink:#FF2D55; --n-purple:#AF52DE;
  /* Cards: very faint tiles, the same in every AllisonOS app */
  --tile:rgba(255,255,255,.40); --tile-edge:rgba(60,60,67,.10);
}

  --flag-ink:#EBC68F; --arch-ink:#CDBEF3; --bin-ink:#F0A9A3; --tag-ink:#D9D3FF; --gi-mix:30%;

}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1213; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.55);
  --accent:#A9D3C7; --on-accent:#10181A; --cta:linear-gradient(100deg,#A9D3C7 0%,#B9C6E0 34%,#E3C5C3 67%,#E9D6B4 100%); --accent-ink:#FFFFFF; --sel-ink:#FFFFFF; --danger:#FF453A; --danger-ink:#FFFFFF; --flag:#FF9F0A;
  --glass:rgba(16,22,23,.46); --glass-2:rgba(34,42,43,.72); --sheet:rgba(24,31,32,.80); --toast:rgba(26,33,34,.62);
  --gb-edge:rgba(255,255,255,.16); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
  --hair:rgba(255,255,255,.11); --hair-2:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07); --pill:rgba(255,255,255,.13);
  --hi:rgba(255,255,255,.10); --lift:rgba(0,0,0,.38); --lift-strong:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.45); --grab:rgba(255,255,255,.25); --ring:rgba(255,255,255,.32);
  --tint-mix:42%; --note-mix:24%; --tl:80%; --aurora:.72; --mark:rgba(255,204,0,.35);
  --flag-ink:#EBC68F; --arch-ink:#CDBEF3; --bin-ink:#F0A9A3; --tag-ink:#D9D3FF; --gi-mix:30%;

*{box-sizing:border-box}
[hidden]{display:none!important}
/* Laid out like Mail, News and Home: the page itself scrolls, and the bottom
   bar is pinned above the home indicator. */
html{background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- glass ---- */
.glass{background:var(--gb-shine),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--gb-edge);box-shadow:inset 0 1px 0 var(--hi),0 16px 40px var(--lift)}
.glass-strong{background:var(--sheet);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);
  box-shadow:0 -14px 44px var(--lift-strong),inset 0 1px 0 var(--hi)}

/* ---- app shell + the light behind the glass ---- */
.app{position:relative;width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:clip;background:var(--bg);isolation:isolate}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(58px);opacity:var(--aurora);will-change:transform}
.ambient i:nth-child(1){width:109.2%;aspect-ratio:1;left:-22.8%;top:-3.2%;background:radial-gradient(circle,#6FA597 0%,rgba(111,165,151,0) 68%);animation:drift1 34s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:92.4%;aspect-ratio:1;right:-17.2%;top:8%;background:radial-gradient(circle,#BE918F 0%,rgba(190,145,143,0) 68%);animation:drift2 41s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:120.4%;aspect-ratio:1;right:-20%;bottom:-6%;background:radial-gradient(circle,#8193BC 0%,rgba(129,147,188,0) 68%);animation:drift3 47s ease-in-out infinite alternate}
.ambient i:nth-child(4){width:86.8%;aspect-ratio:1;left:-17.2%;bottom:13.6%;background:radial-gradient(circle,#BC9C68 0%,rgba(188,156,104,0) 68%);animation:drift4 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14%,10%,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-12%,16%,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(-16%,-12%,0) scale(1.22)}}
@keyframes drift4{to{transform:translate3d(18%,-14%,0) scale(1.15)}}

.view{display:block}
.top{padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:fadeDown .5s var(--ease) both}
.titlerow{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.title{margin:0;flex:1;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.title small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--faint);margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .18s var(--ease),color .2s}
.iconbtn:active{transform:scale(.9);color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
.iconbtn svg{width:19px;height:19px}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 14px;height:40px;color:var(--muted)}
.search svg{width:17px;height:17px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clear{background:var(--fill);color:var(--muted);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.search .clear svg{width:11px;height:11px;stroke-width:2.6}

/* ---- filters: one scrolling row of glass capsules ---- */
.chips{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px -14px 0;padding:3px 14px 5px}
.chips::-webkit-scrollbar{display:none}
.chip{--h:211;flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .25s,background .25s,border-color .25s,transform .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip .n{font-size:11px;color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.chip svg{width:15px;height:15px}
.chip i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 90% 62%);box-shadow:0 0 8px hsl(var(--h) 90% 62% / .6)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.chip[aria-pressed="true"]{color:var(--sel-ink);font-weight:600;
  background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--gb-edge))}
.chip.ghost{background:var(--fill);border:1px dashed var(--ring);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

/* tag chips inside cards and rows: coloured by hue, as in Mail */
.tchip{--h:211;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;
  color:hsl(var(--h) 90% var(--tl));background:hsl(var(--h) 90% 60% / .14);border:1px solid hsl(var(--h) 90% 60% / .32);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tchip.bare::before{display:none}
.tchip svg{width:11px;height:11px}
.tchip.over{--h:4}
.tchip.lst{color:var(--muted);background:var(--fill);border-color:var(--hair)}
.tchip.lst::before{background:var(--lc);box-shadow:0 0 6px var(--lc)}

/* segmented view switch (reminders), as in News */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;border-radius:14px;background:var(--fill);border:1px solid var(--hair-2)}
.seg button{border-radius:11px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s}
.seg button b{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.warn b{color:var(--danger)}

/* ---- content ---- */
.list{padding:6px 14px calc(192px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sechead{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:6px 4px 6px;display:flex;justify-content:space-between}
.resulthead{font-size:13px;color:var(--faint);margin:0 4px}
/* Two plain flex columns, not CSS multi-column: Safari can fail to draw
   frosted-glass cards that sit in the second column of a multi-column box. */
.grid{display:flex;gap:10px;align-items:flex-start}
.grid .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.card{margin:0;display:block;width:100%;text-align:left;border-radius:22px;padding:14px 14px 12px;color:var(--text);transition:transform .18s var(--ease)}
.card:active{transform:scale(.98)}
.card[data-color]:not([data-color="none"]){background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--note-mix),var(--glass));border-color:color-mix(in srgb,var(--tint) 35%,var(--gb-edge))}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.card h3 span{flex:1;overflow-wrap:anywhere}
.card h3 svg{width:14px;height:14px;color:var(--flag);margin-top:3px}
.card h3 svg.lk,.nrow .nt svg.lk{color:var(--icon)}
.opt svg.lk{width:15px;height:15px}
.card p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
mark{background:var(--mark);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:28px 20px;border-radius:24px;font-size:14px}
.empty strong{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
[data-color="yellow"]{--tint:var(--n-yellow)} [data-color="green"]{--tint:var(--n-green)} [data-color="blue"]{--tint:var(--n-blue)}
[data-color="pink"]{--tint:var(--n-pink)} [data-color="purple"]{--tint:var(--n-purple)} [data-color="none"]{--tint:transparent}
.enter .card,.enter .todo,.enter .rgroup{animation:rowIn .52s var(--ease) both;animation-delay:calc(var(--i,0) * 34ms)}

/* ---- reminders ---- */
.quickadd{display:flex;align-items:center;gap:10px;border-radius:999px;padding:5px 5px 5px 16px}
.quickadd input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;padding:8px 0}
.quickadd input::placeholder{color:var(--faint)}
.send{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--cta-ink);
  background:var(--cta);border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px color-mix(in srgb,var(--accent) 22%,transparent);transition:transform .18s var(--ease)}
.send:active{transform:scale(.88)}
.send svg{width:20px;height:20px;stroke-width:2.3}
.rgroup{border-radius:22px;overflow:hidden}
.rgroup > .sechead{margin:0;padding:13px 16px 9px}
.rgroup > .sechead.over{color:var(--danger)}
.todo{display:flex;gap:12px;padding:11px 12px 11px 16px;align-items:flex-start;border-top:1px solid var(--hair-2)}
.rgroup > .sechead + .todo{border-top:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--lc);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,transform .18s var(--ease)}
.check:active{transform:scale(.85)}
.check svg{width:14px;height:14px;stroke-width:3;opacity:0}
.check[aria-checked="true"]{background:var(--lc);box-shadow:0 0 12px color-mix(in srgb,var(--lc) 55%,transparent)}
.check[aria-checked="true"] svg{opacity:1;animation:pop .35s var(--ease)}
.tbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.tbody .t{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.tbody .n{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{display:flex;flex-wrap:wrap;gap:5px}
.todo.done .t{color:var(--faint);text-decoration:line-through}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:4px}
.prio{display:flex;gap:2px;align-items:flex-end;height:12px}
.prio i{width:3px;border-radius:2px;background:var(--ring)}
.prio i:nth-child(1){height:5px} .prio i:nth-child(2){height:8px} .prio i:nth-child(3){height:12px}
.prio.p1 i:nth-child(-n+1),.prio.p2 i:nth-child(-n+2),.prio.p3 i:nth-child(-n+3){background:var(--danger)}
.flag{color:var(--flag)}
.flag svg{fill:currentColor;width:15px;height:15px}
.morebtn{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--fill);border:1px solid var(--hair);transition:transform .18s var(--ease)}
.morebtn:active{transform:scale(.94)}

/* ---- floating capsules: sections + new, as in Mail's toolbar ---- */
.dock{position:fixed;left:0;right:0;max-width:560px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;z-index:5;pointer-events:none}
.dock > *{pointer-events:auto}
.tabs{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;box-shadow:inset 0 1px 0 var(--hi),0 10px 30px var(--lift-strong)}
.tab{height:44px;border-radius:999px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s,transform .18s var(--ease)}
.tab:active{transform:scale(.94)}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{background:var(--pill);color:var(--accent)}
.fab{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);
  background:var(--glass-2);border:1px solid var(--hair);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 10px 28px var(--lift-strong),inset 0 1px 0 var(--hi);transition:transform .2s var(--ease);animation:popIn .45s var(--ease) both}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.dockr{display:flex;align-items:center;gap:8px}
/* Ipsy, the helper (../home/ipsy.js): above the tabs at the bottom left, as the dock has no room beside them */
.ipsyslot{position:absolute;left:14px;bottom:calc(100% + 8px);width:78px;height:78px}
.ipsyslot:empty{display:none}
@media (max-width:389px){.tab svg{display:none}.tab{padding:0 14px}}
.fab.small{width:46px;height:46px}
.fab.small svg{width:21px;height:21px;stroke-width:1.9}
.linkbox{width:100%;border:1px solid var(--hair);background:var(--fill);border-radius:12px;padding:9px 11px;font-size:13px;color:var(--muted)}
#psText{min-height:180px;font-size:15px;color:var(--text)}

/* ---- sheets ---- */
.sheetwrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .3s ease both}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;border-bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;animation:sheetUp .46s var(--ease) both}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 24px)}
.sheetwrap{position:fixed;inset:auto 0 auto 0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
.notice{border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.notice span{flex:1}
.implist{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.implist li{margin:3px 0;overflow-wrap:anywhere}
/* drag a sheet down by its handle or title bar to close it, as in Mail */
.grab{width:38px;height:5px;border-radius:99px;background:var(--grab);margin:0 auto;padding:10px 60px 8px;background-clip:content-box;box-sizing:content-box;flex:none;cursor:grab}
.grab,.sheethead{touch-action:none;-webkit-user-select:none;user-select:none}
.sheet.dragging{animation:none;transition:none}
.sheet.settling{transition:transform .28s var(--ease)}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 8px 20px}
.sheethead h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheetbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.btn{--tint:var(--accent);position:relative;min-height:38px;padding:8px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--accent-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--tint-mix),transparent);border:1px solid color-mix(in srgb,var(--tint) 40%,var(--gb-edge));
  box-shadow:inset 0 1px 0 var(--hi);transition:transform .18s var(--ease),filter .2s}
.btn:active{transform:scale(.975);filter:brightness(.9)}
.btn.quiet{background:var(--gb-shine),var(--glass);border-color:var(--gb-edge);color:var(--text);font-weight:500}
.btn.danger{--tint:var(--danger);background:var(--gb-shine),color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-weight:500;min-height:48px}

/* editor pieces */
.paper{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.paper[data-color]:not([data-color="none"]){background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--note-mix),var(--glass));border-color:color-mix(in srgb,var(--tint) 35%,var(--gb-edge))}
.paper #edTitle{resize:none;overflow:hidden;min-height:0;line-height:1.2;border:0;background:none;outline:none;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0}
.paper textarea{border:0;background:none;outline:none;resize:none;min-height:40vh;overflow:hidden;font-size:17px;line-height:1.55;padding:0}
/* The note editor is a full page that slides in, like a message in Mail;
   the whole note scrolls as one page instead of inside a small box. */
.sheet.page{height:100%;max-height:none;max-width:none;border-radius:0;border:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(120% 55% at 0% 0%,color-mix(in srgb,#6FA597 calc(var(--aurora) * 32%),transparent),transparent 70%),
    radial-gradient(110% 50% at 100% 100%,color-mix(in srgb,#8193BC calc(var(--aurora) * 30%),transparent),transparent 70%),var(--bg);
  animation:pageIn .42s var(--ease) both}
.sheet.page .sheetbody{max-width:680px;width:100%;margin:0 auto}
#editor .scrim{display:none}
.pagehead{padding:6px 12px 6px 6px;touch-action:auto}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 4px;color:var(--accent);font-size:17px;font-weight:500}
.backbtn svg{width:24px;height:24px;stroke-width:2.2}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes pageIn{from{transform:translateX(100%)}to{transform:none}}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:0 4px}
.box{border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);background:var(--fill);border:1px solid var(--hair);transition:color .2s,background .2s,transform .18s var(--ease)}
.opt:active{transform:scale(.93)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{color:var(--sel-ink);font-weight:600;background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--gb-edge))}
.opt .sw{width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.opt.flagopt[aria-pressed="true"]{color:var(--flag);background:color-mix(in srgb,var(--flag) 16%,transparent);border-color:color-mix(in srgb,var(--flag) 40%,var(--gb-edge))}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inrow input[type="date"],.inrow input[type="time"],.inrow input[type="datetime-local"]{border:1px solid var(--hair);background:var(--fill);border-radius:12px;padding:7px 10px;font-size:15px;min-width:0}
.plain{border:0;background:none;outline:none;width:100%;padding:0;font-size:16px}
textarea.plain{resize:none;min-height:56px;font-size:15px;color:var(--muted)}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tchip{font-size:13px;padding:3px 4px 3px 10px}
.tagedit .tchip button{color:inherit;opacity:.7;padding:0 3px;display:grid;place-items:center}
.tagedit .tchip button svg{width:13px;height:13px}
.tagedit input{border:0;outline:none;background:none;flex:1;min-width:110px;font-size:15px;padding:4px 0}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:1px solid var(--gb-edge);background:color-mix(in srgb,var(--tint) 55%,var(--glass-2));box-shadow:inset 0 1px 0 var(--hi)}
.swatch[data-color="none"]{background:var(--glass-2)}
.swatch.list{background:var(--lc)}
.swatch[aria-checked="true"]{outline:2.5px solid var(--accent);outline-offset:2px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;font-size:15px;font-weight:600;border-top:1px solid var(--hair-2)}
.rowbtn:first-child{border-top:0}
.rowbtn:active{background:var(--fill)}
.rowbtn .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.rowbtn .sub{display:block;font-weight:400;color:var(--muted);font-size:13px}
.danger{color:var(--danger)}
.hint{font-size:12px;line-height:1.55;color:var(--faint);margin:0 4px}
.tagrow{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--hair-2)}
.tagrow:first-child{border-top:0}
.tagrow .grow{flex:1;min-width:0}
.tagrow .sub{font-size:12px;color:var(--faint)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:4px 6px}

/* toast: the same clear glass as the sheets, with their lit rim */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;width:max-content;max-width:calc(100% - 28px);
  display:flex;gap:12px;align-items:center;padding:12px 13px 12px 16px;border-radius:16px;font-size:14px;
  color:var(--text);background:linear-gradient(180deg,var(--lgs-top),var(--lgs-bottom));border:1px solid transparent;-webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);
  box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 12px 30px var(--lift-strong);transform:translateX(-50%);animation:toastIn .42s var(--ease) both}
.toast span{min-width:0}
.toast button{color:var(--accent);font-weight:600;flex:none;padding:3px 5px}

@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* ---- Notes home: collections, recent, archive, trash, tidy up ---- */
#collBack{margin-right:2px}
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctile,.nlist,.nlist > .sw,.nrow{min-width:0}
.ctile{--h:211;display:flex;flex-direction:column;gap:3px;min-height:82px;padding:11px 14px 10px;border-radius:22px;text-align:left;color:var(--text);transition:transform .18s var(--ease)}
.ctile:active{transform:scale(.97)}
.ctile .ctop{display:flex;align-items:center;justify-content:space-between}
.ctile i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 90% 62%);box-shadow:0 0 10px hsl(var(--h) 90% 62% / .6)}
.ctile.plain i{background:var(--ring);box-shadow:none}
.ctile .cn{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ctile .cname{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:auto}
.ctile .clast{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.nlist{display:flex;flex-direction:column}
.nlist > .sw + .sw,.nlist > .trow + .trow{border-top:1px solid var(--hair-2)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t d" "s s";gap:2px 10px;width:100%;text-align:left;padding:12px 16px;color:var(--text);background:var(--glass)}
.nrow .nt{grid-area:t;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.nrow .nt svg{width:13px;height:13px;color:var(--flag);flex:none}
.nrow .ns{grid-area:s;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .ns:empty{display:none}
.nrow .nd{grid-area:d;font-size:12px;color:var(--faint);align-self:center}
.cdate{display:block;margin-top:8px;font-size:11px;color:var(--faint)}
.morechips{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.chip .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700}
.trow{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px}
.trow .tt,.tidyrow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow .nt,.tidyrow .nt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nd{font-size:12px;color:var(--faint)}
.iconbtn.danger{color:var(--danger-text)}
.tidyrow{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid var(--hair-2)}
.tidyrow:first-child{border-top:0}
.tidyrow .nt{white-space:normal}
.tidyrow .ns{font-size:13px;color:var(--muted);line-height:1.4}
.tidyrow .textbtn{flex:none;max-width:48%;height:auto;min-height:36px;padding:6px 12px;line-height:1.2;white-space:normal;text-align:center;font-size:14px}
.empty.glass{border-radius:22px}
/* swiping a note, as in Mail */
.sw{position:relative}
.sw > .card,.sw > .nrow{position:relative;z-index:1;transition:transform .3s var(--ease)}
.sw-acts{position:absolute;inset:0;z-index:0}
.sw-l,.sw-r{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.sw-l{left:6px}
.sw-r{right:6px}
.sw.open-r .sw-l,.sw.open-l .sw-r{pointer-events:auto}
.sw.show-l .sw-l,.sw.open-r .sw-l,.sw.show-r .sw-r,.sw.open-l .sw-r{opacity:1}
.sa{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.sa .gi{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
  background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--gi-mix),transparent);border:1px solid color-mix(in srgb,var(--tint) 42%,var(--gb-edge));
  box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--lift);transition:transform .3s var(--ease)}
.sa .gi svg{width:22px;height:22px}
.sa:active .gi{transform:scale(.9)}
.sa.pin{--tint:var(--flag-tint);--ink:var(--flag-ink)}
.sa.tag{--tint:var(--tag-tint);--ink:var(--tag-ink)}
.sa.arch{--tint:var(--arch-tint);--ink:var(--arch-ink)}
.sa.bin{--tint:var(--bin-tint);--ink:var(--bin-ink)}
.sw.armed-l .sa.bin .gi,.sw.armed-r .sa.tag .gi{transform:scale(1.18)}
.sw.armed-l .sa.arch,.sw.armed-r .sa.pin{opacity:.35}

/* ---- "Updated" pill: once, the first time the app opens after an update ---- */
.updpill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 11px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--accent-text);background:var(--lg-bg);-webkit-backdrop-filter:var(--lg-filter);backdrop-filter:var(--lg-filter);
  box-shadow:var(--lg-rim),0 8px 24px var(--lift);transform:translateX(-50%);animation:updIn .5s var(--ease) both}
.updpill svg{width:17px;height:17px;color:var(--icon)}
.updpill.out{animation:updOut .45s ease both}
@keyframes updIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes updOut{to{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
/* ---- the busy pill: pulses, with the arrows turning, while Gmail is read ---- */
.syncpill{pointer-events:none;animation:updIn .5s var(--ease) both,syncPulse 1.6s ease-in-out .5s infinite}
.updpill:not([hidden]) + .syncpill{top:calc(env(safe-area-inset-top,0px) + 52px)}
.syncpill .spin{animation:syncTurn 1.1s linear infinite}
.syncpill .tick{display:none}
.syncpill.done{animation:updIn .01s both}
.syncpill.done .spin{display:none}
.syncpill.done .tick{display:block;animation:popIn .3s var(--ease) both}
.syncpill.out{animation:updOut .45s ease both}
@keyframes syncTurn{to{transform:rotate(360deg)}}
@keyframes syncPulse{50%{transform:translate(-50%,0) scale(1.05);box-shadow:var(--lg-rim),0 8px 24px var(--lift),0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.updpill,.toast{background:var(--bar-solid)}}
@media (prefers-reduced-transparency:reduce){.updpill,.toast{background:var(--bar-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ---- Icons and buttons: the same system as Mail ----
   Line icons on a 24px grid, 1.7 stroke with round ends (2.2 for chevrons,
   ticks and close); icons in a calm slate-teal, while text, dots and
   switches keep the blue; every button and bar in the same clear Liquid
   Glass. Sizes follow Mail: 22px icons in 36px header buttons, 24px in 38px
   page buttons, 31px in the 56px compose button, 21px in the search bar,
   20px in pill buttons. Last in the sheet so it wins. */
svg.b{stroke-width:2.2}
svg.f{fill:currentColor;stroke:none}
svg.fs{fill:currentColor}
.iconbtn,.textbtn,.pillbtn,.btn,.send,.fab,.search,.tabs,.seg,.quickadd,.arrow{
  background:var(--lg-bg);border:0;-webkit-backdrop-filter:var(--lg-filter);backdrop-filter:var(--lg-filter)}
.iconbtn{width:36px;height:36px;color:var(--icon);box-shadow:var(--lg-rim);transition:transform .18s var(--ease),background .2s,color .2s}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.9);background:var(--glass-2);color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
#edPin[aria-pressed="true"]{color:var(--flag)}
.pagehead .iconbtn{width:38px;height:38px}
.pagehead .iconbtn svg{width:24px;height:24px}
.pagehead{padding:6px 14px}
.textbtn{height:36px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--accent-text);box-shadow:var(--lg-rim);transition:transform .18s var(--ease)}
.textbtn:active{transform:scale(.93)}
.pillbtn{height:38px;padding:0 15px;gap:6px;font-size:14px;font-weight:600;color:var(--text);box-shadow:var(--lg-rim)}
.pillbtn svg{width:20px;height:20px;color:var(--icon)}
.pillbtn:active{transform:scale(.93);background:var(--glass-2)}
.pillbtn.bluec,.pillbtn.bluec svg{color:var(--accent-text)}
.pillbtn.bluec{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),inset 0 1px 1px var(--hi)}
.btn{--tint:var(--accent);color:var(--tint-text,var(--accent-text));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 42%,transparent),inset 0 1px 1px var(--hi),var(--gb-shadow)}
.btn.quiet{color:var(--text);font-weight:500;box-shadow:var(--lg-rim)}
.btn.quiet{background:var(--lg-bg)}
.btn.danger,.btn.quiet.danger{--tint:var(--danger);background:var(--lg-bg);color:var(--danger-text);min-height:50px;width:100%;font-weight:500;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 42%,transparent),inset 0 1px 1px var(--hi)}
.send{width:38px;height:38px;color:var(--accent-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),inset 0 1px 1px var(--hi)}
.send svg{width:22px;height:22px}
.fab{width:56px;height:56px;color:var(--icon);box-shadow:var(--lg-rim),0 8px 26px var(--lift)}
.fab svg{width:31px;height:31px;stroke-width:1.7}
.fab.small{width:46px;height:46px}
.fab.small svg{width:24px;height:24px}
.search{height:44px;padding:0 7px 0 15px;gap:9px;box-shadow:var(--lg-rim),0 6px 20px var(--lift);transition:box-shadow .25s}
.search:focus-within{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 65%,var(--bar-rim)),inset 0 1px 1px var(--hi),0 0 0 4px rgba(111,165,151,.14),0 6px 20px var(--lift)}
.search > svg{width:21px;height:21px;color:var(--icon)}
.search .clear{width:28px;height:28px;color:var(--muted);background:var(--fill)}
.search .clear svg{width:14px;height:14px}
.quickadd{box-shadow:var(--lg-rim),0 6px 20px var(--lift)}
.tabs{box-shadow:var(--lg-rim),0 10px 30px var(--lift-strong)}
.tab{color:var(--muted)}

body{font-family:"Futura","Futura-Medium","Avenir Next","Jost",system-ui,sans-serif}
.glass,.glass-strong{box-shadow:none}

/* the atomic shapes behind the title (they scroll away with the page) */
.ambient{position:absolute;inset:0 0 auto 0;height:270px;z-index:-1}
.ambient i,.ambient i:nth-child(n){filter:none;animation:none;opacity:var(--aurora);will-change:auto;aspect-ratio:auto}

/* buttons: flat cream discs, outlined teal, solid orange - no blur anywhere */
.iconbtn,.textbtn,.pillbtn,.fab,.tabs,.chip{-webkit-backdrop-filter:none;backdrop-filter:none}

.btn{min-height:50px;font-weight:600;letter-spacing:.02em;background:var(--cta);color:var(--cta-ink);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn:active{filter:brightness(.92)}

/* the dock: a cream pill, with a mustard thumb under the chosen section */
.tabs{background:var(--mc-card);box-shadow:inset 0 0 0 1.5px var(--mc-edge),0 10px 22px -12px var(--lift-strong)}
.tab{color:var(--muted);letter-spacing:.02em}
.tab svg{color:var(--icon)}
.tabs > .slthumb,.tab[aria-selected="true"]{background:var(--mc-mustard);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.tabs.slides .tab[aria-selected="true"]{background:none}
.tab[aria-selected="true"],.tab[aria-selected="true"] svg{color:var(--mc-on-mustard)}

/* the filter: cream pills, with a mustard thumb under the chosen one */
.chip{background:var(--mc-card);border:0;box-shadow:inset 0 0 0 1.5px var(--mc-edge);font-weight:600;letter-spacing:.04em}
.chips.slides .chip[aria-pressed="true"]{color:var(--mc-on-mustard);font-weight:600}
.chip[aria-pressed="true"]{color:var(--mc-on-mustard)}

.trip,.tl,.rgroup,.box,.form,.live,.empty,.empty.glass,.hero{background:var(--mc-card);box-shadow:none;border-radius:20px}
.empty{padding:26px 20px}

/* Tron: light cycles, after the Tron: Ares mode in Tesla's cars - dark only, as the car's screen goes, with red
   only for what's lit: a red light trail that runs around the screen behind everything (it shows in the margins, never
   over a card or an icon), a light racing along it, a faint grid floor under the title, and a glow on what's lit.
   Orbitron headings, Exo 2 for the rest (SIL Open Font License, ../home/fonts). Vintage's disc,
   dot and pill behind the title go: the car's screen is calm. */
@font-face{font-family:"Orbitron";font-style:normal;font-weight:700;font-display:swap;src:url("../home/fonts/orbitron-700-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@property --tr-a{syntax:'<angle>';inherits:false;initial-value:0deg}
:is(.title,.head h1,.top h1,header h1,.masthead h1,.hx-title,.sheethead h2,.ptitle){font-family:"Orbitron","Exo 2","Avenir Next",system-ui,sans-serif;font-weight:700;letter-spacing:.02em;font-size-adjust:.5}
:root{--tr-line:#FF2A2A;--tr-hot:#E9EDF1;--tr-glow:1;--tr-grid:rgba(255,42,42,.16);color-scheme:dark}
:root :is(.ambient i,.aurora b,.atoms b):nth-child(1),:root :is(.ambient i,.aurora b,.atoms b):nth-child(2),:root :is(.ambient i,.aurora b,.atoms b):nth-child(3){display:none}
:is(.ambient,.aurora,.atoms)::after{content:'';position:absolute;left:-30%;right:-30%;top:62%;height:110px;pointer-events:none;
  background:linear-gradient(90deg,var(--tr-grid) 1px,transparent 1px) 50% 0/24px 100%,linear-gradient(var(--tr-grid) 1px,transparent 1px) 0 0/100% 14px;
  transform:perspective(140px) rotateX(58deg);transform-origin:top;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
:root :is(body,#app.app){background:transparent}   /* the page's ground is <html>'s, so the trail (behind everything) shows */
:root::before,:root::after{content:'';position:fixed;inset:max(3px,env(safe-area-inset-top)) 4px max(4px,env(safe-area-inset-bottom)) 4px;z-index:-1;pointer-events:none;border-radius:30px}
:root::before{box-shadow:inset 0 0 0 1.5px rgba(255,42,42,.32),inset 0 0 14px rgba(255,42,42,.12),0 0 10px rgba(255,42,42,.18)}
:root::after{padding:2px;background:conic-gradient(from var(--tr-a),transparent 0 78%,rgba(255,42,42,.35) 90%,#FF2A2A 97%,#FFE1E1 98.4%,transparent 98.6%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  filter:drop-shadow(0 0 4px #FF2A2A);animation:trRun 7s linear infinite}
@keyframes trRun{to{--tr-a:360deg}}

<body>

<div class="app" id="app">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- TRIPS -->
  <section class="view" id="tripsView" aria-label="Trips">
    <header class="top">
      <div class="titlerow">
        <h1 class="title">Trips<small id="tripsSub"></small></h1>
        <div class="acts">
          <button class="iconbtn glass" id="scanBtn" type="button" aria-label="Look for new bookings in Gmail">
            <svg viewBox="0 0 24 24"><rect x="2.8" y="5" width="18.4" height="14" rx="3.4"/><path d="M3.6 7.4l7.2 5a2 2 0 0 0 2.4 0l7.2-5"/></svg>
          </button>
          <button class="iconbtn glass" id="setBtn" type="button" aria-label="Settings, sync and backup">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5l1.3 2.3 2.6-.7.6 2.6 2.6.6-.7 2.6 2.3 1.3-2.3 1.3.7 2.6-2.6.6-.6 2.6-2.6-.7L12 20.5l-1.3-2.3-2.6.7-.6-2.6-2.6-.6.7-2.6L3.5 12l2.3-1.3-.7-2.6 2.6-.6.6-2.6 2.6.7z"/></svg>
          </button>
        </div>
      </div>
      <div class="chips" id="whenChips" role="toolbar" aria-label="Which trips"></div>
    </header>
    <main class="list" id="list"></main>
  </section>

  <!-- EXPLORE: search the big sites for a new trip -->
  <section class="view" id="exploreView" aria-label="Explore" hidden>
    <header class="top">
      <div class="titlerow">
        <h1 class="title">Explore<small>Search flights, hotels and cars</small></h1>
      </div>
    </header>
    <main class="list">
      <form class="form glass" id="exForm" autocomplete="off" action="#">
        <div class="kv">
          <div class="f"><label for="exFrom">From</label><input id="exFrom" placeholder="City or airport" autocapitalize="characters" enterkeyhint="next"></div>
          <div class="f"><label for="exTo">To</label><input id="exTo" placeholder="City or airport" autocapitalize="characters" enterkeyhint="next"></div>
          <div class="f"><label for="exOut">Leaving</label><input id="exOut" type="date"></div>
          <div class="f"><label for="exBack">Coming back</label><input id="exBack" type="date"></div>
        </div>
        <button class="pillbtn swap" id="exSwap" type="button" aria-label="Swap from and to">
          <svg viewBox="0 0 24 24"><path d="M7 4.6v14.8"/><path d="M3.8 7.8L6.3 5.3a1 1 0 0 1 1.4 0l2.5 2.5"/><path d="M17 19.4V4.6"/><path d="M20.2 16.2l-2.5 2.5a1 1 0 0 1-1.4 0l-2.5-2.5"/></svg>Swap
        </button>
      </form>
      <p class="sechead"><span>Search on</span></p>
      <div class="rgroup glass" id="exLinks"></div>
    </main>
  </section>

  <!-- DOCK -->
  <div class="dock">
    <span class="ipsyslot" id="ipsySlot"></span>
    <nav class="tabs glass" role="tablist" aria-label="Sections">
      <button class="tab" type="button" role="tab" data-tab="trips" aria-selected="true">
        <svg viewBox="0 0 24 24"><rect x="3.4" y="7" width="17.2" height="12.8" rx="3.2"/><path d="M8.6 7V5.6a2 2 0 0 1 2-2h2.8a2 2 0 0 1 2 2V7"/><path d="M3.4 12.4h17.2"/></svg>Trips
      </button>
      <button class="tab" type="button" role="tab" data-tab="explore" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2z"/></svg>Explore
      </button>
    </nav>
    <div class="dockr">
      <button class="fab small" id="pasteBtn" type="button" aria-label="Paste a confirmation or a setup link">
        <svg viewBox="0 0 24 24"><rect x="5" y="4.2" width="14" height="17" rx="3.2"/><path d="M9 4.4A1.8 1.8 0 0 1 10.8 2.6h2.4A1.8 1.8 0 0 1 15 4.4a1.4 1.4 0 0 1-1.4 1.4h-3.2A1.4 1.4 0 0 1 9 4.4z"/><path d="M8.8 11.4h6.4M8.8 15.4h4.2"/></svg>
      </button>
      <button class="fab" id="fab" type="button" aria-label="Add a booking">
        <svg viewBox="0 0 24 24" class="b"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg>
      </button>
    </div>
  </div>

  <!-- A trip: every booking in it, day by day -->
  <div class="sheetwrap lg" id="tripPage" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet page" role="dialog" aria-modal="true" aria-labelledby="tpLbl">
      <div class="sheethead pagehead">
        <button class="iconbtn" id="tpBack" type="button" aria-label="Back to trips"><svg viewBox="0 0 24 24" class="b"><path d="M15.2 4.8L8.6 11.3a1 1 0 0 0 0 1.4l6.6 6.5"/></svg></button>
        <h2 id="tpLbl" class="vh">Trip</h2>
        <div class="acts">
          <button class="iconbtn" id="tpCal" type="button" aria-label="Add the whole trip to your calendar">
            <svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/><path d="M12 12.6v5M9.5 15.1h5"/></svg>
          </button>
          <button class="iconbtn okbtn" id="tpDone" type="button" aria-label="Done"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button>
        </div>
      </div>
      <div class="sheetbody" id="tpBody"></div>
    </div>
  </div>

  <!-- One booking: live status, details, links -->
  <div class="sheetwrap lg" id="bkSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet full glass-strong" role="dialog" aria-modal="true" aria-labelledby="bkLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="bkLbl">Booking</h2><div class="acts"><button class="iconbtn okbtn" id="bkDone" type="button" aria-label="Done"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody" id="bkBody"></div>
    </div>
  </div>

  <!-- Add: which kind -->
  <div class="sheetwrap lg" id="addSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="adLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="adLbl">Add a booking</h2><div class="acts"><button class="iconbtn" data-close type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" class="b"><path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/></svg></button></div></div>
      <div class="sheetbody">
        <div class="typepick" id="addTypes"></div>
        <div class="rgroup glass">
          <button class="rowbtn" type="button" id="addPaste">
            <span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="4.2" width="14" height="17" rx="3.2"/><path d="M9 4.4A1.8 1.8 0 0 1 10.8 2.6h2.4A1.8 1.8 0 0 1 15 4.4a1.4 1.4 0 0 1-1.4 1.4h-3.2A1.4 1.4 0 0 1 9 4.4z"/><path d="M8.8 11.4h6.4M8.8 15.4h4.2"/></svg></span>
            <span>Paste a confirmation</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="sheetwrap lg" id="setSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="stLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="stLbl">Settings</h2><div class="acts"><button class="iconbtn okbtn" data-close type="button" aria-label="Done"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody">
        <p class="label" data-design-row hidden>Design</p>
        <div class="rgroup glass" id="stDesign" data-design-row hidden></div>
        <p class="label">Gmail</p>
        <div class="rgroup glass" id="stGmail"></div>
        <p class="hint" id="stGmailHint" hidden></p>
        <p class="label">Live flight status</p>
        <div class="box glass"><span class="hint" style="margin:0" id="stLive">Checking…</span></div>
        <p class="label">Smart help</p>
        <div class="rgroup glass">
          <button class="rowbtn" type="button" id="stCalOpt">
            <span class="ic"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/></svg></span>
            <span>Family calendar<span class="sub" id="stCalSub"></span></span>
          </button>
          <button class="rowbtn" type="button" id="stAiOpt">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3.2l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M18.6 15.4l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/></svg></span>
            <span>Ipsy fills in what’s missing<span class="sub" id="stAiSub"></span></span>
          </button>
          <button class="rowbtn" type="button" id="stIpsyAutoOpt">
            <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 2"/></svg></span>
            <span>Ipsy checks by itself<span class="sub" id="stIpsyAutoSub"></span></span>
          </button>
          <button class="rowbtn" type="button" id="stIpsyGmailOpt">
            <span class="ic"><svg viewBox="0 0 24 24"><rect x="2.8" y="5" width="18.4" height="14" rx="3.4"/><path d="M3.6 7.4l7.2 5a2 2 0 0 0 2.4 0l7.2-5"/></svg></span>
            <span>Ipsy can search Gmail<span class="sub" id="stIpsyGmailSub"></span></span>
          </button>
        </div>
        <p class="label">Backup</p>
        <div class="rgroup glass">
          <button class="rowbtn" type="button" id="stExport">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 14.2V3.8"/><path d="M7.6 7.8l3.7-3.7a1 1 0 0 1 1.4 0l3.7 3.7"/><path d="M4 14.6v2.2a3.2 3.2 0 0 0 3.2 3.2h9.6a3.2 3.2 0 0 0 3.2-3.2v-2.2"/></svg></span>
            <span>Back up everything<span class="sub">One file with every booking</span></span>
          </button>
          <button class="rowbtn" type="button" id="stImport">
            <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3.8v10.4"/><path d="M7.6 10.2l3.7 3.7a1 1 0 0 0 1.4 0l3.7-3.7"/><path d="M4 14.6v2.2a3.2 3.2 0 0 0 3.2 3.2h9.6a3.2 3.2 0 0 0 3.2-3.2v-2.2"/></svg></span>
            <span>Import a backup<span class="sub">Adds what isn’t here already</span></span>
          </button>
        </div>
        <input type="file" id="stFile" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>

  <!-- What the last look at Gmail read -->
  <div class="sheetwrap lg" id="logSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="lgLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="lgLbl">What Travel read</h2><div class="acts"><button class="iconbtn okbtn" data-close type="button" aria-label="Done"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody">
        <div id="lgBody"></div>
        <p class="hint" id="lgHint"></p>
      </div>
    </div>
  </div>

  <!-- Paste fallback: when the clipboard can't be read directly -->
  <div class="sheetwrap lg" id="pasteSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="psLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><button class="iconbtn" data-close type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" class="b"><path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/></svg></button><h2 id="psLbl">Paste a confirmation</h2><div class="acts"><button class="iconbtn okbtn" id="psAdd" type="button" aria-label="Read it"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody">
        <div class="box glass"><textarea class="plain" id="psText" aria-label="Pasted text" placeholder="Paste the booking email here" style="min-height:200px;color:var(--text)"></textarea></div>
        <p class="hint" id="psHint" hidden></p>
      </div>
    </div>
  </div>

  <!-- Shown once, the first time the app opens after an update; and while reading Gmail or syncing -->
  <div class="updpill" id="updPill" role="status" hidden><svg viewBox="0 0 24 24"><path d="M11 3.6l1.5 4.1a2.4 2.4 0 0 0 1.4 1.4l4.1 1.5-4.1 1.5a2.4 2.4 0 0 0-1.4 1.4L11 17.6l-1.5-4.1a2.4 2.4 0 0 0-1.4-1.4L4 10.6l4.1-1.5a2.4 2.4 0 0 0 1.4-1.4z"/><path d="M18.2 15.2l.6 1.6.6.6 1.6.6-1.6.6-.6.6-.6 1.6-.6-1.6-.6-.6-1.6-.6 1.6-.6.6-.6z"/></svg>Updated</div>
  <div class="updpill syncpill" id="syncPill" role="status" hidden><svg class="spin" viewBox="0 0 24 24"><path d="M20 11.2a8 8 0 0 0-14.6-4.4L4 8.4"/><path d="M4 3.8v4.6h4.6"/><path d="M4 12.8a8 8 0 0 0 14.6 4.4l1.4-1.6"/><path d="M20 20.2v-4.6h-4.6"/></svg><svg class="tick b" viewBox="0 0 24 24"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg><span id="syncPillTxt">Syncing</span></div>

  <div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" type="button" hidden>Undo</button></div>
</div>

<script src="../home/slide.js"></script>
<script src="../home/account.js"></script>   <!-- family accounts: signs calls to travel/api and calendar/api in -->
<script src="../home/sheet.js"></script>   <!-- the family's Google Sheet, through aOS (aOS/SHEETS.md) -->
<script src="parse.js"></script>
<script src="../home/ipsy.js"></script>   <!-- Ipsy, the helper you chat with (and ipsy-tools.js, its tools here) -->
<script src="ipsy-tools.js"></script>
<script src="app.js"></script>
<script src="../home/welcome.js" data-app="travel" data-auto defer></script>   <!-- aOS: this app's walkthrough the first time, and what's new after an update -->
</body>
</html>
