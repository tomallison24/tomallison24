<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: the speech bubble with an arrow going up in Improve's own colour (#8A3F7E) on a pale tint of it (#F7DDF1); every app has its own, a shade of its room's (You: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M160 136H336a56 56 0 0 1 56 56V304a56 56 0 0 1-56 56H232L160 420V360a56 56 0 0 1-56-56V192a56 56 0 0 1 56-56Z" fill="#fff"/>
      <path d="M248 314V190M194 244l54-54 54 54" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#F7DDF1"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <rect width="512" height="512" fill="#8A3F7E" mask="url(#cut)"/>
</svg>
