<!--
  Calendar - the iCloud Family calendar, with the everyday parts of iOS
  Calendar and Google Calendar: Day, Week, Month, Year and List views, a
  search, events that repeat, alerts, travel time, and edits to one
  occurrence or the whole series. Alongside it, as layers you can switch on
  and off: US holidays, the reminders and nudges from Notes, the trips from
  Travel, Mail's Remind Me days, the workouts from Fitness, and the weather.

  Data: the events live in iCloud. A small Cloudflare Pages Function on this
  site (functions/calendar/api) talks to iCloud for the phone, holding the
  Apple ID and its app-specific password as secrets; the phone keeps a copy
  of the events it last saw so the calendar opens at once and works offline
  for reading. Code: ical.js (reading and writing iCalendar) and app.js (the
  app). The look is Notes' own style block, unchanged, plus Calendar's own
  pieces at the end.
-->
<style>
/* Allison OS family look, shared with Mail and News: frosted glass over a slow aurora. */
:root{
  --bg:#F2F2F7; --text:#111114; --muted:rgba(60,60,67,.80); --faint:rgba(60,60,67,.64);
  --accent:#007AFF; --accent-ink:#0059C8; --sel-ink:#00479E; --danger:#E5281D; --danger-ink:#AE2117; --flag:#D97706;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.86); --sheet:rgba(249,249,252,.90); --toast:rgba(255,255,255,.84);
  --gb-edge:rgba(255,255,255,.95); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 60%);
  --hair:rgba(60,60,67,.14); --hair-2:rgba(60,60,67,.09); --fill:rgba(118,118,128,.11); --pill:rgba(255,255,255,.96);
  --hi:rgba(255,255,255,.8); --lift:rgba(40,40,80,.08); --lift-strong:rgba(40,40,80,.16);
  --scrim:rgba(0,0,0,.22); --grab:rgba(60,60,67,.30); --ring:rgba(60,60,67,.32);
  --tint-mix:16%; --note-mix:30%; --tl:32%; --aurora:.40; --mark:rgba(255,204,0,.45);
  --blur:blur(30px) saturate(180%); --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --flag-tint:#C8913F; --arch-tint:#8C79CF; --bin-tint:#C9625B; --tag-tint:#7B6CF6;
  --flag-ink:#855412; --arch-ink:#5A45B0; --bin-ink:#9E3A32; --tag-ink:#4A3FC4; --gi-mix:18%;
  --icon:#0E7C8C; --accent-text:#0059C8; --danger-text:#AE2117;
  --bar-top:rgba(255,255,255,.16); --bar-bottom:rgba(255,255,255,.05); --bar-rim:rgba(255,255,255,.85); --bar-solid:rgba(248,248,251,.97);
  --seg-thumb:rgba(255,255,255,.92); --gb-shadow:0 4px 14px rgba(40,40,80,.10);
  --lg-bg:linear-gradient(180deg,var(--bar-top),var(--bar-bottom)); --lg-filter:blur(14px) saturate(190%) brightness(1.04);
  --lg-rim:inset 0 0 0 1px var(--bar-rim),inset 0 1px 1px var(--hi);
  --n-yellow:#FFCC00; --n-green:#34C759; --n-blue:#0A84FF; --n-pink:#FF2D55; --n-purple:#AF52DE;
  /* Cards: very faint tiles, the same in every AllisonOS app */
  --tile:rgba(255,255,255,.40); --tile-edge:rgba(60,60,67,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#08080B; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.38);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --sel-ink:#FFFFFF; --danger:#FF453A; --danger-ink:#FFFFFF; --flag:#FF9F0A;
  --glass:rgba(18,18,22,.46); --glass-2:rgba(38,38,44,.72); --sheet:rgba(28,28,32,.80); --toast:rgba(30,30,34,.62);
  --gb-edge:rgba(255,255,255,.16); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
  --hair:rgba(255,255,255,.11); --hair-2:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07); --pill:rgba(255,255,255,.13);
  --hi:rgba(255,255,255,.10); --lift:rgba(0,0,0,.38); --lift-strong:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.45); --grab:rgba(255,255,255,.25); --ring:rgba(255,255,255,.32);
  --tint-mix:42%; --note-mix:24%; --tl:80%; --aurora:.72; --mark:rgba(255,204,0,.35);
  --flag-ink:#EBC68F; --arch-ink:#CDBEF3; --bin-ink:#F0A9A3; --tag-ink:#D9D3FF; --gi-mix:30%;
  --icon:#4A9BA6; --accent-text:#0A84FF; --danger-text:#FF453A;
  --bar-top:rgba(34,34,40,.14); --bar-bottom:rgba(34,34,40,.05); --bar-rim:rgba(255,255,255,.16); --bar-solid:rgba(20,20,24,.96);
  --seg-thumb:rgba(255,255,255,.14); --gb-shadow:0 6px 18px rgba(0,0,0,.24);
  --tile:rgba(255,255,255,.05); --tile-edge:rgba(255,255,255,.10);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08080B; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.38);
  --accent:#0A84FF; --accent-ink:#FFFFFF; --sel-ink:#FFFFFF; --danger:#FF453A; --danger-ink:#FFFFFF; --flag:#FF9F0A;
  --glass:rgba(18,18,22,.46); --glass-2:rgba(38,38,44,.72); --sheet:rgba(28,28,32,.80); --toast:rgba(30,30,34,.62);
  --gb-edge:rgba(255,255,255,.16); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
  --hair:rgba(255,255,255,.11); --hair-2:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07); --pill:rgba(255,255,255,.13);
  --hi:rgba(255,255,255,.10); --lift:rgba(0,0,0,.38); --lift-strong:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.45); --grab:rgba(255,255,255,.25); --ring:rgba(255,255,255,.32);
  --tint-mix:42%; --note-mix:24%; --tl:80%; --aurora:.72; --mark:rgba(255,204,0,.35);
  --flag-ink:#EBC68F; --arch-ink:#CDBEF3; --bin-ink:#F0A9A3; --tag-ink:#D9D3FF; --gi-mix:30%;
  --icon:#4A9BA6; --accent-text:#0A84FF; --danger-text:#FF453A;
  --bar-top:rgba(34,34,40,.14); --bar-bottom:rgba(34,34,40,.05); --bar-rim:rgba(255,255,255,.16); --bar-solid:rgba(20,20,24,.96);
  --seg-thumb:rgba(255,255,255,.14); --gb-shadow:0 6px 18px rgba(0,0,0,.24);
  --tile:rgba(255,255,255,.05); --tile-edge:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Laid out like Mail, News and Home: the page itself scrolls, and the bottom
   bar is pinned above the home indicator. */
html{background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- glass ---- */
.glass{background:var(--gb-shine),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--gb-edge);box-shadow:inset 0 1px 0 var(--hi),0 16px 40px var(--lift)}
.glass-strong{background:var(--sheet);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--hair);
  box-shadow:0 -14px 44px var(--lift-strong),inset 0 1px 0 var(--hi)}

/* ---- app shell + the light behind the glass ---- */
.app{position:relative;width:100%;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;overflow-x:clip;background:var(--bg);isolation:isolate}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(58px);opacity:var(--aurora);will-change:transform}
.ambient i:nth-child(1){width:109.2%;aspect-ratio:1;left:-22.8%;top:-3.2%;background:radial-gradient(circle,#2E6BFF 0%,rgba(46,107,255,0) 68%);animation:drift1 34s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:92.4%;aspect-ratio:1;right:-17.2%;top:8%;background:radial-gradient(circle,#FF7A3D 0%,rgba(255,122,61,0) 68%);animation:drift2 41s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:120.4%;aspect-ratio:1;right:-20%;bottom:-6%;background:radial-gradient(circle,#9A5BFF 0%,rgba(154,91,255,0) 68%);animation:drift3 47s ease-in-out infinite alternate}
.ambient i:nth-child(4){width:86.8%;aspect-ratio:1;left:-17.2%;bottom:13.6%;background:radial-gradient(circle,#18C3A5 0%,rgba(24,195,165,0) 68%);animation:drift4 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14%,10%,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-12%,16%,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(-16%,-12%,0) scale(1.22)}}
@keyframes drift4{to{transform:translate3d(18%,-14%,0) scale(1.15)}}

.view{display:block}
.top{padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:fadeDown .5s var(--ease) both}
.titlerow{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.title{margin:0;flex:1;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.title small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--faint);margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}
.iconbtn{width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .18s var(--ease),color .2s}
.iconbtn:active{transform:scale(.9);color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
.iconbtn svg{width:19px;height:19px}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 14px;height:40px;color:var(--muted)}
.search svg{width:17px;height:17px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search .clear{background:var(--fill);color:var(--muted);border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.search .clear svg{width:11px;height:11px;stroke-width:2.6}

/* ---- filters: one scrolling row of glass capsules ---- */
.chips{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-2px -14px 0;padding:3px 14px 5px}
.chips::-webkit-scrollbar{display:none}
.chip{--h:211;flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;
  font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .25s,background .25s,border-color .25s,transform .18s var(--ease)}
.chip:active{transform:scale(.94)}
.chip .n{font-size:11px;color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.chip svg{width:15px;height:15px}
.chip i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 90% 62%);box-shadow:0 0 8px hsl(var(--h) 90% 62% / .6)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.chip[aria-pressed="true"]{color:var(--sel-ink);font-weight:600;
  background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--gb-edge))}
.chip.ghost{background:var(--fill);border:1px dashed var(--ring);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

/* tag chips inside cards and rows: coloured by hue, as in Mail */
.tchip{--h:211;display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;
  color:hsl(var(--h) 90% var(--tl));background:hsl(var(--h) 90% 60% / .14);border:1px solid hsl(var(--h) 90% 60% / .32);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tchip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tchip.bare::before{display:none}
.tchip svg{width:11px;height:11px}
.tchip.over{--h:4}
.tchip.lst{color:var(--muted);background:var(--fill);border-color:var(--hair)}
.tchip.lst::before{background:var(--lc);box-shadow:0 0 6px var(--lc)}

/* segmented view switch (reminders), as in News */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;border-radius:14px;background:var(--fill);border:1px solid var(--hair-2)}
.seg button{border-radius:11px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;color:var(--muted);font-size:12px;font-weight:600;transition:background .2s}
.seg button b{font-size:20px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15;letter-spacing:-.02em}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button.warn b{color:var(--danger)}

/* ---- content ---- */
.list{padding:6px 14px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sechead{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:6px 4px 6px;display:flex;justify-content:space-between}
.resulthead{font-size:13px;color:var(--faint);margin:0 4px}
/* Two plain flex columns, not CSS multi-column: Safari can fail to draw
   frosted-glass cards that sit in the second column of a multi-column box. */
.grid{display:flex;gap:10px;align-items:flex-start}
.grid .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.card{margin:0;display:block;width:100%;text-align:left;border-radius:22px;padding:14px 14px 12px;color:var(--text);transition:transform .18s var(--ease)}
.card:active{transform:scale(.98)}
.card[data-color]:not([data-color="none"]){background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--note-mix),var(--glass));border-color:color-mix(in srgb,var(--tint) 35%,var(--gb-edge))}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3;display:flex;gap:6px;align-items:flex-start}
.card h3 span{flex:1;overflow-wrap:anywhere}
.card h3 svg{width:14px;height:14px;color:var(--flag);margin-top:3px}
.card h3 svg.lk,.nrow .nt svg.lk{color:var(--icon)}
.opt svg.lk{width:15px;height:15px}
.card p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
mark{background:var(--mark);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:28px 20px;border-radius:24px;font-size:14px}
.empty strong{display:block;color:var(--text);font-size:17px;font-weight:600;margin-bottom:4px}
[data-color="yellow"]{--tint:var(--n-yellow)} [data-color="green"]{--tint:var(--n-green)} [data-color="blue"]{--tint:var(--n-blue)}
[data-color="pink"]{--tint:var(--n-pink)} [data-color="purple"]{--tint:var(--n-purple)} [data-color="none"]{--tint:transparent}
.enter .card,.enter .todo,.enter .rgroup{animation:rowIn .52s var(--ease) both;animation-delay:calc(var(--i,0) * 34ms)}

/* ---- reminders ---- */
.quickadd{display:flex;align-items:center;gap:10px;border-radius:999px;padding:5px 5px 5px 16px}
.quickadd input{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;padding:8px 0}
.quickadd input::placeholder{color:var(--faint)}
.send{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;
  background:var(--gb-shine),color-mix(in srgb,var(--accent) 82%,transparent);border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px color-mix(in srgb,var(--accent) 22%,transparent);transition:transform .18s var(--ease)}
.send:active{transform:scale(.88)}
.send svg{width:20px;height:20px;stroke-width:2.3}
.rgroup{border-radius:22px;overflow:hidden}
.rgroup > .sechead{margin:0;padding:13px 16px 9px}
.rgroup > .sechead.over{color:var(--danger)}
.todo{display:flex;gap:12px;padding:11px 12px 11px 16px;align-items:flex-start;border-top:1px solid var(--hair-2)}
.rgroup > .sechead + .todo{border-top:0}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--lc);flex:none;display:grid;place-items:center;color:#fff;transition:background .2s,transform .18s var(--ease)}
.check:active{transform:scale(.85)}
.check svg{width:14px;height:14px;stroke-width:3;opacity:0}
.check[aria-checked="true"]{background:var(--lc);box-shadow:0 0 12px color-mix(in srgb,var(--lc) 55%,transparent)}
.check[aria-checked="true"] svg{opacity:1;animation:pop .35s var(--ease)}
.tbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.tbody .t{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.tbody .n{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{display:flex;flex-wrap:wrap;gap:5px}
.todo.done .t{color:var(--faint);text-decoration:line-through}
.tside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:4px}
.prio{display:flex;gap:2px;align-items:flex-end;height:12px}
.prio i{width:3px;border-radius:2px;background:var(--ring)}
.prio i:nth-child(1){height:5px} .prio i:nth-child(2){height:8px} .prio i:nth-child(3){height:12px}
.prio.p1 i:nth-child(-n+1),.prio.p2 i:nth-child(-n+2),.prio.p3 i:nth-child(-n+3){background:var(--danger)}
.flag{color:var(--flag)}
.flag svg{fill:currentColor;width:15px;height:15px}
.morebtn{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:999px;font-size:13px;color:var(--muted);background:var(--fill);border:1px solid var(--hair);transition:transform .18s var(--ease)}
.morebtn:active{transform:scale(.94)}

/* ---- floating capsules: sections + new, as in Mail's toolbar ---- */
.dock{position:fixed;left:0;right:0;max-width:560px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 14px;z-index:5;pointer-events:none}
.dock > *{pointer-events:auto}
.tabs{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;box-shadow:inset 0 1px 0 var(--hi),0 10px 30px var(--lift-strong)}
.tab{height:44px;border-radius:999px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--muted);transition:background .2s,color .2s,transform .18s var(--ease)}
.tab:active{transform:scale(.94)}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{background:var(--pill);color:var(--accent)}
.fab{width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);
  background:var(--glass-2);border:1px solid var(--hair);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 10px 28px var(--lift-strong),inset 0 1px 0 var(--hi);transition:transform .2s var(--ease);animation:popIn .45s var(--ease) both}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.dockr{display:flex;align-items:center;gap:8px}
@media (max-width:389px){.tab svg{display:none}.tab{padding:0 14px}}
.fab.small{width:46px;height:46px}
.fab.small svg{width:21px;height:21px;stroke-width:1.9}
.linkbox{width:100%;border:1px solid var(--hair);background:var(--fill);border-radius:12px;padding:9px 11px;font-size:13px;color:var(--muted)}
#psText{min-height:180px;font-size:15px;color:var(--text)}

/* ---- sheets ---- */
.sheetwrap{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn .3s ease both}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto;border-radius:28px 28px 0 0;border-bottom:0;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;animation:sheetUp .46s var(--ease) both}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 24px)}
.sheetwrap{position:fixed;inset:auto 0 auto 0;top:var(--vvt,0px);height:var(--vvh,100dvh)}
.notice{border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.notice span{flex:1}
.implist{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.implist li{margin:3px 0;overflow-wrap:anywhere}
/* drag a sheet down by its handle or title bar to close it, as in Mail */
.grab{width:38px;height:5px;border-radius:99px;background:var(--grab);margin:0 auto;padding:10px 60px 8px;background-clip:content-box;box-sizing:content-box;flex:none;cursor:grab}
.grab,.sheethead{touch-action:none;-webkit-user-select:none;user-select:none}
.sheet.dragging{animation:none;transition:none}
.sheet.settling{transition:transform .28s var(--ease)}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px 8px 20px}
.sheethead h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.sheetbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.btn{--tint:var(--accent);position:relative;min-height:38px;padding:8px 18px;border-radius:999px;font-weight:600;font-size:15px;color:var(--accent-ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--tint-mix),transparent);border:1px solid color-mix(in srgb,var(--tint) 40%,var(--gb-edge));
  box-shadow:inset 0 1px 0 var(--hi);transition:transform .18s var(--ease),filter .2s}
.btn:active{transform:scale(.975);filter:brightness(.9)}
.btn.quiet{background:var(--gb-shine),var(--glass);border-color:var(--gb-edge);color:var(--text);font-weight:500}
.btn.danger{--tint:var(--danger);background:var(--gb-shine),color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);font-weight:500;min-height:48px}

/* editor pieces */
.paper{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.paper[data-color]:not([data-color="none"]){background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--note-mix),var(--glass));border-color:color-mix(in srgb,var(--tint) 35%,var(--gb-edge))}
.paper #edTitle{resize:none;overflow:hidden;min-height:0;line-height:1.2;border:0;background:none;outline:none;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:0}
.paper textarea{border:0;background:none;outline:none;resize:none;min-height:40vh;overflow:hidden;font-size:17px;line-height:1.55;padding:0}
/* The note editor is a full page that slides in, like a message in Mail;
   the whole note scrolls as one page instead of inside a small box. */
.sheet.page{height:100%;max-height:none;max-width:none;border-radius:0;border:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(120% 55% at 0% 0%,color-mix(in srgb,#2E6BFF calc(var(--aurora) * 32%),transparent),transparent 70%),
    radial-gradient(110% 50% at 100% 100%,color-mix(in srgb,#9A5BFF calc(var(--aurora) * 30%),transparent),transparent 70%),var(--bg);
  animation:pageIn .42s var(--ease) both}
.sheet.page .sheetbody{max-width:680px;width:100%;margin:0 auto}
#editor .scrim{display:none}
.pagehead{padding:6px 12px 6px 6px;touch-action:auto}
.backbtn{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 4px;color:var(--accent);font-size:17px;font-weight:500}
.backbtn svg{width:24px;height:24px;stroke-width:2.2}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes pageIn{from{transform:translateX(100%)}to{transform:none}}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:0 4px}
.box{border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);background:var(--fill);border:1px solid var(--hair);transition:color .2s,background .2s,transform .18s var(--ease)}
.opt:active{transform:scale(.93)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{color:var(--sel-ink);font-weight:600;background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--gb-edge))}
.opt .sw{width:8px;height:8px;border-radius:50%;background:var(--lc);box-shadow:0 0 8px var(--lc)}
.opt.flagopt[aria-pressed="true"]{color:var(--flag);background:color-mix(in srgb,var(--flag) 16%,transparent);border-color:color-mix(in srgb,var(--flag) 40%,var(--gb-edge))}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inrow input[type="date"],.inrow input[type="time"],.inrow input[type="datetime-local"]{border:1px solid var(--hair);background:var(--fill);border-radius:12px;padding:7px 10px;font-size:15px;min-width:0}
.plain{border:0;background:none;outline:none;width:100%;padding:0;font-size:16px}
textarea.plain{resize:none;min-height:56px;font-size:15px;color:var(--muted)}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tchip{font-size:13px;padding:3px 4px 3px 10px}
.tagedit .tchip button{color:inherit;opacity:.7;padding:0 3px;display:grid;place-items:center}
.tagedit .tchip button svg{width:13px;height:13px}
.tagedit input{border:0;outline:none;background:none;flex:1;min-width:110px;font-size:15px;padding:4px 0}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:50%;border:1px solid var(--gb-edge);background:color-mix(in srgb,var(--tint) 55%,var(--glass-2));box-shadow:inset 0 1px 0 var(--hi)}
.swatch[data-color="none"]{background:var(--glass-2)}
.swatch.list{background:var(--lc)}
.swatch[aria-checked="true"]{outline:2.5px solid var(--accent);outline-offset:2px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;font-size:15px;font-weight:600;border-top:1px solid var(--hair-2)}
.rowbtn:first-child{border-top:0}
.rowbtn:active{background:var(--fill)}
.rowbtn .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.rowbtn .sub{display:block;font-weight:400;color:var(--muted);font-size:13px}
.danger{color:var(--danger)}
.hint{font-size:12px;line-height:1.55;color:var(--faint);margin:0 4px}
.tagrow{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-top:1px solid var(--hair-2)}
.tagrow:first-child{border-top:0}
.tagrow .grow{flex:1;min-width:0}
.tagrow .sub{font-size:12px;color:var(--faint)}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;padding:4px 6px}

/* toast: the same clear glass as the sheets, with their lit rim */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;width:max-content;max-width:calc(100% - 28px);
  display:flex;gap:12px;align-items:center;padding:12px 13px 12px 16px;border-radius:16px;font-size:14px;
  color:var(--text);background:linear-gradient(180deg,var(--lgs-top),var(--lgs-bottom));border:1px solid transparent;-webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);
  box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 12px 30px var(--lift-strong);transform:translateX(-50%);animation:toastIn .42s var(--ease) both}
.toast span{min-width:0}
.toast button{color:var(--accent);font-weight:600;flex:none;padding:3px 5px}

@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* ---- Notes home: collections, recent, archive, trash, tidy up ---- */
#collBack{margin-right:2px}
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctile,.nlist,.nlist > .sw,.nrow{min-width:0}
.ctile{--h:211;display:flex;flex-direction:column;gap:3px;min-height:82px;padding:11px 14px 10px;border-radius:22px;text-align:left;color:var(--text);transition:transform .18s var(--ease)}
.ctile:active{transform:scale(.97)}
.ctile .ctop{display:flex;align-items:center;justify-content:space-between}
.ctile i{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 90% 62%);box-shadow:0 0 10px hsl(var(--h) 90% 62% / .6)}
.ctile.plain i{background:var(--ring);box-shadow:none}
.ctile .cn{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ctile .cname{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:auto}
.ctile .clast{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.nlist{display:flex;flex-direction:column}
.nlist > .sw + .sw,.nlist > .trow + .trow{border-top:1px solid var(--hair-2)}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t d" "s s";gap:2px 10px;width:100%;text-align:left;padding:12px 16px;color:var(--text);background:var(--glass)}
.nrow .nt{grid-area:t;font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.nrow .nt svg{width:13px;height:13px;color:var(--flag);flex:none}
.nrow .ns{grid-area:s;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .ns:empty{display:none}
.nrow .nd{grid-area:d;font-size:12px;color:var(--faint);align-self:center}
.cdate{display:block;margin-top:8px;font-size:11px;color:var(--faint)}
.morechips{display:flex;flex-wrap:wrap;gap:8px;padding-top:2px}
.chip .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-size:11px;font-weight:700}
.trow{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px}
.trow .tt,.tidyrow .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.trow .nt,.tidyrow .nt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .nd{font-size:12px;color:var(--faint)}
.iconbtn.danger{color:var(--danger-text)}
.tidyrow{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid var(--hair-2)}
.tidyrow:first-child{border-top:0}
.tidyrow .nt{white-space:normal}
.tidyrow .ns{font-size:13px;color:var(--muted);line-height:1.4}
.tidyrow .textbtn{flex:none;max-width:48%;height:auto;min-height:36px;padding:6px 12px;line-height:1.2;white-space:normal;text-align:center;font-size:14px}
.empty.glass{border-radius:22px}
/* swiping a note, as in Mail */
.sw{position:relative}
.sw > .card,.sw > .nrow{position:relative;z-index:1;transition:transform .3s var(--ease)}
.sw-acts{position:absolute;inset:0;z-index:0}
.sw-l,.sw-r{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.sw-l{left:6px}
.sw-r{right:6px}
.sw.open-r .sw-l,.sw.open-l .sw-r{pointer-events:auto}
.sw.show-l .sw-l,.sw.open-r .sw-l,.sw.show-r .sw-r,.sw.open-l .sw-r{opacity:1}
.sa{width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.sa .gi{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
  background:var(--gb-shine),color-mix(in srgb,var(--tint) var(--gi-mix),transparent);border:1px solid color-mix(in srgb,var(--tint) 42%,var(--gb-edge));
  box-shadow:inset 0 1px 0 var(--hi),0 4px 12px var(--lift);transition:transform .3s var(--ease)}
.sa .gi svg{width:22px;height:22px}
.sa:active .gi{transform:scale(.9)}
.sa.pin{--tint:var(--flag-tint);--ink:var(--flag-ink)}
.sa.tag{--tint:var(--tag-tint);--ink:var(--tag-ink)}
.sa.arch{--tint:var(--arch-tint);--ink:var(--arch-ink)}
.sa.bin{--tint:var(--bin-tint);--ink:var(--bin-ink)}
.sw.armed-l .sa.bin .gi,.sw.armed-r .sa.tag .gi{transform:scale(1.18)}
.sw.armed-l .sa.arch,.sw.armed-r .sa.pin{opacity:.35}

/* ---- "Updated" pill: once, the first time the app opens after an update ---- */
.updpill{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 11px;border-radius:999px;
  font-size:14px;font-weight:600;color:var(--accent-text);background:var(--lg-bg);-webkit-backdrop-filter:var(--lg-filter);backdrop-filter:var(--lg-filter);
  box-shadow:var(--lg-rim),0 8px 24px var(--lift);transform:translateX(-50%);animation:updIn .5s var(--ease) both}
.updpill svg{width:17px;height:17px;color:var(--icon)}
.updpill.out{animation:updOut .45s ease both}
@keyframes updIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes updOut{to{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
/* ---- "Syncing" pill: pulses, with the sync arrows turning, while the Sheet sync runs ---- */
.syncpill{pointer-events:none;animation:updIn .5s var(--ease) both,syncPulse 1.6s ease-in-out .5s infinite}
.updpill:not([hidden]) + .syncpill{top:calc(env(safe-area-inset-top,0px) + 52px)}
.syncpill .spin{animation:syncTurn 1.1s linear infinite}
.syncpill .tick{display:none}
.syncpill.done{animation:updIn .01s both}
.syncpill.done .spin{display:none}
.syncpill.done .tick{display:block;animation:popIn .3s var(--ease) both}
.syncpill.out{animation:updOut .45s ease both}
@keyframes syncTurn{to{transform:rotate(360deg)}}
@keyframes syncPulse{50%{transform:translate(-50%,0) scale(1.05);box-shadow:var(--lg-rim),0 8px 24px var(--lift),0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.updpill,.toast{background:var(--bar-solid)}}
@media (prefers-reduced-transparency:reduce){.updpill,.toast{background:var(--bar-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}

/* ---- Icons and buttons: the same system as Mail ----
   Line icons on a 24px grid, 1.7 stroke with round ends (2.2 for chevrons,
   ticks and close); icons in a calm slate-teal, while text, dots and
   switches keep the blue; every button and bar in the same clear Liquid
   Glass. Sizes follow Mail: 22px icons in 36px header buttons, 24px in 38px
   page buttons, 31px in the 56px compose button, 21px in the search bar,
   20px in pill buttons. Last in the sheet so it wins. */
svg.b{stroke-width:2.2}
svg.f{fill:currentColor;stroke:none}
svg.fs{fill:currentColor}
.iconbtn,.textbtn,.pillbtn,.btn,.send,.fab,.search,.tabs,.seg,.quickadd,.arrow{
  background:var(--lg-bg);border:0;-webkit-backdrop-filter:var(--lg-filter);backdrop-filter:var(--lg-filter)}
.iconbtn{width:36px;height:36px;color:var(--icon);box-shadow:var(--lg-rim);transition:transform .18s var(--ease),background .2s,color .2s}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{transform:scale(.9);background:var(--glass-2);color:var(--text)}
.iconbtn[aria-pressed="true"]{color:var(--accent)}
#edPin[aria-pressed="true"]{color:var(--flag)}
.pagehead .iconbtn{width:38px;height:38px}
.pagehead .iconbtn svg{width:24px;height:24px}
.pagehead{padding:6px 14px}
.textbtn{height:36px;padding:0 14px;border-radius:999px;font-size:15px;font-weight:600;color:var(--accent-text);box-shadow:var(--lg-rim);transition:transform .18s var(--ease)}
.textbtn:active{transform:scale(.93)}
.pillbtn{height:38px;padding:0 15px;gap:6px;font-size:14px;font-weight:600;color:var(--text);box-shadow:var(--lg-rim)}
.pillbtn svg{width:20px;height:20px;color:var(--icon)}
.pillbtn:active{transform:scale(.93);background:var(--glass-2)}
.pillbtn.bluec,.pillbtn.bluec svg{color:var(--accent-text)}
.pillbtn.bluec{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),inset 0 1px 1px var(--hi)}
.btn{--tint:var(--accent);color:var(--tint-text,var(--accent-text));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 42%,transparent),inset 0 1px 1px var(--hi),var(--gb-shadow)}
.btn.quiet{color:var(--text);font-weight:500;box-shadow:var(--lg-rim)}
.btn.quiet{background:var(--lg-bg)}
.btn.danger,.btn.quiet.danger{--tint:var(--danger);background:var(--lg-bg);color:var(--danger-text);min-height:50px;width:100%;font-weight:500;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 42%,transparent),inset 0 1px 1px var(--hi)}
.send{width:38px;height:38px;color:var(--accent-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 42%,transparent),inset 0 1px 1px var(--hi)}
.send svg{width:22px;height:22px}
.fab{width:56px;height:56px;color:var(--icon);box-shadow:var(--lg-rim),0 8px 26px var(--lift)}
.fab svg{width:31px;height:31px;stroke-width:1.7}
.fab.small{width:46px;height:46px}
.fab.small svg{width:24px;height:24px}
.search{height:44px;padding:0 7px 0 15px;gap:9px;box-shadow:var(--lg-rim),0 6px 20px var(--lift);transition:box-shadow .25s}
.search:focus-within{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 65%,var(--bar-rim)),inset 0 1px 1px var(--hi),0 0 0 4px rgba(10,132,255,.14),0 6px 20px var(--lift)}
.search > svg{width:21px;height:21px;color:var(--icon)}
.search .clear{width:28px;height:28px;color:var(--muted);background:var(--fill)}
.search .clear svg{width:14px;height:14px}
.quickadd{box-shadow:var(--lg-rim),0 6px 20px var(--lift)}
.tabs{box-shadow:var(--lg-rim),0 10px 30px var(--lift-strong)}
.tab{color:var(--muted)}
.tab svg{width:20px;height:20px;color:var(--icon)}
.tab[aria-selected="true"],.seg button[aria-pressed="true"]{color:var(--text);background:var(--gb-shine),var(--seg-thumb);box-shadow:inset 0 0 0 1px var(--gb-edge),inset 0 1px 0 var(--hi),0 3px 10px var(--lift)}
.seg{border-radius:20px;box-shadow:var(--lg-rim),0 6px 20px var(--lift)}
.seg button{border-radius:17px}
.seg button[aria-pressed="true"] b{color:var(--text)}
.seg button.warn b{color:var(--danger)}
.arrow{color:var(--icon);box-shadow:var(--lg-rim),0 8px 26px var(--lift)}
.arrow svg{width:28px;height:28px}
.chip svg{width:15px;height:15px;opacity:.7}
.rowbtn .ic{width:26px;height:auto;background:none;border:0;border-radius:0;color:var(--icon)}
.rowbtn .ic svg{width:22px;height:22px}
.tagedit .tchip button svg{stroke-width:2.2}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .iconbtn,.textbtn,.pillbtn,.btn,.send,.fab,.search,.tabs,.seg,.quickadd,.arrow{background:var(--bar-solid)}
}
@media (prefers-reduced-transparency:reduce){
  .iconbtn,.textbtn,.pillbtn,.btn,.send,.fab,.search,.tabs,.seg,.quickadd,.arrow{background:var(--bar-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ---- Calendar's own pieces ---- */
:root{--cal:#FF2968;--hol:#1F9D55;--nt:#8B5CF6;--tr:#18A58A;--ml:#7B6CF6;--fit:#F2780C;--drk:#B0457A;--now:#FF3B30;--ok:#1F9D55;--bad:#E5281D;--hour:56px;--gutter:46px;--cols:7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hol:#30D158;--ok:#30D158;--bad:#FF453A}}
:root[data-theme="dark"]{--hol:#30D158;--ok:#30D158;--bad:#FF453A}
.enter .mgrid,.enter .timeview,.enter .rgroup,.enter .ymon,.enter .strip{animation:rowIn .52s var(--ease) both;animation-delay:calc(var(--i,0) * 34ms)}
/* Cards - the month grid, the day and week grids and their strip, the year's
   months, the event lists, notices and empty states - are very faint flat
   tiles, the same in every AllisonOS app: no blur, lit rim or shadow. */
.rgroup,.empty,.notice,.mgrid,.timeview,.strip,.ymon{background:var(--tile);border:0;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px var(--tile-edge)}
.titlebtn{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:6px}
.titlebtn .title{flex:none;max-width:100%;font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebtn svg{width:16px;height:16px;color:var(--faint);stroke-width:2.2;margin-top:6px}
.list{gap:10px}
.navrow{display:flex;align-items:center;gap:6px;padding:0 2px}
.navrow .lbl{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navrow .iconbtn{width:32px;height:32px}
.navrow .iconbtn svg{width:20px;height:20px}

/* the week's initials over the month grid */
.wkhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);text-align:center}
.wkhead .we{opacity:.7}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:22px;overflow:hidden;touch-action:pan-y}
.mday{min-height:86px;padding:5px 3px 4px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--hair-2);border-left:1px solid var(--hair-2);text-align:left;min-width:0;color:var(--text)}
.mday:nth-child(-n+7){border-top:0}
.mday:nth-child(7n+1){border-left:0}
.mday:active{background:var(--fill)}
.mday.out .n{opacity:.4}
.mday.out .mev{opacity:.55}
.mday .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;margin:0 auto 1px;font-variant-numeric:tabular-nums}
.mday.today .n{background:var(--accent);color:#fff}
.mday.sel .n{box-shadow:inset 0 0 0 2px var(--accent)}
.mday.sel.today .n{box-shadow:none}
.mev{--c:var(--cal);font-size:10.5px;line-height:1.3;padding:1px 3px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:var(--text);
  background:color-mix(in srgb,var(--c) 24%,transparent);border-left:2px solid var(--c);min-width:0}
.mev.timed{background:none;border-left:0;padding-left:2px;display:flex;gap:3px;align-items:center}
.mev.timed::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.mev.more{background:none;border:0;color:var(--faint);font-weight:600;padding-left:6px}
.mev.done{text-decoration:line-through;opacity:.55}
.mday .wx{font-size:9.5px;color:var(--faint);text-align:center;margin-top:auto;white-space:nowrap}
@media (max-width:389px){.mday{min-height:76px}.mev{font-size:10px}}

/* the selected day under the month grid, and the List and Search views */
.dayhead{display:flex;align-items:baseline;gap:8px;padding:10px 6px 0;min-width:0}
.dayhead b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.dayhead.today b{color:var(--accent-text)}
.dayhead span{font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead .wx{margin-left:auto;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;flex:none}
.dayhead .wx svg{width:16px;height:16px;color:var(--icon)}
.evrow{--c:var(--cal);display:grid;grid-template-columns:66px minmax(0,1fr);gap:0 10px;align-items:start;width:100%;text-align:left;padding:11px 14px 11px 12px;border-top:1px solid var(--hair-2);color:var(--text)}
.evrow:first-child{border-top:0}
.evrow:active{background:var(--fill)}
.evrow .tm{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;padding-top:2px}
.evrow .tm small{display:block;font-size:11px;font-weight:500;color:var(--faint)}
.evrow .bd{min-width:0;display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--c);padding-left:10px;border-radius:2px}
.evrow .t{font-size:16px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.3}
.evrow .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere;display:flex;gap:5px;align-items:center;min-width:0}
.evrow .s svg{width:13px;height:13px;flex:none}
.evrow .s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow.past{opacity:.62}
.evrow.done .t{text-decoration:line-through;color:var(--faint)}
.lsec{display:flex;flex-direction:column;gap:6px}
.loadmore{align-self:center}

/* the time grid: Day and Week */
.timeview{display:flex;flex-direction:column;border-radius:22px;overflow:hidden;height:var(--tv-h,60vh);touch-action:pan-y}
.tghead{flex:none;display:grid;grid-template-columns:var(--gutter) repeat(var(--cols),minmax(0,1fr));border-bottom:1px solid var(--hair)}
.tghead .dh{padding:8px 1px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;color:var(--text)}
.tghead .dh span{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.tghead .dh b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.tghead .dh.today b{background:var(--accent);color:#fff}
.tghead .dh.sel:not(.today) b{box-shadow:inset 0 0 0 2px var(--accent)}
.tghead .dh .wx{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%;text-overflow:ellipsis;display:inline-flex;gap:3px;align-items:center}
.tghead .dh .wx svg{width:13px;height:13px;color:var(--icon)}
.tghead .gl{align-self:end;font-size:10px;color:var(--faint);text-align:right;padding:0 5px 5px 0}
.allday{grid-column:1 / -1;display:grid;grid-template-columns:var(--gutter) repeat(var(--cols),minmax(0,1fr));border-top:1px solid var(--hair-2)}
.allday .gl{padding:5px 5px 0 0;align-self:start}
.allday .ad{display:flex;flex-direction:column;gap:2px;padding:3px 1px;min-width:0}
.allday .mev{font-size:11px;text-align:left;width:100%}
.tgbody{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:none}
.tgbody::-webkit-scrollbar{display:none}
.tgin{position:relative;display:grid;grid-template-columns:var(--gutter) repeat(var(--cols),minmax(0,1fr));height:calc(var(--hour) * 24);padding-bottom:8px}
.gut{position:relative}
.gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.col{position:relative;border-left:1px solid var(--hair-2);background-image:linear-gradient(var(--hair-2) 1px,transparent 1px);background-size:100% var(--hour);min-width:0}
.col.today{background-color:color-mix(in srgb,var(--accent) 4%,transparent)}
.tev{--c:var(--cal);position:absolute;left:1px;right:2px;border-radius:8px;padding:3px 6px;overflow:hidden;font-size:12px;line-height:1.25;text-align:left;color:var(--text);
  background:color-mix(in srgb,var(--c) 26%,var(--glass-2));border-left:3px solid var(--c);box-shadow:0 1px 3px var(--lift);touch-action:none;-webkit-user-select:none;user-select:none;min-height:14px}
.tev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev.short{padding:0 6px;font-size:11px;line-height:1.2}
.tev.short span{display:none}
.tev.past{opacity:.72}
.tev.drag{opacity:.9;box-shadow:0 10px 28px var(--lift-strong);z-index:6}
.tev .rs{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize}
.tev .rs::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;border-radius:2px;background:var(--c);transform:translateX(-50%);opacity:0}
.tev.drag .rs::after{opacity:.8}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.nowlbl{position:absolute;right:6px;transform:translateY(-100%);font-size:10.5px;font-weight:700;color:var(--now);background:var(--bg);padding:0 3px;border-radius:4px;z-index:3;pointer-events:none;font-variant-numeric:tabular-nums}
.dragtime{position:absolute;left:0;width:var(--gutter);text-align:right;padding-right:6px;font-size:10.5px;font-weight:700;color:var(--accent-text);transform:translateY(-50%);z-index:6;pointer-events:none;background:var(--bg);border-radius:4px}

.timeview[data-cols="7"] .tev{padding:2px 3px 2px 4px;font-size:11px;border-left-width:2.5px}
.timeview[data-cols="7"] .tev span{display:none}
.timeview[data-cols="7"] .allday .mev{padding:1px 3px}
/* the week strip over the Day view */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:5px 4px;border-radius:999px;touch-action:pan-y}
.strip button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;color:var(--text);min-width:0}
.strip span{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.strip b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.strip button[aria-selected="true"] b{background:var(--text);color:var(--bg)}
.strip button.today b{color:var(--accent-text)}
.strip button.today[aria-selected="true"] b{background:var(--accent);color:#fff}
.strip i{width:4px;height:4px;border-radius:50%;background:var(--faint)}
.strip i.none{background:transparent}

/* year */
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ymon{border-radius:18px;padding:9px 7px 8px;text-align:left;color:var(--text);transition:transform .18s var(--ease)}
.ymon:active{transform:scale(.97)}
.ymon h4{margin:0 0 4px 3px;font-size:14px;font-weight:700;color:var(--text)}
.ymon.cur h4{color:var(--accent-text)}
.ygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:9.5px;text-align:center;row-gap:1px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ygrid span{height:15px;line-height:15px;position:relative}
.ygrid .today{background:var(--accent);color:#fff;border-radius:50%;font-weight:700}
.ygrid .has::after{content:"";position:absolute;left:50%;bottom:-1px;width:3px;height:3px;border-radius:50%;background:var(--faint);transform:translateX(-50%)}
.ygrid .today.has::after{display:none}
@media (max-width:359px){.year{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* an event, opened */
.evhead{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.evhead .cn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.evhead .cn i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--cal))}
.evhead h3{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.evhead h3.done{text-decoration:line-through;color:var(--faint)}
.evhead .when{font-size:15px;color:var(--muted);line-height:1.4}
.evhead .when b{color:var(--text);font-weight:600}
.kvrow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--hair-2);font-size:15px;width:100%;text-align:left;color:var(--text)}
.kvrow:first-child{border-top:0}
.kvrow .ic{color:var(--icon);flex:none;padding-top:1px;width:26px;display:grid;place-items:center}
.kvrow .ic svg{width:22px;height:22px}
.kvrow .v{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere;white-space:pre-line;line-height:1.4}
.kvrow .v small{color:var(--faint);font-size:12px;white-space:normal}
.kvrow .v a{color:var(--accent-text);text-decoration:none;overflow-wrap:anywhere}
.kvrow .go{color:var(--faint);flex:none;padding-top:2px}
.kvrow .go svg{width:18px;height:18px;stroke-width:2.2}
button.kvrow:active{background:var(--fill)}
.att{display:flex;align-items:center;gap:8px}
.att i{width:8px;height:8px;border-radius:50%;background:var(--ring);flex:none}
.att.yes i{background:var(--ok)}
.att.no i{background:var(--bad)}
.att small{color:var(--faint)}
.actrow{display:flex;gap:10px}
.actrow .btn{flex:1}

/* the editor */
.frow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--hair-2);font-size:15px;min-height:48px}
.frow:first-child{border-top:0}
.frow > label,.frow > .l{flex:1;min-width:0}
.frow .l small{display:block;color:var(--faint);font-size:12px}
.frow input[type="date"],.frow input[type="time"],.frow input[type="datetime-local"],.frow select,.frow input[type="number"]{border:1px solid var(--hair);background:var(--fill);border-radius:10px;padding:6px 9px;font-size:15px;min-width:0;color:var(--text);max-width:62%;font-variant-numeric:tabular-nums}
.frow input[type="number"]{width:64px;text-align:center}
.frow select{appearance:none;-webkit-appearance:none;padding-right:26px;text-overflow:ellipsis;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 7px center;background-size:14px}
.frow input.txt,.frow textarea{flex:1;border:0;background:none;outline:none;font-size:16px;min-width:0;padding:0;color:var(--text);width:100%}
.frow input.txt::placeholder,.frow textarea::placeholder{color:var(--faint)}
.frow textarea{resize:none;min-height:72px;font-size:15px;line-height:1.45}
.frow.big input{font-size:20px;font-weight:600;letter-spacing:-.01em}
.frow.big{padding-top:12px;padding-bottom:12px}
.frow .ic{color:var(--icon);flex:none;width:26px;display:grid;place-items:center}
.frow .ic svg{width:22px;height:22px}
.frow.sub{padding-left:42px}
.switch{width:51px;height:31px;border-radius:999px;background:var(--fill);border:1px solid var(--hair);position:relative;flex:none;transition:background .2s,border-color .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.28);transition:transform .22s var(--ease)}
.switch[aria-checked="true"]{background:var(--n-green);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.switch[disabled]{opacity:.5}
.wdays{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.wdays button{width:32px;height:32px;border-radius:50%;font-size:12px;font-weight:600;background:var(--fill);border:1px solid var(--hair);color:var(--muted)}
.wdays button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg.small button{padding:6px 4px;font-size:13px}
.frow .seg{max-width:62%;flex:1}
.calpick{display:flex;align-items:center;gap:8px}
.calpick i{width:12px;height:12px;border-radius:50%;background:var(--c,var(--cal))}

/* settings */
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.4}
.status i{width:10px;height:10px;border-radius:50%;background:var(--ring);flex:none}
.status.ok i{background:var(--ok)}
.status.bad i{background:var(--bad)}
.status span{flex:1;min-width:0}
.status b{color:var(--text)}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--hair-2);font-size:15px;font-weight:600}
.lrow:first-child{border-top:0}
.lrow i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent)}
.lrow .l{flex:1;min-width:0}
.lrow .l small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.empty .btn{margin-top:12px}

/* the header's search bar */
.top .search{margin:0 2px}
.sheet.full .sheetbody{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.pickrow{width:100%;text-align:center;padding:15px 14px;font-size:17px;font-weight:600;color:var(--accent-text);border-top:1px solid var(--hair-2)}
.pickrow:first-child{border-top:0}
.pickrow.danger{color:var(--danger-text)}
.pickrow:active{background:var(--fill)}
a.rowbtn{color:var(--text);text-decoration:none}
.sheetbody > *{flex-shrink:0}

/* ---- switches with a sliding glass thumb ----
   The view bar, the Day view's week strip and Settings' segmented choices:
   the options stay clear, and one thumb under them glides to the chosen
   one, stretching as it goes, as iOS 26's do (home/slide.js). */
.slides{position:relative;isolation:isolate}
.slides > :not(.slthumb){position:relative;z-index:1}
.slthumb{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;z-index:0;pointer-events:none;
  background:var(--gb-shine),var(--seg-thumb);box-shadow:inset 0 0 0 1px var(--gb-edge),inset 0 1px 0 var(--hi),0 3px 10px var(--lift);
  transition:opacity .25s ease,scale .25s var(--ease),background-color .3s}
.slthumb.off{opacity:0;scale:.7}
.tab[aria-selected="true"]{background:none;box-shadow:none;color:var(--accent-text)}
.tab[aria-selected="true"] svg{color:var(--accent-text)}
@media (max-width:389px){.tab svg{display:block}.tab{padding:0 11px}}
.seg.slides button[aria-pressed="true"]{background:none;box-shadow:none}
.seg > .slthumb{border-radius:17px}
.strip.slides button[aria-selected="true"] b{background:none}
.strip b{transition:color .25s .12s}
.strip > .slthumb{background:var(--gb-shine),var(--text);background-color:var(--text);box-shadow:0 2px 8px var(--lift)}
.strip > .slthumb.today{background:var(--gb-shine),var(--accent);background-color:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.enter .strip.keep{animation:none}

/* ---- the sheets: Liquid Glass ----
   New Event, an event's details, Settings and the this-or-all choice are
   each one sheet of clear glass floating just inside the screen's edges:
   the calendar blurs and brightens through it, a lit rim runs round it, the
   rows sit on it as the same faint tiles as the cards, and the fields and
   buttons are lighter glass on top. The rows don't blur again (the sheet
   already has), which keeps it smooth on a phone. */
:root{--lgs-top:rgba(255,255,255,.68);--lgs-bottom:rgba(255,255,255,.50);--lgs-rim:rgba(255,255,255,.92);--lgs-edge:rgba(255,255,255,.62);
  --lgs-field:rgba(255,255,255,.62);--lgs-filter:blur(28px) saturate(200%) brightness(1.06);--lgs-scrim:rgba(0,0,0,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lgs-top:rgba(44,44,52,.60);--lgs-bottom:rgba(22,22,28,.52);--lgs-rim:rgba(255,255,255,.20);--lgs-edge:rgba(255,255,255,.12);
  --lgs-field:rgba(255,255,255,.10);--lgs-filter:blur(28px) saturate(180%) brightness(.92);--lgs-scrim:rgba(0,0,0,.30)}}
:root[data-theme="dark"]{--lgs-top:rgba(44,44,52,.60);--lgs-bottom:rgba(22,22,28,.52);--lgs-rim:rgba(255,255,255,.20);--lgs-edge:rgba(255,255,255,.12);
  --lgs-field:rgba(255,255,255,.10);--lgs-filter:blur(28px) saturate(180%) brightness(.92);--lgs-scrim:rgba(0,0,0,.30)}
.lg .scrim{background:var(--lgs-scrim)}
.lg .sheet{width:auto;margin:0 8px 8px;border-radius:34px;border:0;overflow:hidden;max-height:calc(100% - env(safe-area-inset-top,0px) - 32px);
  background:linear-gradient(180deg,var(--lgs-top),var(--lgs-bottom));-webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);
  box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1.5px 1px var(--lgs-rim),0 24px 60px var(--lift-strong),0 2px 8px var(--lift)}
.lg .sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 32px)}
@media (min-width:576px){.lg .sheet{margin:0 auto 8px;max-width:544px}}
.lg .sheethead{padding:6px 12px 10px}
#evSheet .sheethead{justify-content:flex-end}
.lg .sheethead h2{font-size:17px;font-weight:600}
#stLbl,#pkLbl{padding-left:8px}
.lg .sheethead .iconbtn{width:44px;height:44px}
.lg .sheethead .iconbtn svg{width:22px;height:22px}
.lg .sheethead .textbtn{height:44px;padding:0 18px;font-size:16px}
.lg .okbtn{color:#fff;background:var(--gb-shine),color-mix(in srgb,var(--accent) 88%,transparent);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),inset 0 1px 1px rgba(255,255,255,.5),0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent)}
.lg .okbtn:active{color:#fff;background:var(--gb-shine),var(--accent)}
.lg .okbtn[disabled]{opacity:.6}
.lg .sheetbody{padding:6px 12px calc(16px + env(safe-area-inset-bottom,0px));-webkit-mask-image:linear-gradient(180deg,transparent,#000 12px);mask-image:linear-gradient(180deg,transparent,#000 12px)}
.lg .rgroup{border:0;border-radius:26px;background:var(--tile);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 .5px var(--tile-edge)}
.lg a.kvrow{text-decoration:none}
.lg .rowbtn:active,.lg button.kvrow:active,.lg a.kvrow:active,.lg .pickrow:active{background:var(--lgs-field)}
.lg .label{margin:4px 8px -6px}
.lg .hint{text-align:center;margin:0 12px}
.lg .evhead{padding:4px 8px 2px}
.lg .evhead h3{font-size:28px}
.lg .frow{border-top-color:var(--hair-2)}
.lg .frow > label{flex:1 0 auto;white-space:nowrap}
.lg .frow input.txt:focus-visible,.lg .frow textarea:focus-visible{outline:0}
.lg .frow.big input{font-size:22px;font-weight:700;letter-spacing:-.02em}
.lg .frow input[type="date"],.lg .frow input[type="datetime-local"],.lg .frow input[type="number"],.lg .frow select{
  border:0;border-radius:999px;padding:7px 13px;background-color:var(--lgs-field);
  box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 1px 3px var(--lift);transition:box-shadow .2s}
.lg .frow select{padding-right:30px;background-position:right 11px center}
.lg .frow input:not(.txt):focus-visible,.lg .frow select:focus-visible{outline:0;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent),inset 0 1px 1px var(--lgs-rim),0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.lg .seg{background:var(--fill);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 2px var(--lift)}
/* iOS 26's switch: a pill-shaped knob that swells into a clear lens while pressed */
.lg .switch{width:58px;height:30px;border:0;background:var(--fill);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 2px var(--lift)}
.lg .switch::after{top:3px;left:3px;width:34px;height:24px;border-radius:999px;transition:transform .3s cubic-bezier(.3,1.3,.5,1),scale .2s var(--ease),background .2s}
.lg .switch[aria-checked="true"]{background:var(--n-green)}
.lg .switch[aria-checked="true"]::after{transform:translateX(18px)}
.lg .switch:not([disabled]):active::after{scale:1.18;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.22)}
.lg .wdays button{border:0;background:var(--lgs-field);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim);transition:transform .18s var(--ease)}
.lg .wdays button:active{transform:scale(.9)}
.lg .wdays button[aria-pressed="true"]{color:#fff;background:var(--gb-shine),color-mix(in srgb,var(--accent) 88%,transparent);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 3px 10px color-mix(in srgb,var(--accent) 30%,transparent)}
.lg .btn.danger{border-radius:26px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.lg .sheet{background:var(--bar-solid)}}
@media (prefers-reduced-transparency:reduce){.lg .sheet{background:var(--bar-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <section class="view" id="calView" aria-label="Calendar">
    <header class="top" id="top">
      <div class="titlerow">
        <button class="titlebtn" id="titleBtn" type="button" aria-label="Go to the year">
          <h1 class="title" id="title">Calendar<small id="titleSub"></small></h1>
        </button>
        <div class="acts">
          <button class="iconbtn glass" id="todayBtn" type="button" aria-label="Today"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/><rect x="9.6" y="12.6" width="4.8" height="4.4" rx="1.2" class="fs"/></svg></button>
          <button class="iconbtn glass" id="searchBtn" type="button" aria-label="Search" aria-pressed="false">
            <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
          </button>
          <button class="iconbtn glass" id="setBtn" type="button" aria-label="Settings and calendars">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5l1.3 2.3 2.6-.7.6 2.6 2.6.6-.7 2.6 2.3 1.3-2.3 1.3.7 2.6-2.6.6-.6 2.6-2.6-.7L12 20.5l-1.3-2.3-2.6.7-.6-2.6-2.6-.6.7-2.6L3.5 12l2.3-1.3-.7-2.6 2.6-.6.6-2.6 2.6.7z"/></svg>
          </button>
        </div>
      </div>
      <div class="search" id="searchBar" hidden role="search">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
        <input type="search" id="searchIn" placeholder="Search events" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="Search events">
        <button class="clear" id="searchClear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" class="b"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <main class="list" id="main"></main>
  </section>

  <!-- DOCK: the views, and New Event -->
  <div class="dock">
    <nav class="tabs glass" role="tablist" aria-label="Views">
      <span class="slthumb" id="tabThumb" aria-hidden="true"></span>
      <button class="tab" type="button" role="tab" data-view="day" aria-selected="false" aria-label="Day"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/><path d="M8 14h8"/></svg></button>
      <button class="tab" type="button" role="tab" data-view="week" aria-selected="false" aria-label="Week"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/><path d="M9.2 9.6v11M14.8 9.6v11"/></svg></button>
      <button class="tab" type="button" role="tab" data-view="month" aria-selected="true" aria-label="Month"><svg viewBox="0 0 24 24"><rect x="3.4" y="4.6" width="17.2" height="16" rx="3.2"/><path d="M3.4 9.6h17.2M8 2.8v3.6M16 2.8v3.6"/><path d="M3.4 15.1h17.2M9.2 9.6v11M14.8 9.6v11"/></svg></button>
      <button class="tab" type="button" role="tab" data-view="year" aria-selected="false" aria-label="Year"><svg viewBox="0 0 24 24"><rect x="3.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="3.4" width="7.2" height="7.2" rx="2"/><rect x="3.4" y="13.4" width="7.2" height="7.2" rx="2"/><rect x="13.4" y="13.4" width="7.2" height="7.2" rx="2"/></svg></button>
      <button class="tab" type="button" role="tab" data-view="list" aria-selected="false" aria-label="List"><svg viewBox="0 0 24 24"><path d="M8.4 6.4h12M8.4 12h12M8.4 17.6h12"/><circle cx="4.4" cy="6.4" r=".9" class="fs"/><circle cx="4.4" cy="12" r=".9" class="fs"/><circle cx="4.4" cy="17.6" r=".9" class="fs"/></svg></button>
    </nav>
    <div class="dockr">
      <button class="fab" id="fab" type="button" aria-label="New event">
        <svg viewBox="0 0 24 24" class="b"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg>
      </button>
    </div>
  </div>

  <!-- One event -->
  <div class="sheetwrap lg" id="evSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="evLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="evLbl" class="vh">Event</h2><div class="acts" id="evActs"></div></div>
      <div class="sheetbody" id="evBody"></div>
    </div>
  </div>

  <!-- New or edited event -->
  <div class="sheetwrap lg" id="edSheet" hidden>
    <div class="scrim"></div>
    <div class="sheet full glass-strong" role="dialog" aria-modal="true" aria-labelledby="edLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><button class="iconbtn" id="edCancel" type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" class="b"><path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/></svg></button><h2 id="edLbl">New Event</h2><div class="acts"><button class="iconbtn okbtn" id="edSave" type="button" aria-label="Add"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody" id="edBody"></div>
    </div>
  </div>

  <!-- A choice: this event, all future, all -->
  <div class="sheetwrap lg" id="pickSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="pkLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="pkLbl">Choose</h2><div class="acts"><button class="iconbtn" data-close type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" class="b"><path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6"/></svg></button></div></div>
      <div class="sheetbody"><p class="hint" id="pkHint" style="margin:0 4px"></p><div class="rgroup glass" id="pkRows"></div></div>
    </div>
  </div>

  <!-- Settings and calendars -->
  <div class="sheetwrap lg" id="setSheet" hidden>
    <div class="scrim" data-close></div>
    <div class="sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="stLbl">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheethead"><h2 id="stLbl">Settings</h2><div class="acts"><button class="iconbtn okbtn" data-close type="button" aria-label="Done"><svg viewBox="0 0 24 24" class="b"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div></div>
      <div class="sheetbody" id="stBody"></div>
    </div>
  </div>

  <!-- Shown once after an update; and while iCloud is read or written -->
  <div class="updpill" id="updPill" role="status" hidden><svg viewBox="0 0 24 24"><path d="M11 3.6l1.5 4.1a2.4 2.4 0 0 0 1.4 1.4l4.1 1.5-4.1 1.5a2.4 2.4 0 0 0-1.4 1.4L11 17.6l-1.5-4.1a2.4 2.4 0 0 0-1.4-1.4L4 10.6l4.1-1.5a2.4 2.4 0 0 0 1.4-1.4z"/><path d="M18.2 15.2l.6 1.6.6.6 1.6.6-1.6.6-.6.6-.6 1.6-.6-1.6-.6-.6-1.6-.6 1.6-.6.6-.6z"/></svg>Updated</div>
  <div class="updpill syncpill" id="syncPill" role="status" hidden><svg class="spin" viewBox="0 0 24 24"><path d="M20 11.2a8 8 0 0 0-14.6-4.4L4 8.4"/><path d="M4 3.8v4.6h4.6"/><path d="M4 12.8a8 8 0 0 0 14.6 4.4l1.4-1.6"/><path d="M20 20.2v-4.6h-4.6"/></svg><svg class="tick b" viewBox="0 0 24 24"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg><span id="syncPillTxt">Updating</span></div>

  <div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastAct" type="button" hidden>Undo</button></div>
</div>

<script src="../home/slide.js"></script>
<script src="../home/account.js"></script>   <!-- family accounts: signs calls to calendar/api in -->
<script src="ical.js"></script>
<script src="app.js"></script>
<!-- Opened from AllisonOS Home: swipe up from the bottom to go back to it. -->
<script src="../home/welcome.js" data-app="calendar" data-auto defer></script>   <!-- aOS: this app's walkthrough the first time, and what's new after an update -->
</body>
</html>
