<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Shell": a white calendar page on shell rose, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E9C0B9"/>
      <stop offset="0.55" stop-color="#C08A84"/>
      <stop offset="1" stop-color="#93605B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="100" y="124" width="312" height="292" rx="52" fill="#fff"/>
      <rect x="100" y="200" width="312" height="12" fill="#000"/>
      <rect x="156" y="78" width="46" height="88" rx="23" fill="#000"/><rect x="310" y="78" width="46" height="88" rx="23" fill="#000"/>
      <g fill="#000">
        <circle cx="160" cy="262" r="16"/><circle cx="224" cy="262" r="16"/><circle cx="288" cy="262" r="16"/><circle cx="352" cy="262" r="16"/>
        <circle cx="160" cy="320" r="16"/><circle cx="288" cy="320" r="16"/><circle cx="352" cy="320" r="16"/>
        <circle cx="160" cy="378" r="16"/><circle cx="224" cy="378" r="16"/>
        <circle cx="224" cy="320" r="25"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#FFFFFF" mask="url(#cut)"/>
    <rect x="166" y="88" width="26" height="68" rx="13" fill="#FFFFFF"/><rect x="320" y="88" width="26" height="68" rx="13" fill="#FFFFFF"/>
  </g>
</svg>
