<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Page": a white calendar page on a coral-to-raspberry sky, the same family as Travel's Sunset. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="0.55" stop-color="#FF3D6E"/>
      <stop offset="1" stop-color="#C2266F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5C7A"/>
      <stop offset="1" stop-color="#F0335F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="120" cy="90" r="220" fill="url(#glow)"/>
  <!-- the page -->
  <rect x="96" y="112" width="320" height="304" rx="52" fill="#FFFFFF" fill-opacity="0.96"/>
  <path d="M148 112h216a52 52 0 0 1 52 52v40H96v-40a52 52 0 0 1 52-52z" fill="url(#band)"/>
  <!-- rings -->
  <rect x="166" y="82" width="26" height="68" rx="13" fill="#FFFFFF"/>
  <rect x="320" y="82" width="26" height="68" rx="13" fill="#FFFFFF"/>
  <!-- days -->
  <g fill="#D7D2DA">
    <circle cx="152" cy="252" r="16"/><circle cx="222" cy="252" r="16"/><circle cx="292" cy="252" r="16"/><circle cx="362" cy="252" r="16"/>
    <circle cx="152" cy="316" r="16"/><circle cx="292" cy="316" r="16"/><circle cx="362" cy="316" r="16"/>
    <circle cx="152" cy="380" r="16"/><circle cx="222" cy="380" r="16"/>
  </g>
  <!-- today -->
  <circle cx="222" cy="316" r="24" fill="#FF3D6E"/>
</svg>
