# Empties the Mail app's Marketing bucket on a schedule, and brings back
# Remind Me mail that is due.
#
# The app sweeps when it is opened; this does the same daily so mail is
# cleared whether or not the phone app is opened. Everything in the bucket
# older than DELETE_AFTER_DAYS (default 30) goes to the Trash, where Gmail
# deletes it for good after 30 days.
#
# Does nothing until the three Google secrets exist, so it is safe to leave
# switched on. Setup: mail/README.md.
name: Mail

on:
  schedule:
    # Once a day at 07:23 UTC - off the hour, as GitHub delays scheduled runs
    # at busy times such as :00.
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'mail/scripts/sweep.mjs'
      - '.github/workflows/mail.yml'

permissions:
  contents: read

jobs:
  sweep:
    # Never from another branch's code: this job holds the Gmail refresh token.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions are pinned to exact commits (version in the comment), not tags:
      # a tag can be moved to new code, and these jobs can read the repo's
      # secrets. To update, look up the new tag's commit and change both.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - name: Empty the bucket and bring back reminders
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MARKETING_LABEL: ${{ vars.MARKETING_LABEL }}
          DELETE_AFTER_DAYS: ${{ vars.DELETE_AFTER_DAYS }}
        run: node mail/scripts/sweep.mjs
