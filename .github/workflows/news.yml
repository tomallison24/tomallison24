# Releases aOS, refreshes the News app's headlines and publishes the site.
#
# Only released versions go live (aOS/RELEASING.md): a release is a tag,
# aOS<version> (aOS1, aOS1.1). Every merge to the default branch releases on
# its own: the newest version in home/welcome.js's release log is tagged on the
# merged code and published (the owner asked for this). It can also be run by
# hand with a version. labs/ - test pages for the owner, not apps - always
# publishes from the latest merged code.
#
# release: (a push to the default branch, or by hand with a version) checks
#          that the newest entry in home/welcome.js's release log is that
#          version (on a push, it is that version) and tags the default branch
#          as aOS<version>. Released already (more added to aOS1, say): the tag
#          moves to the latest code, and tags for versions no longer in the log
#          (aOS1.1, folded into aOS1) are removed, so it's the live one.
# build:   fetches every feed in news/feeds.json into news/data/news.json and
#          packages the site (News, Weather, Mail, Notes, Podcasts, Travel,
#          Calendar, Places, Fitness, Drinks, Home Assistant in house/, aOS, and home/'s
#          shared scripts). On a push to another branch it only checks the
#          branch builds. After a release, by hand or on the schedule, it
#          packages the live release - the newest aOS tag - with fresh
#          headlines, and publishes it to Cloudflare Pages,
#          once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository
#          secrets exist (the site sits behind Cloudflare Access, so only
#          signed-in people can open it).
# deploy:  publishes the same package to GitHub Pages (public). To be removed
#          once the Cloudflare site is confirmed working.
name: News

on:
  schedule:
    # Every 30 minutes, off the hour: GitHub delays or drops scheduled runs
    # at busy times such as :00 and :30.
    - cron: '15,45 * * * *'
  workflow_dispatch:
    inputs:
      release:
        description: 'aOS version to release, like 1.1 (its entry must be the newest in home/welcome.js). Blank: republish the live release with fresh headlines.'
        required: false
        default: ''
  push:
    paths:
      - 'news/**'
      - 'weather/**'
      - 'mail/**'
      - 'notes/**'
      - 'home/**'
      - 'podcasts/**'
      - 'travel/**'
      - 'places/**'
      - 'house/**'
      - 'calendar/**'
      - 'fitness/**'
      - 'drinks/**'
      - 'aOS/**'
      - 'labs/**'
      - 'functions/**'
      - 'server/**'
      - '.github/workflows/news.yml'

permissions:
  contents: read

jobs:
  release:
    # By hand with a version, or every merge to the default branch.
    if: (github.event_name == 'workflow_dispatch' && inputs.release != '') || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # One release at a time; a newer merge's release replaces one still waiting,
    # so the tag never moves back to older code.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write   # to push the release tag
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          fetch-depth: 0
      - name: Tag the release
        env:
          V: ${{ inputs.release }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          [ "$GITHUB_REF_NAME" = "$DEFAULT" ] || { echo "::error::Release from $DEFAULT, not $GITHUB_REF_NAME"; exit 1; }
          top=$(node -e "const m = require('fs').readFileSync('home/welcome.js', 'utf8').match(/const RELEASES = \[\s*\{\s*v:\s*'([^']+)'/); console.log(m ? m[1] : '')")
          # a merge releases the newest version in the log
          V=${V:-$top}
          printf '%s' "$V" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || { echo "::error::A version is numbers and dots, like 1.1"; exit 1; }
          [ "$top" = "$V" ] || { echo "::error::The newest entry in home/welcome.js's release log is aOS$top, not aOS$V: add aOS$V's entry first"; exit 1; }
          # a release tag whose version isn't in the log any more (folded into another) goes
          logged=$(node -e "const s = require('fs').readFileSync('home/welcome.js', 'utf8'); const i = s.indexOf('const RELEASES = ['); const b = s.slice(i, s.indexOf('];', i)); console.log([...b.matchAll(/\{\s*v:\s*'([^']+)'/g)].map(m => m[1]).join(' '))")
          for t in $(git tag --list 'aOS*'); do
            case " $logged " in *" ${t#aOS} "*) ;; *) git push origin ":refs/tags/$t" && echo "Removed $t: no longer in the log" >> "$GITHUB_STEP_SUMMARY";; esac
          done
          # released already: the tag moves to the latest code
          if git rev-parse -q --verify "refs/tags/aOS$V" >/dev/null; then
            git tag -f "aOS$V" && git push -f origin "refs/tags/aOS$V"
            echo "Released aOS$V again, now at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            git tag "aOS$V" && git push origin "aOS$V"
            echo "Released aOS$V at $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: release
    if: always() && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One publish at a time, in order, so an older package can't land after a newer one.
    # (Not the release job: a queued publish never stands in for a release.)
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref_name != github.event.repository.default_branch && format('check-{0}', github.ref) || 'publish' }}
      cancel-in-progress: false
    env:
      PUBLISH: ${{ github.event_name != 'push' || github.ref_name == github.event.repository.default_branch }}   # a merge (released above), by hand or on the schedule; a push to another branch only checks
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      # Actions are pinned to exact commits (version in the comment), not tags:
      # a tag can be moved to new code, and these jobs can read the repo's
      # secrets. To update, look up the new tag's commit and change both.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          fetch-depth: 0   # the release tags
      - name: Use the live release
        if: env.PUBLISH == 'true'
        run: |
          live=$(git tag --list 'aOS*' --sort=-v:refname | head -1)
          if [ -z "$live" ]; then echo "::warning::No aOS release yet: publishing $GITHUB_REF_NAME as it is"; exit 0; fi
          # labs/ (test pages for the owner, not apps) always comes from the latest merged code
          if [ -d labs ]; then cp -r labs "$RUNNER_TEMP/labs"; fi
          git checkout -q --detach "$live"
          if [ -d "$RUNNER_TEMP/labs" ]; then rm -rf labs && cp -r "$RUNNER_TEMP/labs" labs; fi
          echo "Publishing $live ($(git rev-parse --short HEAD)), with labs/ from $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      # Last run's news.json, for topics that keep stories for days.
      - name: Restore last run's headlines
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .cache-news
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      - name: Fetch headlines
        run: node news/scripts/fetch-news.mjs
      - name: Keep headlines for the next run
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .cache-news
          key: news-data-${{ github.run_id }}
      - name: Send aOS's old address on to the new one
        # aOS was at /aos/ before it moved to /aOS/; paths are case-sensitive, so the old
        # address (in Safari's history, a bookmark, an early Home Screen icon) would 404.
        # Made here, on the runner, so the repository never holds both spellings.
        run: |
          mkdir -p aos
          cat > aos/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>aOS</title><meta http-equiv="refresh" content="0; url=../aOS/">
          <script>location.replace('../aOS/' + location.search + location.hash)</script></head>
          <body style="font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:40px 16px">aOS has moved: <a href="../aOS/">open aOS</a></body></html>
          HTML
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4.0.0
        with:
          path: .
      - name: Publish to Cloudflare Pages
        if: env.PUBLISH == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          ICLOUD_APPLE_ID: ${{ secrets.ICLOUD_APPLE_ID }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR: ${{ secrets.ICLOUD_CALENDAR }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: |
          # wrangler is pinned to an exact release for the same reason; it runs
          # with the Cloudflare token. It runs from the repository root, so it
          # also deploys functions/ (the Podcasts app's feed fetcher,
          # /podcasts/api/*, Travel's flight status, /travel/api/*, and
          # Calendar's iCloud connection, /calendar/api/*, and Weather's forecast
          # radar run time, /weather/api/*) as Pages Functions.
          mkdir -p _site && cp -r home news weather mail notes podcasts travel calendar places house fitness drinks aOS aos _site/ && if [ -d labs ]; then cp -r labs _site/; fi
          npx --yes wrangler@4.131.1 pages project create tomallison24-news --production-branch=main 2>/dev/null || true
          # Family accounts (server/auth.js, functions/aOS/api): a Workers KV
          # namespace, "allisonos-accounts", bound to the Pages project as
          # ACCOUNTS. Needs the token to have Account > Workers KV Storage >
          # Edit; without it accounts stay off and the site works as before
          # (aOS/RELEASING.md, "Family accounts"). Bound before the secrets
          # below are put, and before the deploy, which picks the binding up.
          cf="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          find_kv() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/storage/kv/namespaces?per_page=100" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => { let j = {}; try { j = JSON.parse(s); } catch {}
              if (!j.success) process.exit(2);
              const n = (j.result || []).find(x => x.title === "allisonos-accounts"); if (!n) process.exit(1); console.log(n.id); });'; }
          kv_rc=0; kv_id=$(find_kv) || kv_rc=$?
          if [ "$kv_rc" = 1 ]; then
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$cf/storage/kv/namespaces" -d '{"title":"allisonos-accounts"}' >/dev/null || true
            kv_rc=0; kv_id=$(find_kv) || kv_rc=$?
          fi
          if [ "$kv_rc" != 0 ] || [ -z "$kv_id" ]; then
            echo "::warning::Family accounts are off: the Cloudflare token can't use Workers KV. Give it Account > Workers KV Storage > Edit (aOS/RELEASING.md, Family accounts)."
          else
            bound=$(curl -sS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$cf/pages/projects/tomallison24-news" \
              -d "{\"deployment_configs\":{\"production\":{\"kv_namespaces\":{\"ACCOUNTS\":{\"namespace_id\":\"$kv_id\"}}}}}" \
              | node -e 'let s = ""; process.stdin.on("data", d => s += d).on("end", () => { try { console.log(JSON.parse(s).success ? "yes" : "no"); } catch { console.log("no"); } });') || bound=no
            if [ "$bound" = yes ]; then echo "Family accounts: storage bound ($kv_id)"; else echo "::warning::Couldn't bind the accounts storage to the Pages project (the token needs Account > Cloudflare Pages > Edit)."; fi
          fi
          # Travel's live flight status key (travel/README.md, "Live flight
          # status"), handed to the Pages project as a secret. Skipped until
          # the AERODATABOX_KEY repository secret exists.
          if [ -n "$AERODATABOX_KEY" ]; then
            printf '%s' "$AERODATABOX_KEY" | npx --yes wrangler@4.131.1 pages secret put AERODATABOX_KEY --project-name=tomallison24-news
          fi
          # Calendar's iCloud sign-in (calendar/README.md, "Set up"): the
          # Apple ID, its app-specific password and, optionally, the
          # calendar's name. Each is skipped until its repository secret exists.
          # functions/_middleware.js: with both of these, every /api/ request
          # must carry a valid Cloudflare Access sign-in (calendar/README.md,
          # "Locking the server functions"). Skipped until they exist.
          for v in ICLOUD_APPLE_ID ICLOUD_APP_PASSWORD ICLOUD_CALENDAR ACCESS_TEAM_DOMAIN ACCESS_AUD; do
            if [ -n "${!v}" ]; then
              printf '%s' "${!v}" | npx --yes wrangler@4.131.1 pages secret put "$v" --project-name=tomallison24-news
            fi
          done
          npx --yes wrangler@4.131.1 pages deploy _site --project-name=tomallison24-news --branch=main --commit-dirty=true

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}news/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
