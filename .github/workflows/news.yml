# Refreshes the News app's headlines and publishes the site.
#
# build:  fetches every feed in news/feeds.json into news/data/news.json and
#         packages the repo (Home + News + Weather + Mail + Notes + Podcasts + Travel). Runs on any branch, so feed
#         changes can be checked before merging. On the default branch it
#         also publishes to Cloudflare Pages, once the CLOUDFLARE_API_TOKEN
#         and CLOUDFLARE_ACCOUNT_ID repository secrets exist (the site sits
#         behind Cloudflare Access, so only signed-in people can open it).
# deploy: publishes the same package to GitHub Pages (public). To be removed
#         once the Cloudflare site is confirmed working.
name: News

on:
  schedule:
    # Every 30 minutes, off the hour: GitHub delays or drops scheduled runs
    # at busy times such as :00 and :30.
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'news/**'
      - 'weather/**'
      - 'mail/**'
      - 'notes/**'
      - 'home/**'
      - 'podcasts/**'
      - 'travel/**'
      - 'functions/**'
      - '.github/workflows/news.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PUBLISH: ${{ github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      # Actions are pinned to exact commits (version in the comment), not tags:
      # a tag can be moved to new code, and these jobs can read the repo's
      # secrets. To update, look up the new tag's commit and change both.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      # Last run's news.json, for topics that keep stories for days.
      - name: Restore last run's headlines
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .cache-news
          key: news-data-${{ github.run_id }}
          restore-keys: news-data-
      - name: Fetch headlines
        run: node news/scripts/fetch-news.mjs
      - name: Keep headlines for the next run
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: .cache-news
          key: news-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4.0.0
        with:
          path: .
      - name: Publish to Cloudflare Pages
        if: env.PUBLISH == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: |
          # wrangler is pinned to an exact release for the same reason; it runs
          # with the Cloudflare token. It runs from the repository root, so it
          # also deploys functions/ (the Podcasts app's feed fetcher,
          # /podcasts/api/*, and Travel's flight status, /travel/api/*) as
          # Pages Functions.
          mkdir -p _site && cp -r home news weather mail notes podcasts travel _site/
          npx --yes wrangler@4.131.1 pages project create tomallison24-news --production-branch=main 2>/dev/null || true
          # Travel's live flight status key (travel/README.md, "Live flight
          # status"), handed to the Pages project as a secret. Skipped until
          # the AERODATABOX_KEY repository secret exists.
          if [ -n "$AERODATABOX_KEY" ]; then
            printf '%s' "$AERODATABOX_KEY" | npx --yes wrangler@4.131.1 pages secret put AERODATABOX_KEY --project-name=tomallison24-news
          fi
          npx --yes wrangler@4.131.1 pages deploy _site --project-name=tomallison24-news --branch=main --commit-dirty=true

  deploy:
    needs: build
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}news/
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4.0.5
