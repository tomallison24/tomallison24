# Checks that every app is wired into aOS completely and follows the ground
# rules every AllisonOS app shares (aOS/scripts/check-apps.mjs; the steps are
# in .claude/skills/new-aos-app/SKILL.md). It only reads the repository:
# nothing is built or published here.
name: Apps check

# A branch's checks run once, on its pull request; pushes only run here for the
# default branch (the merge itself), so every commit isn't checked twice.
on:
  push:
    branches: [claude/custom-iphone-photos-app-0ubcek]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: node aOS/scripts/check-apps.mjs
      # the family accounts' safety rules and the plan: plain Node, no network
      - run: node aOS/scripts/accounts-api-test.mjs && node aOS/scripts/plan-api-test.mjs && node aOS/scripts/push-api-test.mjs && node drinks/scripts/api-test.mjs && node notes/scripts/push-test.mjs && node news/scripts/tick-test.mjs
      # Meals: the server (the allergy check above all) and its sums
      - run: node meals/scripts/api-test.mjs && node meals/scripts/logic-test.mjs && node notes/scripts/aisles-test.mjs && node news/scripts/ai-test.mjs
      # each app's own server and logic tests: plain Node, no network
      - run: node calendar/scripts/access-test.mjs && node calendar/scripts/api-test.mjs && node calendar/scripts/ical-test.mjs
      - run: node drinks/scripts/calc-test.mjs && node drinks/scripts/sheet-test.mjs && node fitness/scripts/analysis-test.mjs && node fitness/scripts/sheet-test.mjs
      - run: node mail/scripts/push-test.mjs && node places/scripts/parse-test.mjs && node travel/scripts/api-test.mjs && node travel/scripts/parse-test.mjs && node travel/scripts/reader-version-test.mjs && node orders/scripts/parse-test.mjs && node orders/scripts/api-test.mjs && node orders/scripts/sheet-test.mjs && node meals/scripts/sheet-test.mjs && node podcasts/scripts/sheet-test.mjs && node ordersvintage/scripts/same-reader-test.mjs
      # Clock: when alarms ring, the sleep schedule, zones, laps, the sounds
      - run: node clock/scripts/logic-test.mjs
      - run: node calendarvintage/scripts/same-reader-test.mjs && node drinksvintage/scripts/same-reader-test.mjs && node fitnessvintage/scripts/same-reader-test.mjs && node travelvintage/scripts/same-reader-test.mjs && node weathervintage/scripts/same-reader-test.mjs && node mealsvintage/scripts/same-reader-test.mjs && node placesvintage/scripts/same-reader-test.mjs

  # Each app's live tour finds its way round the app, and tidies up after itself
  # (aOS/scripts/tours-test.mjs). The slowest test, so it's in three shards that run
  # side by side with everything else: shard i plays every third app.
  tours:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: tours-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node aOS/scripts/tours-test.mjs
        env:
          TOURS_SHARD: ${{ matrix.shard }}/3

  # The browser tests: each app at iPhone size in Chromium, driven through what a person does,
  # and aOS's own (every app opens, on its own, the sky, the release's update screens). They run in
  # groups side by side, each about four minutes, so the whole check takes about as long as one
  # group, not all of them in a row. A new browser test goes into the group that runs shortest
  # (each group's time is on its run's page). A group runs all its tests even when one fails, and
  # names each failure. A test seeds aos.seen at '999' so no walkthrough or update screen covers the page.
  browser:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # every app opens, light and dark, with nothing its policy blocks; and every app on its own
          - group: smoke
            tests: |
              aOS/scripts/apps-smoke-test.mjs
              aOS/scripts/standalone-test.mjs
          # the Vintage sky; the newest release's update screens in aOS and every app
          - group: sky-release
            tests: |
              aOS/scripts/sky-test.mjs
              aOS/scripts/release-test.mjs
          # aOS: Calendar's layers through the family account, an invite, notifications, designs, the look, Android; Meals and Podcasts
          - group: aos
            tests: |
              calendar/scripts/layers-test.mjs
              calendarvintage/scripts/layers-test.mjs
              aOS/scripts/join-test.mjs
              aOS/scripts/notify-test.mjs
              aOS/scripts/designs-test.mjs
              aOS/scripts/look-test.mjs
              aOS/scripts/android-installed-test.mjs
              meals/scripts/app-test.mjs
              mealsvintage/scripts/app-test.mjs
              podcasts/scripts/app-test.mjs
          # Drinks, Podcasts Vintage, Places Vintage
          - group: drinks
            tests: |
              drinks/scripts/app-test.mjs
              podcastsvintage/scripts/app-test.mjs
              placesvintage/scripts/app-test.mjs
          # Drinks Vintage, Home, News' table and match pages, Calendar
          - group: home
            tests: |
              drinksvintage/scripts/app-test.mjs
              house/scripts/app-test.mjs
              house/scripts/connect-test.mjs
              news/scripts/table-test.mjs
              news/scripts/match-test.mjs
              calendar/scripts/app-test.mjs
          # Home Vintage, Fitness, Calendar Vintage, Clock, Notes
          - group: apps
            tests: |
              housevintage/scripts/app-test.mjs
              housevintage/scripts/connect-test.mjs
              fitness/scripts/app-test.mjs
              calendarvintage/scripts/app-test.mjs
              fitnessvintage/scripts/app-test.mjs
              clock/scripts/app-test.mjs
              notes/scripts/aisles-app-test.mjs
              notes/scripts/push-app-test.mjs
              notes/scripts/security-test.mjs
          # Notes Vintage, Places, Travel, Weather Vintage, News
          - group: apps-more
            tests: |
              notesvintage/scripts/aisles-app-test.mjs
              notesvintage/scripts/push-app-test.mjs
              notesvintage/scripts/security-test.mjs
              notesvintage/scripts/app-test.mjs
              places/scripts/app-test.mjs
              travel/scripts/app-test.mjs
              travel/scripts/smart-test.mjs travel
              travel/scripts/smart-test.mjs travelvintage
              travelvintage/scripts/app-test.mjs
              weathervintage/scripts/app-test.mjs
              news/scripts/app-test.mjs
              newsvintage/scripts/app-test.mjs
          # Orders and Mail, both designs (Mail: the security tests that run in a page)
          - group: orders-mail
            tests: |
              orders/scripts/app-test.mjs
              ordersvintage/scripts/app-test.mjs
              mail/scripts/security-test.mjs
              mailvintage/scripts/security-test.mjs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Run the group's tests
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          failed=''
          while read -r t; do
            [ -n "$t" ] || continue
            echo "::group::node $t"
            if node $t < /dev/null; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::node $t failed"; failed="$failed
            node $t"; fi
          done <<< "$TESTS"
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
