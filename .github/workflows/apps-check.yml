# Checks that every app is wired into aOS completely and follows the ground
# rules every AllisonOS app shares (aOS/scripts/check-apps.mjs; the steps are
# in .claude/skills/new-aos-app/SKILL.md). It only reads the repository:
# nothing is built or published here.
name: Apps check

# A branch's checks run once, on its pull request. The browser tests run only where the pull
# request needs them (.github/scripts/ci-select.mjs): all of them when it changes shared code,
# an app's own (and every test that opens that app) when it changes only some apps, none when
# it changes only labs/ or documentation. The merge (a push to the default branch) runs only the
# quick checks: its pull request already passed the rest.
on:
  push:
    branches: [claude/custom-iphone-photos-app-0ubcek]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request stops the run still going for the one before it.
concurrency:
  group: apps-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job reports under its own name on every pull request (a skipped one as skipped), so each can be a
# required check for GitHub's auto-merge: apps, changes, the twelve groups, tours-0 to tours-2. A required
# check that never reports would hold a pull request for good, so the tours skip their steps, not the job.
jobs:
  check:
    name: apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: node aOS/scripts/check-apps.mjs && node .github/scripts/ci-select-test.mjs
      # the family accounts' safety rules and the plan: plain Node, no network
      - run: node aOS/scripts/find-test.mjs && node aOS/scripts/accounts-api-test.mjs && node aOS/scripts/sheet-api-test.mjs && node aOS/scripts/plan-api-test.mjs && node aOS/scripts/push-api-test.mjs && node drinks/scripts/api-test.mjs && node notes/scripts/push-test.mjs && node news/scripts/tick-test.mjs && node news/scripts/stemcell-log-test.mjs
      # Meals: the server (the allergy check above all) and its sums
      - run: node meals/scripts/api-test.mjs && node notes/scripts/ipsy-api-test.mjs && node meals/scripts/logic-test.mjs && node notes/scripts/aisles-test.mjs && node news/scripts/ai-test.mjs
      # each app's own server and logic tests: plain Node, no network
      - run: node calendar/scripts/access-test.mjs && node calendar/scripts/api-test.mjs && node calendar/scripts/ical-test.mjs
      - run: node drinks/scripts/calc-test.mjs && node drinks/scripts/sheet-test.mjs && node notes/scripts/sheet-test.mjs && node fitness/scripts/analysis-test.mjs && node fitness/scripts/sheet-test.mjs && node fitness/scripts/meds-test.mjs && node fitness/scripts/steps-api-test.mjs && node fitness/scripts/ipsy-api-test.mjs && node fitness/scripts/health-api-test.mjs && node fitness/scripts/health-status-test.mjs && node fitness/scripts/vitals-alert-test.mjs && node travel/scripts/sheet-test.mjs
      - run: node mail/scripts/push-test.mjs && node places/scripts/parse-test.mjs && node travel/scripts/api-test.mjs && node travel/scripts/parse-test.mjs && node travel/scripts/reader-version-test.mjs && node orders/scripts/parse-test.mjs && node orders/scripts/api-test.mjs && node orders/scripts/sheet-test.mjs && node meals/scripts/sheet-test.mjs && node podcasts/scripts/sheet-test.mjs && node podcasts/scripts/api-test.mjs
      # Clock: when alarms ring, the sleep schedule, zones, laps, the sounds
      - run: node clock/scripts/logic-test.mjs
      # Sparkle Kingdom: the learning engine and every question it makes, the school letters, its server
      - run: node sparkle/scripts/logic-test.mjs && node sparkle/scripts/letters-test.mjs && node sparkle/scripts/api-test.mjs
      # School: reading the school's ParentSquare emails; Money: reading Monarch's emails, the sums (cards, rewards, what repeats), and its server (who may see it)
      - run: node school/scripts/sort-test.mjs && node money/scripts/parse-test.mjs && node money/scripts/calc-test.mjs && node money/scripts/api-test.mjs && node home/scripts/redact-test.mjs

  # What the pull request changes: each browser group keeps only the tests that need it.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.diff.outputs.files }}
      tours: ${{ steps.diff.outputs.tours }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(node .github/scripts/ci-select.mjs changed "$BASE")
          { echo 'files<<EOF_FILES'; echo "$files"; echo 'EOF_FILES'; } >> "$GITHUB_OUTPUT"
          echo "tours=$(CHANGED="$files" node .github/scripts/ci-select.mjs tours)" >> "$GITHUB_OUTPUT"
          echo "Changed:"; echo "$files"

  # Each app's live tour finds its way round the app, and tidies up after itself
  # (aOS/scripts/tours-test.mjs). The slowest test, so it's in nine shards: three jobs that run
  # side by side with everything else, each playing three shards at once (.github/scripts/ci-run.mjs).
  tours:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: tours-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        if: needs.changes.outputs.tours == 'yes'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        if: needs.changes.outputs.tours == 'yes'
        with:
          node-version: 22
      # the test browser and its system packages, from the caches the default branch keeps (warm)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        id: pw
        if: needs.changes.outputs.tours == 'yes'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        if: needs.changes.outputs.tours == 'yes'
        with:
          path: ~/apt-archives
          key: apt-playwright-1.56.1-${{ runner.os }}
          restore-keys: apt-playwright-1.56.1-${{ runner.os }}-
      - run: .github/scripts/ci-browser.sh ${{ steps.pw.outputs.cache-hit == 'true' && 'hit' || '' }}
        timeout-minutes: 45   # its own tries give up sooner (ci-browser.sh)
        if: needs.changes.outputs.tours == 'yes'
      - name: Run the tours
        if: needs.changes.outputs.tours == 'yes'
        env:
          SHARD: ${{ matrix.shard }}
        run: TESTS="$(for k in 0 3 6; do echo "TOURS_SHARD=$((SHARD + k))/9 aOS/scripts/tours-test.mjs"; done)" node .github/scripts/ci-run.mjs

  # The browser tests: each app at iPhone size in Chromium, driven through what a person does,
  # and aOS's own (every app opens, on its own, the sky, the release's update screens). They run in
  # twelve groups side by side, each about three minutes of tests (the sky, in three shards, is one),
  # and a group runs three of its tests at once (.github/scripts/ci-run.mjs: the runner has four
  # cores), so the whole check takes about as long as one group's longest tests, not all of them in a
  # row. A new browser test goes into the group that runs shortest (each test's time is on its run's
  # page, in its fold's title). A group runs all its tests even when one fails, and names each
  # failure. A test seeds aos.seen at '999' so no walkthrough or update screen covers the page.
  browser:
    name: ${{ matrix.group }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the Vintage sky in every app, in three shards (the last also the sun and Standard)
          - group: sky
            tests: |
              aOS/scripts/sky-test.mjs . 2/3
              aOS/scripts/sky-test.mjs . 0/3
              aOS/scripts/sky-test.mjs . 1/3
          # every app on its own (and its old Vintage address); aOS's Today; your helper's name, and English only; your helper dressed for the weather; Weather's and Home's tools for Ipsy in aOS
          - group: standalone
            tests: |
              aOS/scripts/standalone-test.mjs
              aOS/scripts/design-check.mjs .
              aOS/scripts/today-test.mjs
              aOS/scripts/names-test.mjs
              home/scripts/ipsy-weather-test.mjs
              weather/scripts/ipsy-test.mjs
              house/scripts/ipsy-test.mjs
          # the newest release's update screens; every app opens, light and dark, and in Layers and Tron; Calendar's layers, an invite, notifications, designs
          - group: release-smoke
            tests: |
              aOS/scripts/release-test.mjs
              aOS/scripts/apps-smoke-test.mjs
              calendar/scripts/layers-test.mjs
              aOS/scripts/join-test.mjs
              aOS/scripts/notify-test.mjs
              aOS/scripts/designs-test.mjs
          # Sparkle Kingdom: the whole game, from a new player to the natural voices (about eight minutes on its own)
          - group: sparkle
            tests: |
              sparkle/scripts/app-test.mjs
              school/scripts/app-test.mjs
          # Drinks (in two parts); Private: what Orders, Travel and Calendar keep from Ipsy; Claude turned off app by app; Home's Automations
          - group: drinks
            tests: |
              drinks/scripts/app-test.mjs . 0/2
              drinks/scripts/app-test.mjs . 1/2
              home/scripts/ipsy-private-test.mjs
              home/scripts/ipsy-redact-test.mjs
              home/scripts/claude-switch-test.mjs
              house/scripts/automations-test.mjs
          # Orders, and Ipsy in Orders and News; Ipsy and settings
          - group: orders
            tests: |
              orders/scripts/app-test.mjs
              orders/scripts/ipsy-test.mjs
              news/scripts/ipsy-test.mjs
              aOS/scripts/ipsy-settings-test.mjs
          # Ipsy in Calendar and Notes; Mail's two designs; Money
          - group: calendar-ipsy
            tests: |
              calendar/scripts/ipsy-test.mjs
              notes/scripts/ipsy-test.mjs
              mail/scripts/design-test.mjs
              money/scripts/app-test.mjs
          # Notes; Ipsy in Meals; Fitness's Meds and Steps; home/design.js; an update isn't cut off by moving between apps
          - group: notes
            tests: |
              notes/scripts/app-test.mjs
              meals/scripts/ipsy-test.mjs
              fitness/scripts/meds-steps-test.mjs
              aOS/scripts/design-test.mjs
              aOS/scripts/updating-test.mjs
          # Meals, Podcasts; aOS's look; Android
          - group: meals-podcasts
            tests: |
              meals/scripts/app-test.mjs
              podcasts/scripts/app-test.mjs
              aOS/scripts/look-test.mjs
              aOS/scripts/android-installed-test.mjs
          # Places; aOS 2's Home (every app inside aOS, Ipsy across them); News' table and match pages
          - group: places-home
            tests: |
              places/scripts/app-test.mjs
              aOS/scripts/home-test.mjs
              news/scripts/table-test.mjs
              news/scripts/match-test.mjs
          # Home (the house app), Calendar, Mail's security tests that run in a page
          - group: house-calendar-mail
            tests: |
              house/scripts/connect-test.mjs
              house/scripts/app-test.mjs
              calendar/scripts/app-test.mjs
              mail/scripts/security-test.mjs
          # Fitness (and its Health page, and Ipsy), Clock, Notes' aisles, reminders and security
          - group: fitness-clock
            tests: |
              fitness/scripts/app-test.mjs
              fitness/scripts/ipsy-test.mjs
              fitness/scripts/health-test.mjs
              clock/scripts/app-test.mjs
              notes/scripts/aisles-app-test.mjs
              notes/scripts/push-app-test.mjs
              notes/scripts/security-test.mjs
          # Travel (and Ipsy in it), Weather, News
          - group: travel-weather-news
            tests: |
              travel/scripts/app-test.mjs
              travel/scripts/smart-test.mjs travel
              travel/scripts/smart-test.mjs travelvintage
              travel/scripts/ipsy-test.mjs
              weather/scripts/app-test.mjs
              news/scripts/app-test.mjs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      # of this group's tests, the ones this pull request needs (none: the group stops here)
      - id: pick
        env:
          TESTS: ${{ matrix.tests }}
          CHANGED: ${{ needs.changes.outputs.files }}
        run: |
          picked=$(node .github/scripts/ci-select.mjs pick)
          { echo 'tests<<EOF_TESTS'; echo "$picked"; echo 'EOF_TESTS'; } >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$picked" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          echo "Tests this pull request needs here:"; echo "${picked:-none}"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        if: steps.pick.outputs.any == 'yes'
        with:
          node-version: 22
      # the test browser and its system packages, from the caches the default branch keeps (warm)
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        id: pw
        if: steps.pick.outputs.any == 'yes'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        if: steps.pick.outputs.any == 'yes'
        with:
          path: ~/apt-archives
          key: apt-playwright-1.56.1-${{ runner.os }}
          restore-keys: apt-playwright-1.56.1-${{ runner.os }}-
      - run: .github/scripts/ci-browser.sh ${{ steps.pw.outputs.cache-hit == 'true' && 'hit' || '' }}
        timeout-minutes: 45   # its own tries give up sooner (ci-browser.sh)
        if: steps.pick.outputs.any == 'yes'
      - name: Run the group's tests
        if: steps.pick.outputs.any == 'yes'
        env:
          TESTS: ${{ steps.pick.outputs.tests }}
        run: node .github/scripts/ci-run.mjs

  # The caches the browser jobs start from (.github/scripts/ci-browser.sh): the browser, and apt's
  # .deb files (a new set each month, so they stay close to current). A pull request's run can't
  # share what it saves with other pull requests, only the default branch's can, so they're made
  # here, on a merge, and only when missing.
  warm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
          lookup-only: true
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        id: apt
        with:
          path: ~/apt-archives
          key: apt-playwright-1.56.1-${{ runner.os }}-${{ steps.month.outputs.m }}
          lookup-only: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        if: steps.pw.outputs.cache-hit != 'true' || steps.apt.outputs.cache-hit != 'true'
        with:
          node-version: 22
      - run: .github/scripts/ci-browser.sh
        timeout-minutes: 45   # its own tries give up sooner (ci-browser.sh)
        if: steps.pw.outputs.cache-hit != 'true' || steps.apt.outputs.cache-hit != 'true'
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        if: steps.pw.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium-${{ runner.os }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        if: steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives
          key: apt-playwright-1.56.1-${{ runner.os }}-${{ steps.month.outputs.m }}
