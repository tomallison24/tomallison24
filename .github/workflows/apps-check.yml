# Checks that every app is wired into aOS completely and follows the ground
# rules every AllisonOS app shares (aOS/scripts/check-apps.mjs; the steps are
# in .claude/skills/new-aos-app/SKILL.md). It only reads the repository:
# nothing is built or published here.
name: Apps check

# A branch's checks run once, on its pull request; pushes only run here for the
# default branch (the merge itself), so every commit isn't checked twice.
on:
  push:
    branches: [claude/custom-iphone-photos-app-0ubcek]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: node aOS/scripts/check-apps.mjs
      # the family accounts' safety rules and the plan: plain Node, no network
      - run: node aOS/scripts/accounts-api-test.mjs && node aOS/scripts/plan-api-test.mjs && node aOS/scripts/push-api-test.mjs && node drinks/scripts/api-test.mjs && node notes/scripts/push-test.mjs && node news/scripts/tick-test.mjs
      # Meals: the server (the allergy check above all) and its sums
      - run: node meals/scripts/api-test.mjs && node meals/scripts/logic-test.mjs && node notes/scripts/aisles-test.mjs && node news/scripts/ai-test.mjs
      # each app's own server and logic tests: plain Node, no network
      - run: node calendar/scripts/access-test.mjs && node calendar/scripts/api-test.mjs && node calendar/scripts/ical-test.mjs
      - run: node drinks/scripts/calc-test.mjs && node fitness/scripts/analysis-test.mjs && node fitness/scripts/sheet-test.mjs
      - run: node mail/scripts/push-test.mjs && node places/scripts/parse-test.mjs && node travel/scripts/api-test.mjs && node travel/scripts/parse-test.mjs && node orders/scripts/parse-test.mjs && node orders/scripts/api-test.mjs && node ordersvintage/scripts/same-reader-test.mjs
      - run: node calendarvintage/scripts/same-reader-test.mjs && node drinksvintage/scripts/same-reader-test.mjs && node fitnessvintage/scripts/same-reader-test.mjs && node travelvintage/scripts/same-reader-test.mjs && node weathervintage/scripts/same-reader-test.mjs

  # Every app opens in Chromium, light and dark, with no script errors and
  # nothing its Content-Security-Policy blocks (aOS/scripts/apps-smoke-test.mjs).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node aOS/scripts/apps-smoke-test.mjs
      # Calendar's layers through the family account, each app in its own storage as on an iPhone
      - run: node calendar/scripts/layers-test.mjs && node calendarvintage/scripts/layers-test.mjs
      # every app works on its own: users may want only some of the core apps
      - run: node aOS/scripts/standalone-test.mjs
      # an invite on a phone: the account, then how to add aOS (iPhone and Android)
      - run: node aOS/scripts/join-test.mjs
      # notifications in aOS: turning them on and off, and the owner's composer, as on a phone
      - run: node aOS/scripts/notify-test.mjs
      - run: node aOS/scripts/designs-test.mjs
      # an app removed from an Android tablet: opened in Chrome it says so, and aOS shows Get
      - run: node aOS/scripts/android-installed-test.mjs
      # the newest release in the log: the right update screen in aOS and every app, or none
      - run: node aOS/scripts/release-test.mjs
      # Meals at iPhone size, against its real server code and a stand-in AI
      - run: node meals/scripts/app-test.mjs

  # Each app's live tour finds its way round the app, and tidies up after itself
  # (aOS/scripts/tours-test.mjs). The slowest test, so it's in three shards that run
  # side by side with everything else: shard i plays every third app.
  tours:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    name: tours-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node aOS/scripts/tours-test.mjs
        env:
          TOURS_SHARD: ${{ matrix.shard }}/3

  # Each app at iPhone size in Chromium, driven through what a person does:
  # its own app test, and the security tests that run in a page. A job of its
  # own so it runs alongside the smoke test. A test seeds aos.seen at '999'
  # so no walkthrough or update screen covers the page.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node house/scripts/app-test.mjs
      - run: node house/scripts/connect-test.mjs
      - run: node housevintage/scripts/app-test.mjs
      - run: node housevintage/scripts/connect-test.mjs
      - run: node news/scripts/table-test.mjs
      - run: node news/scripts/match-test.mjs
      - run: node calendar/scripts/app-test.mjs
      - run: node drinks/scripts/app-test.mjs
      - run: node fitness/scripts/app-test.mjs
      - run: node calendarvintage/scripts/app-test.mjs
      - run: node drinksvintage/scripts/app-test.mjs
      - run: node fitnessvintage/scripts/app-test.mjs

  # The other half of the apps' own tests, a job of its own so the two run side by side.
  apps-more:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node notes/scripts/aisles-app-test.mjs
      - run: node notes/scripts/push-app-test.mjs
      - run: node notes/scripts/security-test.mjs
      - run: node places/scripts/app-test.mjs
      - run: node travel/scripts/app-test.mjs
      - run: node orders/scripts/app-test.mjs
      - run: node ordersvintage/scripts/app-test.mjs
      - run: node travelvintage/scripts/app-test.mjs
      - run: node weathervintage/scripts/app-test.mjs
      - run: node mail/scripts/security-test.mjs
      - run: node mailvintage/scripts/security-test.mjs
      - run: node news/scripts/app-test.mjs
      - run: node newsvintage/scripts/app-test.mjs
