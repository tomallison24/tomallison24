# Checks that every app is wired into aOS completely and follows the ground
# rules every AllisonOS app shares (aOS/scripts/check-apps.mjs; the steps are
# in .claude/skills/new-aos-app/SKILL.md). It only reads the repository:
# nothing is built or published here.
name: Apps check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: node aOS/scripts/check-apps.mjs
      # the family accounts' safety rules and the plan: plain Node, no network
      - run: node aOS/scripts/accounts-api-test.mjs && node aOS/scripts/plan-api-test.mjs && node drinks/scripts/api-test.mjs && node notes/scripts/push-test.mjs

  # Every app opens in Chromium, light and dark, with no script errors and
  # nothing its Content-Security-Policy blocks (aOS/scripts/apps-smoke-test.mjs).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node aOS/scripts/apps-smoke-test.mjs
      # Calendar's layers through the family account, each app in its own storage as on an iPhone
      - run: node calendar/scripts/layers-test.mjs
