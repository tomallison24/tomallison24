# Temporary: asks the deployed site's functions how they answer, from a
# runner that can reach it. To be removed once the Calendar connection is
# confirmed.
name: Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask each function
        run: |
          echo "===== ping"
          curl -sS -m 20 -H 'X-Calendar: 1' "https://tomallison24-news.pages.dev/calendar/api/ping"; echo
          # The events of this month and next: only how many, and how big; nothing of them is printed.
          s=$(date -u +%Y%m01T000000Z); e=$(date -u -d "$(date -u +%Y-%m-01) +2 months" +%Y%m%dT000000Z)
          echo "===== events $s..$e"
          curl -sS -m 30 -o body.txt -w 'status=%{http_code} type=%{content_type} bytes=%{size_download}\n' -H 'X-Calendar: 1' "https://tomallison24-news.pages.dev/calendar/api/events?start=$s&end=$e" || true
          jq -c '{ok, error, calendar, items: (.items|length), withEtag: ([.items[]?|select(.etag!="")]|length), sampleName: (.items[0].name|tostring|gsub("[0-9A-Fa-f]{8,}";"…"))}' body.txt || head -c 300 body.txt
