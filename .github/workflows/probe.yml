# Temporary: checks candidate stem cell feed URLs from a GitHub runner (the
# dev container can't reach the publishers). Remove once feeds.json is set.
name: Probe

on:
  push:
    branches: [claude/stemcell-news-sources]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - name: Probe feeds
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          const UA = { 'User-Agent': 'news-home-screen-app/1.0 (personal RSS reader)', Accept: 'application/rss+xml, application/xml, text/xml' };
          const urls = `
          https://www.stemcellsciencenews.com/newsletter/esc-ipsc-news/feed/
          https://www.stemcellsciencenews.com/esc-ipsc-news/feed/
          https://www.stemcellsciencenews.com/category/newsletter/esc-ipsc-news/feed/
          https://www.stemcellsciencenews.com/newsletter/organoid-news/feed/
          https://www.stemcellsciencenews.com/organoid-news/feed/
          https://www.stemcellsciencenews.com/category/newsletter/organoid-news/feed/
          https://www.stemcellsciencenews.com/newsletter/hematopoiesis-news/feed/
          https://www.stemcellsciencenews.com/newsletter/mesenchymal-cell-news/feed/
          https://www.stemcellsciencenews.com/newsletter/cancer-stem-cell-news/feed/
          https://www.stemcellsciencenews.com/newsletter/neural-cell-news/feed/
          https://www.stemcellsciencenews.com/newsletter/cell-therapy-news/feed/
          https://www.stemcellsciencenews.com/newsletter/umbilical-and-placental-cell-news/feed/
          https://www.stemcellsciencenews.com/newsletter/intestinal-cell-news/feed/
          https://www.stemcellsciencenews.com/newsletter/muscle-cell-news/feed/
          https://www.stemcellsciencenews.com/wp-json/wp/v2/categories?per_page=100&_fields=id,name,slug,count,link
          `.trim().split(/\s+/);
          for (const u of urls) {
            try {
              const r = await fetch(u, { signal: AbortSignal.timeout(15000), headers: UA });
              const t = await r.text();
              const items = t.match(/<item[\s>][\s\S]*?<\/item>/gi) || [];
              console.log(`\n== ${r.status} ${items.length} items ${u} -> ${r.url.slice(0, 120)}`);
              if (u.includes('wp-json')) console.log('   ' + t.slice(0, 6000));
              for (const it of items.slice(0, 40)) {
                const title = (it.match(/<title>([\s\S]*?)<\/title>/) || [])[1];
                const date = (it.match(/<(?:pubDate|dc:date)>([^<]*)/) || [])[1];
                const cats = [...it.matchAll(/<category><!\[CDATA\[([^\]]*)/g)].map(m => m[1]).join(' | ');
                console.log(`   - ${date} ${title?.slice(0, 110)} [${cats}]`);
              }
            } catch (e) { console.log(`\n== ERR ${u} ${e.message}`); }
          }
          JS
          node probe.mjs
