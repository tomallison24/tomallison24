# Temporary: checks candidate stem cell feed URLs from a GitHub runner (the
# dev container can't reach the publishers). Remove once feeds.json is set.
name: Probe

on:
  push:
    branches: [claude/stemcell-news-sources]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - name: Probe feeds
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          const UA = { 'User-Agent': 'news-home-screen-app/1.0 (personal RSS reader)', Accept: 'application/rss+xml, application/xml, text/xml' };
          // Redirect chain, by hand, with and without keeping cookies.
          async function chain(u, keepCookies) {
            const jar = new Map();
            for (let i = 0; i < 8; i++) {
              const headers = { ...UA };
              if (keepCookies && jar.size) headers.Cookie = [...jar].map(([k, v]) => `${k}=${v}`).join('; ');
              const r = await fetch(u, { redirect: 'manual', signal: AbortSignal.timeout(15000), headers });
              for (const c of r.headers.getSetCookie()) { const [kv] = c.split(';'); const j = kv.indexOf('='); jar.set(kv.slice(0, j), kv.slice(j + 1)); }
              const loc = r.headers.get('location');
              const body = loc ? '' : await r.text();
              const items = (body.match(/<item[\s>]/gi) || []).length;
              console.log(`   ${r.status} ${u.slice(0, 160)} cookies=${[...jar.keys()].join(',')} ${loc ? '-> ' + loc.slice(0, 160) : items + ' items'}`);
              if (!loc) { if (!items) console.log('   BODY: ' + body.replace(/\s+/g, ' ').slice(0, 1500)); return; }
              u = new URL(loc, u).toString();
            }
          }
          for (const u of ['https://www.nature.com/neuro.rss', 'https://www.nature.com/ncb.rss', 'https://www.nature.com/subjects/stem-cells.rss']) {
            console.log(`\n== chain ${u} (no cookies)`); await chain(u, false);
            console.log(`== chain ${u} (cookies)`); await chain(u, true);
          }
          const urls = `
          https://feeds.nature.com/neuro/rss/current
          https://www.nature.com/neuro/current-issue.rss
          https://www.nature.com/subjects/embryonic-stem-cells.rss
          https://www.nature.com/subjects/haematopoietic-stem-cells.rss
          https://www.nature.com/subjects/mesenchymal-stem-cells.rss
          https://www.nature.com/subjects/adult-stem-cells.rss
          https://www.nature.com/subjects/stem-cell-research.rss
          https://www.nature.com/subjects/regenerative-medicine.rss
          https://www.nature.com/subjects/organoid.rss
          https://www.nature.com/subjects/stem-cell-niche.rss
          https://www.nature.com/subjects/reprogramming.rss
          https://www.nature.com/nature.rss
          https://www.stemcellsciencenews.com/feed/
          https://www.stemcellsciencenews.com/feed/?paged=2
          `.trim().split(/\s+/);
          for (const u of urls) {
            try {
              const r = await fetch(u, { signal: AbortSignal.timeout(15000), headers: UA });
              const t = await r.text();
              const items = t.match(/<item[\s>][\s\S]*?<\/item>/gi) || [];
              console.log(`\n== ${r.status} ${items.length} items ${u} -> ${r.url.slice(0, 120)}`);
              for (const it of items.slice(0, u.includes('stemcellsciencenews') ? 30 : 3)) {
                const title = (it.match(/<title>([\s\S]*?)<\/title>/) || [])[1];
                const date = (it.match(/<(?:pubDate|dc:date)>([^<]*)/) || [])[1];
                const cats = [...it.matchAll(/<category><!\[CDATA\[([^\]]*)/g)].map(m => m[1]).join(' | ');
                const link = (it.match(/<link>([^<]*)/) || [])[1];
                console.log(`   - ${date} ${title?.replace(/<!\[CDATA\[|\]\]>/g, '').slice(0, 140)} [${cats}] ${link}`);
              }
              if (u.includes('stemcellsciencenews.com/feed/') && !u.includes('paged')) {
                const it = items[0] || '';
                console.log('   FIRST ITEM: ' + it.replace(/\s+/g, ' ').slice(0, 3000));
              }
            } catch (e) { console.log(`\n== ERR ${u} ${e.message}`); }
          }
          // STEMCELL's own site: which newsletters/categories exist.
          const home = await (await fetch('https://www.stemcellsciencenews.com/', { headers: UA })).text();
          const links = [...new Set([...home.matchAll(/href="(https:\/\/www\.stemcellsciencenews\.com\/[^"#?]+)"/g)].map(m => m[1]))];
          console.log('\n== site links:\n   ' + links.join('\n   '));
          JS
          node probe.mjs
