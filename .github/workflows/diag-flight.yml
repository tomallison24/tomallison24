# Temporary: one look at what AeroDataBox answers for Travel's flight status. Deleted after.
name: Diag flight status
on:
  push:
    branches: [claude/diag-flight-status]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask AeroDataBox
        env:
          KEY: ${{ secrets.AERODATABOX_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "no key"; exit 0; }
          for q in F93073/2026-11-02 F93073/2026-11-03 DL2/2026-11-03; do
            echo "=== $q"
            curl -sS -m 20 -D h.txt -o b.txt -w 'HTTP %{http_code}\n' \
              -H "X-RapidAPI-Key: $KEY" -H "X-RapidAPI-Host: aerodatabox.p.rapidapi.com" -H "Accept: application/json" \
              "https://aerodatabox.p.rapidapi.com/flights/number/$q?withAircraftImage=false&withLocation=false&dateLocalRole=Departure" || true
            grep -i -E '^(x-ratelimit|x-rapidapi-|content-type)' h.txt | grep -v -i 'x-rapidapi-key' || true
            head -c 600 b.txt; echo
          done
