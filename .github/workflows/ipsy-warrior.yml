name: Ipsy warrior engine
on:
  push:
    branches: [feature/ipsy-warrior-mvp]
    paths:
      - 'labs/ipsy-warrior/**'
      - '.github/workflows/ipsy-warrior.yml'
  pull_request:
    paths:
      - 'labs/ipsy-warrior/**'
      - '.github/workflows/ipsy-warrior.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node --check labs/ipsy-warrior/engine.mjs
      - run: node --test labs/ipsy-warrior/engine.test.mjs
