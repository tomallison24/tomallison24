name: Ipsy warrior prototype
on:
  push:
    branches: [feature/ipsy-warrior-mvp]
    paths:
      - 'labs/ipsy-warrior/**'
      - 'functions/games/**'
      - '.github/workflows/ipsy-warrior.yml'
  pull_request:
    paths:
      - 'labs/ipsy-warrior/**'
      - 'functions/games/**'
      - '.github/workflows/ipsy-warrior.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node --check labs/ipsy-warrior/engine.mjs && node --check labs/ipsy-warrior/town.mjs && node --check labs/ipsy-warrior/town.browser.mjs
      - run: node --check labs/ipsy-warrior/cloud/store.mjs && node --check labs/ipsy-warrior/cloud/gateway.mjs && node --check labs/ipsy-warrior/cloud/worker.mjs && node --check 'functions/games/api/[[route]].js'
      - run: node --check labs/ipsy-warrior/cloud/client.mjs && node --check labs/ipsy-warrior/cloud/account.mjs && node --check labs/ipsy-warrior/cloud/client.browser.mjs
      - run: node --test labs/ipsy-warrior/engine.test.mjs labs/ipsy-warrior/cloud/cloud.test.mjs labs/ipsy-warrior/cloud/client.test.mjs
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: NODE_PATH="$(npm root -g)" node labs/ipsy-warrior/town.browser.mjs
      - run: NODE_PATH="$(npm root -g)" node labs/ipsy-warrior/cloud/client.browser.mjs
