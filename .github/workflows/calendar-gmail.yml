name: Calendar Gmail
on:
  push:
    branches: [feature/calendar-ipsy-gmail, claude/custom-iphone-photos-app-0ubcek]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: calendar-gmail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: node calendar/scripts/gmail-test.mjs
