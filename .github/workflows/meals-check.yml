# Runs one real Meals deals search (meals/scripts/deals-live.mjs) with the
# ANTHROPIC_API_KEY secret, and shows what it found in the run's summary: to
# see how well the web search finds a store's weekly sales. Saves nothing; each
# run is one search, a few cents. By hand only: Actions -> Meals check -> Run
# workflow, with a store id (wholefoods, harristeeter, publix, lidl, lowesfoods,
# aldi, walmart, target) or any store and its address.
name: Meals check

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'A store id (wholefoods, harristeeter, publix, lidl, lowesfoods, aldi, walmart, target), or a store and its address'
        required: true
        default: 'wholefoods'
      prime:
        description: 'Member card prices (Prime at Whole Foods, VIC at Harris Teeter): yes or no'
        required: false
        default: 'yes'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to exact commits (version in the comment), as in the other workflows.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: 22
      - name: Search for this week's deals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEALS_MODEL: ${{ secrets.MEALS_MODEL }}
          STORE: ${{ inputs.store }}
          PRIME: ${{ inputs.prime }}
        run: node meals/scripts/deals-live.mjs "$STORE" "$PRIME"
