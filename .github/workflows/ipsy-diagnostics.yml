name: News Ipsy clearance
on:
  push:
    branches: [feature/ipsy-larger-livelier, claude/custom-iphone-photos-app-0ubcek]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: ipsy-clearance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - run: npm install --global playwright@1.56.1 && npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node news/scripts/ipsy-test.mjs
