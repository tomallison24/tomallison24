name: Handoff check
# Read-only, for the owner: where moving into aOS 2 stands in the family account (functions/aOS/api,
# handoff). Prints who, which app and when; never what was moved.
on:
  push:
    branches: [claude/laughing-cannon-ybem5h]
    paths: ['.github/workflows/handoff-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'JS'
          const cf = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces`;
          const H = { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN };
          const j = u => fetch(u, { headers: H }).then(r => r.json());
          const ns = (await j(cf + '?per_page=100')).result.find(n => n.title === 'allisonos-accounts');
          if (!ns) { console.log('no accounts storage'); process.exit(1); }
          const val = k => fetch(`${cf}/${ns.id}/values/${encodeURIComponent(k)}`, { headers: H }).then(r => r.ok ? r.text() : null);
          let keys = [], cursor = '';
          do { const r = await j(`${cf}/${ns.id}/keys?prefix=handoff:&limit=1000${cursor ? '&cursor=' + cursor : ''}`); keys.push(...r.result); cursor = r.result_info && r.result_info.cursor; } while (cursor);
          const names = {}, who = async id => names[id] ??= (JSON.parse(await val('user:' + id) || '{}').name || id);
          const when = ms => new Date(+ms).toISOString().replace('T', ' ').slice(0, 16) + 'Z';
          const rows = [];
          for (const { name: k } of keys) {
            const p = k.split(':');
            if (p[1] === 'want') rows.push([await who(p[2]), '-', 'uses aOS 2 (want)', when(await val(k))]);
            else if (p[1] === 'taken2') rows.push([await who(p[2]), p[3], 'moved into aOS (fixed version)', when(await val(k))]);
            else if (p[1] === 'taken') rows.push([await who(p[2]), p[3], 'taken by the first aOS 2 (dropped)', when(await val(k))]);
            else { const v = await val(k); rows.push([await who(p[1]), p[2], `waiting for aOS (${v ? Object.keys(JSON.parse(v)).length : 0} keys, ${v ? v.length : 0} bytes)`, '']); }
          }
          rows.sort((a, b) => (a[0] + a[1]).localeCompare(b[0] + b[1]));
          for (const r of rows) console.log(r.map((c, i) => String(c).padEnd([10, 10, 40, 0][i])).join(' '));
          console.log(`${keys.length} handoff keys`);
          JS
