<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in News's own colour (#2D5070) on a pale glass of it (#DBE8F5), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#EFF5FB"/>
      <stop offset="0.55" stop-color="#DBE8F5"/>
      <stop offset="1" stop-color="#C6D6E5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="108" y="108" width="296" height="296" rx="46" fill="#fff"/>
      <g fill="#000">
        <rect x="148" y="150" width="216" height="40" rx="20"/>
        <rect x="148" y="222" width="96" height="78" rx="14"/>
        <rect x="264" y="222" width="100" height="18" rx="9"/><rect x="264" y="252" width="100" height="18" rx="9"/><rect x="264" y="282" width="70" height="18" rx="9"/>
        <rect x="148" y="324" width="216" height="18" rx="9"/><rect x="148" y="354" width="150" height="18" rx="9"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#2D5070" mask="url(#cut)"/>
  </g>
</svg>
