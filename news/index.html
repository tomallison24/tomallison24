<!--
  News - headlines by topic as a home-screen web app.

  Data: data/news.json, written by scripts/fetch-news.mjs from the RSS feeds
  in feeds.json. The app never talks to a news site itself (no CORS there),
  it only reads that one same-origin file.

  Two designs, picked in Settings > Design (the gear; ../home/design.js, as in
  Clock): Vintage (mid-century modern, the default: the <style id="vintage">
  block) and Standard (Sea glass: that block switched off, as below). The old
  News Vintage address opens this same app.

  Sea glass: a quiet gradient backdrop that drifts slowly, with frosted glass
  (backdrop-filter) only on the topic picker, the chips, the toast and the
  sheets; the lead story, the
  story list and the other cards are very faint tiles with no blur, the same
  in every AllisonOS app. Few glass layers keep scrolling smooth on iPhone.
  The filter panels are Liquid Glass sheets, as in the Calendar, and every
  switch has the sliding glass thumb from ../home/slide.js.
-->
<style>
  :root {
    --bg: #EEF2F0;
    --text: #0B0B0F;
    --muted: rgba(60, 60, 67, 0.80);
    --hairline: rgba(60, 60, 67, 0.14);
    --glass: rgba(255, 255, 255, 0.46);
    --glass-strong: rgba(255, 255, 255, 0.62);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --glass-shadow: 0 8px 32px rgba(31, 38, 64, 0.10);
    --bar-hi: rgba(255, 255, 255, 0.8);
    --bar-lift: rgba(40, 40, 80, 0.08);
    /* Liquid Glass, as in iOS 26's own bars */
    --lg-rim: rgba(255, 255, 255, 0.75);
    --lg-solid: rgba(247, 249, 248, 0.97);
    /* control glass on the page: the team chips, News | Scores and
       small buttons, each frosted with a lit rim; the chosen one sits on a
       brighter glass thumb */
    --ctl-bg: rgba(255, 255, 255, 0.42);
    --ctl-filter: blur(16px) saturate(190%) brightness(1.05);
    --ctl-rim: inset 0 0 0 0.5px var(--lg-rim), inset 0 1px 0 var(--bar-hi);
    --seg-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 60%);
    --seg-thumb: rgba(255, 255, 255, 0.92);
    --seg-lift: rgba(40, 40, 80, 0.16);
    --sel-ink: var(--accent);   /* the chosen label, and the toast's Undo */
    --chip-on-bg: #0B0B0F;
    --chip-on-text: #FFFFFF;
    --skeleton: rgba(60, 60, 67, 0.10);
    /* Sea glass, the AllisonOS accent, for icons and highlights alike */
    --accent: #3B7366;
    --on-accent: #FFFFFF;
    --accent-soft: rgba(59, 115, 102, 0.13);
    --accent-edge: rgba(59, 115, 102, 0.35);
    --icon: #3B7366;
    --scrim: rgba(15, 18, 30, 0.28);
    --sheet: rgba(245, 248, 247, 0.94);
    --field: rgba(118, 118, 128, 0.12);
    --live: #E5242B;
    --blob-1: rgba(111, 165, 151, 0.55);
    --blob-2: rgba(190, 145, 143, 0.50);
    --blob-3: rgba(129, 147, 188, 0.50);
    --blob-4: rgba(188, 156, 104, 0.45);
    /* Cards: very faint tiles, the same in every AllisonOS app */
    --tile: rgba(255, 255, 255, 0.40);
    --tile-edge: rgba(60, 60, 67, 0.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1213;
      --text: #F5F5F7;
      --muted: rgba(235, 235, 245, 0.58);
      --hairline: rgba(255, 255, 255, 0.08);
      --glass: rgba(26, 33, 34, 0.46);
      --glass-strong: rgba(34, 42, 43, 0.62);
      --glass-edge: rgba(255, 255, 255, 0.10);
      --bar-hi: rgba(255, 255, 255, 0.10);
      --bar-lift: rgba(0, 0, 0, 0.38);
      --lg-rim: rgba(255, 255, 255, 0.16);
      --lg-solid: rgba(18, 24, 25, 0.96);
      --seg-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%);
      --ctl-bg: rgba(34, 42, 43, 0.50);
      --seg-thumb: rgba(255, 255, 255, 0.22);
      --seg-lift: rgba(0, 0, 0, 0.45);
      --sel-ink: #A9D3C7;         /* the light sea glass, to read on grey glass */
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      --chip-on-bg: #F5F5F7;
      --chip-on-text: #0B0B0F;
      --skeleton: rgba(255, 255, 255, 0.07);
      --accent: #A9D3C7;
      --on-accent: #10181A;
      --accent-soft: rgba(169, 211, 199, 0.18);
      --accent-edge: rgba(169, 211, 199, 0.42);
      --icon: #A9D3C7;
      --scrim: rgba(0, 0, 0, 0.45);
      --sheet: rgba(20, 27, 28, 0.94);
      --field: rgba(118, 118, 128, 0.24);
      --live: #FF5A52;
      --blob-1: rgba(111, 165, 151, 0.40);
      --blob-2: rgba(190, 145, 143, 0.32);
      --blob-3: rgba(129, 147, 188, 0.36);
      --blob-4: rgba(188, 156, 104, 0.30);
      --tile: rgba(255, 255, 255, 0.05);
      --tile-edge: rgba(255, 255, 255, 0.10);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); /* background stays on html so the backdrop shows through */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  /* ---- Top clearance ----
     Since iOS 26, iOS draws its own Liquid Glass blur over the top of a
     home-screen web app, reaching about 40pt below the status bar; no CSS or
     meta tag turns it off. So in the installed app (portrait) the page keeps
     that band clear: the date starts below it. */
  :root { --top-clear: 0px; --inset-top: calc(env(safe-area-inset-top) + var(--top-clear)); }
  @media (display-mode: standalone) and (orientation: portrait) {
    @supports (-webkit-touch-callout: none) { :root { --top-clear: 2.5rem; } }
  }

  /* ---- Backdrop: soft colour fields for the glass to blur ---- */
  .backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; width: 90vmax; height: 90vmax; border-radius: 50%; will-change: transform; }
  .blob.b1 { top: -40vmax; left: -30vmax; background: radial-gradient(circle, var(--blob-1) 0%, transparent 70%); animation: drift1 38s ease-in-out infinite alternate; }
  .blob.b2 { top: 10vmax; right: -45vmax; background: radial-gradient(circle, var(--blob-2) 0%, transparent 70%); animation: drift2 44s ease-in-out infinite alternate; }
  .blob.b3 { bottom: -50vmax; left: -20vmax; background: radial-gradient(circle, var(--blob-3) 0%, transparent 70%); animation: drift3 50s ease-in-out infinite alternate; }
  .blob.b4 { bottom: -30vmax; right: -40vmax; background: radial-gradient(circle, var(--blob-4) 0%, transparent 70%); animation: drift1 56s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { transform: translate(12vmax, 10vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-14vmax, 8vmax) scale(0.92); } }
  @keyframes drift3 { to { transform: translate(10vmax, -12vmax) scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none !important; } }

  /* ---- Glass ---- */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 0.5px solid var(--glass-edge);
    box-shadow: var(--glass-shadow), inset 0 0.5px 0 var(--glass-edge);
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }

  /* ---- Large title (scrolls away, like iOS) ---- */
  .masthead { padding-top: calc(env(safe-area-inset-top) + max(18px, var(--top-clear) + 6px)); padding-bottom: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .masthead .date { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
  .masthead h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 36px; height: 36px; flex: none; border-radius: 22.5%; box-shadow: 0 2px 10px rgba(20, 24, 48, 0.22); }
  .logo.vintage-logo { display: none; }   /* the Sea glass icon here; the Vintage block swaps them */
  .ambient { display: none; }             /* the atomic shapes behind the title: Vintage only */
  .mh-btns { display: flex; align-items: center; gap: 8px; flex: none; }
  .round-btn { width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; flex: none; margin-bottom: 2px; }
  /* Line icons drawn like the Mail app's (and iOS's): thin, rounded strokes. */
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.bold { stroke-width: 2.2; }
  .round-btn svg { width: 22px; height: 22px; color: var(--icon); }
  .round-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- The topic picker: a glass pill at the bottom, in reach of a thumb ----
     The same as the Home app's view picker: always there, centred over the
     home indicator, the topic's icon, its name and a chevron; the menu opens
     upwards from it. Clear glass: a light tint, a strong blur and a bright
     rim, the glass a layer behind (::before) so the menu's own glass still
     blurs the page. Hidden under a sheet. */
  :root {
    --pill-top: rgba(255, 255, 255, 0.56);
    --pill-bottom: rgba(255, 255, 255, 0.24);
    --pill-rim: inset 0 0 0 0.5px rgba(28, 32, 40, 0.12), inset 0 1px 0.5px rgba(255, 255, 255, 0.9), 0 10px 26px -8px rgba(30, 40, 60, 0.28);
    --pill-press: rgba(28, 32, 40, 0.09);
    --pill-ic: rgba(28, 32, 40, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pill-top: rgba(255, 255, 255, 0.14);
      --pill-bottom: rgba(255, 255, 255, 0.06);
      --pill-rim: inset 0 0 0 0.5px rgba(255, 255, 255, 0.32), inset 0 1px 0.5px rgba(255, 255, 255, 0.5), inset 0 -1px 1px rgba(255, 255, 255, 0.08), 0 12px 30px -6px rgba(0, 0, 0, 0.6);
      --pill-press: rgba(255, 255, 255, 0.12);
      --pill-ic: rgba(255, 255, 255, 0.12);
    }
  }
  .vbar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 8; translate: -50% 0;
    display: flex; align-items: center; padding: 4px; border-radius: 999px; transition: opacity .25s, transform .3s cubic-bezier(.2, .8, .2, 1); }
  .vbar::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, var(--pill-top), var(--pill-bottom));
    -webkit-backdrop-filter: blur(18px) saturate(190%); backdrop-filter: blur(18px) saturate(190%);
    box-shadow: var(--pill-rim); }
  html.locked .vbar { opacity: 0; transform: translateY(12px); pointer-events: none; }   /* not over an open sheet */
  .vbar > button { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px 0 12px; border-radius: 999px; white-space: nowrap;
    font-size: 16px; font-weight: 700; letter-spacing: -0.2px; transition: background .2s; }
  .vbar > button:active { background: var(--pill-press); }
  .vbar .vb-ic { display: flex; width: 30px; height: 30px; border-radius: 50%; align-items: center; justify-content: center; background: var(--pill-ic); }
  .vbar .vb-ic svg { width: 18px; height: 18px; }
  .vbar .vb-chev { display: flex; opacity: .7; margin-left: -2px; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .vbar button[aria-expanded="true"] .vb-chev { transform: rotate(180deg); }
  .viewmenu {
    position: absolute; left: 50%; bottom: calc(100% + 10px); translate: -50% 0; z-index: 5; width: max-content; min-width: 250px;
    max-height: min(74vh, 560px); overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-radius: 22px;
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom)); backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 18px 40px var(--lgs-lift);
    transform-origin: 50% 100%; animation: menu-up .22s cubic-bezier(.2, .8, .2, 1) both;
  }
  .viewmenu[hidden] { display: none; }
  @keyframes menu-up { from { opacity: 0; transform: scale(.92) translateY(6px); } to { opacity: 1; transform: none; } }
  .viewmenu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border-radius: 16px; text-align: left; font-size: 16px; font-weight: 600; }
  .viewmenu button:active { background: var(--lgs-field); }
  .viewmenu button[aria-selected="true"] { background: var(--lgs-field); }
  .viewmenu .ic { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--pill-ic); flex: none; }
  .viewmenu .ic svg { width: 20px; height: 20px; }
  .viewmenu .k { flex: 1; min-width: 0; }
  .viewmenu .tick { display: flex; opacity: 0; }
  .viewmenu .tick svg { width: 20px; height: 20px; }
  .viewmenu button[aria-selected="true"] .tick { opacity: 1; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .viewmenu { background: var(--lg-solid); } }
  @media (prefers-reduced-transparency: reduce) {
    .vbar::before { background: var(--lg-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .viewmenu { background: var(--lg-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ---- Sport filter bar: second line of the pinned bar, Sport tab only ---- */
  .filterbar {
    padding: 2px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
    max-width: 560px; margin: 0 auto;
  }
  .fb-row { display: flex; align-items: center; gap: 8px; }
  .modes {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; margin-bottom: 8px; border-radius: 999px;
    background: var(--ctl-bg); -webkit-backdrop-filter: var(--ctl-filter); backdrop-filter: var(--ctl-filter); box-shadow: var(--ctl-rim);
  }
  .modes .seg { gap: 6px; border-radius: 999px; }
  .modes .live-dot { display: inline-block; }
  .filterbar[hidden] { display: none; }
  .chip {
    flex: none; height: 30px; padding: 0 12px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap;
    background: var(--ctl-bg); border: 0;
    -webkit-backdrop-filter: var(--ctl-filter); backdrop-filter: var(--ctl-filter); box-shadow: var(--ctl-rim);
    transition: transform 0.15s;
  }
  .chip:active { transform: scale(0.96); }
  .chip svg { width: 18px; height: 18px; flex: none; color: var(--icon); }
  .chip .n {
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    display: inline-grid; place-items: center;
    background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .chip.icon { width: 30px; padding: 0; justify-content: center; }
  .modes.three { grid-template-columns: repeat(3, 1fr); }
  .modes.four { grid-template-columns: repeat(4, 1fr); }
  .fb-summary { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* One line: News | Scores, and the pill for everything you follow. */
  .fb-top { display: flex; align-items: center; gap: 8px; }
  .fb-top .modes { flex: 1; min-width: 0; margin-bottom: 0; }
  .chip.pill { gap: 5px; padding: 0 8px 0 10px; }
  .chip.pill .lbl { max-width: 118px; overflow: hidden; text-overflow: ellipsis; }
  .chip.pill .dn { width: 18px; height: 18px; margin-right: -2px; opacity: .7; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .chip.pill[aria-expanded="true"] .dn { transform: rotate(180deg); }
  .chip.pill.on { background: var(--seg-shine), var(--seg-thumb); color: var(--sel-ink); font-weight: 700; }
  .chip.pill .live-dot { display: inline-block; }
  /* The pill's menu: clear glass, like the topic picker's, opening downwards. */
  .pillwrap { position: relative; flex: none; }
  .pmenu {
    position: absolute; left: 0; top: calc(100% + 8px); z-index: 30; width: max-content; min-width: 220px; max-width: calc(100vw - 32px);
    max-height: min(60vh, 440px); overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-radius: 22px;
    /* over a list of scores, so denser than the topic menu's glass: the words stay readable */
    background: color-mix(in srgb, var(--lg-solid) 90%, transparent); backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 18px 40px var(--lgs-lift);
    transform-origin: 0 0; animation: menu-down .22s cubic-bezier(.2, .8, .2, 1) both;
  }
  .pillwrap.right .pmenu { left: auto; right: 0; transform-origin: 100% 0; }
  .pmenu[hidden] { display: none; }
  @keyframes menu-down { from { opacity: 0; transform: scale(.92) translateY(-6px); } to { opacity: 1; transform: none; } }
  .pmenu button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 16px; text-align: left; font-size: 16px; font-weight: 600; }
  .pmenu button:active, .pmenu button[aria-pressed="true"], .pmenu button[aria-selected="true"] { background: var(--lgs-field); }
  .pmenu .k { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .pmenu .sub { font-size: 14px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pmenu .ic { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--pill-ic); flex: none; }
  .pmenu .ic svg { width: 18px; height: 18px; }
  .pmenu .tick { width: 20px; height: 20px; flex: none; color: var(--accent); opacity: 0; }
  .pmenu [aria-pressed="true"] .tick, .pmenu [aria-selected="true"] .tick { opacity: 1; }
  .pmenu hr { border: 0; border-top: 0.5px solid var(--hairline); margin: 4px 10px; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .pmenu { background: var(--lg-solid); } }
  @media (prefers-reduced-motion: reduce) { .pmenu { animation: none; } .chip.pill .dn { transition: none; } }
  @media (prefers-reduced-transparency: reduce) { .pmenu { background: var(--lg-solid); backdrop-filter: none; -webkit-backdrop-filter: none; } }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Filter sheet ---- */
  html.locked, html.locked body { overflow: hidden; }
  .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet-wrap[hidden] { display: none; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.25s; touch-action: none; }
  .sheet {
    position: relative; width: 100%; max-width: 560px;
    height: min(88dvh, 760px);
    display: flex; flex-direction: column;
    border-radius: 20px 20px 0 0; border-width: 0.5px 0.5px 0;
    background: var(--sheet);
    transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .sheet:focus { outline: none; }
  .sheet-wrap.open .scrim { opacity: 1; }
  .sheet-wrap.open .sheet { transform: none; }
  @media (min-width: 640px) {
    .sheet-wrap { align-items: center; }
    .sheet { border-radius: 20px; border-width: 0.5px; height: min(720px, calc(100dvh - 48px)); }
  }
  .grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--field); margin: 6px auto 0; flex: none; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; flex: none; }
  .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .close-btn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--field); color: var(--muted); }
  .close-btn svg { width: 16px; height: 16px; color: var(--icon); }
  .search-wrap { position: relative; margin: 0 16px 10px; flex: none; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--icon); pointer-events: none; }
  .search {
    display: block; width: 100%; height: 36px; padding: 0 12px 0 34px; border: 0; border-radius: 10px;
    background: var(--field); color: var(--text); font: inherit; font-size: 16px;
    -webkit-appearance: none; appearance: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent-edge); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; }
  .segmented {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    margin: 0 16px 4px; padding: 2px; border-radius: 9px; background: var(--field); flex: none;
  }
  .segmented[hidden] { display: none; }
  .seg { height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13px; font-weight: 600; }
  .seg[aria-selected="true"] { background: var(--seg-shine), var(--seg-thumb); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 0 var(--lgs-rim), 0 3px 10px var(--seg-lift); }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 20px; }
  .sect h3 { margin: 18px 4px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .sect:first-child .card:first-child { margin-top: 12px; }
  .card { border-radius: 12px; overflow: hidden; background: var(--tile); box-shadow: inset 0 0 0 0.5px var(--tile-edge); }
  .opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 14px; text-align: left; font-size: 16px; }
  .opt + .opt::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--hairline); }
  .opt:active { background: var(--hairline); }
  .opt .label { flex: 1; min-width: 0; }
  .opt .sub { color: var(--muted); font-size: 14px; }
  .opt .tick { width: 20px; height: 20px; flex: none; color: var(--accent); visibility: hidden; }
  .opt[aria-pressed="true"] .tick { visibility: visible; }
  .opt.add { color: var(--accent); font-weight: 600; }
  .opt.add svg { width: 18px; height: 18px; flex: none; }
  .sheet-note { margin: 14px 4px 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  .sheet-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); border-top: 0.5px solid var(--hairline);
  }
  .text-btn { font-size: 16px; font-weight: 600; color: var(--accent); padding: 8px 4px; }
  .text-btn:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  .show-btn { height: 44px; padding: 0 22px; border-radius: 999px; font-size: 16px; font-weight: 600; background: var(--chip-on-bg); color: var(--chip-on-text); }

  /* ---- Undo toast ---- */
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 108px); z-index: 40;   /* above the topic picker */
    display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; border-radius: 999px;
    width: max-content; max-width: calc(100vw - 32px); white-space: nowrap;
    color: var(--text); font-size: 15px; font-weight: 600;
    /* the same clear glass as the sheets, with their lit rim */
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom));
    -webkit-backdrop-filter: var(--lgs-filter); backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 12px 30px var(--lgs-lift);
    transform: translate(-50%, 0); transition: opacity 0.2s, transform 0.2s;
  }
  .toast[hidden] { display: none; }
  .toast button { height: 32px; padding: 0 14px; border-radius: 999px; color: var(--sel-ink); font-weight: 700; }
  .meta .pickname { color: var(--accent); }
  .notice .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .notice .actions button.secondary {
    color: var(--text); border: 0;
    background: var(--ctl-bg); -webkit-backdrop-filter: var(--ctl-filter); backdrop-filter: var(--ctl-filter); box-shadow: var(--ctl-rim);
  }
  @media (prefers-reduced-motion: reduce) { .sheet, .scrim, .toast { transition: none; } }

  /* ---- Scores ---- */
  .scores .game { position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .scores .game + .game::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; border-top: 0.5px solid var(--hairline); }
  .scores .game:active { background: var(--hairline); }
  .gstat { width: 54px; flex: none; font-size: 12px; font-weight: 700; line-height: 1.25; color: var(--muted); font-variant-numeric: tabular-nums; }
  .gstat.in { color: var(--live); display: flex; align-items: center; gap: 5px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; animation: pulse 1.4s ease-in-out infinite; }
  .gteams { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .gteam { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500; }
  .glogo { width: 20px; height: 20px; flex: none; object-fit: contain; }
  .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gscore { min-width: 22px; text-align: right; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .game.decided .gteam:not(.win) { color: var(--muted); }
  .game.decided .gteam.win { font-weight: 700; }
  .gtv { display: flex; align-items: center; gap: 9px; margin-top: -1px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .gtv svg { width: 16px; height: 16px; flex: none; margin: 0 2px; color: var(--icon); }  /* centred under the 20px team logos */
  .gtv span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A block (Scores, Coming up): its name on the left, the league pill on the right. */
  main .sect { position: relative; }
  main .sect + .sect { margin-top: 4px; }
  .sect-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; margin: 0 0 8px; }
  main .sect-head h3 { margin: 0 4px; }
  .sect-head .one { font-size: 13px; font-weight: 500; color: var(--muted); }
  .sect-head .pmenu { left: auto; right: 0; transform-origin: 100% 0; min-width: 250px; }
  .sect-head .pillwrap { display: block; }
  .sect-head .chip.pill .lbl { max-width: 190px; }
  .lg-name { margin: 14px 4px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .lg-name:first-of-type { margin-top: 0; }
  .gnone { margin: 0; padding: 4px 4px 0; font-size: 14px; color: var(--muted); }
  .scores .more { display: block; width: 100%; min-height: 44px; border-top: 0.5px solid var(--hairline); font-size: 15px; font-weight: 600; color: var(--accent); }
  .scores .more:active { background: var(--hairline); }

  /* ---- Feed ---- */
  main { padding-top: 8px; padding-bottom: calc(env(safe-area-inset-bottom) + 96px);   /* room for the topic picker */
    display: flex; flex-direction: column; gap: 14px; }

  /* The lead story, the story list and the notices are cards: faint tiles,
     no blur (the backdrop is only soft colour, so the text reads without it). */
  .lead, .list, .notice { background: var(--tile); box-shadow: inset 0 0 0 0.5px var(--tile-edge); }
  .lead { display: block; border-radius: 24px; overflow: hidden; }
  .lead .img { aspect-ratio: 16 / 9; background: var(--skeleton); overflow: hidden; }
  .lead .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lead .body { padding: 14px 16px 16px; }
  .lead h2 { margin: 6px 0 0; font-size: 22px; line-height: 1.22; font-weight: 700; letter-spacing: -0.015em; }
  .lead p { margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .list { border-radius: 24px; overflow: hidden; }
  .row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--hairline); }
  .row:active, .lead:active { background: var(--hairline); }
  .row .text { flex: 1; min-width: 0; }
  .row h3 { margin: 4px 0 0; font-size: 16px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .row .thumb { width: 76px; height: 76px; border-radius: 14px; overflow: hidden; flex: none; background: var(--skeleton); }
  .row .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; }
  .meta .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .meta .sep { opacity: 0.6; }
  .meta .new { flex: none; padding: 1px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }

  .notice { border-radius: 24px; padding: 28px 20px; text-align: center; }
  .notice h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .notice p { margin: 6px 0 0; font-size: 14px; line-height: 1.4; color: var(--muted); }
  /* Try again / Show all sport: the Sea glass pastel, as the sheets' Show button */
  .notice button {
    margin-top: 14px; height: 36px; padding: 0 18px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--cta-ink);
    background: var(--cta);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 18px color-mix(in srgb, var(--lgs-ok) 34%, transparent);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .notice button:active { transform: scale(0.96); filter: brightness(.94); }

  .status { text-align: center; font-size: 12px; line-height: 1.5; color: var(--muted); padding: 4px 8px 0; }

  /* ---- Loading skeleton ---- */
  .sk { background: var(--skeleton); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* ---- Switches with a sliding glass thumb ----
     News | Scores, the time range and the
     filter panel's Sports | Competitions | Teams: the options stay clear, and
     one thumb under them glides to the chosen one, stretching as it goes, as
     iOS 26's do (home/slide.js). The tick lists are not switches (tick any
     number), so they keep their ticks. */
  .slides { position: relative; isolation: isolate; }
  .slides > :not(.slthumb) { position: relative; z-index: 1; }
  .slthumb {
    position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 0; pointer-events: none;
    border-radius: 999px;
    transition: opacity 0.25s ease, scale 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .slthumb.off { opacity: 0; scale: 0.7; }
  /* A label newly chosen keeps its old ink until the thumb gets to it, so
     white-on-dark never shows white on the light bar. */
  .slides > .ink { animation: ink 0.22s ease-in both; }
  @keyframes ink { from { color: var(--text); } }
  @media (prefers-reduced-motion: reduce) { .slides > .ink { animation: none; } }
  /* Segmented choices: a glass thumb sliding in a frosted track (on the page)
     or a recessed one (in the sheets). */
  .modes.slides .seg[aria-selected="true"], .segmented.slides .seg[aria-selected="true"] { background: none; box-shadow: none; }
  .modes > .slthumb, .segmented > .slthumb {
    border-radius: 999px;
    background: var(--seg-shine), var(--seg-thumb);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 0 var(--lgs-rim), 0 3px 10px var(--seg-lift);
  }

  /* ---- The sheets: Liquid Glass ----
     Sport filters and Sources are each one sheet of clear glass floating
     just inside the screen's edges: the stories blur and brighten through it,
     a lit rim runs round it, and the search field and the buttons are
     lighter glass on top. The lists are the same faint tiles as every card
     (no blur of their own, which keeps it smooth on a phone). */
  :root {
    --lgs-top: rgba(255, 255, 255, 0.68);
    --lgs-bottom: rgba(255, 255, 255, 0.50);
    --lgs-rim: rgba(255, 255, 255, 0.92);
    --lgs-edge: rgba(255, 255, 255, 0.62);
    --lgs-field: rgba(255, 255, 255, 0.62);
    --lgs-filter: blur(28px) saturate(200%) brightness(1.06);
    --lgs-scrim: rgba(0, 0, 0, 0.10);
    --lgs-lift: rgba(40, 40, 80, 0.16);
    /* the glow under the Show button; the button itself is the Sea glass
       pastel (the one thing to tap), with dark ink in both modes */
    --lgs-ok: rgba(59, 115, 102, 0.90);
    --cta: linear-gradient(100deg, #6FA597 0%, #8193BC 34%, #BE918F 67%, #BC9C68 100%);
    --cta-ink: #10181A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --lgs-top: rgba(44, 44, 52, 0.60);
      --lgs-bottom: rgba(22, 22, 28, 0.52);
      --lgs-rim: rgba(255, 255, 255, 0.20);
      --lgs-edge: rgba(255, 255, 255, 0.12);
      --lgs-field: rgba(255, 255, 255, 0.10);
      --lgs-filter: blur(28px) saturate(180%) brightness(0.92);
      --lgs-scrim: rgba(0, 0, 0, 0.30);
      --lgs-lift: rgba(0, 0, 0, 0.50);
      --cta: linear-gradient(100deg, #A9D3C7 0%, #B9C6E0 34%, #E3C5C3 67%, #E9D6B4 100%);
    }
  }
  .lg .scrim { background: var(--lgs-scrim); }
  .lg .sheet {
    flex: 1; width: auto; max-width: 544px; margin: 0 8px 8px;
    max-height: calc(100% - env(safe-area-inset-top) - 32px);
    border: 0; border-radius: 34px; overflow: hidden;
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom));
    backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 24px 60px var(--lgs-lift), 0 2px 8px var(--bar-lift);
    transform: translateY(calc(100% + 16px));
  }
  .lg .grabber { background: var(--hairline); }
  .lg .sheet-head { padding: 4px 12px 10px 20px; }
  .lg .close-btn {
    width: 44px; height: 44px;
    background: var(--lgs-field);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 2px 8px var(--bar-lift);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lg .close-btn:active { transform: scale(0.92); }
  .lg .close-btn svg { width: 20px; height: 20px; }
  /* The search box: a glass capsule, lit in the accent colour while typing. */
  .lg .search-wrap { margin: 0 12px 10px; }
  .lg .search-wrap svg { left: 13px; }
  .lg .search {
    height: 40px; padding: 0 16px 0 38px; border-radius: 999px;
    background: var(--lgs-field);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 1px 3px var(--bar-lift);
    transition: box-shadow 0.2s;
  }
  .lg .search:focus-visible {
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 1px var(--lgs-rim), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .lg .segmented {
    margin: 0 12px 4px; padding: 3px; border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 2px var(--bar-lift);
  }
  .lg .seg, .lg .segmented > .slthumb { border-radius: 999px; }
  /* A soft fade where the lists scroll under the search box and the buttons. */
  .lg .sheet-body {
    padding: 0 12px 16px;
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 12px, #000 calc(100% - 16px), transparent);
    mask-image: linear-gradient(180deg, transparent, #000 12px, #000 calc(100% - 16px), transparent);
  }
  .lg .sect h3 { margin: 18px 16px 6px; }
  .lg .sheet-note { margin: 14px 16px 0; }
  .lg .card { border-radius: 26px; }
  .lg .opt { min-height: 48px; padding: 11px 16px; }
  .lg .opt + .opt::before { left: 16px; }
  .lg .opt:active { background: var(--lgs-field); }
  .lg .sheet-foot { border-top: 0; padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px); }
  .lg .text-btn {
    height: 44px; padding: 0 20px; border-radius: 999px;
    background: var(--lgs-field);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 2px 8px var(--bar-lift);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lg .text-btn:disabled { color: var(--muted); }
  /* Show N stories: the sheet's Done, in the Sea glass pastel. */
  .lg .okbtn {
    color: var(--cta-ink);
    background: var(--cta);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 18px color-mix(in srgb, var(--lgs-ok) 34%, transparent);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .lg .okbtn:active, .lg .text-btn:not(:disabled):active { transform: scale(0.96); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .lg .sheet, .toast { background: var(--lg-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .lg .sheet, .toast { background: var(--lg-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ---- Summaries: the sparkle on a story, and its sheet ----
     Two sentences, the key takeaways and questions about one story, written by
     Claude (functions/news/api). The sparkle sits at the end of the story's source
     line; the sheet is the same clear glass as the others. */
  .sum-btn { position: relative; flex: none; margin-left: auto; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); cursor: pointer; transition: transform 0.15s; }
  .sum-btn::after { content: ""; position: absolute; inset: -10px; }
  .sum-btn:active { transform: scale(0.9); }
  .sum-btn svg { width: 15px; height: 15px; }
  .meta { min-height: 24px; }
  .ai-story { padding: 0 8px 2px; }
  .ai-story h3 { margin: 0; font-size: 18px; line-height: 1.28; font-weight: 700; letter-spacing: -0.01em; }
  .ai-story .src { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .ai-card { margin-top: 12px; padding: 14px 16px; border-radius: 22px; background: var(--tile); box-shadow: inset 0 0 0 0.5px var(--tile-edge); }
  .ai-card h4 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .ai-card p { margin: 0; font-size: 16px; line-height: 1.45; }
  .ai-card ul { margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.4; }
  .ai-card li + li { margin-top: 6px; }
  .ai-card li::marker { color: var(--accent); }
  .ai-note { margin: 10px 8px 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .ai-open { display: inline-flex; align-items: center; height: 36px; margin-top: 12px; padding: 0 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--sel-ink); background: var(--lgs-field); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim); }
  .ai-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .ai-q { width: fit-content; max-width: 88%; margin: 14px 0 0 auto; padding: 9px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35; background: var(--accent-soft); box-shadow: inset 0 0 0 0.5px var(--accent-edge); }
  .ai-a { margin-top: 8px; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--tile); box-shadow: inset 0 0 0 0.5px var(--tile-edge); }
  .ai-a.wait { color: var(--muted); animation: pulse 1.4s ease-in-out infinite; }
  .ai-a.err { color: var(--muted); }
  .ai-err { margin-top: 12px; }
  .ai-err .actions { margin-top: 12px; display: flex; gap: 8px; }
  .ai-ask { display: flex; align-items: center; gap: 8px; flex: none; padding: 6px 12px calc(env(safe-area-inset-bottom) + 12px); }
  .ai-ask[hidden] { display: none; }
  .ai-ask .search { flex: 1; min-width: 0; padding: 0 16px; }
  .ai-send { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; color: var(--cta-ink); background: var(--cta); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.5); transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s; }
  .ai-send:active { transform: scale(0.92); }
  .ai-send:disabled { opacity: 0.4; }
  .ai-send svg { width: 20px; height: 20px; }

  /* ---- Settings: the gear by Refresh; one short sheet, as tall as what it holds ---- */
  #set-sheet .sheet { height: auto; }
  #set-sheet .sheet-body { padding-bottom: calc(env(safe-area-inset-bottom) + 20px); }
  #set-design { --accent-text: var(--accent); }   /* the design rows' tick, in the accent */

  /* ---- Table: a league's standings ----
     A rank, the team, and up to six stats, in a faint card like the scores. A thin bar down
     a row's left edge is ESPN's own zone (Champions League, relegation) in its colour; a
     team in play has a live dot; the teams you follow are tinted. */
  .tbl { padding: 4px 0 6px; border-radius: 22px; overflow: hidden; }

:root{--tr-line:#FF2A2A;--tr-hot:#E9EDF1;--tr-glow:1;--tr-grid:rgba(255,42,42,.16);color-scheme:dark}
:root :is(.ambient i,.aurora b,.atoms b):nth-child(1),:root :is(.ambient i,.aurora b,.atoms b):nth-child(2),:root :is(.ambient i,.aurora b,.atoms b):nth-child(3){display:none}
:is(.ambient,.aurora,.atoms)::after{content:'';position:absolute;left:-30%;right:-30%;top:62%;height:110px;pointer-events:none;
  background:linear-gradient(90deg,var(--tr-grid) 1px,transparent 1px) 50% 0/24px 100%,linear-gradient(var(--tr-grid) 1px,transparent 1px) 0 0/100% 14px;
  transform:perspective(140px) rotateX(58deg);transform-origin:top;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
:root :is(body,#app.app){background:transparent}   /* the page's ground is <html>'s, so the trail (behind everything) shows */
:root::before,:root::after{content:'';position:fixed;inset:max(3px,env(safe-area-inset-top)) 4px 4px 4px;z-index:-1;pointer-events:none;border-radius:30px 30px var(--tr-foot) var(--tr-foot);--tr-foot:max(30px,calc(env(safe-area-inset-bottom) + 14px))}
:root::before{box-shadow:inset 0 0 0 1.5px rgba(255,42,42,.32),inset 0 0 14px rgba(255,42,42,.12),0 0 10px rgba(255,42,42,.18)}
:root::after{padding:2px;background:conic-gradient(from var(--tr-a),transparent 0 78%,rgba(255,42,42,.35) 90%,#FF2A2A 97%,#FFE1E1 98.4%,transparent 98.6%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  filter:drop-shadow(0 0 4px #FF2A2A);animation:trRun 7s linear infinite}
@keyframes trRun{to{--tr-a:360deg}}
@media (prefers-reduced-motion:reduce){:root::after{animation:none;opacity:0}}
:is(.fab,.okbtn){box-shadow:0 0 calc(var(--tr-glow) * 16px) color-mix(in srgb,var(--tr-line) 70%,transparent)}
</style>
<script src="../home/design.js" data-app="news" data-was="newsvintage" data-keys="newsv.=news."></script>   <!-- Vintage or Standard, from Settings: before the page is drawn -->
<script src="../home/names.js"></script>   <!-- your helper's name where the words say Ipsy: before the page is drawn -->
<script src="../home/sky.js"></script>   <!-- the Vintage sky: day and night backgrounds, shared by every Vintage design (off in Standard) -->
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>
<!-- the atomic shapes behind the title (Vintage only; there the drifting backdrop above is hidden) -->
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="date" id="today"></p>
      <div class="brand">
        <img class="logo glass-logo" src="icon-glass.svg?v=1" alt="" width="36" height="36">
        <img class="logo vintage-logo" src="icon.svg?v=4" alt="" width="36" height="36">
        <h1>News</h1>
      </div>
    </div>
    <div class="mh-btns">
      <button class="round-btn glass" id="setBtn" type="button" aria-label="Settings" aria-haspopup="dialog">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.45 12.00 21.42 12.49 21.29 12.98 20.81 13.40 19.62 13.62 18.75 13.81 18.46 14.10 18.30 14.42 18.17 14.75 18.05 15.08 18.06 15.50 18.53 16.24 19.22 17.24 19.26 17.88 19.01 18.31 18.68 18.68 18.31 19.01 17.88 19.26 17.24 19.22 16.24 18.53 15.50 18.06 15.08 18.05 14.75 18.17 14.42 18.30 14.10 18.46 13.81 18.75 13.62 19.62 13.40 20.81 12.98 21.29 12.49 21.42 12.00 21.45 11.51 21.42 11.02 21.29 10.60 20.81 10.38 19.62 10.19 18.75 9.90 18.46 9.58 18.30 9.25 18.17 8.92 18.05 8.50 18.06 7.76 18.53 6.76 19.22 6.12 19.26 5.69 19.01 5.32 18.68 4.99 18.31 4.74 17.88 4.78 17.24 5.47 16.24 5.94 15.50 5.95 15.08 5.83 14.75 5.70 14.42 5.54 14.10 5.25 13.81 4.38 13.62 3.19 13.40 2.71 12.98 2.58 12.49 2.55 12.00 2.58 11.51 2.71 11.02 3.19 10.60 4.38 10.38 5.25 10.19 5.54 9.90 5.70 9.58 5.83 9.25 5.95 8.92 5.94 8.50 5.47 7.76 4.78 6.76 4.74 6.12 4.99 5.69 5.32 5.32 5.69 4.99 6.12 4.74 6.76 4.78 7.76 5.47 8.50 5.94 8.92 5.95 9.25 5.83 9.58 5.70 9.90 5.54 10.19 5.25 10.38 4.38 10.60 3.19 11.02 2.71 11.51 2.58 12.00 2.55 12.49 2.58 12.98 2.71 13.40 3.19 13.62 4.38 13.81 5.25 14.10 5.54 14.42 5.70 14.75 5.83 15.08 5.95 15.50 5.94 16.24 5.47 17.24 4.78 17.88 4.74 18.31 4.99 18.68 5.32 19.01 5.69 19.26 6.12 19.22 6.76 18.53 7.76 18.06 8.50 18.05 8.92 18.17 9.25 18.30 9.58 18.46 9.90 18.75 10.19 19.62 10.38 20.81 10.60 21.29 11.02 21.42 11.51z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
      <button class="round-btn glass" id="refresh" aria-label="Refresh">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.6 13.2A7.8 7.8 0 1 1 17.7 6.6"/><path d="M18.4 2.9v4.2h-4.2"/></svg>
      </button>
    </div>
  </header>
</div>

<div class="filterbar" id="filterbar" aria-label="Sport filters" hidden></div>

<!-- The topic picker, at the bottom in reach of a thumb; the menu opens upwards. -->
<nav class="vbar" id="vbar">
  <button id="viewBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Show a topic"><span class="vb-ic" id="vbIcon"></span><span id="vbName">Latest</span><span class="vb-chev"></span></button>
  <div class="viewmenu" id="viewMenu" role="listbox" aria-label="Topic" hidden></div>
</nav>

<div class="wrap">
  <main id="feed" aria-live="polite"></main>
</div>

<div class="sheet-wrap lg" id="sheet" hidden>
  <div class="scrim" data-action="close-sheet"></div>
  <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheet-title">Sport filters</h2>
      <button class="close-btn" data-action="close-sheet" aria-label="Close">
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </header>
    <div class="search-wrap">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
      <input class="search" id="sheet-search" type="search" placeholder="Search teams, players or events" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Search sports, competitions, teams and players">
    </div>
    <div class="segmented" id="sheet-seg" role="tablist" aria-label="Filter type"></div>
    <div class="sheet-body" id="sheet-body"></div>
    <footer class="sheet-foot">
      <button class="text-btn" id="sheet-reset" data-action="reset-picks">Reset</button>
      <button class="show-btn okbtn" id="sheet-show" data-action="close-sheet">Show all sport</button>
    </footer>
  </section>
</div>

<!-- Sources for topics with "filters" in feeds.json (Stem cells). -->
<div class="sheet-wrap lg" id="src-sheet" hidden>
  <div class="scrim" data-action="close-src"></div>
  <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="src-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="src-title">Sources</h2>
      <button class="close-btn" data-action="close-src" aria-label="Close">
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </header>
    <div class="search-wrap">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
      <input class="search" id="src-search" type="search" placeholder="Search sources" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Search sources">
    </div>
    <div class="sheet-body" id="src-body"></div>
    <footer class="sheet-foot">
      <button class="text-btn" id="src-reset" data-action="src-reset">Reset</button>
      <button class="show-btn okbtn" id="src-show" data-action="close-src">Show all sources</button>
    </footer>
  </section>
</div>

<!-- Summaries: two sentences, key takeaways and questions about one story (Claude, via /news/api/). -->
<div class="sheet-wrap lg" id="ai-sheet" hidden>
  <div class="scrim" data-action="close-ai"></div>
  <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="ai-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="ai-title">Summary</h2>
      <button class="close-btn" data-action="close-ai" aria-label="Close">
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="ai-body" aria-live="polite"></div>
    <div class="ai-ask" id="ai-ask" hidden>
      <input class="search" id="ai-input" type="text" placeholder="Ask about this article" autocomplete="off" autocorrect="on" enterkeyhint="send" maxlength="500" aria-label="Ask a question about this article">
      <button class="ai-send" id="ai-send" type="button" aria-label="Ask" disabled>
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5.5M6 11.2l6-6 6 6"/></svg>
      </button>
    </div>
  </section>
</div>

<!-- Match: a football game's own page, from ESPN's match details. -->
<div class="sheet-wrap lg" id="match-sheet" hidden>
  <div class="scrim" data-action="close-match"></div>
  <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="match-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="match-title">Match</h2>
      <button class="close-btn" data-action="close-match" aria-label="Close">
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="match-body" aria-live="polite"></div>
  </section>
</div>

<!-- Settings: the design (Vintage or Standard), just on this phone. -->
<div class="sheet-wrap lg" id="set-sheet" hidden>
  <div class="scrim" data-action="close-set"></div>
  <section class="sheet glass" role="dialog" aria-modal="true" aria-labelledby="set-title" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="set-title">Settings</h2>
      <button class="close-btn" data-action="close-set" aria-label="Close">
        <svg class="i bold" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </header>
    <div class="sheet-body" id="set-body"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button id="toast-undo">Undo</button></div>

<!-- The switches' sliding glass thumb, shared by the AllisonOS apps. -->
<script src="../home/slide.js"></script>
<script src="../home/account.js"></script>   <!-- family accounts: summaries and questions are for signed-in family -->
<script src="../home/redact.js"></script>   <!-- personal details stay on the phone: what goes to Claude has placeholders (before ipsy.js) -->
<script src="../home/ipsy.js"></script>   <!-- Ipsy, the helper you chat with (and ipsy-tools.js, its tools here) -->
<script src="ipsy-tools.js"></script>
<script src="app.js"></script>
<script src="../home/welcome.js" data-app="news" data-auto defer></script>   <!-- aOS: this app's walkthrough the first time, and what's new after an update -->
</body>
</html>
