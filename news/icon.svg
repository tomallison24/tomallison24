<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Home-screen icon: the page is the whole icon. Full-bleed square: iOS rounds the corners itself. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECFB"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C9BFF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#page)"/>
  <rect x="170" y="249" width="684" height="90" rx="45" fill="url(#head)"/>
  <rect x="170" y="419" width="684" height="56" rx="28" fill="#1E2A5A" fill-opacity="0.22"/>
  <rect x="170" y="519" width="580" height="56" rx="28" fill="#1E2A5A" fill-opacity="0.22"/>
  <rect x="170" y="619" width="684" height="56" rx="28" fill="#1E2A5A" fill-opacity="0.22"/>
  <rect x="170" y="719" width="400" height="56" rx="28" fill="#1E2A5A" fill-opacity="0.22"/>
</svg>
