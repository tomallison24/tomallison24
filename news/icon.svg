<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: the front page in News's own colour (#2D5070) on a pale tint of it (#DBE8F5); every app has its own, a shade of its room's (Every day: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="108" y="108" width="296" height="296" rx="46" fill="#fff"/>
      <g fill="#000">
        <rect x="148" y="150" width="216" height="40" rx="20"/>
        <rect x="148" y="222" width="96" height="78" rx="14"/>
        <rect x="264" y="222" width="100" height="18" rx="9"/><rect x="264" y="252" width="100" height="18" rx="9"/><rect x="264" y="282" width="70" height="18" rx="9"/>
        <rect x="148" y="324" width="216" height="18" rx="9"/><rect x="148" y="354" width="150" height="18" rx="9"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#DBE8F5"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <rect width="512" height="512" fill="#2D5070" mask="url(#cut)"/>
</svg>
