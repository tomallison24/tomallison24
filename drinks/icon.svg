<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Plum": a white wine glass on dusty plum, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#DDB2C5"/>
      <stop offset="0.55" stop-color="#A97590"/>
      <stop offset="1" stop-color="#7A4C66"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
    
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M176 112h160c6 64 6 104-10 132-14 26-40 42-70 42s-56-16-70-42c-16-28-16-68-10-132z"/>
      <path d="M256 290v104M196 400h120"/>
    </g>
    <path d="M182 186h148c-2 28-8 46-16 58-12 20-34 32-58 32s-46-12-58-32c-8-12-14-30-16-58z" fill="#FFFFFF"/>
  </g>
</svg>
