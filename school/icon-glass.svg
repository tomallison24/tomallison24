<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in School's own colour (#9C2B1F) on a pale glass of it (#FFDCD3), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFEEE9"/>
      <stop offset="0.55" stop-color="#FFDCD3"/>
      <stop offset="1" stop-color="#EEC5BB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g transform="rotate(-45 256 256)">
        <rect x="92" y="212" width="64" height="88" rx="24" fill="#fff"/>
        <rect x="144" y="212" width="194" height="88" fill="#fff"/>
        <path d="M336 212L424 256L336 300Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/>
      </g>
      <g transform="rotate(-45 256 256)">
        <path d="M150 200V312" stroke="#000" stroke-width="14"/>
        <path d="M178 200V312" stroke="#000" stroke-width="9"/>
        <path d="M338 200V312" stroke="#000" stroke-width="12"/>
        <path d="M206 256H318" stroke="#000" stroke-width="10" stroke-linecap="round"/>
        <path d="M388 238L424 256L388 274Z" fill="#000"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#9C2B1F" mask="url(#cut)"/>
  </g>
</svg>
