<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, Retro colours: a cream note page (a title and three lines, each with a round bullet, cut out of it) on pine green, with a mustard sun and a burnt-orange pill behind it. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="112" y="92" width="288" height="328" rx="48" fill="#fff"/>
      <g fill="#000">
        <rect x="154" y="140" width="204" height="36" rx="18"/>
        <circle cx="170" cy="240" r="14"/><rect x="202" y="230" width="156" height="20" rx="10"/>
        <circle cx="170" cy="294" r="14"/><rect x="202" y="284" width="156" height="20" rx="10"/>
        <circle cx="170" cy="348" r="14"/><rect x="202" y="338" width="106" height="20" rx="10"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#2E7D5B"/>
  <circle cx="404" cy="108" r="150" fill="#E3A72F"/>
  <rect x="40" y="396" width="190" height="50" rx="25" fill="#D8572A" transform="rotate(-18 135 421)"/>
  <rect width="512" height="512" fill="#FBF5E9" mask="url(#cut)"/>
</svg>
