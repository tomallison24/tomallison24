<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: its drawing in Podcasts's own colour (#5C76AD) on a pale tint of it (#DDE6FE); every app has its own, a shade of its room's (Every day: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs></defs>
  <rect width="512" height="512" fill="#DDE6FE"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <g>
    <g transform="scale(.5)"><g fill="none" stroke="#5C76AD" stroke-linecap="round" stroke-width="56">
      <path d="M358 648a220 220 0 1 1 308 0"/>
      <path d="M256 752a364 364 0 1 1 512 0" stroke-opacity="0.55"/>
    </g>
    <circle cx="512" cy="492" r="86" fill="#5C76AD"/>
    <rect x="478" y="600" width="68" height="236" rx="34" fill="#5C76AD"/></g>
  </g>
</svg>
