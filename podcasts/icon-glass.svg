<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in Podcasts's own colour (#5C76AD) on a pale glass of it (#DDE6FE), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0F4FF"/>
      <stop offset="0.55" stop-color="#DDE6FE"/>
      <stop offset="1" stop-color="#CED9F4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <g transform="scale(.5)"><g fill="none" stroke="#5C76AD" stroke-linecap="round" stroke-width="56">
      <path d="M358 648a220 220 0 1 1 308 0"/>
      <path d="M256 752a364 364 0 1 1 512 0" stroke-opacity="0.55"/>
    </g>
    <circle cx="512" cy="492" r="86" fill="#5C76AD"/>
    <rect x="478" y="600" width="68" height="236" rx="34" fill="#5C76AD"/></g>
  </g>
</svg>
