      <path d="M256 116L386 191V341L256 416L126 341V191Z" fill="#fff" stroke="#fff" stroke-width="20" stroke-linejoin="round"/>
      <path d="M256 266L126 191M256 266L386 191M256 266V416" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#FCE1C8"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
