<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- What this page may run and load. Only the app's own script file runs:
     nothing inline, nothing from another site - so if some text ever did slip
     through unescaped, it couldn't act as the app or read the Gmail token.
     A file opened from here (a blob: URL) inherits this policy, so an HTML
     attachment forced open couldn't run either.
     img-src has https: and http: for emails' images after "Show", and
     connect-src has https: for one-click unsubscribe, which posts to the
     sender's own server. Email frames (srcdoc) inherit this policy on top of
     their own stricter one. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src data:; connect-src https:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mail</title>
<meta name="description" content="Gmail triage for the home screen: one tap buckets a sender's whole domain into Marketing, and Marketing empties itself.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default, not black-translucent: that one always draws the clock white,
     which vanishes on the light theme. default lets iOS pick the clock's colour
     and use theme-color above for the bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mail">
<meta name="referrer" content="origin">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<!--
  Mail - Gmail triage as a home-screen app. No build step, no server, no
  dependencies: this file is the whole app.

  What one tap on the tag button does:
    1. moves that conversation to the Marketing label and out of the inbox;
    2. creates a Gmail filter so everything from the same domain does the
       same from now on, without the app being open;
    3. sweeps the mail already in the mailbox from that domain into Marketing.

  Tags work the same way without leaving the inbox: tag one message from the
  school and everything from that domain - already here and still to come -
  carries the tag, and choosing it from the title's menu filters the list to it.

  Tapping a message opens it as a page of its own, rendered in a sandboxed
  frame that can run nothing and load nothing until "Show images" is tapped,
  so tracking pixels stay dark. The search bar takes Gmail's own search syntax.

  Anything in Marketing older than 3 days (Settings: 1-30) goes to the Trash,
  where Gmail deletes it for good after 30 days. The sweep runs when the app
  opens; .github/workflows/mail.yml runs the same sweep daily so it happens
  whether or not the app is opened.

  Sign-in is the OAuth 2.0 implicit flow done by hand (a full-page redirect to
  accounts.google.com and back) rather than Google's popup-based library: an
  iPhone home-screen app opens popups in a separate browser view that cannot
  hand a token back, while a redirect returns into the app. Access tokens last
  about an hour and no refresh token exists, so a signed-out app bounces
  through Google again - silently, once the grant is in place.

  Scopes: gmail.modify (label, move, trash) and gmail.settings.basic (the
  domain filters). Both are per-device; the token never leaves the phone.

  Look: one sheet of frosted glass over a slow aurora, and every action has
  its own motion - a tag stamp and a sheen before a row flies out to the
  right, a row flying back left when it returns, a crumble for a deleted
  rule, a wipe down the bucket when it empties. All of it collapses to
  nothing under prefers-reduced-motion.

  Light or dark follows the iPhone's own setting (prefers-color-scheme), and
  changes the moment iOS does. Every colour is a token on :root with a light
  value under the media query; the email itself always renders on white.
-->
<style>
  :root {
    --bg: #08080B;
    --text: #FFFFFF;
    --muted: rgba(235, 235, 245, 0.62);
    --faint: rgba(235, 235, 245, 0.38);
    --accent: #0A84FF;
    --icon: #4A9BA6;                          /* the icons and switches: a calm slate-teal (text and dots keep the blue) */
    --icon-text: #4FA2AD;                     /* the teal as a word (Edit / Done): a hair lighter, 4.8:1 on glass (#4A9BA6 is 4.4) */
    --tag: #FF9F0A;
    --danger: #FF453A;
    /* glass buttons, as on iOS: a translucent fill, lit along the top edge;
       coloured ones carry a tint of their colour rather than a solid block */
    --gb: rgba(255, 255, 255, 0.10);
    --gb-edge: rgba(255, 255, 255, 0.16);
    --gb-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%);
    --gb-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
    --tint-mix: 42%;                          /* how much colour a tinted button carries */
    --accent-ink: #FFFFFF;                    /* text on a tinted button */
    --sel-ink: #FFFFFF;                       /* the chosen filter, over the aurora */
    --danger-ink: #FFFFFF;
    --accent-text: var(--accent);             /* a coloured label on clear glass */
    --danger-text: var(--danger);
    /* swipe actions: round glass icons in each action's own colour */
    --gi-mix: 30%;
    --armed-mix: 62%;
    --armed-ink: #FFFFFF;
    --swipe-track: rgba(123, 108, 246, 0.10);
    --tag-ink: #D9D3FF;
    /* Flag, Archive, Trash: iOS Mail's orange, purple and red, at about half
       their saturation so they sit as quietly as Tag */
    --flag-tint: #C8913F;
    --arch-tint: #8C79CF;
    --bin-tint: #C9625B;
    --flag-ink: #EBC68F;
    --arch-ink: #CDBEF3;
    --bin-ink: #F0A9A3;
    --armed-mix-l: 50%;                       /* a full swipe's Trash capsule */
    /* glass */
    --glass: rgba(18, 18, 22, 0.46);
    --glass-2: rgba(38, 38, 44, 0.72);
    --pill-rim: rgba(255, 255, 255, 0.15);    /* the outline of one conversation in the list */
    --seg-thumb: rgba(255, 255, 255, 0.14);   /* the chosen half of All | Unread */
    /* the pinned header: Liquid Glass - a thin tint, clearer towards the bottom, and a lit rim */
    --bar-top: rgba(34, 34, 40, 0.14);
    --bar-bottom: rgba(34, 34, 40, 0.05);
    --bar-rim: rgba(255, 255, 255, 0.16);
    /* one clear Liquid Glass for every neutral button, bar and toolbar */
    --lg-bg: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    --lg-filter: blur(14px) saturate(190%) brightness(1.04);
    --lg-rim: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi);
    --bar-solid: rgba(20, 20, 24, 0.96);
    --hair: rgba(255, 255, 255, 0.11);
    --hair-2: rgba(255, 255, 255, 0.07);
    --blur: blur(30px) saturate(180%);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --fill: rgba(255, 255, 255, 0.07);        /* chips, inputs, quiet buttons */
    --pill: rgba(255, 255, 255, 0.13);        /* the selected tab */
    --hi: rgba(255, 255, 255, 0.10);          /* the light catching a glass edge */
    --lift: rgba(0, 0, 0, 0.38);              /* buttons' and bars' shadow */
    /* Cards: very faint tiles, the same in every AllisonOS app - a whisper of
       white and a hairline edge; no shadow, no lit rim, no blur */
    --tile: rgba(255, 255, 255, 0.05);
    --tile-edge: rgba(255, 255, 255, 0.10);
    --lift-strong: rgba(0, 0, 0, 0.5);        /* sheets, toast, bars */
    --toast: rgba(30, 30, 34, 0.62);
    --page: rgb(10, 10, 13);                  /* the message page: solid, as a pushed page in Mail is */
    --sheet: rgba(28, 28, 32, 0.80);          /* tag sheet and select bar */
    --scrim: rgba(0, 0, 0, 0.45);
    --grab: rgba(255, 255, 255, 0.25);
    --ring: rgba(255, 255, 255, 0.32);        /* an empty select circle */
    --bad-text: #FF9A92;
    --chip-on-text: #FFFFFF;
    --tl: 80%;                                /* tag chip text lightness */
    --aurora: 0.72;
    color-scheme: dark;
  }

  /* Light, when the iPhone is in Light mode - and it switches live when iOS
     does, with no reload. Same glass, turned to frosted white; colours are
     the iOS light-mode system ones, deepened where they carry text. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F2F2F7;
      --text: #111114;
      --muted: rgba(60, 60, 67, 0.80);
      --faint: rgba(60, 60, 67, 0.64);          /* 0.55 measured 2.9:1 on the page - below the 3:1 floor */
      --accent: #007AFF;
      --icon: #0E7C8C;
      --icon-text: #0B6F7D;                   /* a shade deeper: 5.3:1 on the page (#0E7C8C is 4.4, under 4.5 for text) */
      --tag: #D97706;
      --danger: #E5281D;
      --gb: rgba(255, 255, 255, 0.55);
      --gb-edge: rgba(255, 255, 255, 0.95);
      --gb-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 60%);
      --gb-shadow: 0 4px 14px rgba(40, 40, 80, 0.10);
      --tint-mix: 16%;
      --accent-ink: #0059C8;
      --sel-ink: #00479E;                     /* #0059C8 measured 4.0:1 over the aurora - below 4.5 */
      --danger-ink: #AE2117;
      --accent-text: var(--accent-ink);         /* the plain blue and red are under 4.5:1 on near-white */
      --danger-text: var(--danger-ink);
      --gi-mix: 18%;
      --armed-mix: 34%;
      --armed-ink: initial;                   /* keeps each action's own dark ink */
      --swipe-track: rgba(123, 108, 246, 0.07);
      --tag-ink: #4A3FC4;
      --flag-ink: #855412;
      --arch-ink: #5A45B0;
      --bin-ink: #9E3A32;
      --armed-mix-l: 26%;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-2: rgba(255, 255, 255, 0.86);
      --pill-rim: rgba(60, 60, 67, 0.17);
      --seg-thumb: rgba(255, 255, 255, 0.92);
      --bar-top: rgba(255, 255, 255, 0.16);
      --bar-bottom: rgba(255, 255, 255, 0.05);
      --bar-rim: rgba(255, 255, 255, 0.85);
      --lg-bg: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
      --lg-rim: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi);
      --bar-solid: rgba(248, 248, 251, 0.97);
      --hair: rgba(60, 60, 67, 0.14);
      --hair-2: rgba(60, 60, 67, 0.09);
      --fill: rgba(118, 118, 128, 0.11);
      --pill: rgba(255, 255, 255, 0.96);
      --hi: rgba(255, 255, 255, 0.8);
      --lift: rgba(40, 40, 80, 0.08);
      --tile: rgba(255, 255, 255, 0.40);
      --tile-edge: rgba(60, 60, 67, 0.10);
      --lift-strong: rgba(40, 40, 80, 0.16);
      --toast: rgba(255, 255, 255, 0.84);
      --page: rgb(242, 242, 247);
      --sheet: rgba(249, 249, 252, 0.90);
      --scrim: rgba(0, 0, 0, 0.22);
      --grab: rgba(60, 60, 67, 0.30);
      --ring: rgba(60, 60, 67, 0.32);
      --bad-text: #C4001A;
      --chip-on-text: #111114;
      --tl: 32%;
      --aurora: 0.40;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); }
  body {                                    /* no background: the aurora is behind it */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 84px) max(14px, env(safe-area-inset-left));
    overscroll-behavior-y: none;
  }

  /* ---- the light behind the glass ---- */
  .aurora { position: fixed; inset: -20%; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora b {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(58px); opacity: var(--aurora); will-change: transform;
  }
  .aurora b:nth-child(1) { width: 78vw; height: 78vw; left: -12vw;  top: 6vh;   background: radial-gradient(circle, #2E6BFF 0%, rgba(46,107,255,0) 68%); animation: drift1 34s ease-in-out infinite alternate; }
  .aurora b:nth-child(2) { width: 66vw; height: 66vw; right: -14vw; top: 14vh;  background: radial-gradient(circle, #FF7A3D 0%, rgba(255,122,61,0) 68%); animation: drift2 41s ease-in-out infinite alternate; }
  .aurora b:nth-child(3) { width: 86vw; height: 86vw; right: -16vw; bottom: 2vh; background: radial-gradient(circle, #9A5BFF 0%, rgba(154,91,255,0) 68%); animation: drift3 47s ease-in-out infinite alternate; }
  .aurora b:nth-child(4) { width: 62vw; height: 62vw; left: -14vw;  bottom: 16vh; background: radial-gradient(circle, #18C3A5 0%, rgba(24,195,165,0) 68%); animation: drift4 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.18); } }
  @keyframes drift2 { to { transform: translate3d(-12vw, 16vh, 0) scale(1.12); } }
  @keyframes drift3 { to { transform: translate3d(-16vw, -12vh, 0) scale(1.22); } }
  @keyframes drift4 { to { transform: translate3d(18vw, -14vh, 0) scale(1.15); } }

  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg.i { display: inline-block; flex: none; fill: currentColor; }
  /* line icons, drawn like iOS's: thin, rounded strokes */
  svg.i.s { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.s.bold { stroke-width: 2.2; }
  /* a flagged message's flag is filled in, as in Mail */
  .rb.on svg.i.s, .who .when .flagged svg.i.s { fill: currentColor; }
  .hide { display: none !important; }

  /* ---- header ----
     It stays at the top as the list scrolls, as in Mail: the large title
     shrinks to a compact one, the account line folds away, and a Liquid Glass
     bar appears behind it - with the mailbox menu, search, Edit and Settings still
     to hand. The height it gives up is added back as margin below, so the list
     doesn't jump when it shrinks. */
  header {
    --hh: 54px;
    position: sticky; top: 0; z-index: 12; display: flex; align-items: center; gap: 10px;
    height: calc(env(safe-area-inset-top) + 14px + var(--hh));
    margin-top: calc(-1 * (env(safe-area-inset-top) + 10px));        /* reach up under the status bar */
    padding: calc(env(safe-area-inset-top) + 12px) 4px 2px;
    transition: height .28s var(--ease), margin-bottom .28s var(--ease), padding .28s var(--ease);
  }
  /* the fade-in goes on what's inside: an animation on the header itself would
     stop the bar's blur from reaching the list behind it */
  header > * { animation: fadeDown .5s var(--ease) both; }
  header::before {                          /* the Liquid Glass bar: a rounded pill floating just inside the screen's edges */
    content: ''; position: absolute; top: calc(env(safe-area-inset-top) + 4px); bottom: 0; left: -6px; right: -6px; z-index: -1;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    backdrop-filter: blur(14px) saturate(190%) brightness(1.04); -webkit-backdrop-filter: blur(14px) saturate(190%) brightness(1.04);
    box-shadow: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi), 0 8px 26px var(--lift);
    opacity: 0; transform: scale(.97); transition: opacity .25s, transform .3s var(--ease); pointer-events: none;
  }
  header::after {                           /* a soft fade under the status bar, so mail doesn't scroll sharp behind the clock */
    content: ''; position: absolute; top: 0; left: calc(50% - 50vw); right: calc(50% - 50vw); z-index: -2;
    height: calc(env(safe-area-inset-top) + 6px); pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 85%, transparent), transparent);
    opacity: 0; transition: opacity .25s;
  }
  header h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; flex: 1; font-weight: 700; transition: font-size .28s var(--ease); }
  header .sub {
    display: block; font-size: 12px; font-weight: 400; color: var(--faint); letter-spacing: 0; margin-top: 3px;
    max-height: 18px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    transition: opacity .2s, max-height .28s var(--ease), margin .28s var(--ease);
  }
  /* Where the glass can't blur - no support, or Reduce Transparency is on in
     iOS Accessibility - the bar turns near-solid (the compose button too, below). */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header::before { background: var(--bar-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    header::before { background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  body.scrolled header { --hh: 40px; margin-bottom: 14px; padding-bottom: 6px; padding-left: 12px; padding-right: 8px; }
  body.scrolled header::before { opacity: 1; transform: none; }
  body.scrolled header::after { opacity: 1; }
  header h1.fit1 { font-size: 28px; }       /* a long title steps down before it would be cut off */
  header h1.fit2 { font-size: 24px; }
  body.scrolled header h1 { font-size: 21px; letter-spacing: -0.02em; }
  body.scrolled header .sub { opacity: 0; max-height: 0; margin-top: 0; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--hair); color: var(--icon);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: transform .18s var(--ease), background .2s, color .2s;
  }
  .iconbtn:active { transform: scale(0.9); background: var(--glass-2); color: var(--text); }

  /* Pull to refresh: the list follows your finger, a glass spinner shows above it */
  main { transition: transform .45s var(--ease); }
  main.pulling { transition: none; }
  .ptr {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 5; width: 36px; height: 36px; margin-left: -18px;
    border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted);
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi), 0 6px 16px var(--lift);
    opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .25s, transform .25s var(--ease);
  }
  .ptr.ready { color: var(--accent); }
  .ptr.spin svg { animation: rot .8s linear infinite; }
  .iconbtn.turning svg { animation: rot .6s var(--ease); }

  /* ---- the mailbox menu: the pill at the bottom opens it (see the Liquid Glass block below) ---- */
  header h1 { min-width: 0; }
  #title { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boxmenu { position: fixed; inset: 0; z-index: 45; }
  #boxmenu .catch { position: absolute; inset: 0; background: var(--scrim); opacity: .45; animation: fadeIn .2s ease both; }
  .menu {
    position: absolute; width: min(290px, calc(100vw - 32px)); overflow-y: auto; overscroll-behavior: contain;
    padding: 6px 0; border-radius: 18px; border: 1px solid var(--hair);
    background: var(--sheet);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 18px 50px var(--lift-strong), inset 0 1px 0 var(--hi);
    transform-origin: 50% 100%; animation: menuIn .34s var(--ease) both;
  }
  #boxmenu.leaving .menu { animation: menuOut .18s ease both; }
  #boxmenu.leaving .catch { animation: fadeOut .18s ease both; }
  @keyframes menuIn { from { opacity: 0; transform: translateY(8px) scale(.9); } }
  @keyframes menuOut { to { opacity: 0; transform: translateY(6px) scale(.94); } }
  .menu hr { border: 0; height: 1px; margin: 5px 0; background: var(--hair); }
  .menu .mhead { padding: 6px 16px 2px 42px; font-size: 12px; color: var(--faint); }
  .menu button {
    --h: 211; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 16px 0 14px;
    font-size: 16px; color: var(--text); text-align: left; background: none; border: 0; transition: background .15s;
  }
  .menu button:active { background: var(--fill); }
  .menu .tick { width: 18px; flex: none; display: inline-flex; color: var(--accent); visibility: hidden; }
  .menu [aria-checked="true"] .tick { visibility: visible; }
  .menu [aria-checked="true"] .name { font-weight: 600; }
  .menu .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .cnt { font-size: 14px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .menu .ico { width: 22px; flex: none; display: inline-flex; justify-content: center; color: var(--muted); }
  .menu .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 90% 62%); box-shadow: 0 0 8px hsl(var(--h) 90% 62% / .6); }

  /* ---- card: a very faint tile (the border stays, clear, so nothing moves) ---- */
  .card {
    position: relative; border-radius: 22px; overflow: hidden;
    background: var(--tile); border: 1px solid transparent; background-clip: padding-box;
    box-shadow: inset 0 0 0 .5px var(--tile-edge);
  }
  #screen > .card { animation: cardIn .5s var(--ease) both; }
  #screen.quiet > .card, #screen.quiet ul.list > li, #screen.quiet .panel > * { animation: none; }
  #screen.quiet ul.list > li.fresh { animation: rowIn .52s var(--ease) both; animation-delay: calc(var(--i) * 34ms); }
  #screen.back > .card { animation: cardInBack .5s var(--ease) both; }
  .card h2 {
    font-size: 12px; font-weight: 600; color: var(--faint); margin: 0; padding: 13px 16px 9px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* ---- rows ---- */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list > li {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    padding: 11px 10px 11px 16px; border-top: 1px solid var(--hair-2);
    animation: rowIn .52s var(--ease) both; animation-delay: calc(var(--i) * 34ms);
    transition: height .3s var(--ease), padding .3s var(--ease), opacity .26s ease, transform .3s cubic-bezier(.4,0,.9,.4), filter .26s;
  }
  ul.list > li:first-child { border-top: 0; }
  ul.list > li.going { height: 0 !important; padding-top: 0; padding-bottom: 0; opacity: 0; }
  ul.list > li.going.right { transform: translateX(105%) rotate(1.6deg); }
  ul.list > li.going.left  { transform: translateX(-105%) rotate(-1.6deg); }
  ul.list > li.going.crumble { transform: scale(0.93); filter: blur(5px); }
  /* the light that runs across a row the moment its action lands */
  ul.list > li.confirm::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 20%, rgba(255,159,10,0.22) 45%, rgba(255,255,255,0.30) 52%, transparent 78%);
    transform: translateX(-100%); animation: sheen .75s var(--ease);
  }
  ul.list > li.confirm.blue::after { background: linear-gradient(105deg, transparent 20%, rgba(10,132,255,0.22) 45%, rgba(255,255,255,0.30) 52%, transparent 78%); }

  .open { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 2px 0; transition: transform .2s var(--ease), opacity .2s; }
  button.open:active { transform: scale(0.985); opacity: 0.75; }
  .who { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 600; letter-spacing: -0.012em; }
  .who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .when { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  /* read while open: the dot fades out as you come back to the list */
  .who .dot.fade { animation: none; }
  .who .dot.fade.go { animation: dotOut .55s var(--ease) forwards; }
  @keyframes dotOut { 60% { transform: scale(1.4); opacity: .5; } to { transform: scale(0); opacity: 0; width: 0; margin-right: -7px; } }
  .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--icon); flex: none; align-self: center; box-shadow: 0 0 10px color-mix(in srgb, var(--icon) 75%, transparent); animation: breathe 2.6s ease-in-out infinite; }
  .subj { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip { font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    background: var(--fill); border: 1px solid var(--hair-2); color: var(--muted); font-size: 11px;
    max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip svg { opacity: 0.7; }
  .chip.due { color: var(--danger); border-color: rgba(255,69,58,0.32); background: rgba(255,69,58,0.10); animation: breathe 2.4s ease-in-out infinite; }

  .act {
    width: 46px; height: 46px; align-self: center; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    background: var(--gb-shine), var(--gb); border: 1px solid var(--gb-edge); color: var(--tag);
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 10px var(--lift);
    transition: transform .2s var(--ease), background .2s, box-shadow .3s;
  }
  .act:active { transform: scale(0.88); background: rgba(255,159,10,0.16); }
  .act.undo { color: var(--accent); }
  .act.undo:active { background: rgba(10,132,255,0.16); }
  .act.warn { color: var(--danger); }
  .act.warn:active { background: rgba(255,69,58,0.16); }
  .act[disabled] { opacity: 0.55; }
  .act.stamping { animation: stamp .5s var(--ease); }

  /* ---- the bucket emptying ---- */
  .card.flushing::before {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,69,58,0.00) 0%, rgba(255,69,58,0.16) 45%, rgba(255,255,255,0.10) 55%, rgba(255,69,58,0.00) 100%);
    animation: flush 1.05s var(--ease);
  }

  /* ---- states ---- */
  .empty { padding: 30px 20px; text-align: center; color: var(--faint); font-size: 14px; line-height: 1.55; animation: rowIn .5s var(--ease) both; }
  .skel {
    height: 62px; border-top: 1px solid var(--hair-2);
    background: linear-gradient(100deg, transparent 20%, var(--fill) 50%, transparent 80%);
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; animation-delay: calc(var(--i) * 90ms);
  }
  .skel:first-child { border-top: 0; }

  /* ---- panels ---- */
  .panel { padding: 18px; display: flex; flex-direction: column; gap: 13px; }
  .panel > * { animation: rowIn .5s var(--ease) both; }
  .panel > *:nth-child(2) { animation-delay: .05s; } .panel > *:nth-child(3) { animation-delay: .1s; }
  .panel > *:nth-child(4) { animation-delay: .15s; } .panel > *:nth-child(5) { animation-delay: .2s; }
  .panel > *:nth-child(n+6) { animation-delay: .25s; }
  .panel p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .panel strong { color: var(--text); }
  .panel ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .panel code, code.url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: var(--fill); border: 1px solid var(--hair-2); border-radius: 7px; padding: 2px 6px;
    word-break: break-all; color: var(--text);
  }
  .panel input[type=text] {
    width: 100%; padding: 12px 13px; border-radius: 13px; background: var(--fill);
    border: 1px solid var(--hair); outline: none; font-size: 16px;   /* under 16px, iOS zooms the page on focus */ transition: border-color .25s, box-shadow .25s;
  }
  .panel input[type=text]:focus { border-color: rgba(10,132,255,0.7); box-shadow: 0 0 0 4px rgba(10,132,255,0.16); }
  .hero {
    align-self: center; width: 76px; height: 76px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,159,10,0.14); border: 1px solid rgba(255,159,10,0.28); color: var(--tag);
    box-shadow: 0 0 40px rgba(255,159,10,0.22), inset 0 1px 0 rgba(255,255,255,0.18);
    animation: float 4.5s ease-in-out infinite alternate;
  }
  .hero svg { width: 34px; height: 34px; }
  .btn {
    position: relative; overflow: hidden;
    --tint: var(--accent);
    min-height: 50px; padding: 13px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--accent-ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: rgba(10, 132, 255, 0.35);                          /* where color-mix isn't known */
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--tint-mix), transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 40%, var(--gb-edge));
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--hi), var(--gb-shadow);
    transition: transform .18s var(--ease), filter .2s, box-shadow .25s;
  }
  .btn:active { transform: scale(0.975); filter: brightness(0.9); }
  .btn::after {
    content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.45), transparent 60%);
    opacity: 0; transition: opacity .5s;
  }
  .btn:active::after { opacity: 1; transition: opacity 0s; }
  .btn.ghost { background: var(--gb-shine), var(--gb); border: 1px solid var(--gb-edge); color: var(--text); font-weight: 500; }
  .btn.warn { --tint: var(--danger); background: var(--gb-shine), color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-weight: 500; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .field input[type=number] {
    width: 72px; padding: 9px 10px; border-radius: 11px; background: var(--fill); border: 1px solid var(--hair);
    color: var(--text); font: inherit; text-align: center; outline: none;
  }
  .note { font-size: 12px; line-height: 1.55; color: var(--faint); }
  .note.bad { color: var(--bad-text); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 60;   /* above the sheets (40) and the title menu (45): an error is never hidden */
    max-width: min(480px, calc(100vw - 28px)); width: max-content;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 13px 12px 16px; border-radius: 16px;
    /* the sheets' Liquid Glass (tokens below); the border stays, clear, so nothing moves */
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom)); border: 1px solid transparent;
    backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 12px 30px var(--lift-strong);
    color: var(--text); font-size: 14px; animation: toastIn .42s var(--ease) both;
  }
  #toast .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { color: var(--accent); font-weight: 600; flex: none; padding: 3px 5px; transition: transform .18s var(--ease); }
  #toast button:active { transform: scale(0.92); }
  #toast.bad { box-shadow: inset 0 0 0 1px rgba(255,69,58,0.42), inset 0 1px 1px var(--lgs-rim), 0 12px 30px var(--lift-strong); }   /* an error: a red rim */
  #toast.bad .msg { white-space: normal; }

  .foot { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); padding: 2px 0 4px; animation: rowIn .5s .2s var(--ease) both; }
  .foot button { color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--hair-2); transition: transform .18s var(--ease), color .2s; }
  .foot button:active { transform: scale(0.94); color: var(--text); }

  /* ---- search ---- */
  /* a rounded capsule of the same clear Liquid Glass as the header and All | Unread */
  .search {
    display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 7px 0 15px; border-radius: 999px;
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    backdrop-filter: blur(14px) saturate(190%) brightness(1.04); -webkit-backdrop-filter: blur(14px) saturate(190%) brightness(1.04);
    box-shadow: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi), 0 6px 20px var(--lift);
    transition: box-shadow .25s;
    animation: fadeDown .5s .02s var(--ease) both;
  }
  .search:focus-within { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 65%, var(--bar-rim)), inset 0 1px 1px var(--hi), 0 0 0 4px rgba(10,132,255,0.14), 0 6px 20px var(--lift); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .search { background: var(--bar-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .search { background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  .search > svg { color: var(--icon); transition: color .25s; }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: var(--text); -webkit-appearance: none; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .x {
    width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex: none;
    color: var(--muted); background: var(--fill); animation: pop .3s var(--ease);
  }

  /* ---- tag chips (the tag sheet's picker) ---- */
  .chip2 {
    --h: 211; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap;
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: color .25s, background .25s, border-color .25s, transform .18s var(--ease);
  }
  .chip2.on {
    color: var(--sel-ink); font-weight: 600;
    background: var(--gb-shine), color-mix(in srgb, var(--accent) var(--tint-mix), transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--gb-edge));
  }
  .chip2:active { transform: scale(0.94); }
  .chip2 i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) 90% 62%); box-shadow: 0 0 8px hsl(var(--h) 90% 62% / .6); }
  .chip2.has { border-color: hsl(var(--h) 90% 66% / .45); }
  .tchip {
    --h: 211; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; flex: 0 1 auto;
    font-size: 11px; font-weight: 500; color: hsl(var(--h) 90% var(--tl)); min-width: 0;
    background: hsl(var(--h) 90% 60% / .14); border: 1px solid hsl(var(--h) 90% 60% / .32);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tchip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tchip.rem::before { display: none; }                 /* the bell is its mark */
  .meta { overflow: hidden; }
  .meta .chip { flex: 0 1 auto; min-width: 0; }
  .card h2.gh { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; }
  .card h2.gh .tchip { font-size: 13px; padding: 3px 10px; }
  .gcount { font-size: 12px; font-weight: 400; color: var(--faint); }
  .ptitle { font-size: 15px; font-weight: 600; }
  .more { display: flex; justify-content: center; padding: 10px; border-top: 1px solid var(--hair-2); }
  .more button {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; font-size: 13px; color: var(--muted);
    background: var(--fill); border: 1px solid var(--hair); transition: transform .18s var(--ease);
  }
  .more button:active { transform: scale(0.94); }

  /* ---- the message page: slides over the list like a pushed screen ---- */
  #reader {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 84px) max(14px, env(safe-area-inset-left));
    background: var(--page);                 /* solid: no blur needed, and none to pay for */
    animation: pageIn .44s var(--ease) both;
  }
  #reader.leaving { animation: pageOut .28s cubic-bezier(.4,0,1,1) both; }
  /* iOS 18+: the tapped row grows into the message (View Transitions); the
     slide above is the fallback. */
  #reader.vt, #reader.vt .wrap > * { animation: none; }
  ::view-transition-group(msg) { animation-duration: .42s; animation-timing-function: cubic-bezier(.2, .85, .25, 1); }
  ::view-transition-old(msg), ::view-transition-new(msg) { height: 100%; object-fit: cover; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; }
  #reader .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  #reader .wrap > * { animation: rowIn .5s var(--ease) both; }
  #reader .wrap > :nth-child(2) { animation-delay: .06s; } #reader .wrap > :nth-child(3) { animation-delay: .12s; }
  #reader .wrap > :nth-child(4) { animation-delay: .18s; }
  .rtop { display: flex; align-items: center; gap: 8px; }
  .rtop .iconbtn { width: 38px; height: 38px; }
  .rspace { flex: 1; }
  .pillbtn {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 15px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--glass); border: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: transform .18s var(--ease), background .2s;
  }
  .pillbtn:active { transform: scale(0.93); background: var(--glass-2); }
  .pillbtn.tagc { color: var(--tag); }
  .pillbtn.bluec { color: var(--accent); }
  .pillbtn[disabled] { opacity: 0.6; }
  .rhead { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .rsubj { font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .rfrom { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .avatar {
    --h: 211; width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    background: linear-gradient(135deg, hsl(var(--h) 85% 60%), hsl(calc(var(--h) + 40) 80% 46%));
    box-shadow: 0 4px 16px hsl(var(--h) 85% 50% / .38), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .rwho { display: flex; flex-direction: column; min-width: 0; font-size: 15px; }
  .rwho strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmail { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rwhen { margin-left: auto; color: var(--faint); font-size: 12px; text-align: right; flex: none; white-space: nowrap; }
  .rtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .rtags:empty { display: none; }
  .rtags.flash .tchip:last-child { animation: pop .5s var(--ease); }
  .imgnote { display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 14px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .imgnote svg { color: var(--faint); }
  .imgnote button {
    margin-left: auto; flex: none; padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--accent); background: rgba(10,132,255,0.12); border: 1px solid rgba(10,132,255,0.28);
  }
  .rcount { font-size: 13px; color: var(--faint); margin-top: -6px; }
  .msg { overflow: hidden; }
  .mhead { display: flex; align-items: center; gap: 11px; width: 100%; min-width: 0; text-align: left; padding: 14px 16px; transition: background .2s; }
  .mhead:active { background: var(--fill); }
  .msg.folded .mhead { padding: 11px 16px; }
  .msg.folded .avatar { width: 32px; height: 32px; font-size: 14px; }
  .msg.unfold { animation: rowIn .4s var(--ease) both; }
  .mbody.html { margin: 0 8px 8px; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--hair); }
  .mbody.rtext { padding: 2px 16px 18px; }
  .who .cnt { flex: none; font-size: 11px; font-weight: 600; color: var(--faint); padding: 1px 7px; border-radius: 999px; background: var(--fill); }
  .who .when { display: inline-flex; align-items: center; gap: 4px; }
  .who .when .clip { opacity: .75; }
  .rframe { display: block; width: 100%; height: 160px; border: 0; background: #fff; }
  .rtext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; color: var(--text); }
  .rtext a { color: var(--accent); }
  .rfoot { display: flex; justify-content: center; padding-top: 2px; }
  .rowtop { display: flex; align-items: stretch; gap: 10px; }
  .plink {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    color: var(--accent); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi), 0 4px 14px var(--lift);
    transition: transform .18s var(--ease);
  }
  .plink:active { transform: scale(0.94); }

  /* ---- the tag sheet ---- */
  #sheet { position: fixed; inset: 0; z-index: 40; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fadeIn .3s ease both; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 13px;
    padding: 10px 18px calc(env(safe-area-inset-bottom) + 18px);
    border-radius: 28px 28px 0 0; border: 1px solid var(--hair); border-bottom: 0;
    background: var(--sheet);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -14px 44px var(--lift-strong), inset 0 1px 0 var(--hi);
    animation: sheetUp .46s var(--ease) both;
  }
  #sheet.leaving .sheet { animation: sheetDown .28s cubic-bezier(.4,0,1,1) both; }
  /* drag a sheet down to close it, as on iOS */
  .sheet { touch-action: none; }
  .sheet input, .sheet textarea { touch-action: auto; }
  .sheet .grab { padding: 6px 0; margin: -6px auto; background-clip: content-box; }
  #sheet.leaving .scrim { animation: fadeOut .28s ease both; }
  .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--grab); align-self: center; margin-bottom: 2px; }
  .sheet h3 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -0.01em; }
  .sheet h3 .chip { font-size: 14px; vertical-align: 1px; max-width: none; }
  .sheet .note { margin: 0; }
  .tagpick { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet input[type=text] {
    width: 100%; padding: 12px 13px; border-radius: 13px; background: var(--fill);
    border: 1px solid var(--hair); outline: none; font-size: 16px; color: var(--text);
    transition: border-color .25s, box-shadow .25s;
  }
  .sheet input[type=text]:focus { border-color: rgba(10,132,255,0.7); box-shadow: 0 0 0 4px rgba(10,132,255,0.16); }

  @keyframes pageIn { from { transform: translateX(100%); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @keyframes pageOut { to { transform: translateX(100%); opacity: 0.4; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ---- selecting, the way Mail does it ---- */
  .textbtn {
    height: 36px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--accent);
    background: var(--glass); border: 1px solid var(--hair);

    animation: pop .3s var(--ease);

  #selall { font-weight: 500; }
  #edit { color: var(--icon-text); }
  /* no text selection or iOS callout on a long press */
  ul.list > li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .check {
    position: absolute; left: 14px; top: 50%; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%;
    border: 2px solid var(--ring); pointer-events: none;

  }

  /* a finger-sized grip around each circle: drag down from it to select a run */
  #screen.selecting .check::before { content: ''; position: absolute; inset: -16px -14px -16px -14px; }
  #screen.selecting .act { opacity: 0; transform: scale(0.5); width: 0; margin-left: -10px; pointer-events: none; }
  .act { transition: transform .2s var(--ease), background .2s, box-shadow .3s, opacity .25s, width .3s var(--ease), margin .3s var(--ease); }
  ul.list > li.sel { background: rgba(10,132,255,0.10); }
  li.sel .check { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(10,132,255,0.55); animation: pop .35s var(--ease); }
  li.sel .check::after {
    content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  #selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto;
    padding: 12px max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(18px, env(safe-area-inset-left));
    border-radius: 24px 24px 0 0; border: 1px solid var(--hair); border-bottom: 0;
    background: var(--sheet);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -10px 36px var(--lift-strong), inset 0 1px 0 var(--hi);
    animation: sheetUp .42s var(--ease) both;
  }
  #selbar button {
    display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px;
    font-size: 15px; font-weight: 600; color: var(--accent); background: rgba(10,132,255,0.12);
    border: 1px solid rgba(10,132,255,0.26); transition: transform .18s var(--ease), opacity .2s;
  }
  #selbar button.danger { color: var(--danger); background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.32); }
  #selbar button:active { transform: scale(0.93); }
  #selbar button[disabled] { opacity: 0.35; }
  #sel-count { flex: 1; text-align: center; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  body.selecting { padding-bottom: calc(env(safe-area-inset-bottom) + 96px); }

  /* ---- swipe right to tag ---- */
  ul.list > li[data-id] { touch-action: pan-y; }
  .rowtop { position: relative; z-index: 1; transition: transform .34s var(--ease); }
  .swipe {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 0; overflow: hidden;
    display: flex; justify-content: flex-start;
    background: var(--swipe-track);
    transition: width .34s var(--ease), background .25s;
  }
  .sa.tagx { --tint: #7B6CF6; --ink: var(--tag-ink); }
  .sa.mktx { --tint: var(--flag-tint); --ink: var(--flag-ink); }
  .sa.inbx { --tint: var(--accent); --ink: var(--accent); }
  li.armed .sa.mktx, li.armed .sa.inbx { flex-basis: 0; padding: 0; overflow: hidden; }
  li.armed .sa.tagx { flex: 1 0 76px; }
  /* The glass icon the swipe actions share */
  .gi {
    width: 44px; height: 44px; border-radius: 999px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--gi-mix), transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 42%, var(--gb-edge));
    box-shadow: inset 0 1px 0 var(--hi), 0 4px 12px var(--lift);
    transition: transform .3s var(--ease), background .25s, color .25s, width .3s var(--ease);
  }
  /* all the way right: Tag stretches into a wide capsule, as Trash does on the left */
  li.armed .sa.tagx .gi {
    width: calc(100% - 28px); color: var(--armed-ink, var(--ink));
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--armed-mix), transparent);
  }
  li.swiped .swipe .gi { animation: pop .35s var(--ease); }
  li.peek .rowtop { animation: peekRow 1.6s var(--ease) .5s both; }
  li.peek .swipe { animation: peekUnder 1.6s var(--ease) .5s both; }
  @keyframes peekRow { 0%, 100% { transform: none; } 35%, 62% { transform: translateX(96px); } }
  @keyframes peekUnder { 0%, 100% { width: 0; } 35%, 62% { width: 108px; } }
  #screen.selecting .swipe, #screen.selecting .swipe-r { display: none; }

  /* ---- swipe left: Flag, Archive, Trash ---- */
  .swipe-r {
    position: absolute; right: 0; top: 0; bottom: 0; width: 0; z-index: 0; overflow: hidden;
    display: flex; justify-content: flex-end; transition: width .34s var(--ease);
  }
  .sa {
    flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    color: var(--muted); font-size: 12px; font-weight: 600; transition: flex-basis .3s var(--ease), padding .3s var(--ease);
  }
  .swipe-r { background: var(--fill); }
  .sa:active .gi { transform: scale(0.9); }
  .sa.flag { --tint: var(--flag-tint); --ink: var(--flag-ink); }
  .sa.arch { --tint: var(--arch-tint); --ink: var(--arch-ink); }
  .sa.bin { --tint: var(--bin-tint); --ink: var(--bin-ink); }
  li.armed-l .sa.flag, li.armed-l .sa.arch { flex-basis: 0; padding: 0; overflow: hidden; }
  li.armed-l .sa.bin { flex: 1 0 76px; }
  /* all the way: Trash stretches into a wide glass capsule, as Mail's fills the row */
  li.armed-l .sa.bin .gi {
    width: calc(100% - 28px); color: var(--armed-ink, var(--ink));
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--armed-mix-l), transparent);
  }
  li.armed-l .sa.bin svg { animation: pop .35s var(--ease); }
  .who .when .flagged { color: #FF9500; display: inline-flex; }

  /* ---- writing ---- */
  #compose {
    position: fixed; inset: 0; z-index: 22; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(14px, env(safe-area-inset-left));
    background: var(--page); animation: sheetUp .44s var(--ease) both;
  }
  #compose.leaving { animation: sheetDown .28s cubic-bezier(.4,0,1,1) both; }
  .cwrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .ctop { display: flex; align-items: center; gap: 10px; }
  .ctitle { flex: 1; text-align: center; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .send {
    width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    color: #fff; background: var(--accent);
    background: var(--gb-shine), color-mix(in srgb, var(--accent) 82%, transparent);
    border: 1px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 6px 16px color-mix(in srgb, var(--accent) 22%, transparent);
    transition: transform .18s var(--ease);
  }
  .send:active { transform: scale(0.88); }
  .cform { display: flex; flex-direction: column; }
  .cf { display: flex; align-items: center; gap: 8px; padding: 0 16px; min-height: 48px; border-bottom: 1px solid var(--hair-2); }
  .cf span { color: var(--faint); font-size: 15px; flex: none; }
  .cf input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: var(--text); }
  #c-body {
    min-height: 46vh; padding: 14px 16px 18px; background: none; border: 0; outline: none; resize: none;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text);
  }
  .cnote-bad { padding: 12px 16px; font-size: 13px; line-height: 1.5; color: var(--bad-text); }
  .fab {
    position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 15;
    width: 56px; height: 56px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    /* the same clear Liquid Glass as the pinned header's pill */
    color: var(--icon); background: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    backdrop-filter: blur(14px) saturate(190%) brightness(1.04); -webkit-backdrop-filter: blur(14px) saturate(190%) brightness(1.04);
    box-shadow: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi), 0 8px 26px var(--lift);
    transition: transform .2s var(--ease); animation: pop .45s var(--ease) both;
  }

  }
  @media (prefers-reduced-transparency: reduce) {
    .fab { background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
  /* All | Unread, at the top of the list: a frosted glass capsule whose lit
     thumb slides to the side that's chosen, as iOS's segmented controls do
     (the thumb is home/slide.js's, below). */
  .seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 40px; padding: 3px; border-radius: 999px;
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bottom));
    backdrop-filter: blur(14px) saturate(190%) brightness(1.04); -webkit-backdrop-filter: blur(14px) saturate(190%) brightness(1.04);
    box-shadow: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi), 0 6px 20px var(--lift);
    animation: rowIn .45s var(--ease) both;
  }
  .seg button {
    position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--muted); border-radius: 999px;
    transition: color .25s, transform .18s var(--ease);
  }
  .seg button[aria-checked="true"] {
    color: var(--text); background: var(--gb-shine), var(--seg-thumb);
    box-shadow: inset 0 0 0 1px var(--gb-edge), inset 0 1px 0 var(--hi), 0 3px 10px var(--lift);
  }
  .seg button:active { transform: scale(0.95); }
  .seg .udot { width: 7px; height: 7px; border-radius: 50%; background: var(--icon); opacity: .55; transition: opacity .25s, box-shadow .25s; }
  .seg.on .udot { opacity: 1; box-shadow: 0 0 8px color-mix(in srgb, var(--icon) 75%, transparent); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .seg { background: var(--bar-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .seg { background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ---- the list as pills: each conversation a rounded glass card of its own ---- */
  .stack { position: relative; display: flex; flex-direction: column; }
  .stack > h2 {
    font-size: 12px; font-weight: 600; color: var(--faint); margin: 0; padding: 2px 8px 10px;
    letter-spacing: 0.04em; text-transform: uppercase; animation: rowIn .5s var(--ease) both;
  }

  ul.list.pills > li {
    margin-top: 10px; padding: 13px 14px 13px 18px; border-top: 0; border-radius: 24px;
    background: var(--tile); border: 1px solid transparent; background-clip: padding-box;   /* a faint tile, as every card */
    box-shadow: inset 0 0 0 .5px var(--tile-edge);
    transition: height .3s var(--ease), padding .3s var(--ease), margin .3s var(--ease), opacity .26s ease, transform .3s cubic-bezier(.4,0,.9,.4), filter .26s, background .25s, border-color .25s;
  }

  #screen.selecting ul.list.pills > li { padding-left: 52px; }
  ul.list.pills > li.sel {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border-color: color-mix(in srgb, var(--accent) 50%, var(--pill-rim));
  }
  .stack .skel {
    height: 84px; margin-top: 10px; border-top: 0; border-radius: 24px; border: 1px solid transparent;
    box-shadow: inset 0 0 0 .5px var(--tile-edge);
    background: linear-gradient(100deg, transparent 20%, var(--fill) 50%, transparent 80%), var(--tile); background-clip: padding-box;
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; animation-delay: calc(var(--i) * 90ms);
  }
  .stack .skel:first-child { margin-top: 0; }
  .stack .more { border-top: 0; padding: 14px 0 4px; }
  .stack .more button { background: transparent; border-color: var(--pill-rim); }
  /* room at the bottom so the last pill clears the compose button */
  #screen:has(ul.pills) { padding-bottom: 64px; }
  .stack.flushing::before {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,69,58,0.00) 0%, rgba(255,69,58,0.16) 45%, rgba(255,255,255,0.10) 55%, rgba(255,69,58,0.00) 100%);
    animation: flush 1.05s var(--ease);
  }

  /* ---- mailing lists and blocking ---- */
  .unsub {
    display: flex; align-items: center; gap: 10px; margin: 0 14px 10px; padding: 8px 8px 8px 14px;
    border-radius: 999px; background: var(--gb-shine), var(--fill); border: 1px solid var(--gb-edge); box-shadow: inset 0 1px 0 var(--hi); font-size: 13.5px; color: var(--muted);
  }

  .unsub .textbtn { flex: none; font-weight: 600; }
  .blocked { display: flex; align-items: center; gap: 10px; }
  .blocked span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- files ---- */
  .mfiles { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
  .fchip {
    display: flex; align-items: center; gap: 11px; width: 100%; min-height: 54px; padding: 8px 10px; text-align: left;
    border-radius: 18px; background: var(--tile); border: 1px solid transparent; background-clip: padding-box; box-shadow: inset 0 0 0 .5px var(--tile-edge); color: var(--text);
    transition: transform .18s var(--ease);
