<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mail</title>
<meta name="description" content="Gmail triage for the home screen: one tap buckets a sender's whole domain into Marketing, and Marketing empties itself.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08080B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default, not black-translucent: that one always draws the clock white,
     which vanishes on the light theme. default lets iOS pick the clock's colour
     and use theme-color above for the bar. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mail">
<meta name="referrer" content="origin">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<!--
  Mail - Gmail triage as a home-screen app. No build step, no server, no
  dependencies: this file is the whole app.

  What one tap on the tag button does:
    1. moves that conversation to the Marketing label and out of the inbox;
    2. creates a Gmail filter so everything from the same domain does the
       same from now on, without the app being open;
    3. sweeps the mail already in the mailbox from that domain into Marketing.

  Tags work the same way without leaving the inbox: tag one message from the
  school and everything from that domain - already here and still to come -
  carries the tag, and its chip under the tabs filters the list to it.

  Tapping a message opens it as a page of its own, rendered in a sandboxed
  frame that can run nothing and load nothing until "Show images" is tapped,
  so tracking pixels stay dark. The search bar takes Gmail's own search syntax.

  Anything in Marketing older than 3 days (Settings: 1-30) goes to the Trash,
  where Gmail deletes it for good after 30 days. The sweep runs when the app
  opens; .github/workflows/mail.yml runs the same sweep daily so it happens
  whether or not the app is opened.

  Sign-in is the OAuth 2.0 implicit flow done by hand (a full-page redirect to
  accounts.google.com and back) rather than Google's popup-based library: an
  iPhone home-screen app opens popups in a separate browser view that cannot
  hand a token back, while a redirect returns into the app. Access tokens last
  about an hour and no refresh token exists, so a signed-out app bounces
  through Google again - silently, once the grant is in place.

  Scopes: gmail.modify (label, move, trash) and gmail.settings.basic (the
  domain filters). Both are per-device; the token never leaves the phone.

  Look: one sheet of frosted glass over a slow aurora, and every action has
  its own motion - a tag stamp and a sheen before a row flies out to the
  right, a row flying back left when it returns, a crumble for a deleted
  rule, a wipe down the bucket when it empties. All of it collapses to
  nothing under prefers-reduced-motion.

  Light or dark follows the iPhone's own setting (prefers-color-scheme), and
  changes the moment iOS does. Every colour is a token on :root with a light
  value under the media query; the email itself always renders on white.
-->
<style>
  :root {
    --bg: #08080B;
    --text: #FFFFFF;
    --muted: rgba(235, 235, 245, 0.62);
    --faint: rgba(235, 235, 245, 0.38);
    --accent: #0A84FF;
    --tag: #FF9F0A;
    --danger: #FF453A;
    /* glass buttons, as on iOS: a translucent fill, lit along the top edge;
       coloured ones carry a tint of their colour rather than a solid block */
    --gb: rgba(255, 255, 255, 0.10);
    --gb-edge: rgba(255, 255, 255, 0.16);
    --gb-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%);
    --gb-shadow: 0 6px 18px rgba(0, 0, 0, 0.24);
    --tint-mix: 42%;                          /* how much colour a tinted button carries */
    --accent-ink: #FFFFFF;                    /* text on a tinted button */
    --sel-ink: #FFFFFF;                       /* the chosen filter, over the aurora */
    --danger-ink: #FFFFFF;
    /* swipe actions: round glass icons in each action's own colour */
    --gi-mix: 30%;
    --armed-mix: 62%;
    --armed-ink: #FFFFFF;
    --swipe-track: rgba(123, 108, 246, 0.10);
    --tag-ink: #D9D3FF;
    /* Flag, Archive, Trash: iOS Mail's orange, purple and red, at about half
       their saturation so they sit as quietly as Tag */
    --flag-tint: #C8913F;
    --arch-tint: #8C79CF;
    --bin-tint: #C9625B;
    --flag-ink: #EBC68F;
    --arch-ink: #CDBEF3;
    --bin-ink: #F0A9A3;
    --armed-mix-l: 50%;                       /* a full swipe's Trash capsule */
    /* glass */
    --glass: rgba(18, 18, 22, 0.46);
    --glass-2: rgba(38, 38, 44, 0.72);
    --hair: rgba(255, 255, 255, 0.11);
    --hair-2: rgba(255, 255, 255, 0.07);
    --blur: blur(30px) saturate(180%);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --fill: rgba(255, 255, 255, 0.07);        /* chips, inputs, quiet buttons */
    --pill: rgba(255, 255, 255, 0.13);        /* the selected tab */
    --hi: rgba(255, 255, 255, 0.10);          /* the light catching a glass edge */
    --lift: rgba(0, 0, 0, 0.38);              /* cards' shadow */
    --lift-strong: rgba(0, 0, 0, 0.5);        /* sheets, toast, bars */
    --toast: rgba(30, 30, 34, 0.62);
    --page: rgb(10, 10, 13);                  /* the message page: solid, as a pushed page in Mail is */
    --sheet: rgba(28, 28, 32, 0.80);          /* tag sheet and select bar */
    --scrim: rgba(0, 0, 0, 0.45);
    --grab: rgba(255, 255, 255, 0.25);
    --ring: rgba(255, 255, 255, 0.32);        /* an empty select circle */
    --bad-text: #FF9A92;
    --chip-on-text: #FFFFFF;
    --tl: 80%;                                /* tag chip text lightness */
    --aurora: 0.72;
    color-scheme: dark;
  }

  /* Light, when the iPhone is in Light mode - and it switches live when iOS
     does, with no reload. Same glass, turned to frosted white; colours are
     the iOS light-mode system ones, deepened where they carry text. */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F2F2F7;
      --text: #111114;
      --muted: rgba(60, 60, 67, 0.80);
      --faint: rgba(60, 60, 67, 0.64);          /* 0.55 measured 2.9:1 on the page - below the 3:1 floor */
      --accent: #007AFF;
      --tag: #D97706;
      --danger: #E5281D;
      --gb: rgba(255, 255, 255, 0.55);
      --gb-edge: rgba(255, 255, 255, 0.95);
      --gb-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 60%);
      --gb-shadow: 0 4px 14px rgba(40, 40, 80, 0.10);
      --tint-mix: 16%;
      --accent-ink: #0059C8;
      --sel-ink: #00479E;                     /* #0059C8 measured 4.0:1 over the aurora - below 4.5 */
      --danger-ink: #AE2117;
      --gi-mix: 18%;
      --armed-mix: 34%;
      --armed-ink: initial;                   /* keeps each action's own dark ink */
      --swipe-track: rgba(123, 108, 246, 0.07);
      --tag-ink: #4A3FC4;
      --flag-ink: #855412;
      --arch-ink: #5A45B0;
      --bin-ink: #9E3A32;
      --armed-mix-l: 26%;
      --glass: rgba(255, 255, 255, 0.58);
      --glass-2: rgba(255, 255, 255, 0.86);
      --hair: rgba(60, 60, 67, 0.14);
      --hair-2: rgba(60, 60, 67, 0.09);
      --fill: rgba(118, 118, 128, 0.11);
      --pill: rgba(255, 255, 255, 0.96);
      --hi: rgba(255, 255, 255, 0.8);
      --lift: rgba(40, 40, 80, 0.08);
      --lift-strong: rgba(40, 40, 80, 0.16);
      --toast: rgba(255, 255, 255, 0.84);
      --page: rgb(242, 242, 247);
      --sheet: rgba(249, 249, 252, 0.90);
      --scrim: rgba(0, 0, 0, 0.22);
      --grab: rgba(60, 60, 67, 0.30);
      --ring: rgba(60, 60, 67, 0.32);
      --bad-text: #C4001A;
      --chip-on-text: #111114;
      --tl: 32%;
      --aurora: 0.40;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text); }
  body {                                    /* no background: the aurora is behind it */
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh; min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 84px) max(14px, env(safe-area-inset-left));
    overscroll-behavior-y: none;
  }

  /* ---- the light behind the glass ---- */
  .aurora { position: fixed; inset: -20%; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora b {
    position: absolute; display: block; border-radius: 50%;
    filter: blur(58px); opacity: var(--aurora); will-change: transform;
  }
  .aurora b:nth-child(1) { width: 78vw; height: 78vw; left: -12vw;  top: 6vh;   background: radial-gradient(circle, #2E6BFF 0%, rgba(46,107,255,0) 68%); animation: drift1 34s ease-in-out infinite alternate; }
  .aurora b:nth-child(2) { width: 66vw; height: 66vw; right: -14vw; top: 14vh;  background: radial-gradient(circle, #FF7A3D 0%, rgba(255,122,61,0) 68%); animation: drift2 41s ease-in-out infinite alternate; }
  .aurora b:nth-child(3) { width: 86vw; height: 86vw; right: -16vw; bottom: 2vh; background: radial-gradient(circle, #9A5BFF 0%, rgba(154,91,255,0) 68%); animation: drift3 47s ease-in-out infinite alternate; }
  .aurora b:nth-child(4) { width: 62vw; height: 62vw; left: -14vw;  bottom: 16vh; background: radial-gradient(circle, #18C3A5 0%, rgba(24,195,165,0) 68%); animation: drift4 38s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate3d(14vw, 10vh, 0) scale(1.18); } }
  @keyframes drift2 { to { transform: translate3d(-12vw, 16vh, 0) scale(1.12); } }
  @keyframes drift3 { to { transform: translate3d(-16vw, -12vh, 0) scale(1.22); } }
  @keyframes drift4 { to { transform: translate3d(18vw, -14vh, 0) scale(1.15); } }

  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg.i { display: inline-block; flex: none; fill: currentColor; }
  /* line icons, drawn like iOS's: thin, rounded strokes */
  svg.i.s { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  svg.i.s.bold { stroke-width: 2.3; }
  /* a flagged message's flag is filled in, as in Mail */
  .rb.on svg.i.s, .who .when .flagged svg.i.s { fill: currentColor; }
  .hide { display: none !important; }

  /* ---- header ---- */
  header { display: flex; align-items: center; gap: 10px; padding: 2px 4px 0; animation: fadeDown .5s var(--ease) both; }
  header h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.03em; margin: 0; flex: 1; font-weight: 700; }
  header .sub { display: block; font-size: 12px; font-weight: 400; color: var(--faint); letter-spacing: 0; margin-top: 3px; transition: opacity .3s; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--glass); border: 1px solid var(--hair); color: var(--muted);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: transform .18s var(--ease), background .2s, color .2s;
  }
  .iconbtn:active { transform: scale(0.9); background: var(--glass-2); color: var(--text); }

  /* The large title scrolls away; a compact glass bar takes its place, as in iOS.
     Tapping it goes back to the top. */
  .minibar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 12; height: calc(env(safe-area-inset-top) + 44px); padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: center;
    background: var(--glass-2); border-bottom: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    transform: translateY(-100%); opacity: 0; pointer-events: none;
    transition: transform .32s var(--ease), opacity .25s;
  }
  .minibar button { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; padding: 8px 20px; }
  body.scrolled .minibar { transform: none; opacity: 1; pointer-events: auto; }
  body.selecting .minibar, body.reading .minibar { display: none; }

  /* Pull to refresh: the list follows your finger, a glass spinner shows above it */
  main { transition: transform .45s var(--ease); }
  main.pulling { transition: none; }
  .ptr {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); z-index: 5; width: 36px; height: 36px; margin-left: -18px;
    border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--muted);
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi), 0 6px 16px var(--lift);
    opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .25s, transform .25s var(--ease);
  }
  .ptr.ready { color: var(--accent); }
  .ptr.spin svg { animation: rot .8s linear infinite; }
  .iconbtn.turning svg { animation: rot .6s var(--ease); }

  /* ---- filters: one scrolling row of glass capsules ---- */
  .filters {
    display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    margin: -2px -14px 0; padding: 3px 14px 5px; animation: fadeDown .45s .04s var(--ease) both;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chipset { display: contents; }
  .filters [role=tab], .chip2 {
    --h: 211; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap;
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: color .25s, background .25s, border-color .25s, transform .18s var(--ease);
  }
  .filters [role=tab][aria-selected="true"], .chip2.on {
    color: var(--sel-ink); font-weight: 600;
    background: var(--gb-shine), color-mix(in srgb, var(--accent) var(--tint-mix), transparent);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--gb-edge));
  }
  .filters [role=tab]:active, .chip2:active { transform: scale(0.94); }
  .filters .count { font-size: 11px; color: inherit; opacity: .7; font-variant-numeric: tabular-nums; transition: color .3s; }
  .filters .count:empty { display: none; }
  .filters .count.pop { animation: pop .45s var(--ease); color: var(--tag); opacity: 1; }

  /* ---- glass card ---- */
  .card {
    position: relative; border-radius: 22px; overflow: hidden;
    background: var(--glass); border: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi), 0 16px 40px var(--lift);
  }
  #screen > .card { animation: cardIn .5s var(--ease) both; }
  #screen.quiet > .card, #screen.quiet ul.list > li, #screen.quiet .panel > * { animation: none; }
  #screen.quiet ul.list > li.fresh { animation: rowIn .52s var(--ease) both; animation-delay: calc(var(--i) * 34ms); }
  #screen.back > .card { animation: cardInBack .5s var(--ease) both; }
  .card h2 {
    font-size: 12px; font-weight: 600; color: var(--faint); margin: 0; padding: 13px 16px 9px;
    letter-spacing: 0.04em; text-transform: uppercase;
  }

  /* ---- rows ---- */
  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list > li {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    padding: 11px 10px 11px 16px; border-top: 1px solid var(--hair-2);
    animation: rowIn .52s var(--ease) both; animation-delay: calc(var(--i) * 34ms);
    transition: height .3s var(--ease), padding .3s var(--ease), opacity .26s ease, transform .3s cubic-bezier(.4,0,.9,.4), filter .26s;
  }
  ul.list > li:first-child { border-top: 0; }
  ul.list > li.going { height: 0 !important; padding-top: 0; padding-bottom: 0; opacity: 0; }
  ul.list > li.going.right { transform: translateX(105%) rotate(1.6deg); }
  ul.list > li.going.left  { transform: translateX(-105%) rotate(-1.6deg); }
  ul.list > li.going.crumble { transform: scale(0.93); filter: blur(5px); }
  /* the light that runs across a row the moment its action lands */
  ul.list > li.confirm::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 20%, rgba(255,159,10,0.22) 45%, rgba(255,255,255,0.30) 52%, transparent 78%);
    transform: translateX(-100%); animation: sheen .75s var(--ease);
  }
  ul.list > li.confirm.blue::after { background: linear-gradient(105deg, transparent 20%, rgba(10,132,255,0.22) 45%, rgba(255,255,255,0.30) 52%, transparent 78%); }

  .open { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 2px 0; transition: transform .2s var(--ease), opacity .2s; }
  button.open:active { transform: scale(0.985); opacity: 0.75; }
  .who { display: flex; align-items: baseline; gap: 7px; font-size: 15px; font-weight: 600; letter-spacing: -0.012em; }
  .who .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .when { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
  /* read while open: the dot fades out as you come back to the list */
  .who .dot.fade { animation: none; }
  .who .dot.fade.go { animation: dotOut .55s var(--ease) forwards; }
  @keyframes dotOut { 60% { transform: scale(1.4); opacity: .5; } to { transform: scale(0); opacity: 0; width: 0; margin-right: -7px; } }
  .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; align-self: center; box-shadow: 0 0 10px rgba(10,132,255,0.8); animation: breathe 2.6s ease-in-out infinite; }
  .subj { font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snip { font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    background: var(--fill); border: 1px solid var(--hair-2); color: var(--muted); font-size: 11px;
    max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chip svg { opacity: 0.7; }
  .chip.due { color: var(--danger); border-color: rgba(255,69,58,0.32); background: rgba(255,69,58,0.10); animation: breathe 2.4s ease-in-out infinite; }

  .act {
    width: 46px; height: 46px; align-self: center; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    background: var(--gb-shine), var(--gb); border: 1px solid var(--gb-edge); color: var(--tag);
    box-shadow: inset 0 1px 0 var(--hi), 0 3px 10px var(--lift);
    transition: transform .2s var(--ease), background .2s, box-shadow .3s;
  }
  .act:active { transform: scale(0.88); background: rgba(255,159,10,0.16); }
  .act.undo { color: var(--accent); }
  .act.undo:active { background: rgba(10,132,255,0.16); }
  .act.warn { color: var(--danger); }
  .act.warn:active { background: rgba(255,69,58,0.16); }
  .act[disabled] { opacity: 0.55; }
  .act.stamping { animation: stamp .5s var(--ease); }

  /* ---- the bucket emptying ---- */
  .card.flushing::before {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,69,58,0.00) 0%, rgba(255,69,58,0.16) 45%, rgba(255,255,255,0.10) 55%, rgba(255,69,58,0.00) 100%);
    animation: flush 1.05s var(--ease);
  }

  /* ---- states ---- */
  .empty { padding: 30px 20px; text-align: center; color: var(--faint); font-size: 14px; line-height: 1.55; animation: rowIn .5s var(--ease) both; }
  .skel {
    height: 62px; border-top: 1px solid var(--hair-2);
    background: linear-gradient(100deg, transparent 20%, var(--fill) 50%, transparent 80%);
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; animation-delay: calc(var(--i) * 90ms);
  }
  .skel:first-child { border-top: 0; }

  /* ---- panels ---- */
  .panel { padding: 18px; display: flex; flex-direction: column; gap: 13px; }
  .panel > * { animation: rowIn .5s var(--ease) both; }
  .panel > *:nth-child(2) { animation-delay: .05s; } .panel > *:nth-child(3) { animation-delay: .1s; }
  .panel > *:nth-child(4) { animation-delay: .15s; } .panel > *:nth-child(5) { animation-delay: .2s; }
  .panel > *:nth-child(n+6) { animation-delay: .25s; }
  .panel p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .panel strong { color: var(--text); }
  .panel ol { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.7; color: var(--muted); }
  .panel code, code.url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    background: var(--fill); border: 1px solid var(--hair-2); border-radius: 7px; padding: 2px 6px;
    word-break: break-all; color: var(--text);
  }
  .panel input[type=text] {
    width: 100%; padding: 12px 13px; border-radius: 13px; background: var(--fill);
    border: 1px solid var(--hair); outline: none; font-size: 16px;   /* under 16px, iOS zooms the page on focus */ transition: border-color .25s, box-shadow .25s;
  }
  .panel input[type=text]:focus { border-color: rgba(10,132,255,0.7); box-shadow: 0 0 0 4px rgba(10,132,255,0.16); }
  .hero {
    align-self: center; width: 76px; height: 76px; border-radius: 26px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,159,10,0.14); border: 1px solid rgba(255,159,10,0.28); color: var(--tag);

  .btn {
    position: relative; overflow: hidden;

    display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    background: rgba(10, 132, 255, 0.35);                          /* where color-mix isn't known */
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--tint-mix), transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 40%, var(--gb-edge));
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--hi), var(--gb-shadow);
    transition: transform .18s var(--ease), filter .2s, box-shadow .25s;
  }
  .btn:active { transform: scale(0.975); filter: brightness(0.9); }
  .btn::after {
    content: ''; position: absolute; inset: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.45), transparent 60%);
    opacity: 0; transition: opacity .5s;
  }
  .btn:active::after { opacity: 1; transition: opacity 0s; }
  .btn.ghost { background: var(--gb-shine), var(--gb); border: 1px solid var(--gb-edge); color: var(--text); font-weight: 500; }
  .btn.warn { --tint: var(--danger); background: var(--gb-shine), color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); font-weight: 500; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
  .field input[type=number] {
    width: 72px; padding: 9px 10px; border-radius: 11px; background: var(--fill); border: 1px solid var(--hair);
    color: var(--text); font: inherit; text-align: center; outline: none;
  }
  .note { font-size: 12px; line-height: 1.55; color: var(--faint); }
  .note.bad { color: var(--bad-text); }

  /* ---- toast ---- */
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 30;
    max-width: min(480px, calc(100vw - 28px)); width: max-content;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 13px 12px 16px; border-radius: 16px;
    background: var(--toast); border: 1px solid var(--hair);
    backdrop-filter: blur(26px) saturate(180%); -webkit-backdrop-filter: blur(26px) saturate(180%);
    box-shadow: 0 12px 36px var(--lift-strong), inset 0 1px 0 var(--hi);
    font-size: 14px; animation: toastIn .42s var(--ease) both;
  }
  #toast .msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toast button { color: var(--accent); font-weight: 600; flex: none; padding: 3px 5px; transition: transform .18s var(--ease); }
  #toast button:active { transform: scale(0.92); }
  #toast.bad { border-color: rgba(255,69,58,0.42); }
  #toast.bad .msg { white-space: normal; }

  .foot { display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); padding: 2px 0 4px; animation: rowIn .5s .2s var(--ease) both; }
  .foot button { color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--glass); border: 1px solid var(--hair-2); transition: transform .18s var(--ease), color .2s; }
  .foot button:active { transform: scale(0.94); color: var(--text); }

  /* ---- search ---- */
  .search {
    display: flex; align-items: center; gap: 9px; height: 42px; padding: 0 6px 0 13px; border-radius: 14px;
    background: var(--glass); border: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: border-color .25s, box-shadow .25s;
    animation: fadeDown .5s .02s var(--ease) both;
  }
  .search:focus-within { border-color: rgba(10,132,255,0.6); box-shadow: 0 0 0 4px rgba(10,132,255,0.14), inset 0 1px 0 var(--hi); }
  .search > svg { color: var(--faint); transition: color .25s; }
  .search:focus-within > svg { color: var(--accent); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: var(--text); -webkit-appearance: none; }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .x {
    width: 28px; height: 28px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; flex: none;
    color: var(--muted); background: var(--fill); animation: pop .3s var(--ease);
  }

  /* ---- tag chips ---- */
  .chip2 i { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) 90% 62%); box-shadow: 0 0 8px hsl(var(--h) 90% 62% / .6); }
  .chip2.has { border-color: hsl(var(--h) 90% 66% / .45); }
  .tchip {
    --h: 211; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; flex: 0 1 auto;
    font-size: 11px; font-weight: 500; color: hsl(var(--h) 90% var(--tl)); min-width: 0;
    background: hsl(var(--h) 90% 60% / .14); border: 1px solid hsl(var(--h) 90% 60% / .32);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tchip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tchip.rem::before { display: none; }                 /* the bell is its mark */
  .meta { overflow: hidden; }
  .meta .chip { flex: 0 1 auto; min-width: 0; }
  .card h2.gh { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; }
  .card h2.gh .tchip { font-size: 13px; padding: 3px 10px; }
  .gcount { font-size: 12px; font-weight: 400; color: var(--faint); }
  .ptitle { font-size: 15px; font-weight: 600; }
  .more { display: flex; justify-content: center; padding: 10px; border-top: 1px solid var(--hair-2); }
  .more button {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 999px; font-size: 13px; color: var(--muted);
    background: var(--fill); border: 1px solid var(--hair); transition: transform .18s var(--ease);
  }
  .more button:active { transform: scale(0.94); }

  /* ---- the message page: slides over the list like a pushed screen ---- */
  #reader {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 84px) max(14px, env(safe-area-inset-left));
    background: var(--page);                 /* solid: no blur needed, and none to pay for */
    animation: pageIn .44s var(--ease) both;
  }
  #reader.leaving { animation: pageOut .28s cubic-bezier(.4,0,1,1) both; }
  /* iOS 18+: the tapped row grows into the message (View Transitions); the
     slide above is the fallback. */
  #reader.vt, #reader.vt .wrap > * { animation: none; }
  ::view-transition-group(msg) { animation-duration: .42s; animation-timing-function: cubic-bezier(.2, .85, .25, 1); }
  ::view-transition-old(msg), ::view-transition-new(msg) { height: 100%; object-fit: cover; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; }
  #reader .wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  #reader .wrap > * { animation: rowIn .5s var(--ease) both; }
  #reader .wrap > :nth-child(2) { animation-delay: .06s; } #reader .wrap > :nth-child(3) { animation-delay: .12s; }
  #reader .wrap > :nth-child(4) { animation-delay: .18s; }
  .rtop { display: flex; align-items: center; gap: 8px; }
  .rtop .iconbtn { width: 38px; height: 38px; color: var(--text); }
  .rspace { flex: 1; }
  .pillbtn {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 15px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--glass); border: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi);
    transition: transform .18s var(--ease), background .2s;
  }
  .pillbtn:active { transform: scale(0.93); background: var(--glass-2); }
  .pillbtn.tagc { color: var(--tag); }
  .pillbtn.bluec { color: var(--accent); }
  .pillbtn[disabled] { opacity: 0.6; }
  .rhead { padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
  .rsubj { font-size: 21px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .rfrom { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .avatar {
    --h: 211; width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff;
    background: linear-gradient(135deg, hsl(var(--h) 85% 60%), hsl(calc(var(--h) + 40) 80% 46%));
    box-shadow: 0 4px 16px hsl(var(--h) 85% 50% / .38), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .rwho { display: flex; flex-direction: column; min-width: 0; font-size: 15px; }
  .rwho strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rmail { color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rwhen { margin-left: auto; color: var(--faint); font-size: 12px; text-align: right; flex: none; white-space: nowrap; }
  .rtags { display: flex; flex-wrap: wrap; gap: 6px; }
  .rtags:empty { display: none; }
  .rtags.flash .tchip:last-child { animation: pop .5s var(--ease); }
  .imgnote { display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 14px; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
  .imgnote svg { color: var(--faint); }
  .imgnote button {
    margin-left: auto; flex: none; padding: 6px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--accent); background: rgba(10,132,255,0.12); border: 1px solid rgba(10,132,255,0.28);
  }
  .rcount { font-size: 13px; color: var(--faint); margin-top: -6px; }
  .msg { overflow: hidden; }
  .mhead { display: flex; align-items: center; gap: 11px; width: 100%; min-width: 0; text-align: left; padding: 14px 16px; transition: background .2s; }
  .mhead:active { background: var(--fill); }
  .msg.folded .mhead { padding: 11px 16px; }
  .msg.folded .avatar { width: 32px; height: 32px; font-size: 14px; }
  .msg.unfold { animation: rowIn .4s var(--ease) both; }
  .mbody.html { margin: 0 8px 8px; border-radius: 14px; overflow: hidden; background: #fff; border: 1px solid var(--hair); }
  .mbody.rtext { padding: 2px 16px 18px; }
  .who .cnt { flex: none; font-size: 11px; font-weight: 600; color: var(--faint); padding: 1px 7px; border-radius: 999px; background: var(--fill); }
  .who .when { display: inline-flex; align-items: center; gap: 4px; }
  .who .when .clip { opacity: .75; }
  .rframe { display: block; width: 100%; height: 160px; border: 0; background: #fff; }
  .rtext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.6; color: var(--text); }
  .rtext a { color: var(--accent); }
  .rfoot { display: flex; justify-content: center; padding-top: 2px; }
  .rowtop { display: flex; align-items: stretch; gap: 10px; }
  .plink {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    color: var(--accent); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px;
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi), 0 4px 14px var(--lift);
    transition: transform .18s var(--ease);
  }
  .plink:active { transform: scale(0.94); }

  /* ---- the tag sheet ---- */
  #sheet { position: fixed; inset: 0; z-index: 40; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); animation: fadeIn .3s ease both; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 13px;
    padding: 10px 18px calc(env(safe-area-inset-bottom) + 18px);
    border-radius: 28px 28px 0 0; border: 1px solid var(--hair); border-bottom: 0;
    background: var(--sheet);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -14px 44px var(--lift-strong), inset 0 1px 0 var(--hi);
    animation: sheetUp .46s var(--ease) both;
  }
  #sheet.leaving .sheet { animation: sheetDown .28s cubic-bezier(.4,0,1,1) both; }
  /* drag a sheet down to close it, as on iOS */
  .sheet { touch-action: none; }
  .sheet input, .sheet textarea { touch-action: auto; }
  .sheet .grab { padding: 6px 0; margin: -6px auto; background-clip: content-box; }
  #sheet.leaving .scrim { animation: fadeOut .28s ease both; }
  .grab { width: 38px; height: 5px; border-radius: 99px; background: var(--grab); align-self: center; margin-bottom: 2px; }
  .sheet h3 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: -0.01em; }
  .sheet h3 .chip { font-size: 14px; vertical-align: 1px; max-width: none; }
  .sheet .note { margin: 0; }
  .tagpick { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet input[type=text] {
    width: 100%; padding: 12px 13px; border-radius: 13px; background: var(--fill);
    border: 1px solid var(--hair); outline: none; font-size: 16px; color: var(--text);
    transition: border-color .25s, box-shadow .25s;
  }
  .sheet input[type=text]:focus { border-color: rgba(10,132,255,0.7); box-shadow: 0 0 0 4px rgba(10,132,255,0.16); }

  @keyframes pageIn { from { transform: translateX(100%); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @keyframes pageOut { to { transform: translateX(100%); opacity: 0.4; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes sheetDown { to { transform: translateY(100%); } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ---- selecting, the way Mail does it ---- */
  .textbtn {
    height: 36px; padding: 0 14px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--accent);
    background: var(--glass); border: 1px solid var(--hair);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    box-shadow: inset 0 1px 0 var(--hi); transition: transform .18s var(--ease);
    animation: pop .3s var(--ease);
  }
  .textbtn:active { transform: scale(0.93); }
  #selall { font-weight: 500; }
  /* no text selection or iOS callout on a long press */
  ul.list > li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .check {
    position: absolute; left: 14px; top: 50%; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%;
    border: 2px solid var(--ring); pointer-events: none;
    opacity: 0; transform: translateX(-34px) scale(0.6);
    transition: opacity .25s ease, transform .4s var(--ease), background .2s, border-color .2s, box-shadow .3s;
  }
  #screen.selecting ul.list > li { padding-left: 52px; cursor: pointer; }
  #screen.selecting .check { opacity: 1; transform: none; }
  #screen.selecting .act { opacity: 0; transform: scale(0.5); width: 0; margin-left: -10px; pointer-events: none; }
  .act { transition: transform .2s var(--ease), background .2s, box-shadow .3s, opacity .25s, width .3s var(--ease), margin .3s var(--ease); }
  ul.list > li.sel { background: rgba(10,132,255,0.10); }
  li.sel .check { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(10,132,255,0.55); animation: pop .35s var(--ease); }
  li.sel .check::after {
    content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  #selbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    display: flex; align-items: center; gap: 10px; max-width: 560px; margin: 0 auto;
    padding: 12px max(18px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(18px, env(safe-area-inset-left));
    border-radius: 24px 24px 0 0; border: 1px solid var(--hair); border-bottom: 0;
    background: var(--sheet);
    backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -10px 36px var(--lift-strong), inset 0 1px 0 var(--hi);
    animation: sheetUp .42s var(--ease) both;
  }
  #selbar button {
    display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 999px;
    font-size: 15px; font-weight: 600; color: var(--accent); background: rgba(10,132,255,0.12);
    border: 1px solid rgba(10,132,255,0.26); transition: transform .18s var(--ease), opacity .2s;
  }
  #selbar button.danger { color: var(--danger); background: rgba(255,69,58,0.12); border-color: rgba(255,69,58,0.32); }
  #selbar button:active { transform: scale(0.93); }
  #selbar button[disabled] { opacity: 0.35; }
  #sel-count { flex: 1; text-align: center; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  body.selecting { padding-bottom: calc(env(safe-area-inset-bottom) + 96px); }

  /* ---- swipe right to tag ---- */
  ul.list > li[data-id] { touch-action: pan-y; }
  .rowtop { position: relative; z-index: 1; transition: transform .34s var(--ease); }
  .swipe {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; z-index: 0; overflow: hidden;
    display: flex; justify-content: flex-start;
    background: var(--swipe-track);
    transition: width .34s var(--ease), background .25s;
  }
  .sa.tagx { --tint: #7B6CF6; --ink: var(--tag-ink); }
  .sa.mktx { --tint: var(--flag-tint); --ink: var(--flag-ink); }
  .sa.inbx { --tint: var(--accent); --ink: var(--accent); }
  li.armed .sa.mktx, li.armed .sa.inbx { flex-basis: 0; padding: 0; overflow: hidden; }
  li.armed .sa.tagx { flex: 1 0 76px; }
  /* The glass icon the swipe actions share */
  .gi {
    width: 44px; height: 44px; border-radius: 999px; flex: none;
    display: inline-flex; align-items: center; justify-content: center; color: var(--ink);
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--gi-mix), transparent);
    border: 1px solid color-mix(in srgb, var(--tint) 42%, var(--gb-edge));
    box-shadow: inset 0 1px 0 var(--hi), 0 4px 12px var(--lift);
    transition: transform .3s var(--ease), background .25s, color .25s, width .3s var(--ease);
  }
  .gi svg { width: 21px; height: 21px; }
  /* all the way right: Tag stretches into a wide capsule, as Trash does on the left */
  li.armed .sa.tagx .gi {
    width: calc(100% - 28px); color: var(--armed-ink, var(--ink));
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--armed-mix), transparent);
  }
  li.swiped .swipe .gi { animation: pop .35s var(--ease); }
  li.peek .rowtop { animation: peekRow 1.6s var(--ease) .5s both; }
  li.peek .swipe { animation: peekUnder 1.6s var(--ease) .5s both; }
  @keyframes peekRow { 0%, 100% { transform: none; } 35%, 62% { transform: translateX(96px); } }
  @keyframes peekUnder { 0%, 100% { width: 0; } 35%, 62% { width: 108px; } }
  #screen.selecting .swipe, #screen.selecting .swipe-r { display: none; }

  /* ---- swipe left: Flag, Archive, Trash ---- */
  .swipe-r {
    position: absolute; right: 0; top: 0; bottom: 0; width: 0; z-index: 0; overflow: hidden;
    display: flex; justify-content: flex-end; transition: width .34s var(--ease);
  }
  .sa {
    flex: 0 0 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    color: var(--muted); font-size: 12px; font-weight: 600; transition: flex-basis .3s var(--ease), padding .3s var(--ease);
  }
  .swipe-r { background: var(--fill); }
  .sa:active .gi { transform: scale(0.9); }
  .sa.flag { --tint: var(--flag-tint); --ink: var(--flag-ink); }
  .sa.arch { --tint: var(--arch-tint); --ink: var(--arch-ink); }
  .sa.bin { --tint: var(--bin-tint); --ink: var(--bin-ink); }
  li.armed-l .sa.flag, li.armed-l .sa.arch { flex-basis: 0; padding: 0; overflow: hidden; }
  li.armed-l .sa.bin { flex: 1 0 76px; }
  /* all the way: Trash stretches into a wide glass capsule, as Mail's fills the row */
  li.armed-l .sa.bin .gi {
    width: calc(100% - 28px); color: var(--armed-ink, var(--ink));
    background: var(--gb-shine), color-mix(in srgb, var(--tint) var(--armed-mix-l), transparent);
  }
  li.armed-l .sa.bin svg { animation: pop .35s var(--ease); }
  .who .when .flagged { color: #FF9500; display: inline-flex; }
  .who .when .flagged svg { width: 13px; height: 13px; }

  /* ---- writing ---- */
  #compose {
    position: fixed; inset: 0; z-index: 22; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top) + 10px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(14px, env(safe-area-inset-left));
    background: var(--page); animation: sheetUp .44s var(--ease) both;
  }

<script>
"use strict";

// ---------------------------------------------------------------------------
// Configuration
// ---------------------------------------------------------------------------
// The app's OAuth client (Google Cloud -> Credentials -> Web application).
// Not a secret: it appears in every sign-in URL, and Google only hands tokens
// to the redirect URIs registered against it. Built in, it wins over anything
// a device has saved, so every device signs in with no setup and a bad copy
// pasted on one phone can't lock it out. Empty it to go back to per-device
// setup (e.g. to run a fork against your own client).
const BUILT_IN_CLIENT_ID = '804406956056-e91hbdndc4cqgerh9sffl9fmt76nfpua.apps.googleusercontent.com';

const API = 'https://gmail.googleapis.com/gmail/v1/users/me';
const AUTH = 'https://accounts.google.com/o/oauth2/v2/auth';
const SCOPES = [
  'https://www.googleapis.com/auth/gmail.modify',          // label, move, trash
  'https://www.googleapis.com/auth/gmail.settings.basic',  // the domain filters
];
const K = {
  clientId: 'mail.clientId', token: 'mail.token', state: 'mail.state',
  lastAuth: 'mail.lastAuth', days: 'mail.days', label: 'mail.label', swept: 'mail.swept',
  hint: 'mail.hint', silent: 'mail.silent', chips: 'mail.chips', swipeHint: 'mail.swipeHint', pending: 'mail.pending', unsubbed: 'mail.unsubbed', badge: 'mail.badge',
};
const SWEEP_EVERY = 6 * 3600e3;   // don't re-sweep on every open
const PAGE = 40;                  // conversations shown per list

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ls = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
};

async function pool(items, n, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

const chunks = (arr, n) => Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n));

function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.round(s / 60) + 'm';
  if (s < 86400) return Math.round(s / 3600) + 'h';
  if (s < 86400 * 7) return Math.round(s / 86400) + 'd';
  return new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

const settings = {
  get days() { const n = parseInt(ls.get(K.days, '3'), 10); return Number.isFinite(n) && n >= 1 && n <= 30 ? n : 3; },
  set days(v) { ls.set(K.days, String(v)); },
  get label() { return ls.get(K.label, 'Marketing') || 'Marketing'; },
  set label(v) { ls.set(K.label, v); },
};

// A client ID is only letters, digits, dots and dashes. Copying one through
// Messages, Notes or an email can add characters that can't be seen - a
// zero-width or non-breaking space - and Google then answers "invalid_client:
// the OAuth client was not found". Keeping only the legal characters also
// repairs a bad copy already saved on a device.
const cleanClientId = raw => String(raw || '').replace(/[^A-Za-z0-9.\-]/g, '');
const clientId = () => cleanClientId(BUILT_IN_CLIENT_ID || ls.get(K.clientId, ''));

// Says what is wrong with a pasted value, or nothing when it looks right.
function clientIdProblem(id) {
  if (!id) return 'Paste the client ID first.';
  if (/^GOCSPX/i.test(id)) return 'That is the client secret. Paste the Client ID from the same page - it ends in .apps.googleusercontent.com.';
  if (!/\.apps\.googleusercontent\.com$/.test(id)) return 'A client ID ends in .apps.googleusercontent.com. This one does not, so it was probably cut short while copying.';
  return null;
}

// ---------------------------------------------------------------------------
// Sign-in: OAuth 2.0 implicit flow, by full-page redirect
// ---------------------------------------------------------------------------
class AuthError extends Error {}
// Gmail allows each user so many "quota units" a minute. Past that it answers
// 429 (or 403 rateLimitExceeded) until the minute rolls over, so hammering it
// with quick retries only digs deeper. One short retry, then a pause.
class QuotaError extends Error {}
const COOLDOWN = Number(localStorage.getItem('mail.cooldown')) || 60000;   // (the tests shorten this)
let slowUntil = 0;
const slowed = () => Date.now() < slowUntil;

function redirectUri() {
  return location.origin + location.pathname.replace(/index\.html$/, '');
}

function getToken() {
  try {
    const o = JSON.parse(ls.get(K.token, 'null'));
    if (o && o.exp > Date.now()) return o;
  } catch {}
  return null;
}

const canFilter = () => (getToken()?.scope || '').includes('gmail.settings.basic');

// Google gives a browser-only app an access token for an hour and no way to
// renew it in the background. So when it runs out the app goes back through
// Google - silently: prompt=none makes Google answer at once with a token, or
// with interaction_required if it can't, and never shows a screen. login_hint
// names the account, so having several signed in doesn't bring up a chooser.
function signIn(opts = {}) {
  const id = clientId();
  if (!id) return;
  const hint = ls.get(K.hint, '');
  const nonce = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
  // localStorage, not sessionStorage: on iOS the trip through Google can come
  // back in a fresh page context and a lost nonce would look like tampering.
  ls.set(K.state, nonce);
  ls.set(K.lastAuth, String(Date.now()));
  const u = new URL(AUTH);
  u.search = new URLSearchParams({
    client_id: id,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: SCOPES.join(' '),
    include_granted_scopes: 'true',
    state: nonce,
    ...(opts.chooseAccount ? { prompt: 'select_account' } : hint ? { login_hint: hint } : {}),
    ...(opts.silent && !opts.chooseAccount ? { prompt: 'none' } : {}),
  });
  if (opts.silent) ls.set(K.silent, '1'); else ls.del(K.silent);
  location.href = u.toString();
}

function signOut() {
  ls.del(K.token); ls.del(K.state); ls.del(K.lastAuth);
  state.me = null;
  render();
}

// Reads #access_token=... off the URL, then puts the URL back how it was.
function consumeRedirect() {
  const raw = location.hash.slice(1);
  if (!raw || !/(^|&)(access_token|error)=/.test(raw)) return null;
  const p = new URLSearchParams(raw);
  history.replaceState(null, '', redirectUri() + location.search);
  const want = ls.get(K.state, '');
  const silent = ls.get(K.silent, '') === '1';
  ls.del(K.state); ls.del(K.silent);
  if (p.get('error')) return { error: p.get('error'), silent };
  if (!want || p.get('state') !== want) return { error: 'state_mismatch' };
  const life = parseInt(p.get('expires_in') || '3600', 10);
  ls.set(K.token, JSON.stringify({
    t: p.get('access_token'),
    exp: Date.now() + life * 1000 - 60e3,
    scope: p.get('scope') || '',
  }));
  return { ok: true };
}

// ---------------------------------------------------------------------------
// Gmail
// ---------------------------------------------------------------------------
// No request may wait forever. On a phone a reply can simply never arrive -
// the network drops, the app is backgrounded - and a fetch left waiting keeps
// whatever is watching it spinning for good. (mail.timeout only shortens this
// for the tests.)
const TIMEOUT = Number(ls.get('mail.timeout', '')) || 20000;

// once: for requests that create something. If the answer is lost the thing
// may have been made anyway, so they are never sent twice blindly; the caller
// looks for it instead.
async function api(path, { method = 'GET', body, params, tries = 0, once = false } = {}) {
  const tok = getToken();
  if (!tok) throw new AuthError('signed out');
  if (slowed()) throw new QuotaError('Gmail asked the app to slow down for a minute');   // nothing more until the pause is over
  const url = new URL(API + path);
  for (const [k, v] of Object.entries(params || {})) {
    if (v == null) continue;
    for (const one of Array.isArray(v) ? v : [v]) url.searchParams.append(k, one);
  }
  const again = () => api(path, { method, body, params, tries: tries + 1, once });
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), TIMEOUT);
  let res, text;
  try {
    res = await fetch(url, {
      method,
      headers: { Authorization: 'Bearer ' + tok.t, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
      signal: ctl.signal,
    });
    text = await res.text();
    clearTimeout(timer);
  } catch (e) {
    clearTimeout(timer);
    if (!once && tries < 3) { await sleep(500 * 2 ** tries); return again(); }
    throw new Error(ctl.signal.aborted ? 'Gmail took too long to answer' : 'No connection to Gmail');
  }
  if (res.status === 401) { ls.del(K.token); throw new AuthError('token expired'); }
  if (!res.ok) {
    const quota = res.status === 429 || (res.status === 403 && /rate ?limit|quota/i.test(text));
    if (quota) {
      if (tries < 1) { await sleep(1500 + Math.random() * 1000); return again(); }
      slowUntil = Date.now() + COOLDOWN;
      throw new QuotaError('Gmail asked the app to slow down for a minute');
    }
    if (res.status >= 500 && tries < 3) { await sleep(600 * 2 ** tries + Math.random() * 300); return again(); }
    let msg = text.slice(0, 200);
    try { msg = JSON.parse(text).error.message; } catch {}
    const err = new Error(msg || ('Gmail returned ' + res.status));
    err.status = res.status;
    throw err;
  }
  return text ? JSON.parse(text) : null;
}

// ---------------------------------------------------------------------------
// Labels
// ---------------------------------------------------------------------------
// Every label in the mailbox, fetched once and refreshed whenever one is made.
// Rows, chips and rules read this copy, so drawing them never waits on Gmail.
let labelsPromise = null;
const labelsById = new Map();

async function refreshLabels(force) {
  if (force || !labelsPromise) {
    labelsPromise = api('/labels').then(r => r.labels || []).catch(e => { labelsPromise = null; throw e; });
  }
  const all = await labelsPromise;
  labelsById.clear();
  for (const l of all) labelsById.set(l.id, l);
  return all;
}

async function labelNamed(name, { create = false } = {}) {
  const want = name.trim().toLowerCase();
  const found = (await refreshLabels()).find(l => l.name.toLowerCase() === want);
  if (found || !create) return found || null;
  try {
    const made = await api('/labels', {
      method: 'POST', once: true,
      body: { name: name.trim(), labelListVisibility: 'labelShow', messageListVisibility: 'show' },
    });
    await refreshLabels(true);
    return made;
  } catch (e) {
    if (e instanceof AuthError) throw e;
    // Made after all, with the answer lost - or made meanwhile (409).
    const now = (await refreshLabels(true)).find(l => l.name.toLowerCase() === want);
    if (now) return now;
    throw e;
  }
}

const bucketLabel = () => labelNamed(settings.label, { create: true });
const bucketId = () => [...labelsById.values()].find(l => l.name.toLowerCase() === settings.label.toLowerCase())?.id || null;

const byName = (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });

// Every label you (or an app) made, apart from the Marketing bucket.
function userLabels() {
  const bucket = settings.label.toLowerCase();
  return [...labelsById.values()].filter(l => l.type === 'user' && l.name.toLowerCase() !== bucket && !isReminderLabel(l)).sort(byName);
}

// Labels other mail apps and services leave in Gmail. They are never offered
// as tags. Two are kept even from the one-tap clean-up, because something
// still reads them.
const LEFTOVERS = [
  [/^\[imap\]/i, 'an old IMAP mail app'],
  [/^\[mailbox\]/i, 'Dropbox’s Mailbox app, closed in 2016'],
  [/^\[gmail\]/i, 'a mail app that mis-named a folder'],
  [/^(deleted|sent) messages$/i, 'a mail app that mis-named a folder'],
  [/^notes$/i, 'iPhone Notes', 'Kept: iPhone Notes stores your notes here when it syncs with Gmail.'],
  [/^unroll\.me/i, 'Unroll.me', 'Kept: Unroll.me files the mail it unsubscribed you from here.'],
];
function leftover(l) {
  for (const [re, who, keep] of LEFTOVERS) if (re.test(l.name)) return { who, keep: keep || null };
  return null;
}

// Labels that can be tags: yours, not another app's.
const tags = () => userLabels().filter(l => !leftover(l));

// Filters, kept alongside the labels: a label with a rule is a tag in use.
let filtersCache = null;
async function refreshFilters(force) {
  if (!canFilter()) return (filtersCache = []);
  if (force || !filtersCache) filtersCache = (await api('/settings/filters')).filter || [];
  return filtersCache;
}

// Your choice, per device, to show or hide a label as a chip.
function chipPrefs() { try { return JSON.parse(ls.get(K.chips, '{}')) || {}; } catch { return {}; } }
function setChipPref(id, show) {
  const p = chipPrefs();
  if (show == null) delete p[id]; else p[id] = show;
  ls.set(K.chips, JSON.stringify(p));
}

// The chips: tags that have a rule, plus any label you switched on - never,
// unless you ask, a leftover from another app.
// Flagged is Gmail's STARRED, always offered first, the way Mail lists Flagged.
const FLAGGED = { id: 'STARRED', name: 'Flagged', type: 'flag' };
function chipTags() {
  const p = chipPrefs();
  const ruled = new Set((filtersCache || []).flatMap(f => f.action?.addLabelIds || []));
  return userLabels().filter(l => p[l.id] ?? (!leftover(l) && ruled.has(l.id)));
}

// A tag keeps one colour everywhere, picked from its name.
const HUES = [211, 187, 145, 48, 28, 340, 280, 250];
function hue(s) {
  let h = 0;
  for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return HUES[h % HUES.length];
}

// ---------------------------------------------------------------------------
// Listing
// ---------------------------------------------------------------------------
// A label is matched by id, never by name inside the search: a name such as
// "Sofia's school" needs quoting that Gmail's search is fussy about, while an
// id is exact.
async function page(q, { labelIds, pageToken, max = PAGE } = {}) {
  const r = await api('/messages', { params: { q: q || undefined, labelIds, maxResults: max, pageToken } });
  return { ids: (r.messages || []).map(m => m.id), next: r.nextPageToken || null };
}

async function allIds(q, { labelIds, cap = 500 } = {}) {
  const ids = [];
  let pageToken;
  do {
    const r = await page(q, { labelIds, pageToken, max: Math.min(500, cap - ids.length) });
    ids.push(...r.ids);
    pageToken = r.next;
  } while (pageToken && ids.length < cap);
  return ids;
}

function parseFrom(header) {
  const m = /^\s*(?:"?([^"<]*?)"?\s*)?<?([^\s<>]+@[^\s<>]+?)>?\s*$/.exec(header || '');
  const email = (m ? m[2] : '').toLowerCase();
  const name = (m && m[1] ? m[1] : '').trim() || email.split('@')[0] || 'Unknown';
  return { name, email, host: email.split('@')[1] || '' };
}

// Gmail sends snippets HTML-escaped ("don&#39;t"); DOMParser turns them back
// into plain text without running or loading anything.
const unescapeHtml = s => new DOMParser().parseFromString('<!doctype html><body>' + s, 'text/html').body.textContent || '';

const hdr = (m, name) => headerOf(m?.payload, name);
const hdrAll = (m, name) => (m?.payload?.headers || []).filter(h => h.name.toLowerCase() === name).map(h => h.value || '');

// A page of conversations - Gmail's threads - newest first.
async function threadPage(q, { labelIds, pageToken, max = PAGE } = {}) {
  const r = await api('/threads', { params: { q: q || undefined, labelIds, maxResults: max, pageToken } });
  const threads = r.threads || [];
  return { ids: threads.map(t => t.id), hist: new Map(threads.map(t => [t.id, t.historyId])), next: r.nextPageToken || null };
}

// Rows already built, by conversation, with the historyId they were built at.
// A list reload asks Gmail only for conversations whose historyId has moved on:
// a refresh with nothing new costs one list call instead of forty. Kept in
// memory for this visit only - nothing about your mail is stored on the phone.
const rowCache = new Map();
const ROW_CACHE_MAX = 1500;

// One row per conversation, as Mail shows it: the newest message's time and
// text, the other person's name (not yours, when you replied last), how many
// messages it holds, and every label any of them carries. Messages in the
// Trash don't count.
async function hydrate(ids, hist) {
  const known = new Map(), need = [];
  for (const id of ids) {
    const c = rowCache.get(id);
    if (c && hist?.get(id) && c.historyId === hist.get(id)) known.set(id, c.item);
    else need.push(id);
  }
  let stop = null;
  const got = await pool(need, 4, id => api('/threads/' + id, {
    params: { format: 'metadata', metadataHeaders: ['From', 'Subject', 'Date', 'Content-Type'] },
  }).catch(e => { if (e instanceof QuotaError || e instanceof AuthError) stop = e; return null; }));
  if (stop) throw stop;                             // a half-drawn list would look like mail had gone
  for (const t of got) {
    const item = t && buildRow(t);
    if (!item) continue;
    rowCache.delete(t.id);
    rowCache.set(t.id, { historyId: t.historyId || hist?.get(t.id), item });
    if (rowCache.size > ROW_CACHE_MAX) rowCache.delete(rowCache.keys().next().value);
    known.set(t.id, item);
  }
  return ids.map(id => known.get(id)).filter(Boolean);
}

function buildRow(t) {
  const live = (t.messages || []).filter(m => !(m.labelIds || []).includes('TRASH'));
  const msgs = live.length ? live : t.messages || [];
  if (!msgs.length) return null;
  const last = msgs[msgs.length - 1];
  const them = [...msgs].reverse().find(m => !(m.labelIds || []).includes('SENT')) || last;
  return {
    id: t.id, threadId: t.id, msgId: last.id, count: msgs.length,
    snippet: unescapeHtml(last.snippet || ''),
    subject: hdr(msgs[0], 'subject') || hdr(last, 'subject') || '(no subject)',
    date: Number(last.internalDate) || Date.parse(hdr(last, 'date')) || Date.now(),
    labelIds: [...new Set(msgs.flatMap(m => m.labelIds || []))],
    attach: msgs.some(m => /multipart\/mixed/i.test(hdr(m, 'content-type'))),
    get unread() { return this.labelIds.includes('UNREAD'); },
    ...parseFrom(hdr(them, 'from')),
  };
}

// ---------------------------------------------------------------------------
// Reading a message
// ---------------------------------------------------------------------------
function findPart(node, type) {
  if (!node) return null;
  if (node.mimeType === type && (node.body?.data || node.body?.attachmentId)) return node;
  for (const part of node.parts || []) {
    const hit = findPart(part, type);
    if (hit) return hit;
  }
  return null;
}

const headerOf = (node, name) => (node?.headers || []).find(h => h.name.toLowerCase() === name)?.value || '';

// A body part as text, in the character set the part says it is in. Large
// parts come as an attachment id rather than inline.
async function partText(msgId, part) {
  let data = part.body.data;
  if (!data) data = (await api('/messages/' + msgId + '/attachments/' + part.body.attachmentId)).data || '';
  const bin = atob(data.replace(/-/g, '+').replace(/_/g, '/'));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const charset = (/charset="?([^";\s]+)/i.exec(headerOf(part, 'content-type')) || [])[1] || 'utf-8';
  try { return new TextDecoder(charset).decode(bytes); } catch { return new TextDecoder().decode(bytes); }
}

// Every message in a conversation, oldest first: who, when, the text in
// both forms, and the files attached.
async function fetchThread(item) {
  const t = await api('/threads/' + item.threadId, { params: { format: 'full' } });
  const live = (t.messages || []).filter(m => !(m.labelIds || []).includes('TRASH'));
  return Promise.all((live.length ? live : t.messages || []).map(async m => {
    const html = findPart(m.payload, 'text/html'), text = findPart(m.payload, 'text/plain');
    return {
      id: m.id, labelIds: m.labelIds || [],
      date: Number(m.internalDate) || Date.parse(hdr(m, 'date')) || 0,
      from: parseFrom(hdr(m, 'from')), to: hdr(m, 'to'), cc: hdr(m, 'cc'), replyTo: hdr(m, 'reply-to'),
      subject: hdr(m, 'subject'), messageId: hdr(m, 'message-id'), references: hdr(m, 'references'),
      snippet: unescapeHtml(m.snippet || ''),
      html: html ? await partText(m.id, html) : null,
      text: text ? await partText(m.id, text) : null,
      files: attachmentsOf(m.payload),
      unsub: unsubOf(m),
    };
  }));
}

// A mailing list's way out (List-Unsubscribe): a one-click web address
// (List-Unsubscribe-Post), an email address, or a page to finish on.
function unsubOf(m) {
  const raw = hdr(m, 'list-unsubscribe');
  if (!raw) return null;
  const uris = [...raw.matchAll(/<\s*([^>]+?)\s*>/g)].map(x => x[1].trim());
  const https = uris.find(u => /^https:\/\/[^\s]+$/i.test(u)) || null;
  const mailto = uris.find(u => /^mailto:[^\s]+$/i.test(u)) || null;
  if (!https && !mailto) return null;
  const from = parseFrom(hdr(m, 'from'));
  return {
    https, mailto, email: from.email,
    oneClick: !!https && /list-unsubscribe\s*=\s*one-click/i.test(hdr(m, 'list-unsubscribe-post')),
    trusted: !(m.labelIds || []).includes('SPAM') && authentic(m, from),
  };
}

// Whether Gmail itself vouched that the mail is from the domain it names:
// DMARC, or a DKIM signature, passing for the From domain. Only Gmail's own
// verdict counts - the topmost Authentication-Results, from mx.google.com - as
// a sender can write one of its own further down. Unsubscribing from a sender
// that fails this would only tell a spammer the address works.
function authentic(m, from) {
  const dom = baseDomain(from.host);
  const ar = hdrAll(m, 'authentication-results')[0] || '';
  if (!dom || !/^\s*mx\.google\.com\s*;/i.test(ar)) return false;
  for (const part of ar.split(';')) {
    const dmarc = /\bdmarc=pass\b[\s\S]*?\bheader\.from=([^\s;]+)/i.exec(part);
    if (dmarc && baseDomain(dmarc[1]) === dom) return true;
    const dkim = /\bdkim=pass\b[\s\S]*?\bheader\.(?:i|d)=@?([^\s;]+)/i.exec(part);
    if (dkim && baseDomain(dkim[1].replace(/^.*@/, '')) === dom) return true;
  }
  return false;
}

// Files attached to a message, wherever they sit in its MIME tree.
function attachmentsOf(node, out = []) {
  if (!node) return out;
  if (node.filename && node.body?.attachmentId) {
    out.push({ name: node.filename, type: node.mimeType || 'application/octet-stream', size: node.body.size || 0, attId: node.body.attachmentId });
  }
  for (const part of node.parts || []) attachmentsOf(part, out);
  return out;
}

// The message as a page of its own, inside a sandboxed frame. The sandbox has
// no allow-scripts, so nothing in the mail can run, and the frame's policy lets
// it load nothing from the network - so images, and the tracking pixels among
// them, stay dark until "Show" is tapped. allow-same-origin without scripts
// only lets this page measure the frame to size it.
function emailDoc(html, images) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  for (const n of doc.querySelectorAll('script, noscript, meta, link, base, title, iframe, frame, frameset, object, embed, applet, form')) n.remove();
  for (const el of doc.querySelectorAll('*')) {
    for (const a of [...el.attributes]) if (/^on|^ping$/i.test(a.name)) el.removeAttribute(a.name);
  }
  for (const a of doc.querySelectorAll('a[href]')) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
  const policy = "default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:" + (images ? ' https: http:' : '');
  const bodyAttrs = [...(doc.body?.attributes || [])].map(a => ' ' + a.name + '="' + esc(a.value) + '"').join('');
  return '<!doctype html><html><head><meta charset="utf-8">' +
    '<meta http-equiv="Content-Security-Policy" content="' + policy + '">' +
    '<meta http-equiv="x-dns-prefetch-control" content="off">' +
    '<meta name="referrer" content="no-referrer">' +
    '<style>html{-webkit-text-size-adjust:100%;overflow:hidden}body{margin:0;padding:14px;background:#fff;color:#1c1c1e;' +
    'font:15px/1.5 -apple-system,system-ui,sans-serif;overflow-wrap:break-word}img{max-width:100%;height:auto}a{color:#0a63d8}</style>' +
    (doc.head?.innerHTML || '') + '</head><body' + bodyAttrs + '>' + (doc.body?.innerHTML || '') + '</body></html>';
}

// Whether the mail asks for anything from the network - worth offering "Show".
const wantsImages = html => /(?:src|background|srcset)\s*=\s*["']?\s*https?:|url\(\s*["']?\s*https?:/i.test(html);

function tidy(text) {
  return text
    .replace(/\r/g, '')
    .replace(/[ \t ​]+/g, ' ')
    .replace(/ ?\n ?/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// Plain text with its web addresses made tappable. Matched on the raw text and
// escaped piece by piece, so an address can never break out of its tag.
function linkify(text) {
  const re = /\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]]/g;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index)) + '<a href="' + esc(m[0]) + '" target="_blank" rel="noopener noreferrer">' + esc(m[0]) + '</a>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

// Emails are laid out for a column about 600px wide. One wider than the screen
// is scaled down to fit, the way Mail does, and the frame is made as tall as
// the message so the page scrolls rather than the frame.
function fitFrame(frame) {
  const doc = frame.contentDocument, root = doc?.documentElement, body = doc?.body;
  if (!root || !body || !frame.isConnected || !frame.clientWidth) return;
  body.style.transform = '';
  const scale = Math.min(1, frame.clientWidth / Math.max(1, root.scrollWidth));
  if (scale < 1) { body.style.transformOrigin = '0 0'; body.style.transform = 'scale(' + scale + ')'; }
  frame.style.height = Math.ceil(root.scrollHeight * scale) + 'px';
}

const fullDate = ms => new Date(ms).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });

// ---------------------------------------------------------------------------
// Which senders a rule may cover
// ---------------------------------------------------------------------------
// Two-part public suffixes, so a rule on bbc.co.uk is not written as co.uk.
const SUFFIX2 = new Set(('co.uk org.uk ac.uk gov.uk me.uk net.uk sch.uk ltd.uk plc.uk com.au net.au org.au edu.au gov.au ' +
  'co.nz net.nz org.nz co.za org.za com.br com.mx com.ar com.co co.jp ne.jp or.jp co.in net.in org.in com.sg com.hk ' +
  'com.tw com.tr com.ua com.pl com.vn com.my com.ph co.kr co.th co.id co.il com.cn net.cn org.cn com.es com.pt').split(' '));

// Shared mailbox providers: a rule on these would swallow personal mail, so
// those senders get a rule on the exact address instead.
const SHARED = new Set(('gmail.com googlemail.com outlook.com hotmail.com live.com msn.com yahoo.com ymail.com rocketmail.com ' +
  'aol.com icloud.com me.com mac.com protonmail.com proton.me pm.me gmx.com gmx.net gmx.de mail.com zoho.com fastmail.com ' +
  'hey.com duck.com qq.com 163.com 126.com naver.com daum.net yandex.com yandex.ru mail.ru tutanota.com hushmail.com ' +
  'web.de t-online.de free.fr orange.fr laposte.net sky.com btinternet.com virginmedia.com talktalk.net ntlworld.com ' +
  'blueyonder.co.uk comcast.net verizon.net att.net sbcglobal.net cox.net charter.net shaw.ca rogers.com bell.net ' +
  'bigpond.com optusnet.com.au xtra.co.nz').split(' '));

function baseDomain(host) {
  const parts = String(host || '').toLowerCase().split('.').filter(Boolean);
  if (parts.length <= 2) return parts.join('.');
  return SUFFIX2.has(parts.slice(-2).join('.')) ? parts.slice(-3).join('.') : parts.slice(-2).join('.');
}

function isShared(domain) {
  return SHARED.has(domain) || /^(yahoo|gmx|yandex|outlook|hotmail|live|aol)\./.test(domain);
}

// What one tap should cover: the whole domain, or just this sender.
function ruleFor(item) {
  const domain = baseDomain(item.host);
  if (!domain || isShared(domain)) return { kind: 'sender', match: item.email, label: item.email };
  return { kind: 'domain', match: domain, label: domain };
}

// A rule typed into the Rules tab: a domain such as tmsa.org, or one address.
function ruleFromText(raw) {
  const t = String(raw || '').trim().toLowerCase().replace(/^mailto:/, '').replace(/^@/, '');
  if (/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/.test(t)) return { kind: 'sender', match: t, label: t };
  if (/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(t)) {
    const d = baseDomain(t);
    if (isShared(d)) return { error: d + ' is shared by millions of people, so a rule on it would catch everyone. Enter the full address instead, like name@' + d + '.' };
    return { kind: 'domain', match: d, label: d };
  }
  return { error: 'Enter a domain like tmsa.org, or an address like office@tmsa.org.' };
}

// Whether a message is one a rule covers - used to update rows already on
// screen without asking Gmail again.
function covers(rule, it) {
  return rule.kind === 'sender' ? it.email === rule.match : it.host === rule.match || it.host.endsWith('.' + rule.match);
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
async function relabel(ids, add = [], remove = []) {
  if (!ids.length || (!add.length && !remove.length)) return;
  for (const part of chunks(ids, 500)) {
    await api('/messages/batchModify', {
      method: 'POST',
      body: { ids: part, ...(add.length && { addLabelIds: add }), ...(remove.length && { removeLabelIds: remove }) },
    });
  }
}

async function relabelThread(threadId, add = [], remove = []) {
  if (!add.length && !remove.length) return;
  await api('/threads/' + threadId + '/modify', {
    method: 'POST',
    body: { ...(add.length && { addLabelIds: add }), ...(remove.length && { removeLabelIds: remove }) },
  });
}

// Puts everything from one sender or domain under a label: this conversation
// now, all new mail through a Gmail filter, and the mail already here. With
// skipInbox it also leaves the inbox - that is the Marketing bucket - while a
// tag leaves mail where it is. Returns what Undo needs to put it all back.
async function applyRule(rule, labelName, { skipInbox = false, item = null } = {}) {
  const label = await labelNamed(labelName, { create: true });
  const add = [label.id], remove = skipInbox ? ['INBOX'] : [];
  const back = {
    rule, skipInbox, label: label.id, labelName: label.name, filterId: null,
    threadId: item?.threadId || null,
    threadInInbox: !!item?.labelIds.includes('INBOX'),
    threadHadLabel: !!item?.labelIds.includes(label.id),
    added: [], leftInbox: [],
  };

  if (item) await relabelThread(item.threadId, add, remove);

  if (canFilter()) {
    try {
      const isSame = f => (f.criteria?.from || '').toLowerCase() === rule.match && (f.action?.addLabelIds || []).includes(label.id);
      if (!(await refreshFilters(true)).some(isSame)) {
        try {
          const made = await api('/settings/filters', {
            method: 'POST', once: true,
            body: { criteria: { from: rule.match }, action: { addLabelIds: add, ...(remove.length && { removeLabelIds: remove }) } },
          });
          back.filterId = made.id;
          filtersCache.push(made);
        } catch (e) {
          if (e instanceof AuthError) throw e;
          const now = (await refreshFilters(true)).find(isSame);   // made after all?
          if (!now) throw e;
          back.filterId = now.id;
        }
      }
    } catch (e) {
      toast('Done, but the rule for new mail failed: ' + e.message, { bad: true });
    }
  }

  // The mail already here is done in the background, so what's on screen
  // never waits on a whole mailbox's worth of it. back.done settles when it's
  // finished; Undo waits for it.
  back.done = backfill(back, rule, add, remove);
  back.done.catch(() => {});        // reported by whoever watches it
  state.rules = null;
  return back;
}

// What had the label before is left alone, so Undo only takes off what this added.
async function backfill(back, rule, add, remove) {
  const q = 'from:(' + rule.match + ') -in:sent -in:chats';
  const [all, had, inInbox] = await Promise.all([
    allIds(q, { cap: 800 }),
    allIds(q, { labelIds: [back.label], cap: 800 }),
    back.skipInbox ? allIds(q + ' in:inbox', { cap: 800 }) : [],
  ]);
  const hadSet = new Set(had);
  back.added = all.filter(id => !hadSet.has(id));
  back.leftInbox = inInbox;
  await relabel(back.added, add, remove);
  await relabel(inInbox.filter(id => hadSet.has(id)), [], remove);
  state.rules = null;
  return back;
}

// When the older mail is done, the toast says how much and offers Undo. If it
// fails part-way, say so and show what Gmail really has.
function finish(back, say, then) {
  back.done
    .then(() => { toast(say(back.added.length + (back.threadId ? 1 : 0)), { label: 'Undo', action: () => undo(back) }); if (then) then(); })
    .catch(err => { failed(err); state.lists = {}; go({ force: true }); });
}

async function undoRule(back) {
  if (back.threadId) {
    await relabelThread(back.threadId,
      back.skipInbox && back.threadInInbox ? ['INBOX'] : [],
      back.threadHadLabel ? [] : [back.label]);
  }
  await relabel(back.leftInbox, ['INBOX']);
  await relabel(back.added, [], [back.label]);
  if (back.filterId) {
    try { await api('/settings/filters/' + back.filterId, { method: 'DELETE' }); } catch {}
    if (filtersCache) filtersCache = filtersCache.filter(f => f.id !== back.filterId);
  }
  state.rules = null;
}

// Deletes labels from Gmail - rules first, so no filter points at nothing.
// The emails keep everything else; only the label comes off them.
async function removeLabels(list) {
  const filters = await refreshFilters(true);
  for (const l of list) {
    for (const f of filters.filter(f => (f.action?.addLabelIds || []).includes(l.id))) {
      await api('/settings/filters/' + f.id, { method: 'DELETE' });
    }
    await api('/labels/' + l.id, { method: 'DELETE' });
    setChipPref(l.id, null);
  }
  filtersCache = null;
  labelsPromise = null;
  chipSig = null;
  state.lists = {};
  if (state.tag && list.some(l => l.id === state.tag)) state.tag = null;
  await Promise.all([refreshLabels(true), refreshFilters(true)]);
}

const bucket = item => applyRule(ruleFor(item), settings.label, { skipInbox: true, item });
const tagSender = (item, name) => applyRule(ruleFor(item), name, { item });

// One conversation back to the inbox, leaving the rule alone.
async function unbucket(item) {
  const label = await bucketLabel();
  await relabelThread(item.threadId, ['INBOX'], [label.id]);
  return label.id;
}

// Opening a message is reading it: Gmail marks it read, and so does the list.
async function markRead(item) {
  if (!item.unread) return false;
  try {
    await relabelThread(item.threadId, [], ['UNREAD']);
    patch(it => it.threadId === item.threadId, [], ['UNREAD']);
    for (const list of Object.values(state.lists)) for (const it of list.items || []) if (it.threadId === item.threadId) it.fading = true;
    item.fading = true;
    updateBadge();
    if (!item.labelIds.includes('UNREAD')) return true;
    item.labelIds = item.labelIds.filter(l => l !== 'UNREAD');
    return true;
  } catch { return false; }
}

// Everything in the bucket older than the cut-off goes to the Trash, which
// Gmail empties for good after 30 days.
async function sweep() {
  const label = await labelNamed(settings.label);
  let done = 0;
  if (label) {
    const ids = await allIds('older_than:' + settings.days + 'd', { labelIds: [label.id], cap: 1000 });
    await pool(ids, 5, async id => {
      try { await api('/messages/' + id + '/trash', { method: 'POST' }); done++; } catch {}
    });
  }
  ls.set(K.swept, String(Date.now()));
  return done;
}

  rules: null, rulesError: null,

};
