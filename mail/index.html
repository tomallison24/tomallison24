  .fext {
    flex: none; width: 34px; height: 40px; border-radius: 8px; display: inline-flex; align-items: flex-end; justify-content: center;
    padding-bottom: 5px; font-size: 9.5px; font-weight: 800; letter-spacing: .02em; color: #fff;
    background: linear-gradient(160deg, hsl(var(--h) 75% 58%), hsl(var(--h) 70% 44%));
  }
  .fmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fname { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsize { font-size: 12.5px; color: var(--faint); }
  .fsize.lost { color: var(--danger); }
  .fx { flex: none; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); font-size: 20px; }
  .fx:active { background: var(--fill); }
  .cfiles { display: flex; flex-direction: column; gap: 8px; padding: 0 12px 12px; }
  .cfiles:empty { display: none; }
  .cattach { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--hair-2); color: var(--accent); font-size: 15px; font-weight: 600; }
  .cattach svg { width: 18px; height: 18px; }
  .fprev { display: block; max-width: 100%; max-height: 46vh; margin: 0 auto; border-radius: 14px; object-fit: contain; }
  .fwait { text-align: center; color: var(--faint); font-size: 14px; padding: 18px 0; }
  a.btn { display: flex; align-items: center; justify-content: center; text-decoration: none; }

  /* ---- the message page's toolbar ---- */
  /* As in iOS Mail: no bar, just frosted-glass capsules floating over the
     message - Trash, Archive and Flag on the left, Reply and New on the right. */
  .rbar {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px); z-index: 21;   /* just above the message page */
    max-width: 708px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
    display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none;
  }
  .rgroup {
    display: inline-flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; pointer-events: auto;
    background: var(--gb-shine), var(--glass); border: 1px solid var(--gb-edge);
    backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--hi), 0 10px 30px var(--lift-strong);
    animation: pop .4s var(--ease) both;
  }
  .rbar { transition: opacity .2s ease; }
  .rbar.leaving { opacity: 0; pointer-events: none; }
  .rbar.leaving .rgroup { pointer-events: none; }
  .rb {
    width: 50px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--icon); transition: transform .18s var(--ease), background .2s;
  }
  .rb:active { transform: scale(0.9); background: var(--fill); }
  .rb.on { color: #FF9500; }
  .rb.on svg { animation: pop .35s var(--ease); }
  #selbar #sel-archive { padding: 0 12px; }

  /* ---- the Tags page ---- */
  .card h2.gh { flex-wrap: wrap; }
  .gtools { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
  .gtools .act { width: 36px; height: 36px; border-radius: 12px; }
  .mini {
    display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; color: var(--faint); background: var(--fill); border: 1px solid var(--hair);
    transition: color .2s, background .2s, border-color .2s, transform .18s var(--ease);
  }
  .mini.on { color: var(--accent); background: rgba(10,132,255,0.12); border-color: rgba(10,132,255,0.3); }
  .mini:active { transform: scale(0.93); }
  .kept { align-self: center; flex: none; font-size: 11px; font-weight: 600; color: var(--faint); padding: 4px 9px; border-radius: 999px; border: 1px solid var(--hair); }
  .cnote { margin: -2px 16px 8px; font-size: 12px; line-height: 1.5; color: var(--faint); }
  .more button.danger { color: var(--danger); background: rgba(255,69,58,0.10); border-color: rgba(255,69,58,0.32); }
  .btn.danger { --tint: var(--danger); color: var(--danger-ink); }
  .sheet .note .chip { display: inline-flex; margin: 2px 0; }

  /* ---- keyframes ---- */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateX(18px) scale(0.99); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes cardInBack { from { opacity: 0; transform: translateX(-18px) scale(0.99); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes rowIn { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  @keyframes stamp { 0% { transform: scale(1); } 32% { transform: scale(1.34); box-shadow: 0 0 0 0 rgba(255,159,10,0.55); } 100% { transform: scale(1); box-shadow: 0 0 0 16px rgba(255,159,10,0); } }
  @keyframes flush { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.6); } 100% { transform: scale(1); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @keyframes float { from { transform: translateY(-5px) rotate(-3deg); } to { transform: translateY(5px) rotate(3deg); } }
  @keyframes rot { to { transform: rotate(360deg); } }
  @keyframes shimmer { from { background-position: 220% 0; } to { background-position: -220% 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px) scale(0.96); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  #toast { transform: translateX(-50%); }
  /* with a sheet open, the toast goes to the top: at the bottom it would cover the sheet's buttons */
  body:has(#sheet:not(.hide)) #toast { bottom: auto; top: calc(env(safe-area-inset-top) + 12px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    .aurora b { opacity: 0.4; }
  }
  /* ---- Liquid Glass, everywhere ----
     Every neutral button, and the floating bars that hold them, share the
     pinned header's clear glass: round and text buttons, the grey full-width
     buttons, Open in Gmail, a message's toolbar and the select bar (the
     compose button has the same, with its own fallback). Coloured buttons
     get it too, below. Last in the sheet so it wins. */
  .iconbtn, .textbtn, .pillbtn, .btn.ghost, .plink, .rgroup, #selbar {
    background: var(--lg-bg); border-color: transparent;
    backdrop-filter: var(--lg-filter); -webkit-backdrop-filter: var(--lg-filter);
  }
  .iconbtn, .textbtn, .pillbtn, .btn.ghost { box-shadow: var(--lg-rim); }
  .plink { box-shadow: var(--lg-rim), 0 4px 14px var(--lift); }
  .rgroup { box-shadow: var(--lg-rim), 0 10px 30px var(--lift-strong); }
  #selbar { box-shadow: var(--lg-rim), 0 -10px 36px var(--lift-strong); }
  .iconbtn:active, .pillbtn:active { background: var(--glass-2); }
  /* Coloured buttons are clear glass too: the colour moves to the label and a
     faint rim of the same colour, so Connect and Send still read blue and
     Sign out and Trash red. */
  .btn:not(.ghost), .send, #selbar button, #selbar button.danger {
    background: var(--lg-bg); border-color: transparent;
    backdrop-filter: var(--lg-filter); -webkit-backdrop-filter: var(--lg-filter);
    color: var(--tint-text, var(--accent-text));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 42%, transparent), inset 0 1px 1px var(--hi);
  }
  .btn.warn, .btn.danger, #selbar button.danger { --tint-text: var(--danger-text); }
  .btn:not(.ghost) { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 42%, transparent), inset 0 1px 1px var(--hi), var(--gb-shadow); }
  .send, #selbar button { --tint: var(--accent); }
  #selbar button.danger { --tint: var(--danger); }
  /* The small buttons in a card - Show more, In menu / Not in menu on the
     Tags page, a message's Show (images) - are the same clear glass. In menu
     keeps a faint blue fill as well as the blue rim, so on and off still read
     at a glance; Show reads blue and Delete all unused red. */
  .more button, .mini, .imgnote button {
    background: var(--lg-bg); border-color: transparent;
    backdrop-filter: var(--lg-filter); -webkit-backdrop-filter: var(--lg-filter);
    box-shadow: var(--lg-rim);
  }
  .more button:active, .mini:active { background: var(--glass-2); }
  .mini.on, .imgnote button, .more button.danger {
    background: var(--lg-bg); border-color: transparent;
    color: var(--tint-text, var(--accent-text)); --tint: var(--accent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tint) 42%, transparent), inset 0 1px 1px var(--hi);
  }
  .mini.on { background: linear-gradient(color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--accent) 12%, transparent)), var(--lg-bg); }
  .more button.danger { --tint: var(--danger); --tint-text: var(--danger-text); }
  .imgnote button:active, .mini.on:active, .more button.danger:active { background: var(--glass-2); }
  /* the search bar's clear button: lit like glass, but no second blur inside the bar */
  .search .x { background: var(--gb-shine), var(--fill); box-shadow: inset 0 0 0 1px var(--bar-rim), inset 0 1px 1px var(--hi); }
  /* where the glass can't blur, or Reduce Transparency is on: near-solid */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .iconbtn, .textbtn, .pillbtn, .btn.ghost, .plink, .rgroup, #selbar,
    .btn:not(.ghost), .send, #selbar button, #selbar button.danger,
    .more button, .mini, .imgnote button, .mini.on, .more button.danger { background: var(--bar-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .iconbtn, .textbtn, .pillbtn, .btn.ghost, .plink, .rgroup, #selbar,
    .btn:not(.ghost), .send, #selbar button, #selbar button.danger,
    .more button, .mini, .imgnote button, .mini.on, .more button.danger {
      background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none;
    }
  }
  /* Settings: what to be notified about */
  .notify-modes { display: flex; flex-direction: column; gap: 8px; }
  /* the Tidy preview */
  .tidylist { list-style: none; margin: 0; padding: 0; max-height: 38vh; overflow-y: auto; border-radius: 16px; background: var(--tile); box-shadow: inset 0 0 0 .5px var(--tile-edge); }
  .tidylist li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--hair-2); }
  .tidylist li:first-child { border-top: 0; }
  .tidylist .tw { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .tidylist .tw b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tidylist .tw small { font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tidylist .tn { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tidylist .tk { flex: none; font-size: 11px; color: var(--icon-text); }
  .tidylist.keeps { max-height: 22vh; }
  .tidylist .tkeep {
    flex: none; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--icon-text);
    background: var(--fill); border: 1px solid var(--hair); transition: transform .18s var(--ease);
  }
  .tidylist .tkeep:active { transform: scale(0.92); }
  .tidyh { margin: 4px 0 -4px; font-size: 12px; font-weight: 600; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; }
  .notify-modes .textbtn { height: auto; min-height: 40px; padding: 9px 14px; text-align: left; font-weight: 500; color: var(--text); }
  .notify-modes .textbtn[aria-checked="true"] { color: var(--sel-ink, var(--accent)); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }

  /* ---- icons fill more of their glass: bigger glyphs, same size buttons ---- */
  .iconbtn svg { width: 22px; height: 22px; }
  .rtop .iconbtn svg { width: 24px; height: 24px; }
  .rb svg { width: 25px; height: 25px; }
  .gi svg { width: 25px; height: 25px; }
  .fab svg { width: 31px; height: 31px; }
  .act svg { width: 24px; height: 24px; }
  .pillbtn svg { width: 20px; height: 20px; }
  #selbar button svg { width: 21px; height: 21px; }
  .search > svg { width: 21px; height: 21px; }
  .menu .ico svg { width: 22px; height: 22px; }
  .send svg { width: 22px; height: 22px; }
  .ptr svg { width: 21px; height: 21px; }
  .who .when .flagged svg, svg.i.s.clip { width: 14px; height: 14px; }

  /* ---- switches with a sliding glass thumb ----
     All | Unread, the tag sheet's tags and Settings' "Notify me about": the
     options stay clear, and one thumb under them glides to the chosen one,
     stretching as it goes, as iOS 26's do (home/slide.js). Until it has
     placed its thumb, the chosen option keeps its own fill. */
  .slides { position: relative; isolation: isolate; }
  .slides > :not(.slthumb) { position: relative; z-index: 1; }
  .slthumb {
    position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; z-index: 0; pointer-events: none;
    background: var(--gb-shine), var(--seg-thumb);
    box-shadow: inset 0 0 0 1px var(--gb-edge), inset 0 1px 0 var(--hi), 0 3px 10px var(--lift);
    transition: opacity .25s ease, scale .25s var(--ease), background-color .3s;
  }
  .slthumb.off { opacity: 0; scale: .7; }
  .seg.slides button[aria-checked="true"] { background: none; box-shadow: none; }
  /* a tag: tinted like a chosen chip */
  .tagpick > .slthumb {
    background: var(--gb-shine), color-mix(in srgb, var(--accent) var(--tint-mix), transparent);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, var(--gb-edge)), inset 0 1px 0 var(--hi), 0 3px 10px var(--lift);
  }
  .tagpick.slides .chip2.on { background: none; border-color: transparent; box-shadow: none; }
  /* how to be notified: ringed in blue, as the chosen one was */
  .notify-modes > .slthumb { box-shadow: inset 0 0 0 1.5px var(--accent), inset 0 1px 1px var(--hi), 0 3px 10px var(--lift); }
  .notify-modes.slides .textbtn[aria-checked="true"] { background: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

  /* ---- the sheets: Liquid Glass ----
     The tag sheet, Unsubscribe, a file, Tidy's preview and every question are
     each one sheet of clear glass floating just inside the screen's edges: the
     mail blurs and brightens through it, a lit rim runs round it, and its
     buttons, fields and tags are lighter glass on top. They don't blur again
     (the sheet already has), which keeps it smooth on a phone. The mailbox
     menu is the same glass; the message page and New Message stay full pages,
     with the same glass buttons, rows, fields and switches. */
  :root {
    --lgs-top: rgba(44, 44, 52, 0.60);
    --lgs-bottom: rgba(22, 22, 28, 0.52);
    --lgs-rim: rgba(255, 255, 255, 0.20);     /* the lit top edge */
    --lgs-edge: rgba(255, 255, 255, 0.12);    /* the rim all round */
    --lgs-row: rgba(255, 255, 255, 0.07);     /* a button on the sheet (its lists and rows are tiles) */
    --lgs-field: rgba(255, 255, 255, 0.10);   /* a text field or tag on it */
    --lgs-filter: blur(28px) saturate(180%) brightness(.92);
    --lgs-scrim: rgba(0, 0, 0, 0.30);
    --sw-off: rgba(120, 120, 128, 0.36);      /* a switch's track when off */
  }
  @media (prefers-color-scheme: light) {
    :root {
      --lgs-top: rgba(255, 255, 255, 0.68);
      --lgs-bottom: rgba(255, 255, 255, 0.50);
      --lgs-rim: rgba(255, 255, 255, 0.92);
      --lgs-edge: rgba(255, 255, 255, 0.62);
      --lgs-row: rgba(255, 255, 255, 0.44);
      --lgs-field: rgba(255, 255, 255, 0.62);
      --lgs-filter: blur(28px) saturate(200%) brightness(1.06);
      --lgs-scrim: rgba(0, 0, 0, 0.10);
      --sw-off: rgba(120, 120, 128, 0.20);
    }
  }
  #sheet .scrim { background: var(--lgs-scrim); }
  .sheet {
    left: 8px; right: 8px; bottom: 8px; max-width: 544px; gap: 12px;
    padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px);
    border: 0; border-radius: 34px;
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom));
    backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 24px 60px var(--lift-strong), 0 2px 8px var(--lift);
    animation-name: lgsUp;
  }
  #sheet.leaving .sheet { animation-name: lgsDown; }
  @keyframes lgsUp { from { transform: translateY(calc(100% + 48px)); } }
  @keyframes lgsDown { to { transform: translateY(calc(100% + 48px)); } }
  .sheet .grab { height: 17px; margin-bottom: -4px; }   /* 5px of handle in its 6px of grip above and below */
  .sheet h3, .sheet .note { padding: 0 4px; }
  .sheet .btn { min-height: 52px; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .sheet .btn.ghost, .sheet .btn.warn, .sheet .btn.danger {
    background: var(--lgs-row); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 4px 16px var(--lift);
  }
  .sheet .btn.warn, .sheet .btn.danger { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 30%, var(--lgs-edge)), inset 0 1px 1px var(--lgs-rim), 0 4px 16px var(--lift); }
  /* the sheet's one main action (Tag, Unsubscribe, Share, Tidy): filled blue, as iOS 26's is */
  .sheet .btn:not(.ghost):not(.warn):not(.danger) {
    color: #fff; background: var(--gb-shine), color-mix(in srgb, var(--accent) 88%, transparent);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 18px color-mix(in srgb, var(--accent) 34%, transparent);
  }
  .sheet .btn[disabled] { opacity: .6; }
  .sheet .chip2:not(.on) { background: var(--gb-shine), var(--lgs-field); }
  .sheet .chip2 { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .sheet .fchip, .sheet .tidylist {
    border: 0; background: var(--tile); box-shadow: inset 0 0 0 .5px var(--tile-edge);   /* faint tiles, as on the page */
  }
  .sheet .fchip { border-radius: 26px; padding: 10px 12px; }
  .sheet .tidylist { border-radius: 22px; }
  .sheet .tidylist .tkeep { border: 0; background: var(--lgs-field); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim); }
  .sheet .fprev { border-radius: 22px; }
  /* fields: capsules of glass with a lit rim, glowing blue while you type */
  .sheet input[type=text], .panel input[type=text], .field input[type=number], .field input[type=url] {
    border: 0; border-radius: 999px; padding: 12px 16px; font-size: 16px; color: var(--text);
    background: var(--lgs-field); outline: none;
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 1px 3px var(--lift); transition: box-shadow .2s;
  }
  .field input[type=number] { width: 76px; padding: 9px 10px; }
  .field input[type=url] { min-width: 0; }
  .sheet input[type=text]:focus, .panel input[type=text]:focus, .field input[type=number]:focus, .field input[type=url]:focus {
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 70%, transparent), inset 0 1px 1px var(--lgs-rim), 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .sheet input::placeholder, .panel input::placeholder { color: var(--faint); }
  /* the mailbox menu: the same glass, its rows lit as you press them */
  .menu {
    padding: 7px; border: 0; border-radius: 26px;
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom));
    backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 18px 50px var(--lift-strong);
  }
  .menu button { border-radius: 18px; padding: 0 12px 0 10px; }
  .menu button:active { background: var(--lgs-field); }
  .menu .mhead { padding-left: 38px; }
  .menu hr { margin: 5px 10px; }
  /* ---- the mailbox pill: Liquid Glass at the bottom, as in Fitness and Home ----
     Centred over the home indicator, in reach of a thumb: the mailbox's icon,
     its name and a chevron; the menu opens upwards from it. A light tint, a
     strong blur and a bright rim, drawn a layer behind (::before) so the
     menu's own glass still blurs the page. The compose button sits to its
     right; both give way to the select bar. */
  :root {
    --vb-top: rgba(255, 255, 255, 0.14); --vb-bottom: rgba(255, 255, 255, 0.06);
    --vb-rim: inset 0 0 0 .5px rgba(255, 255, 255, 0.32), inset 0 1px .5px rgba(255, 255, 255, 0.5), inset 0 -1px 1px rgba(255, 255, 255, 0.08), 0 12px 30px -6px rgba(0, 0, 0, 0.6);
    --vb-chip: rgba(255, 255, 255, 0.12); --vb-press: rgba(255, 255, 255, 0.12);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --vb-top: rgba(255, 255, 255, 0.56); --vb-bottom: rgba(255, 255, 255, 0.24);
      --vb-rim: inset 0 0 0 .5px rgba(28, 32, 40, 0.12), inset 0 1px .5px rgba(255, 255, 255, 0.9), 0 10px 26px -8px rgba(30, 40, 60, 0.28);
      --vb-chip: rgba(28, 32, 40, 0.09); --vb-press: rgba(28, 32, 40, 0.09);
    }
  }
  .vbar {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 15px); z-index: 15; translate: -50% 0;
    display: flex; align-items: center; padding: 4px; border-radius: 999px;
    max-width: calc(100vw - 180px);        /* never reaches the compose button */
    transition: opacity .25s, transform .3s var(--ease);
  }
  .vbar.hide { display: none; }
  .vbar::before {
    content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, var(--vb-top), var(--vb-bottom));
    -webkit-backdrop-filter: blur(18px) saturate(190%); backdrop-filter: blur(18px) saturate(190%);
    box-shadow: var(--vb-rim);
  }
  .vbar > button {
    display: inline-flex; align-items: center; gap: 8px; height: 46px; max-width: 100%; padding: 0 14px 0 8px; border-radius: 999px;
    white-space: nowrap; font-size: 16px; font-weight: 700; letter-spacing: -.2px; color: var(--text); transition: background .2s;
  }
  .vbar > button:active { background: var(--vb-press); }
  .vbar .vb-ic { display: flex; width: 30px; height: 30px; flex: none; border-radius: 50%; align-items: center; justify-content: center; background: var(--vb-chip); color: var(--icon); }
  .vbar .vb-ic svg { width: 18px; height: 18px; }
  .vbar .vb-ic .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 90% 62%); box-shadow: 0 0 8px hsl(var(--h) 90% 62% / .6); }
  .vbar .vb-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .vbar .vb-chev { display: flex; flex: none; opacity: .7; margin-left: -2px; }
  .vbar .vb-chev svg { width: 20px; height: 20px; transform: rotate(180deg); color: var(--icon); transition: transform .25s var(--ease); }
  .vbar button[aria-expanded="true"] .vb-chev svg { transform: rotate(0deg); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .vbar::before { background: var(--bar-solid); } }
  @media (prefers-reduced-transparency: reduce) { .vbar::before { background: var(--bar-solid); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  /* a message to show goes above the pill, not over it */
  body:has(#vbar:not(.hide)) #toast { bottom: calc(env(safe-area-inset-bottom) + 76px); }
  body:has(#sheet:not(.hide)) #toast { bottom: auto; }
  /* the select bar floats too: a capsule just inside the screen's edges */
  #selbar {
    left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); max-width: 544px; padding: 8px; gap: 6px;
    border: 0; border-radius: 999px; animation-name: lgsUp;
    box-shadow: var(--lg-rim), 0 10px 36px var(--lift-strong);
  }
  #selbar button { height: 44px; padding: 0 14px; white-space: nowrap; }
  #selbar #sel-archive { padding: 0 11px; }
  #sel-count { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* the buttons keep their words on one line */

  /* The full pages - a message, New Message - keep their solid page; their
     cards are the same faint tiles, a little rounder, and
     the buttons at the top are iOS 26's 44-point round glass: ✕ to cancel,
     a filled blue ↑ to send. */
  #reader .card, #compose .card { border-radius: 26px; }
  #reader .mbody.html { border-radius: 18px; }
  .rtop .iconbtn, .ctop .iconbtn { width: 44px; height: 44px; }
  .rtop .pillbtn { height: 44px; padding: 0 16px; }
  .ctop .iconbtn { color: var(--text); }
  .send {
    width: 44px; height: 44px; color: #fff; background: var(--gb-shine), color-mix(in srgb, var(--accent) 88%, transparent);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.5), 0 6px 18px color-mix(in srgb, var(--accent) 34%, transparent);
  }
  .send:active { background: var(--gb-shine), var(--accent); }
  /* iOS 26's switch (the icon's count, Tidy, auto-tags): Mail's teal when on, and a
     pill-shaped knob that swells into a clear lens while pressed */
  .switch {
    position: relative; flex: none; width: 58px; height: 30px; border-radius: 999px;
    background: var(--sw-off); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 2px var(--lift);
    transition: background .25s;
  }
  .switch::after {
    content: ''; position: absolute; top: 3px; left: 3px; width: 34px; height: 24px; border-radius: 999px;
    background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.22), 0 0 0 .5px rgba(0, 0, 0, 0.04);
    transition: transform .3s cubic-bezier(.3, 1.3, .5, 1), scale .2s var(--ease), background .2s;
  }
  .switch[aria-checked="true"] { background: var(--icon); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .switch:not([disabled]):active::after { scale: 1.18; background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 2px 8px rgba(0, 0, 0, 0.22); }
  .switch[disabled] { opacity: .6; }
  .switch.busy::after { animation: breathe 1.2s ease-in-out infinite; }   /* an auto-tag turning on or off */
  /* where the glass can't blur, or Reduce Transparency is on: near-solid */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .sheet, .menu, #toast { background: var(--bar-solid); }
  }
  @media (prefers-reduced-transparency: reduce) {
    .sheet, .menu, #toast { background: var(--bar-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }
  }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
<div class="ptr" id="ptr" aria-hidden="true"><svg class="i s" width="18" height="18" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
<main>
  <header>
    <h1><span id="title">Mail</span><span class="sub" id="sub">&nbsp;</span></h1>
    <button class="textbtn hide" id="selall">Select All</button>
    <button class="iconbtn hide" id="home" data-act="home" aria-label="Back to the inbox"><svg class="i s" width="18" height="18" viewBox="0 0 24 24"><path d="M3.8 11.2 12 4.2l8.2 7"/><path d="M6 9.6v8.9a1.5 1.5 0 0 0 1.5 1.5h2.9v-5.1a1 1 0 0 1 1-1h1.2a1 1 0 0 1 1 1V20h2.9a1.5 1.5 0 0 0 1.5-1.5V9.6"/></svg></button>
    <button class="iconbtn hide" id="find" aria-label="Search"><svg class="i s" width="18" height="18" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg></button>
