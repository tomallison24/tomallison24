<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: the envelope in Mail's own colour (#0F4E98) on a pale tint of it (#DAE7FF); every app has its own, a shade of its room's (Every day: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="92" y="170" width="328" height="212" rx="40" fill="#fff"/>
      <path d="M134 214l122 86 122-86" fill="none" stroke="#000" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#DAE7FF"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <rect width="512" height="512" fill="#0F4E98" mask="url(#cut)"/>
</svg>
