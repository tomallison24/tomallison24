<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clock's Standard design. "Midnight": a white clock face on midnight blue, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph with its hands and hour marks cut out of it; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#9DAAC4"/>
      <stop offset="0.55" stop-color="#4E5D7E"/>
      <stop offset="1" stop-color="#2C3550"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <circle cx="256" cy="256" r="164" fill="#fff"/>
      <g stroke="#000" stroke-linecap="round" fill="none">
        <path d="M256 256V150" stroke-width="26"/>
        <path d="M256 256l72 44" stroke-width="26"/>
        <g stroke-width="16"><path d="M256 112v22M256 378v22M112 256h22M378 256h22"/></g>
      </g>
      <circle cx="256" cy="256" r="20" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)"><rect width="512" height="512" fill="#FFFFFF" mask="url(#cut)"/></g>
</svg>
