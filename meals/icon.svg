<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Paprika": a white bowl with steam on a muted paprika red, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#E3B19D"/>
      <stop offset="0.55" stop-color="#B5705A"/>
      <stop offset="1" stop-color="#84493A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <path d="M104 262h304c0 84-68 142-152 142S104 346 104 262z" fill="#FFFFFF"/>
    <path d="M196 404h120" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
      <path d="M196 214c-18-22 18-38 0-62s14-36 4-52"/>
      <path d="M256 214c-18-22 18-38 0-62s14-36 4-52"/>
      <path d="M316 214c-18-22 18-38 0-62s14-36 4-52"/>
    </g>
  </g>
</svg>
