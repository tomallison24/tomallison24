<title>Weather</title>
<meta name="description" content="Signal-style weather for the home screen: the W3 Vivid card from the Home Assistant dashboard, fed by Open-Meteo.">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!--
  Weather - the Signal dashboard's W3 "Vivid" card as a standalone app.

  The card is a port of views_signal/favorites.yaml in ha-config (the WEATHER
  block, promoted 2026-09-23): same skies, particle layer, glass chips, hourly
  tray, chevron and 7-day drawer, same numbers and timings. What changed is
  only the plumbing:

    HA                                  HERE
    weather.forecast_home (Met.no)   -> Open-Meteo /v1/forecast, no key
    sensor.signal_weather            -> toForecast(): same short keys
                                        (t c p r h l), same 12h / 7d cut
    sun.sun                          -> current.is_day + daily sunrise/sunset
    input_boolean..._expanded        -> localStorage, per phone
    <ha-icon>                        -> inline MDI paths, so it works offline

  Markup is still deterministic (seeded particles) and the DOM is only
  replaced when the string changes, for the same reason as on the dashboard:
  a repaint must not restart the animations.
-->
<style>
  :root {
    --bg: #0A0A0C;
    --surface: #131316;
    --border: #2A2A2E;
    --text: #FFFFFF;
    --muted: rgba(235, 235, 245, 0.6);
    --accent: #0A84FF;
    /* Liquid Glass for the Location sheet: clear glass, a lit rim, lighter glass rows */
    --lgs-top: rgba(44, 44, 52, 0.60);
    --lgs-bottom: rgba(22, 22, 28, 0.52);
    --lgs-rim: rgba(255, 255, 255, 0.20);
    --lgs-edge: rgba(255, 255, 255, 0.12);
    --lgs-row: rgba(255, 255, 255, 0.07);
    --lgs-field: rgba(255, 255, 255, 0.10);
    --lgs-thumb: rgba(255, 255, 255, 0.16);
    --lgs-shine: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 60%);
    --lgs-filter: blur(28px) saturate(180%) brightness(0.92);
    --lgs-lift: rgba(0, 0, 0, 0.38);
    --lgs-lift-strong: rgba(0, 0, 0, 0.5);
    --lgs-solid: rgba(20, 20, 24, 0.96);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
    overscroll-behavior-y: none;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg.i { display: inline-block; flex: none; }

  /* ---- The card: ha-card + button-card grid, as W3 styles them ---- */
  .w3-card {
    position: relative; overflow: hidden;
    border-radius: 28px; padding: 22px 18px 16px 18px; color: #FFFFFF;
    display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 16px; touch-action: pan-y; will-change: transform;
  }
  .w3-days { position: relative; z-index: 1; min-width: 0; }
  .w3-dhead { font-size: 13px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; opacity: 0.78; padding: 2px 0 6px; border-bottom: 0.5px solid rgba(255,255,255,0.22); }
  .w3-place { display: inline-flex; align-items: center; gap: 4px; }

  .w3-fx { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  /* The sky fills the whole screen behind everything, so the forecast sits on it rather than in a box. */
  #sky { position:fixed; inset:0; z-index:0; }
  #sky[hidden] { display:none; }
  main { position:relative; z-index:1; }
  .w3-sky { position:absolute; inset:-2px; background-size:100% 180% !important; animation:w3-sky 22s ease-in-out infinite alternate; }
  .w3-sun { position:absolute; top:-90px; right:-90px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle, rgba(255,226,120,0.60) 0%, rgba(255,214,10,0.22) 32%, rgba(255,214,10,0) 64%); animation:w3-pulse 6s ease-in-out infinite alternate; }
  .w3-rays { position:absolute; top:-170px; right:-170px; width:420px; height:420px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0.13) 0deg 5deg, rgba(255,255,255,0) 5deg 15deg); -webkit-mask-image:radial-gradient(circle, #000 18%, transparent 62%); mask-image:radial-gradient(circle, #000 18%, transparent 62%); animation:w3-spin 80s linear infinite; }
  .w3-moon { position:absolute; top:-70px; right:-70px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(215,225,255,0.35) 0%, rgba(215,225,255,0.10) 35%, rgba(215,225,255,0) 65%); animation:w3-pulse 7s ease-in-out infinite alternate; }
  .w3-star { position:absolute; border-radius:50%; background:#FFFFFF; animation:w3-twinkle ease-in-out infinite alternate; }
  .w3-cloud { position:absolute; left:-45%; border-radius:999px; background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%); filter:blur(6px); animation:w3-drift linear infinite; }
  .w3-drop { position:absolute; top:-40px; width:1.5px; border-radius:2px; background:linear-gradient(180deg, rgba(255,255,255,0), rgba(220,238,255,0.85)); animation:w3-fall linear infinite; }
  .w3-flake { position:absolute; top:-12px; border-radius:50%; background:#FFFFFF; animation:w3-snow linear infinite; }
  .w3-flash { position:absolute; inset:0; background:#EBEBFF; opacity:0; animation:w3-flash 9s linear infinite; }
  .w3-fog { position:absolute; left:-30%; width:160%; border-radius:999px; background:rgba(255,255,255,0.22); filter:blur(14px); animation:w3-fogdrift ease-in-out infinite alternate; }
  .w3-gust { position:absolute; left:-40%; height:1.5px; border-radius:2px; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7), rgba(255,255,255,0)); animation:w3-gust linear infinite; }
  .w3-in { position:relative; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,0.18); }
  .w3-in.rise { animation:w3-rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .w3-hours { position:relative; z-index:1; min-width:0; }
  .w3-ico { display:inline-flex; }
  .w3-spin-slow { animation:w3-spin 30s linear infinite; }
  .w3-bob { animation:w3-bob 4s ease-in-out infinite alternate; }
  .w3-glow { animation:w3-glow 4s ease-in-out infinite alternate; }
  .w3-flicker { animation:w3-flicker 5s linear infinite; }
  @keyframes w3-sky { from { background-position:50% 0%; } to { background-position:50% 100%; } }
  @keyframes w3-pulse { from { transform:scale(1); opacity:.85; } to { transform:scale(1.12); opacity:1; } }
  @keyframes w3-spin { to { transform:rotate(360deg); } }
  @keyframes w3-twinkle { from { opacity:.15; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
  @keyframes w3-drift { from { left:-45%; } to { left:110%; } }
  @keyframes w3-fall { from { transform:translate(0, 0) rotate(12deg); } to { transform:translate(-200px, 110vh) rotate(12deg); } }
  @keyframes w3-snow { 0% { transform:translate(0, 0); } 50% { transform:translate(14px, 55vh); } 100% { transform:translate(-8px, 110vh); } }
  @keyframes w3-flash { 0%, 86%, 100% { opacity:0; } 87% { opacity:.55; } 88% { opacity:.05; } 90% { opacity:.4; } 92% { opacity:0; } }
  @keyframes w3-fogdrift { from { transform:translateX(-8%); } to { transform:translateX(8%); } }
  @keyframes w3-gust { from { left:-40%; } to { left:120%; } }
  @keyframes w3-bob { from { transform:translateY(-2px); } to { transform:translateY(3px); } }
  @keyframes w3-glow { from { filter:drop-shadow(0 0 4px rgba(255,255,255,0.25)); } to { filter:drop-shadow(0 0 14px rgba(255,255,255,0.60)); } }
  @keyframes w3-flicker { 0%, 84%, 100% { opacity:1; } 85% { opacity:.35; } 87% { opacity:1; } 89% { opacity:.5; } 91% { opacity:1; } }
  @keyframes w3-rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes w3-sway { from { transform:rotate(calc(var(--w3-rot) - 10deg)); } to { transform:rotate(calc(var(--w3-rot) + 10deg)); } }
  @media (prefers-reduced-motion: reduce) {
    .w3-fx *, .w3-in, .w3-ico, .w3-sway, .hx-col, .hx-col *, .hx-col .i { animation:none !important; }
  }


  /* ---- The hourly tray: 24 hours you scroll sideways. Each hour has its
     time, a moving icon, a temperature on a curve, and a rain bar. ---- */
  /* No panel: the hours sit straight on the sky (the radar keeps its own dark map panel, .hx.rd). */
  .hx { border-radius: 24px; background: none; overflow: hidden; }
  .hx-tray { scroll-padding-left: 6px; display: flex; overflow-x: auto; overflow-y: hidden; padding: 6px; scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; overscroll-behavior-x: contain; }
  .hx-tray::-webkit-scrollbar { display: none; }
  .hx-col { position: relative; flex: 0 0 calc((100% - 12px) / 6.5); min-width: 0; display: flex; flex-direction: column; align-items: center;
    border-radius: 14px; padding-top: 6px; scroll-snap-align: start; }
  .hx-now { background: rgba(255,255,255,0.22); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.50); }
  .hx-time { height: 18px; font-size: 12px; font-weight: 600; letter-spacing: -0.3px; line-height: 18px; white-space: nowrap; opacity: 0.92; font-variant-numeric: tabular-nums; }
  .hx-now .hx-time { font-weight: 700; opacity: 1; }
  .hx-day { font-weight: 800; letter-spacing: 0.2px; }
  .hx-time.sm { font-size: 11px; letter-spacing: -0.3px; }
  .hx-ico { height: 36px; display: flex; align-items: center; justify-content: center; }
  .hx-ico .i { transform-origin: 50% 55%; }
  .hx-curve { position: relative; width: 100%; height: 70px; }
  .hx-curve svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hx-line { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .hx-dot { position: absolute; left: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.28), 0 0 12px rgba(255,255,255,0.55); }
  .hx-temp { position: absolute; left: 0; right: 0; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.4px; line-height: 20px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px rgba(0,0,0,0.22); }
  .hx-rain { height: 34px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; padding-bottom: 6px; }
  .hx-bar { width: 14px; border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, #CDEBFF, #6CB8FF); transform-origin: 50% 100%; box-shadow: 0 0 10px rgba(108,184,255,0.55); }
  .hx-pct { font-size: 11.5px; font-weight: 700; color: #CDEBFF; line-height: 1; }
  .hx-lbl.sm { font-size: 10px; letter-spacing: -0.2px; }
  .hx-lbl { font-size: 11.5px; font-weight: 700; line-height: 1; opacity: 0.95; }
  /* Icons move to suit the weather; each hour starts at its own point in the cycle. */
  .hx-m-spin .i { animation: w3-spin 24s linear infinite; }
  .hx-m-bob .i { animation: w3-bob 3s ease-in-out infinite alternate; }
  .hx-m-rain .i { animation: hx-patter 1.1s ease-in-out infinite; }
  .hx-m-snow .i { animation: hx-snow 3.2s ease-in-out infinite alternate; }
  .hx-m-zap .i { animation: w3-flicker 4.5s linear infinite; }
  .hx-m-moon .i { animation: w3-glow 3s ease-in-out infinite alternate; }
  .hx-m-wind .i { animation: hx-wind 1.8s ease-in-out infinite alternate; }
  .hx-m-fog .i { animation: hx-fog 3.4s ease-in-out infinite alternate; }
  .hx-m-up .i { animation: hx-rise 3.2s ease-in-out infinite alternate; }
  .hx-m-down .i { animation: hx-set 3.2s ease-in-out infinite alternate; }
  @keyframes hx-patter { 0%, 100% { transform: translateY(-1px) scale(1); } 50% { transform: translateY(3px) scale(1.06, 0.96); } }
  @keyframes hx-snow { from { transform: rotate(-10deg) translateY(-1px); } to { transform: rotate(10deg) translateY(3px); } }
  @keyframes hx-wind { from { transform: translateX(-3px); } to { transform: translateX(4px); } }
  @keyframes hx-fog { from { opacity: 0.55; transform: translateX(-2px); } to { opacity: 1; transform: translateX(2px); } }
  @keyframes hx-rise { from { transform: translateY(5px); } to { transform: translateY(-4px); } }
  @keyframes hx-set { from { transform: translateY(-4px); } to { transform: translateY(5px); } }


  .row-c { display: flex; justify-content: center; margin-top: 12px; }
  .locating { margin: 0; padding: 120px 0 0; text-align: center; font-size: 18px; color: var(--muted); }
  .skeleton { position: relative; }
  /* The Places sheet's rows */
  .prow { display: flex; align-items: center; }
  .prow + .prow { border-top: 0.5px solid rgba(255,255,255,0.10); }
  .list .prow button { border-top: 0; }
  .list .pmain { flex: 1; min-width: 0; gap: 14px; padding: 14px 16px; }
  .prow.on .pmain { background: var(--lgs-field); }
  .pn { flex: 1; min-width: 0; }
  .pn b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .pn small { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-t { flex: none; font-size: 26px; font-weight: 300; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .list .prm { flex: none; width: 54px; height: 60px; padding: 0; justify-content: center; color: var(--muted); }


  /* ---- The view switcher above the timeline, and the radar ---- */
  .hx-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .hx-title { min-width: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vsw { flex: none; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.14);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,0.20);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
  .vsw button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,0.74); transition: color .25s; }
  .vsw button[aria-pressed="true"] { color: #fff; }
  .vsw .slthumb { background: linear-gradient(180deg, rgba(255,255,255,0.38), rgba(255,255,255,0.18));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.30), inset 0 1px 0 rgba(255,255,255,0.55), 0 3px 10px rgba(0,0,0,0.25); }
  .hx-title small { display: block; margin-top: 1px; font-size: 12px; font-weight: 500; letter-spacing: 0; opacity: 0.75; }
  .hx-empty { padding: 56px 0; text-align: center; font-size: 17px; opacity: 0.8; }
  .hx-rot { display: inline-flex; }
  @keyframes hx-swayr { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  .hx.rd { position: relative; height: 300px; background: #10131A; }
  .rd-base, .rd-fr { position: absolute; inset: 0; }
  .rd-fr { opacity: 0; transition: opacity .25s; }
  .rd-fr.on { opacity: 0.88; }
  .rd-t { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; -webkit-user-drag: none; }
  .rd-dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    background: #0A84FF; border: 2.5px solid #fff; animation: rd-ping 2.2s ease-out infinite; pointer-events: none; }
  @keyframes rd-ping { 0% { box-shadow: 0 0 0 0 rgba(10,132,255,0.65); } 80%, 100% { box-shadow: 0 0 0 16px rgba(10,132,255,0); } }
  .rd-zoom { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
  .rd-zoom button, .rd-play { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 500; color: #fff;
    background: rgba(20,22,28,0.66); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .rd-play { flex: none; font-size: 15px; }
  .rd-bar { position: absolute; left: 10px; right: 10px; bottom: 26px; display: flex; align-items: center; gap: 10px; padding: 5px 14px 5px 5px; border-radius: 999px;
    background: rgba(20,22,28,0.66); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .rd-bar input { flex: 1; min-width: 0; accent-color: #9FD8FF; }
  .rd-kind { position: absolute; top: 12px; left: 12px; padding: 4px 9px; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,0.35); font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: #1B1B1F; background: #FFD60A; }
  .rd-kind[hidden] { display: none; }
  .rd-fr.ahead.on { opacity: 0.75; }
  .rd-time { flex: none; min-width: 84px; text-align: right; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rd-attr { position: absolute; left: 10px; right: 10px; bottom: 6px; font-size: 11px; color: rgba(255,255,255,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rd-note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; font-size: 16px; line-height: 1.4; color: rgba(255,255,255,0.85); }
  .rd-note b { font-size: 19px; color: #fff; }
  .rd-note.over { background: rgba(16,19,26,0.88); }
  .rd-note.small { inset: auto 10px 70px 10px; padding: 8px 12px; border-radius: 14px; background: rgba(16,19,26,0.82); font-size: 14px; }
  .rd-note a { color: #9FD8FF; }
  @media (prefers-reduced-motion: reduce) { .rd-dot { animation: none; } .rd-fr { transition: none; } }


  /* ---- Page dots under the forecast ---- */
  .dots { display: flex; justify-content: center; align-items: center; gap: 2px; margin-top: -2px; }
  .dots:empty { display: none; }
  .dot { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: rgba(255,255,255,0.38); transition: color .3s; }
  .dot i { display: block; width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.30);
    transition: width .4s cubic-bezier(.3,1.4,.5,1), background .3s; }
  .dot svg { transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
  .dot.on { color: #fff; }
  .dot.on i { width: 22px; background: #fff; }
  .dot.on svg { transform: scale(1.25); }
  /* ---- The hour popup: the same Liquid Glass sheet as Places ---- */
  .hnav { display: flex; gap: 8px; }
  .hnav button:disabled { opacity: 0.35; }
  .hd-hero { --k: 0; border-radius: 28px; padding: 20px 20px 20px 22px; display: flex; align-items: center; justify-content: space-between; color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), inset 0 1px 1px rgba(255,255,255,0.35), 0 10px 26px -12px rgba(0,0,0,0.5); }
  .hd-temp { font-size: 76px; font-weight: 200; letter-spacing: -3.5px; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .hd-temp span { opacity: 0.9; }
  .hd-words { margin-top: 8px; font-size: 21px; font-weight: 600; letter-spacing: -0.3px; }
  .hd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .hd-tile { border-radius: 24px; padding: 14px 16px 12px; background: var(--lgs-row); min-width: 0;
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 4px 16px var(--lgs-lift); }
  .hd-k { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; color: var(--muted); }
  .hd-v { margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 32px; font-weight: 600; letter-spacing: -0.8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hd-v small { font-size: 17px; font-weight: 500; letter-spacing: 0; color: var(--muted); }
  .hd-arrow { display: inline-flex; }
  .hd-s { margin-top: 3px; font-size: 15px; color: var(--muted); }
  .hd-tile.wide .hd-v { font-size: 26px; }
  .hd-hero, .hd-tile { animation: w3-rise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--k) * 55ms); }
  .hx-col[data-hour] { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .hx-col[data-hour]:focus-visible { outline: 2px solid rgba(255,255,255,0.8); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { .hd-hero, .hd-tile { animation: none; } .dot i, .dot svg { transition: none; } }
  /* ---- The day sheet: the hour popup's glass, with the day drawn hour by hour ---- */
  .hd-temp em { font-style: normal; font-size: 38px; letter-spacing: -1.2px; opacity: 0.72; margin-left: 6px; }
  .hd-tile.full { grid-column: 1 / -1; }
  .dd-chart { display: block; width: 100%; height: auto; margin-top: 6px; overflow: visible; }
  .dd-chart text { font: 600 11px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; fill: rgba(255,255,255,0.62); }
  .dd-chart .lbl { font-size: 13px; font-weight: 700; fill: #fff; }
  .dd-key { display: flex; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .dd-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .dd-none { padding: 18px 0 8px; font-size: 16px; color: var(--muted); }
  .dd-txt { margin-top: 8px; font-size: 16px; line-height: 1.42; }
  .dd-txt + .dd-txt { margin-top: 10px; }
  .dd-txt b { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .dc[data-day] { cursor: pointer; -webkit-user-select: none; user-select: none; border-radius: 16px; }
  .dc[data-day]:focus-visible { outline: 2px solid rgba(255,255,255,0.8); outline-offset: -2px; }
  .dc[data-day]:active { background: rgba(255,255,255,0.08); }


  /* ---- 7-day: a column per day, the high over a bar down to the low ---- */
  .dcols { display: flex; padding-top: 2px; }
  .dc { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; }
  .dc-n { margin-top: 8px; font-size: 13px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
  .dc-ic { height: 30px; display: flex; align-items: center; }
  .dc-r { height: 14px; font-size: 11px; font-weight: 700; line-height: 14px; color: #BFE3FF; white-space: nowrap; }
  .dc-area { position: relative; width: 100%; }
  .dc-hi, .dc-lo { position: absolute; left: 0; right: 0; text-align: center; font-size: 15px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dc-lo { font-weight: 500; opacity: 0.75; }
  .dc-bar { position: absolute; left: 50%; width: 12px; margin-left: -6px; border-radius: 7px; box-shadow: 0 0 10px rgba(255,255,255,0.15); }
  .dc-now { position: absolute; left: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,0.3); }

  /* ---- App chrome: Signal's own surfaces, not the sky ---- */
  .foot { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; color: rgba(255,255,255,0.8); padding: 6px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .foot button { display: inline-flex; align-items: center; gap: 4px; color: rgba(255,255,255,0.85); padding: 6px 8px; border-radius: 999px; }
  .foot button:active { background: var(--surface); }
  .spin { animation: w3-spin 1s linear infinite; }

  .msg { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 20px 18px; font-size: 17px; line-height: 1.4; }
  .msg b { display: block; font-size: 20px; margin-bottom: 4px; }
  .msg .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 12px 18px; border-radius: 999px; background: #1F1F23; border: 1px solid var(--border); font-size: 17px; font-weight: 600; }
  .pill.primary { background: var(--accent); border-color: var(--accent); }

  .skeleton { height: 290px; border-radius: 26px; background: linear-gradient(160deg, #1A1D24, #22262F); animation: w3-pulse 1.4s ease-in-out infinite alternate; }

  /* NWS alerts: Signal surfaces with the severity as the one colour */
  .alerts { display: flex; flex-direction: column; gap: 8px; }
  .alerts:empty { display: none; }
  .alert { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  .alert > button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; }
  .alert .dot { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; }
  .alert .t { flex: 1; min-width: 0; }
  .alert .t b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -0.24px; }
  .alert .t small { display: block; font-size: 14px; color: var(--muted); margin-top: 1px; }
  .alert .chev { color: var(--muted); transition: transform .2s; }
  .alert.open .chev { transform: rotate(90deg); }
  .alert .body { display: none; padding: 0 16px 16px 68px; font-size: 16px; line-height: 1.45; color: rgba(235,235,245,0.85); white-space: pre-line; }
  .alert.open .body { display: block; }

  /* Location sheet: Liquid Glass. One sheet of clear glass floating just
     inside the screen's edges, as iOS 26's are: the sky blurs through it, a
     lit rim runs round it, and the rows and fields are lighter glass on top.
     The rows don't blur again (the sheet already has). */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.30); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 11; margin: 0 auto; max-width: 544px;
    display: flex; flex-direction: column; overflow: hidden; border-radius: 34px;
    background: linear-gradient(180deg, var(--lgs-top), var(--lgs-bottom));
    backdrop-filter: var(--lgs-filter); -webkit-backdrop-filter: var(--lgs-filter);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1.5px 1px var(--lgs-rim), 0 24px 60px var(--lgs-lift-strong), 0 2px 8px var(--lgs-lift);
    transform: translateY(calc(100% + 24px)); visibility: hidden;
    transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s linear .32s;
    max-height: min(85vh, calc(100dvh - env(safe-area-inset-top) - 32px));
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.22); margin: 6px auto 0; flex: none; }
  .sheet h2 { flex: none; font-size: 20px; font-weight: 600; letter-spacing: -0.4px; margin: 0; padding: 2px 12px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  /* Close: a round glass button, as iOS 26's sheets have */
  .sheet h2 button {
    width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--text);
    background: var(--lgs-shine), var(--lgs-field);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 4px 14px var(--lgs-lift);
    transition: transform .18s cubic-bezier(.22,1,.36,1);
  }
  .sheet h2 button:active { transform: scale(0.9); }
  /* The list fades in under the header rather than being cut off by it. */
  .sheet-body {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 6px 12px calc(env(safe-area-inset-bottom) + 16px);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 12px); mask-image: linear-gradient(180deg, transparent, #000 12px);
  }
  .search {
    display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 0 16px; color: var(--muted); background: var(--lgs-field);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 1px 3px var(--lgs-lift); transition: box-shadow .2s;
  }
  .search:focus-within { box-shadow: inset 0 0 0 1.5px rgba(10,132,255,0.70), inset 0 1px 1px var(--lgs-rim), 0 0 0 4px rgba(10,132,255,0.18); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; padding: 12px 0; }
  .list {
    margin-top: 10px; border-radius: 26px; overflow: hidden; background: var(--lgs-row);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 1px var(--lgs-rim), 0 4px 16px var(--lgs-lift);
  }
  .list:empty { display: none; }
  .list button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 15px 16px; font-size: 18px; }
  .list button + button { border-top: 0.5px solid rgba(255,255,255,0.10); }
  .list button small { display: block; color: var(--muted); font-size: 15px; margin-top: 1px; }
  .list button:active { background: var(--lgs-field); }
  .label { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin: 18px 8px 8px; }
  .seg { display: flex; border-radius: 999px; padding: 3px; background: rgba(255,255,255,0.07); box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 2px var(--lgs-lift); }
  .seg button { flex: 1; padding: 11px 0; border-radius: 999px; font-size: 16px; font-weight: 600; color: var(--muted); transition: color .25s; }
  .seg button[aria-pressed="true"] { background: #3A3A3F; color: var(--text); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .sheet { background: var(--lgs-solid); } }
  @media (prefers-reduced-transparency: reduce) { .sheet { background: var(--lgs-solid); backdrop-filter: none; -webkit-backdrop-filter: none; } }

  /* The units switch's sliding glass thumb: the options stay clear, and one
     thumb under them glides to the chosen one, stretching as it goes, as
     iOS 26's do (home/slide.js). */
  .slides { position: relative; isolation: isolate; }
  .slides > :not(.slthumb) { position: relative; z-index: 1; }
  .slthumb {
    position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 999px; z-index: 0; pointer-events: none;
    background: var(--lgs-shine), var(--lgs-thumb);
    box-shadow: inset 0 0 0 1px var(--lgs-edge), inset 0 1px 0 var(--lgs-rim), 0 3px 10px var(--lgs-lift);
    transition: opacity .25s ease, scale .25s cubic-bezier(.22,1,.36,1), background-color .3s;
  }
  .slthumb.off { opacity: 0; scale: .7; }
  .seg.slides button[aria-pressed="true"] { background: none; }
  .note { font-size: 14px; color: var(--muted); margin: 14px 8px 0; line-height: 1.4; }
</style>
</head>

<div id="sky" class="w3-fx" aria-hidden="true"></div>
<main id="app"><div class="skeleton" aria-hidden="true"></div></main>

<div id="sheetWrap">

    <div class="sheet-body">

    </div>

</div>

  </section>
</div>

<div id="dayWrap">
  <div class="scrim" data-close></div>

    <div class="sheet-body" id="dayBody"></div>
  </section>
</div>

// the icon's own colour (white), a yellow bolt and light blue drops. Each glyph is one path, so it
// is cut where the bolt and the drops begin.
const STORM_PARTS = {
  'weather-lightning': [['M12,11H15', '#FFD60A']],
  'weather-lightning-rainy': [['M9.5,11H12.5', '#FFD60A'], ['M17.5,18.67', '#9FD3FF']]
};
const svg = (name, size, style) => {
  const d = MDI[name] || MDI['weather-cloudy'];
  let paths = `<path fill="currentColor" d="${d}"/>`;
  const cuts = (STORM_PARTS[name] || []).map(([at, fill]) => [d.indexOf(at), fill]).filter(([i]) => i > 0).sort((a, b) => a[0] - b[0]);
  if (cuts.length) paths = `<path fill="currentColor" d="${d.slice(0, cuts[0][0])}"/>`
    + cuts.map(([i, fill], k) => `<path fill="${fill}" d="${d.slice(i, k + 1 < cuts.length ? cuts[k + 1][0] : d.length)}"/>`).join('');
  return `<svg class="i" viewBox="0 0 24 24" width="${size}" height="${size}" style="${style || ''}" aria-hidden="true">${paths}</svg>`;
};

// ===========================================================================
// DATA. The National Weather Service is the source for any US location:
// its forecast is the official one, edited by the local forecast office,
// and it carries the official watches and warnings. Open-Meteo is the
// fallback, outside the US (where /points 404s) or when api.weather.gov is
// down, so the app never goes blank.
//
// Both sources are normalised to one BASE shape, always in US units, and
// cached as that:
//   { src, lat, lon, tz, place,
//     cur:    { tF, fF (feels like), hum, mph, deg, c },
//     hourly: [{ t, c, pF, r, fF, hum, mph, deg }],  next 24 hours from this one
//     v:      2 (older caches lack feels-like, humidity and wind per hour and are refetched)
//     daily:  [{ t, c, hF, lF, r }],    7 days from today
//     rKind:  'pop' (chance, %) | 'in' (amount, inches),
//     alerts: [{ event, severity, headline, ends, desc }] }
// model() turns BASE into what the card templates read, doing the unit
// conversion and the day/night maths at render time, so a unit switch or a
// sunset never needs a fetch.
// ===========================================================================

// ---- Condition strings (HA's vocabulary, which the card speaks) ----

// WMO weather code (Open-Meteo) -> HA condition. Day/night is applied later.
function wmo(code) {
  if (code <= 1) return 'sunny';
  if (code === 2) return 'partlycloudy';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if (code === 65 || code === 82) return 'pouring';
  if ([56, 57, 66, 67].includes(code)) return 'snowy-rainy';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snowy';
  if (code >= 95) return 'lightning-rainy';
  if (code >= 51 && code <= 81) return 'rainy';
  return 'cloudy';
}

// NWS: the icon URL carries a condition code (".../land/day/tsra_sct,40?..."),
// which is more regular than the prose; the short forecast text is the
// fallback when there is no icon, and decides "heavy" rain.

  fzra: 'snowy-rainy', rain_fzra: 'snowy-rainy', snow_fzra: 'snowy-rainy', sleet: 'snowy-rainy',
  rain: 'rainy', rain_showers: 'rainy', rain_showers_hi: 'rainy',
  tsra: 'lightning-rainy', tsra_sct: 'lightning-rainy', tsra_hi: 'lightning-rainy',

    getJSON(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`).catch(() => null)

function locate() {

      p => { clearTimeout(giveUp); res({ lat: p.coords.latitude, lon: p.coords.longitude }); },
      e => { clearTimeout(giveUp); rej(new Error(e.code === 1 ? 'Location permission was denied. Allow it in Settings → Privacy → Location Services, or search for a city.' : 'Could not get your location.')); },

      ico = `<div class="hx-ico"><span class="hx-rot" style="transform:rotate(${x.wd == null ? 0 : rot}deg)">${svg('navigation', 21, `color:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.45));${x.now ? `animation:hx-swayr ${dur}s ease-in-out infinite alternate;` : ''}`)}</span></div>`;
      shown = String(v);
      extra = `<div class="hx-lbl">${compass(x.wd)}</div>`;
    } else {
      const icon = (x.dark && V.icons[x.c + '-night']) || V.icons[x.c] || 'weather-cloudy';
      const tint = V.tints[x.c] || '#FFFFFF';
      ico = `<div class="hx-ico${mv(hourMotion(x.c, x.dark))}">${svg(icon, 26, `color:${tint};filter:drop-shadow(0 0 7px ${tint}66);`)}</div>`;
      shown = v + '°';
      if (wet(m, x.r)) {                                // Hourly and Feels like both show the rain chance underneath
        const f = m.rKind === 'pop' ? x.r / 100 : x.r / (unit === 'mm' ? 6 : 0.25);
        extra = `<div class="hx-bar" style="height:${Math.round(4 + Math.min(1, Math.max(0, f)) * 13)}px"></div><div class="hx-pct">${x.r}${unit}</div>`;
      }
    }
    return `<div class="${cls}" ${st} data-hour="${x.t}" role="button" tabindex="0" aria-label="Details for ${x.now ? 'now' : fmt(x.t)}">
      <div class="hx-time">${label}</div>
      ${ico}
      <div class="hx-curve">${curveSvg(i)}<div class="hx-dot" style="top:${ys[i].toFixed(1)}px"></div><div class="hx-temp" style="top:${(ys[i] - 27).toFixed(1)}px">${shown}</div></div>
      <div class="hx-rain">${extra}</div>
    </div>`;
  });
  return head + `<div class="hx"><div class="hx-tray" id="hxTray">${cols.join('')}</div></div>`;
}

// ---- Radar: NEXRAD reflectivity over a dark map, the last 50 minutes on a loop ----
// Radar tiles: the Iowa Environmental Mesonet's cache of the NWS NEXRAD national
// mosaic (the continental US). Map: CARTO's dark tiles, from OpenStreetMap data.
const R = { z: 7, idx: 0, playing: false, timer: null, touched: false, place: '', offs: [], hrrr: null };
// The loop is "Now" (the latest NEXRAD radar, IEM's ready-made tiles) and then the next two
// hours, which are a forecast, not radar: the NWS HRRR model's simulated reflectivity, which
// IEM draws every 15 minutes out to 18 hours. Offsets are minutes: 0 is now, negative is ahead.
const RADAR_OFFSETS = [0];
const RADAR_AHEAD = [15, 30, 45, 60, 75, 90, 105, 120];
// Forecast frames are numbered from the model run's start, so that time is read first
// (IEM's refd_1080.json, model_init_utc). IEM doesn't let other sites read that file, so it
// comes through this site's own helper (functions/weather/api, on Cloudflare); a direct read
// is tried first in case that ever changes. Without it there are no forecast frames rather
// than mislabelled ones.
async function hrrrInit() {
  if (R.hrrr && Date.now() - R.hrrr.at < 10 * 60000) return R.hrrr.init;
  let j = null;
  try { j = await getJSON('https://mesonet.agron.iastate.edu/data/gis/images/4326/hrrr/refd_1080.json', { headers: {} }); }
  catch (e) { j = await getJSON('api/hrrr', { headers: { 'X-Weather': '1' }, cache: 'no-store', credentials: 'same-origin' }); }
  const v = String((j && j.model_init_utc) || '');
  const init = /^\d{12}$/.test(v) ? Date.UTC(+v.slice(0, 4), +v.slice(4, 6) - 1, +v.slice(6, 8), +v.slice(8, 10), +v.slice(10, 12)) : Date.parse(v);
  if (!Number.isFinite(init)) throw new Error('No HRRR run time');
  R.hrrr = { init, at: Date.now() };
  return init;
}
function hrrrTile(ahead, init, z, x, y) {
  const f = Math.round((Date.now() + ahead * 60000 - init) / 60000 / 15) * 15;   // forecast minute from the run's start
  if (f < 0 || f > 1080) return null;
  const run = new Date(init).toISOString().slice(0, 16).replace(/[-T:]/g, '');
  return `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr::REFD-F${String(f).padStart(4, '0')}-${run}/${z}/${x}/${y}.png`;
}
const radarTile = (off, z, x, y) => `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/${z}/${x}/${y}.png`;
const spanLabel = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${m % 60 ? ' ' + m % 60 + 'm' : ''}`;
const agoLabel = off => !off ? 'Now' : off > 0 ? `${spanLabel(off)} ago` : `in ${spanLabel(-off)}`;
// CARTO has required a (free) key since late August 2026; without one every tile is
// stamped "API KEY REQUIRED". Map keys are meant to sit in web pages like this one.
const CARTO_KEY = 'cb1_48id_1_0ed95665ed15e6f191380e40';
const baseTile = (z, x, y) => `https://${'abcd'[(x + y) % 4]}.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png?key=${CARTO_KEY}`;
const inUS = (lat, lon) => lat >= 24 && lat <= 50 && lon >= -125 && lon <= -66;
function stopRadar() { clearTimeout(R.timer); R.timer = null; R.playing = false; const b = document.querySelector('.rd-play'); if (b) b.textContent = '▶'; }
function radarShow(i) {
  R.idx = i;
  document.querySelectorAll('#rd .rd-fr').forEach((f, k) => f.classList.toggle('on', k === i));
  const sc = document.getElementById('rdScrub'), tm = document.getElementById('rdTime');
  if (sc) sc.value = i;
  if (tm) tm.textContent = agoLabel(R.offs[i]);
  const kind = document.getElementById('rdKind');
  if (kind) kind.hidden = !(R.offs[i] < 0);
}
function radarPlay(on) {
  clearTimeout(R.timer); R.playing = on;
  const b = document.querySelector('.rd-play'); if (b) b.textContent = on ? '❚❚' : '▶';
  if (!on) return;
  const step = () => {
    if (!document.getElementById('rd') || document.hidden) return stopRadar();
    // Step to the next picture that has arrived, so a slow or missing one never shows as a blank map.
    const frs = document.querySelectorAll('#rd .rd-fr'), n = R.offs.length;
    let j = (R.idx + 1) % n;
    for (let k = 0; k < n && frs[j] && !frs[j].ok; k++) j = (j + 1) % n;
    radarShow(j);
    R.timer = setTimeout(step, R.idx === n - 1 ? 1500 : 500);
  };
  R.timer = setTimeout(step, 500);
}
// Draw the map for the place on screen. Called after every repaint; it only does
// anything when the place or the zoom is not the one already drawn.
function radarSync() {
  const box = document.getElementById('rd');
  if (!box || !S.loc || !box.clientWidth) return;
  const sig = locKey() + '|' + R.z + '|' + Math.floor(Date.now() / 300000);      // a new picture every five minutes
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  const wasPlaying = R.playing;
  if (R.place !== locKey()) { R.place = locKey(); R.touched = false; }
  stopRadar();
  box.innerHTML = '';
  const { lat, lon } = S.loc;
  if (!inUS(lat, lon)) {
    box.innerHTML = '<div class="rd-note"><b>Radar covers the continental US</b>Open a place there to see rain and storms moving in.</div>';
    return;
  }
  const W = box.clientWidth, H = box.clientHeight, z = R.z, n = 2 ** z;
  const cx = (lon + 180) / 360 * n, la = lat * Math.PI / 180;
  const cy = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
  const ox = W / 2 - cx * 256, oy = H / 2 - cy * 256;
  const xs = [], ys = [];
  for (let x = Math.floor(cx - W / 512); x <= Math.floor(cx + W / 512); x++) xs.push(x);
  for (let y = Math.floor(cy - H / 512); y <= Math.floor(cy + H / 512); y++) if (y >= 0 && y < n) ys.push(y);
  const tiles = { base: [0, 0], radar: [0, 0] };       // [loaded, failed]
  const layer = (cls, kind, url) => {
    const d = document.createElement('div'); d.className = cls; d.ok = 0;
    for (const ty of ys) for (const tx of xs) {
      const im = new Image();
      im.className = 'rd-t'; im.alt = ''; im.decoding = 'async'; im.draggable = false;
      im.style.left = (ox + tx * 256).toFixed(1) + 'px'; im.style.top = (oy + ty * 256).toFixed(1) + 'px';
      im.onload = () => { tiles[kind][0]++; d.ok++; };
      im.onerror = () => { tiles[kind][1]++; im.style.display = 'none'; };
      im.src = url(((tx % n) + n) % n, ty);
      d.appendChild(im);
    }
    return d;
  };
  box.appendChild(layer('rd-base', 'base', (x, y) => baseTile(z, x, y)));
  R.offs = RADAR_OFFSETS.slice();
  R.idx = Math.min(R.idx, R.offs.length - 1);
  R.offs.forEach((off, k) => box.appendChild(layer('rd-fr' + (k === R.idx ? ' on' : ''), 'radar', (x, y) => radarTile(off, z, x, y))));
  const ui = document.createElement('div');
  ui.innerHTML = `<div class="rd-dot"></div>
    <div class="rd-zoom"><button data-rz="1" aria-label="Zoom in">+</button><button data-rz="-1" aria-label="Zoom out">−</button></div>
    <div class="rd-bar"><button class="rd-play" data-rplay aria-label="Play or pause the loop">▶</button>
      <input id="rdScrub" type="range" min="0" max="${R.offs.length - 1}" step="1" value="${R.idx}" aria-label="Radar time"><span class="rd-time" id="rdTime"></span></div>
    <span class="rd-kind" id="rdKind" hidden>Forecast</span>
    <div class="rd-attr">© OpenStreetMap © CARTO · Radar: NWS NEXRAD, forecast: NWS HRRR, via Iowa Environmental Mesonet</div>`;
  while (ui.firstChild) box.appendChild(ui.firstChild);
  radarShow(R.idx);
  // The forecast frames go in after "Now" once the model run's time is known.
  hrrrInit().then(init => {
    if (document.getElementById('rd') !== box || box.dataset.sig !== sig) return;
    let last = [...box.querySelectorAll('.rd-fr')].pop();
    for (const ahead of RADAR_AHEAD) {
      if (!hrrrTile(ahead, init, z, 0, 0)) continue;
      const fr = layer('rd-fr ahead', 'radar', (x, y) => hrrrTile(ahead, init, z, x, y));
      last.after(fr); last = fr;
      R.offs.push(-ahead);
    }
    const sc = document.getElementById('rdScrub');
    if (sc) sc.max = R.offs.length - 1;
    setTimeout(() => {                                   // forecast tiles that never arrived are dropped too
      if (document.getElementById('rd') !== box || box.dataset.sig !== sig) return;
      const frs = [...box.querySelectorAll('.rd-fr')], showing = R.offs[R.idx];
      for (let k = frs.length - 1; k >= 0; k--) if (!frs[k].ok && R.offs[k] < 0) { frs[k].remove(); R.offs.splice(k, 1); }
      const sc2 = document.getElementById('rdScrub');
      if (sc2) sc2.max = R.offs.length - 1;
      const at = R.offs.indexOf(showing);
      if (at >= 0) R.idx = at; else radarShow(Math.min(R.idx, R.offs.length - 1));
    }, 9000);
  }).catch(() => {
    // No run time: show the latest radar on its own, and say why the loop is missing.
    if (document.getElementById('rd') !== box || box.dataset.sig !== sig || box.querySelector('.rd-note')) return;
    box.insertAdjacentHTML('beforeend', '<div class="rd-note over small">The two-hour forecast isn’t available right now, so this is the latest radar only.</div>');
  });
  // Start the loop for you, unless you have already played, paused or scrubbed it; a redraw keeps it playing if it was.
  if (wasPlaying || (!R.touched && !calm())) setTimeout(() => {
    if (document.getElementById('rd') !== box || box.dataset.sig !== sig || (R.touched && !wasPlaying)) return;
    if (!wasPlaying) { const frs = [...box.querySelectorAll('.rd-fr')], k = frs.findIndex(f => f.ok); radarShow(k < 0 ? R.offs.length - 1 : k); }
    radarPlay(true);
  }, wasPlaying ? 300 : 1800);
  // If nothing arrived, say so rather than leave a blank map. Older frames that never arrived
  // (the time-based service is the untested part) are dropped, so the loop and the slider only
  // hold pictures that exist.
  setTimeout(() => {
    if (document.getElementById('rd') !== box || box.dataset.sig !== sig || box.querySelector('.rd-note:not(.small)')) return;
    const frs = [...box.querySelectorAll('.rd-fr')], showing = R.offs[R.idx];
    for (let k = frs.length - 1; k >= 0; k--) if (!frs[k].ok && (R.offs[k] > 50 || R.offs[k] < 0)) { frs[k].remove(); R.offs.splice(k, 1); }
    const sc = document.getElementById('rdScrub');
    if (sc) sc.max = R.offs.length - 1;
    const at = R.offs.indexOf(showing);
    radarShow(at >= 0 ? at : R.offs.length - 1);
    if (!tiles.base[0] && !tiles.radar[0]) {
      stopRadar();
      box.querySelectorAll('.rd-note.small').forEach(n => n.remove());   // nothing loaded at all: that is the message, not the forecast
      box.insertAdjacentHTML('beforeend', '<div class="rd-note over"><b>Radar couldn’t load</b>Check your connection, or <a href="https://radar.weather.gov/" target="_blank" rel="noopener">open the NWS radar</a>.</div>');
    } else if (!tiles.radar[0]) {
      box.querySelectorAll('.rd-note.small').forEach(n => n.remove());
      box.insertAdjacentHTML('beforeend', '<div class="rd-note over small">Radar images aren’t available right now.</div>');
    }
  }, 9000);
}

// A temperature's colour on the five-stop Celsius ramp: cold blue through green to hot orange.
// Absolute, so 30° looks the same in any week.
function rampOf(m) {
  const f = (m.entity.attributes.temperature_unit || '').indexOf('F') >= 0;
  const stops = [[0, [122, 184, 255]], [10, [90, 200, 250]], [18, [126, 217, 87]], [25, [255, 214, 10]], [32, [255, 159, 10]]];
  return t => {
    const c = f ? (t - 32) * 5 / 9 : t;
    if (c <= stops[0][0]) return `rgb(${stops[0][1]})`;
    for (let i = 1; i < stops.length; i++) {
      if (c <= stops[i][0]) {
        const k = (c - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        const rgb = stops[i - 1][1].map((a, j) => Math.round(a + (stops[i][1][j] - a) * k));
        return `rgb(${rgb})`;
      }
    }
    return `rgb(${stops[stops.length - 1][1]})`;
  };
}

// Range bars against the week's own min/max, coloured by ABSOLUTE
// temperature through the five-stop Celsius ramp; a dot on Today marks now.
function wDays(m) {
  const { entity, fc, tz } = m;
  const days = (fc.daily || []).slice(0, 7);
  if (!days.length) return '';
  const unit = entity.attributes.precipitation_unit || '';
  const ramp = rampOf(m);
  const min = Math.min.apply(null, days.map(d => d.l));
  const max = Math.max.apply(null, days.map(d => d.h));
  const span = Math.max(1, max - min);
  // A column per day: the high over a bar that runs down to the low, every bar on the same
  // scale (the week's own lowest low to highest high), so the week's shape shows at a glance.
  const CH = 128;                                     // px of bar for the week's whole range
  const yOf = t => (1 - (t - min) / span) * CH;
  const cur = entity.attributes.temperature;
  const cols = days.map((d, i) => {
    const name = i === 0 ? 'Today' : new Date(d.t * 1000).toLocaleDateString([], { weekday: 'short', timeZone: tz });
    const icon = V.icons[d.c] || 'weather-cloudy';
    const tint = V.tints[d.c] || '#FFFFFF';
    const top = yOf(d.h), len = Math.max(6, yOf(d.l) - top);
    const now = i === 0 && cur != null && d.h > d.l
      ? `<i class="dc-now" style="top:${((1 - (Math.min(Math.max(cur, d.l), d.h) - d.l) / (d.h - d.l)) * 100).toFixed(1)}%"></i>` : '';
    return `<div class="dc" data-day="${i}" role="button" tabindex="0" aria-label="Details for ${i === 0 ? 'today' : dayLong(d.t, tz)}">
      <div class="dc-n">${name}</div>
      <div class="dc-ic">${svg(icon, 24, `color:${tint};`)}</div>
      <div class="dc-r">${wet(m, d.r) ? d.r + unit : ''}</div>
      <div class="dc-area" style="height:${CH + 48}px">
        <div class="dc-hi" style="top:${top.toFixed(1)}px">${d.h}°</div>
        <div class="dc-bar" style="top:${(top + 22).toFixed(1)}px;height:${len.toFixed(1)}px;background:linear-gradient(0deg,${ramp(d.l)},${ramp(d.h)})">${now}</div>
        <div class="dc-lo" style="top:${(top + 26 + len).toFixed(1)}px">${d.l}°</div>
      </div>
    </div>`;
  });
  return `<div class="w3-dhead">7-day forecast</div><div class="dcols">${cols.join('')}</div>`;
}

// Active NWS watches/warnings/advisories for this point, most severe first.
function alertCards(m) {
  const rank = SEV;
  const tint = { Extreme: '#FF453A', Severe: '#FF453A', Moderate: '#FF9F0A' };
  return m.alerts.slice().sort((a, b) => (rank[a.severity] ?? 4) - (rank[b.severity] ?? 4)).map((a, i) => {
    const c = tint[a.severity] || '#FFD60A';
    const until = a.ends ? 'Until ' + new Date(a.ends).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: m.tz }) : a.severity || '';
    const key = a.event + '|' + a.ends;
    const open = !!S.alertOpen[key];
    return `<div class="alert${open ? ' open' : ''}">
      <button data-alert="${esc(key)}" aria-expanded="${open}">
        <span class="dot" style="background:${c}22;color:${c};">${svg('alert', 20)}</span>
        <span class="t"><b>${esc(a.event)}</b><small>${esc(until)}</small></span>
        <span class="chev">${svg('chevron-right', 20)}</span>
      </button>
      <div class="body">${esc([a.desc, a.instr].filter(Boolean).join('\n\n'))}</div>
    </div>`;
  }).join('');
}

// ---- Render: build strings, touch the DOM only where a string changed ----
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const app = document.getElementById('app');
const parts = {};
function slot(id, tag, cls) {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement(tag); el.id = id; if (cls) el.className = cls; }
  return el;
}
function put(el, html) { if (parts[el.id] !== html) { el.innerHTML = html; parts[el.id] = html; } }

// Page dots under the forecast: one per place, My Location first as an arrow. The
// current one stretches into a pill; tap a dot to go there.
function dotsBar() {
  const ids = placeIds();
  if (ids.length < 2) return '';
  const cur = currentId();
  return ids.map((id, i) => {
    const on = id === cur, name = id === 'here' ? 'My Location' : S.places[+id.slice(1)].name;
    return `<button class="dot${on ? ' on' : ''}" data-pick-place="${id}" aria-label="${esc(name)}, place ${i + 1} of ${ids.length}" aria-current="${on}">${id === 'here' ? svg('navigation-variant', 15, '') : '<i></i>'}</button>`;
  }).join('');
}
const skyEl = document.getElementById('sky');
// Messages and the welcome screen sit on the plain dark background; while a place loads, the last sky stays.
function renderShell(inner, keepSky) {
  for (const k in parts) delete parts[k];
  if (!keepSky) { skyEl.hidden = true; skyEl.innerHTML = ''; delete parts.sky; document.body.style.background = ''; }
  app.innerHTML = inner;
}
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function render() {
  if (!S.loc) return S.locating ? renderShell(`<div class="skeleton" aria-hidden="true"><p class="locating">Finding where you are…</p></div>${S.places.length ? `<div class="row-c"><button class="pill" data-action="location">${svg('magnify', 18)}Choose a place</button></div>` : ''}`) : renderWelcome();
  if (!S.data || S.data.key !== locKey()) {
    if (S.error) return renderMsg('Couldn’t load the forecast', esc(S.error), true);
    return renderShell('<div class="skeleton" aria-hidden="true"></div>', true);
  }
  const m = model(S.data);
  const night = m.sun.night, c = m.entity.state;
  const sky = (night && V.vivid[c + '-night']) || V.vivid[c] || V.vivid.cloudy;

  const card = slot('card', 'section', 'w3-card');
  const hero = slot('hero', 'div');
  const hours = slot('hours', 'div', 'w3-hours');
  const days = slot('days', 'div', 'w3-days');
  const foot = slot('foot', 'div', 'foot');
  const alerts = slot('alerts', 'div', 'alerts');
  const dots = slot('dots', 'nav', 'dots');
  dots.setAttribute('aria-label', 'Places');
  if (!card.contains(days)) { card.replaceChildren(hero, hours, days); }
  if (!app.contains(card) || app.firstElementChild !== alerts) { app.replaceChildren(alerts, card, dots, foot); }
  put(dots, dotsBar());

  put(hero, w3Hero(m));
  skyEl.hidden = false;
  put(skyEl, heroSky);
  document.body.style.background = sky;               // the same colours under the sky layer, for the bounce at either end of the page
  S.heroRise = false;
  // Keep the tray where you left it: remember which hour is at its left edge, and after a
  // repaint (or the hour rolling over) put that same hour back there. A new place starts at "Now".
  const tray = document.getElementById('hxTray');
  let anchor = null;
  if (tray && !S.swap && tray.scrollLeft > 4) {
    const edge = tray.getBoundingClientRect().left, c = [...tray.querySelectorAll('[data-hour]')].find(c => c.getBoundingClientRect().right > edge + 6);
    if (c) anchor = { t: c.dataset.hour, d: c.getBoundingClientRect().left - edge };
  }
  put(hours, w3Hours(m));
  const tray2 = document.getElementById('hxTray');
  if (tray2 && anchor) {
    const c = tray2.querySelector(`[data-hour="${anchor.t}"]`);
    tray2.scrollLeft = c ? tray2.scrollLeft + c.getBoundingClientRect().left - tray2.getBoundingClientRect().left - anchor.d : 0;
  }
  const vsw = document.getElementById('vsw');
  slide(vsw, vsw && vsw.querySelector('[aria-pressed="true"]'), 'wxview', { jump: !S.vswPlaced });
  S.vswPlaced = true;
  if (S.view === 'radar') radarSync(); else stopRadar();
  if (S.swap) {                                       // a new place slides in from the side you swiped toward
    S.swap = false;
    const swiped = S.swipeIn; S.swipeIn = false;
    if (!calm()) {
      skyEl.animate([{ opacity: 0.25 }, { opacity: 1 }], { duration: 480, easing: 'ease-out' });
      const w = card.offsetWidth;   // after a swipe it comes in from the edge the old one left by; after a tap, from a little way off
      card.animate([{ opacity: swiped ? 0.35 : 0, transform: `translateX(${(S.dir || 1) * (swiped ? w : w * 0.3)}px)` }, { opacity: 1, transform: 'none' }],
        { duration: swiped ? 360 : 420, easing: 'cubic-bezier(.22,1,.36,1)' });
    }
  }
  put(days, wDays(m));

  const at = new Date(S.data.fetchedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const status = S.loading ? `${svg('refresh', 14, '').replace('class="i"', 'class="i spin"')} Updating…`

// Tap an hour: a Liquid Glass sheet with everything about it, and arrows to step through the day.

// One day, hour by hour, on a midnight-to-midnight axis: the temperature as a line in the
// ramp's colours, rain as bars along the bottom, night shaded, and Now marked on today
// (whose line starts at the current hour - the hours gone are not in the forecast).
function dayChart(m, hrs, rise, set) {
  const tz = m.tz, ramp = rampOf(m), metric = (m.entity.attributes.temperature_unit || '').indexOf('C') >= 0;
  const X0 = 6, X1 = 314, YT = 34, YB = 96, RB = 134, RH = 26;
  const x = f => X0 + f / 24 * (X1 - X0);
  const seen = new Set(), pts = [];
  for (const h of hrs) {                               // a clock-change day repeats an hour; keep the first
    const f = hourFrac(h.t, tz), k = Math.floor(f);
    if (h.p == null || seen.has(k)) continue;
    seen.add(k); pts.push({ f: k, h });
  }
  if (pts.length < 2) return '<div class="dd-none">Hour-by-hour detail isn\'t available for this day yet.</div>';
  const vs = pts.map(p => p.h.p), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  const span = Math.max(metric ? 4 : 7, hi - lo), base = lo - (span - (hi - lo)) / 2;   // a quiet day stays flat
  const y = v => YB - (v - base) / span * (YB - YT);
  const P = pts.map(p => [x(p.f + 0.5), y(p.h.p)]);
  // A smooth curve through every hour (whole degrees would otherwise look like stairs), flat
  // at each peak and trough so it never bulges past the day's real high or low.
  const ms = P.slice(1).map((q, i) => (q[1] - P[i][1]) / (q[0] - P[i][0]));
  const tg = P.map((q, i) => i === 0 ? ms[0] : i === P.length - 1 ? ms[i - 1] : ms[i - 1] * ms[i] < 0 ? 0 : (ms[i - 1] + ms[i]) / 2);
  let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for (let i = 1; i < P.length; i++) {
    const [x0, y0] = P[i - 1], [x1, y1] = P[i], k = (x1 - x0) / 3;
    d += ` C${(x0 + k).toFixed(1)},${(y0 + tg[i - 1] * k).toFixed(1)} ${(x1 - k).toFixed(1)},${(y1 - tg[i] * k).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  const area = `${d} L${P[P.length - 1][0].toFixed(1)},${RB} L${P[0][0].toFixed(1)},${RB} Z`;
  const grad = [0, 1, 2, 3, 4].map(k => `<stop offset="${k / 4}" stop-color="${ramp(base + span * k / 4)}"/>`).join('');
  // Night: from the sun when it rises and sets that day, else hour by hour.
  let night = '';
  const band = (a, b) => b > a ? `<rect x="${x(a).toFixed(1)}" y="${YT - 26}" width="${(x(b) - x(a)).toFixed(1)}" height="${RB - YT + 26}" rx="6" fill="rgba(0,8,30,0.22)"/>` : '';
  if (rise && set) night = band(0, hourFrac(rise, tz)) + band(hourFrac(set, tz), 24);
  else night = pts.filter(p => p.h.dark).map(p => band(p.f, p.f + 1)).join('');
  const wetH = h => m.rKind === 'pop' ? h.r / 100 : Math.min(1, h.r / (metric ? 5 : 0.2));
  const bars = pts.filter(p => p.h.r > 0).map(p => {
    const hgt = Math.max(2, wetH(p.h) * RH);
    return `<rect x="${(x(p.f) + 1.5).toFixed(1)}" y="${(RB - hgt).toFixed(1)}" width="${(x(1) - X0 - 3).toFixed(1)}" height="${hgt.toFixed(1)}" rx="2" fill="#5AC8FA" opacity="${(0.45 + 0.5 * wetH(p.h)).toFixed(2)}"/>`;
  }).join('');
  const hiP = pts.reduce((b, p) => p.h.p > b.h.p ? p : b), loP = pts.reduce((b, p) => p.h.p < b.h.p ? p : b);
  const cx = p => Math.min(X1 - 14, Math.max(X0 + 14, x(p.f + 0.5)));
  const mark = (p, above) => `<circle cx="${x(p.f + 0.5).toFixed(1)}" cy="${y(p.h.p).toFixed(1)}" r="4" fill="#fff"/>`
    + `<text class="lbl" x="${cx(p).toFixed(1)}" y="${(y(p.h.p) + (above ? -10 : 20)).toFixed(1)}" text-anchor="middle">${p.h.p}°</text>`;
  const marks = hi === lo ? mark(hiP, true) : mark(hiP, true) + mark(loP, false);
  const clock = H => new Date(Date.UTC(2000, 0, 1, H)).toLocaleTimeString([], { hour: 'numeric', timeZone: 'UTC' }).replace(/\s/g, '');
  const ticks = [6, 12, 18].map(H => `<line x1="${x(H)}" x2="${x(H)}" y1="${RB}" y2="${RB + 4}" stroke="rgba(255,255,255,0.3)"/><text x="${x(H)}" y="${RB + 17}" text-anchor="middle">${clock(H)}</text>`).join('');
  const nowF = hourFrac(Date.now() / 1000, tz);
  const nowM = ymd(Date.now() / 1000, tz) === ymd(pts[0].h.t, tz)
    ? `<line x1="${x(nowF).toFixed(1)}" x2="${x(nowF).toFixed(1)}" y1="${YT - 18}" y2="${RB}" stroke="#fff" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.75"/><text x="${Math.max(X0 + 12, x(nowF)).toFixed(1)}" y="${YT - 22}" text-anchor="middle">Now</text>` : '';
  return `<svg class="dd-chart" viewBox="0 0 320 156" role="img" aria-label="Temperature from ${lo}° to ${hi}° through the day">
      <defs><linearGradient id="ddT" gradientUnits="userSpaceOnUse" x1="0" y1="${YB}" x2="0" y2="${YT}">${grad}</linearGradient>
        <linearGradient id="ddA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      ${night}
      <line x1="${X0}" x2="${X1}" y1="${RB}" y2="${RB}" stroke="rgba(255,255,255,0.22)"/>
      ${bars}
      <path d="${area}" fill="url(#ddA)"/>
      <path d="${d}" fill="none" stroke="url(#ddT)" stroke-width="3.5" stroke-linecap="round"/>
      ${nowM}${marks}${ticks}
    </svg>
    <div class="dd-key"><span><i style="background:linear-gradient(90deg,${ramp(lo)},${ramp(hi)})"></i>Temperature</span><span><i style="background:#5AC8FA"></i>${m.rKind === 'pop' ? 'Chance of rain' : 'Rain'}</span><span><i style="background:rgba(0,8,30,0.45)"></i>Night</span></div>`;
}

// Tap a day: the hour popup's Liquid Glass sheet, for a whole day, with arrows to step through the week.
function fillDay() {
  if (!S.data) return closeSheet();
  const m = model(S.data), tz = m.tz, days = (m.fc.daily || []).slice(0, 7);
  if (!days.length) return closeSheet();
  let i = days.findIndex(d => ymd(d.t, tz) === S.dayKey);
  if (i < 0) i = S.dayKey < ymd(days[0].t, tz) ? 0 : days.length - 1;   // the day you opened may have passed since
  const d = days[i], key = ymd(d.t, tz), a = m.entity.attributes;
  const today = key === ymd(Date.now() / 1000, tz);
  S.dayKey = key;
  dayTitle.textContent = today ? 'Today' : dayLong(d.t, tz);
  navState(dayNav, i === 0, i === days.length - 1);
  const hrs = (m.fc.hourly || []).filter(h => ymd(h.t, tz) === key);
  const ev = sunEvents(S.data.lat, S.data.lon, Date.now(), 9).filter(e => !e.polar);
  const rise = ev.map(e => e.rise).find(t => ymd(t, tz) === key), set = ev.map(e => e.set).find(t => ymd(t, tz) === key);
  const sky = V.vivid[d.c] || V.vivid.cloudy, icon = V.icons[d.c] || 'weather-cloudy', tint = V.tints[d.c] || '#FFFFFF';
  const tile = (k, ico, label, value, sub) => `<div class="hd-tile" style="--k:${k}"><div class="hd-k">${ico}${label}</div><div class="hd-v">${value}</div><div class="hd-s">${sub || '&nbsp;'}</div></div>`;
  const most = k => hrs.filter(h => h[k] != null).reduce((b, h) => !b || h[k] > b[k] ? h : b, null);
  const vals = k => hrs.map(h => h[k]).filter(v => v != null);
  const tiles = [];

  const top = most('r');
  if (m.rKind === 'pop') tiles.push(tile(2, svg('umbrella-outline', 17, ''), 'Chance of rain', `${Math.round(d.r)}%`,
    wet(m, d.r) && top && top.r >= 20 ? `Most likely around ${hrFmt(top.t, tz)}` : 'Unlikely'));
  else tiles.push(tile(2, svg('umbrella-outline', 17, ''), 'Rain', d.r > 0 ? `${d.r}<small> ${a.precipitation_unit || ''}</small>` : 'None',
    d.r > 0 ? (top && top.r > 0 ? `Heaviest around ${hrFmt(top.t, tz)}` : 'Total for the day') : 'A dry day'));
  const w = most('w');
  if (w) tiles.push(tile(3, line('wind', 17), 'Wind',
    `${w.deg == null ? '' : `<span class="hd-arrow" style="transform:rotate(${(w.deg + 180) % 360}deg)">${svg('navigation', 22, '')}</span>`}${w.w}<small> ${a.wind_speed_unit || 'mph'}</small>`,
    `Strongest at ${hrFmt(w.t, tz)}${w.deg == null ? '' : `, from the ${compass(w.deg)}`}`));

    const avg = Math.round(hu.reduce((s, v) => s + v, 0) / hu.length), hlo = Math.min.apply(null, hu), hhi = Math.max.apply(null, hu);
    tiles.push(tile(4, line('drop', 17), 'Humidity', `${avg}%`, hlo === hhi ? dampWord(avg) : `${dampWord(avg)}, ${hlo}–${hhi}%`));
  }
  const fl = vals('fl');

  }
  if (rise && set) {
    const len = Math.round((set - rise) / 60);
    tiles.push(`<div class="hd-tile wide" style="--k:6"><div class="hd-k">${svg('weather-sunset-up', 18, 'color:#FFD60A;')}Sunrise</div><div class="hd-v">${minFmt(rise, tz)}</div></div><div class="hd-tile wide" style="--k:6"><div class="hd-k">${svg('weather-sunset-down', 18, 'color:#FFD60A;')}Sunset</div><div class="hd-v">${minFmt(set, tz)}</div><div class="hd-s">${Math.floor(len / 60)}h ${len % 60}m of daylight</div></div>`);
  }
  if (d.dt || d.nt) tiles.push(`<div class="hd-tile full" style="--k:7"><div class="hd-k">${line('text', 17)}Forecast</div>`
    + (d.dt ? `<p class="dd-txt"><b>${today ? 'Today' : 'Day'}</b>${esc(d.dt)}</p>` : '')
    + (d.nt ? `<p class="dd-txt"><b>${today ? 'Tonight' : 'Night'}</b>${esc(d.nt)}</p>` : '')
    + '<div class="hd-s">National Weather Service</div></div>');

  dayBody.innerHTML = `<div class="hd-hero" style="background:${sky};--k:0">
      <div><div class="hd-temp" aria-label="High ${d.h}°, low ${d.l}°">${d.h}<span>°</span><em>${d.l}°</em></div><div class="hd-words">${V.words[d.c] || d.c}</div></div>
      ${svg(icon, 76, `color:${tint};filter:drop-shadow(0 0 12px ${tint}99);`)}
    </div>
    <div class="hd-grid"><div class="hd-tile full" style="--k:1"><div class="hd-k">${line('thermo', 17)}Through the day</div>${dayChart(m, hrs, rise, set)}</div>${tiles.join('')}</div>`;
  dayBody.scrollTop = 0;
}
function openDay(i) {
  if (!S.data) return;
  const m = model(S.data), d = (m.fc.daily || [])[i];
  if (!d) return;
  S.dayKey = ymd(d.t, m.tz); fillDay(); dayWrap.classList.add('open'); lockBehind(dayWrap);
}
function stepDay(dir) {
  const m = model(S.data), days = (m.fc.daily || []).slice(0, 7);
  const i = days.findIndex(d => ymd(d.t, m.tz) === S.dayKey), n = Math.max(0, Math.min(days.length - 1, (i < 0 ? 0 : i) + dir));

// Disable a sheet's arrow at the first or last item without losing keyboard focus: a
// focused button that becomes disabled drops focus out of the sheet.
function navState(btns, atStart, atEnd) {
  const lost = (atStart && document.activeElement === btns[0]) || (atEnd && document.activeElement === btns[1]);
  btns[0].disabled = atStart; btns[1].disabled = atEnd;
  if (lost) (btns[atStart ? 1 : 0].disabled ? btns[0].closest('.sheet') : btns[atStart ? 1 : 0]).focus({ preventScroll: true });
}

}

  if (app.inert) { app.inert = false; if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true }); lastFocus = null; }
}
// The sliding glass thumb under the units switch (home/slide.js, loaded first).

let searchTimer, searchSeq = 0;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const term = q.value.trim();
  if (term.length < 2) { searchSeq++; results.innerHTML = ''; return; }   // and drop any answer still on its way
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try {
      const j = await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(term)}&count=8&language=en&format=json`, { headers: {} });
      if (seq !== searchSeq) return;
      const list = j.results || [];
      results.innerHTML = list.length ? list.map((p, i) =>
        `<button data-pick="${i}">${svg('weather-partly-cloudy', 20, 'color:var(--muted);')}<span>${esc(p.name)}<small>${esc([p.admin1, p.country].filter(Boolean).join(', '))}</small></span></button>`
      ).join('') : '<button disabled><span>No matches</span></button>';
      results._list = list;
    } catch (e) {
      if (seq === searchSeq) results.innerHTML = '<button disabled><span>Search is unavailable offline</span></button>';
    }
  }, 250);
});

// ---- Events ----
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action],[data-close],[data-pick],[data-pick-place],[data-remove],[data-u],[data-alert],[data-view],[data-rz],[data-rplay],[data-hour],[data-hstep],[data-day],[data-dstep]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.view) {
    if (S.view !== t.dataset.view) { S.view = t.dataset.view; store.set('view', S.view); stopRadar(); render(); }
    return;
  }
  if (t.dataset.hour) return openHour(+t.dataset.hour);
  if (t.dataset.hstep) return stepHour(+t.dataset.hstep);
  if (t.dataset.day != null) return openDay(+t.dataset.day);
  if (t.dataset.dstep) return stepDay(+t.dataset.dstep);
  if (t.dataset.rz) { R.touched = true; R.z = Math.max(5, Math.min(9, R.z + +t.dataset.rz)); return radarSync(); }
  if (t.hasAttribute('data-rplay')) { R.touched = true; return radarPlay(!R.playing); }
  if (t.dataset.alert != null) { S.alertOpen[t.dataset.alert] = !S.alertOpen[t.dataset.alert]; return render(); }
  if (t.dataset.pick != null) {
    const p = results._list[+t.dataset.pick];
    if (!canAdd(p)) { results.innerHTML = `<button disabled><span>You have ${MAX_PLACES} places. Remove one to add another.</span></button>`; return; }
    q.value = ''; results.innerHTML = '';
    closeSheet();
    return addPlace(p);
  }
  if (t.dataset.pickPlace != null) { closeSheet(); return pickPlace(t.dataset.pickPlace); }
  if (t.dataset.remove != null) { removePlace(+t.dataset.remove); placesList.innerHTML = placesRows(); return; }
  if (t.dataset.u) {
    if (S.units !== t.dataset.u) { S.units = t.dataset.u; store.set('units', S.units); syncUnits(); placesList.innerHTML = placesRows(); render(); }
    return;
  }
  switch (t.dataset.action) {
    case 'refresh': refresh(true); break;
    case 'location': openSheet(); break;
    case 'gps': closeSheet(); autoLocate(false); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  const h = (e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-hour],[data-day]');
  if (h) { e.preventDefault(); h.dataset.hour ? openHour(+h.dataset.hour) : openDay(+h.dataset.day); }
});
document.addEventListener('input', e => { if (e.target.id === 'rdScrub') { R.touched = true; radarPlay(false); radarShow(+e.target.value); } });

// Drag the forecast card sideways to move between places. It follows your finger,
// gives a little at the first and last place, springs back if you let go early,
// and otherwise slides away while the next place slides in from the other side.
// The hourly tray, the radar and the view buttons keep their own gestures.
let drag = null, pendingSwipe = null;
app.addEventListener('touchstart', e => {
  drag = null;
  const card = document.getElementById('card');
  if (!card || !card.isConnected || e.touches.length !== 1 || !card.contains(e.target) || e.target.closest('#hxTray, #rd, .vsw')) return;
  // A quick second swipe: finish the first switch now (it redraws the card, so only after checking where the touch landed).
  if (pendingSwipe) pendingSwipe();
  const t = e.touches[0];
  // The rest of this touch is heard on the element it started on: if a repaint replaces that
  // element mid-drag, its events no longer bubble up to the app, but they still reach it.
  const el = e.target;
  drag = { card: document.getElementById('card'), el, x0: t.clientX, y0: t.clientY, x: t.clientX, t: e.timeStamp, dx: 0, vx: 0, axis: null };
  el.addEventListener('touchmove', moveDrag, { passive: false });
  el.addEventListener('touchend', endDrag, { passive: true });
  el.addEventListener('touchcancel', endDrag, { passive: true });
}, { passive: true });
function moveDrag(e) {
  const d = drag;
  if (!d) return;
  const t = e.touches[0], dx = t.clientX - d.x0, dy = t.clientY - d.y0;
  if (!d.axis) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    d.axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
  }
  if (d.axis !== 'x') return;
  e.preventDefault();                                   // the page should not scroll while the card is being dragged
  const dt = Math.max(1, e.timeStamp - d.t);
  d.vx = 0.7 * ((t.clientX - d.x) / dt) + 0.3 * d.vx; d.x = t.clientX; d.t = e.timeStamp;
  const ids = placeIds(), i = ids.indexOf(currentId());
  const atEnd = (dx > 0 && i <= 0) || (dx < 0 && i >= ids.length - 1);
  d.dx = atEnd ? dx * 0.22 : dx;
  if (calm()) return;
  d.card.style.transform = `translateX(${d.dx}px)`;
  d.card.style.opacity = String(1 - Math.min(0.3, Math.abs(d.dx) / d.card.offsetWidth * 0.45));
}
function endDrag() {
  const d = drag; drag = null;
  if (!d) return;
  d.el.removeEventListener('touchmove', moveDrag); d.el.removeEventListener('touchend', endDrag); d.el.removeEventListener('touchcancel', endDrag);
  if (d.axis !== 'x') return;
  const w = d.card.offsetWidth, ids = placeIds(), i = ids.indexOf(currentId());
  const dir = d.dx < 0 ? 1 : -1, next = ids[i + dir];
  const flick = Math.abs(d.vx) > 0.4 && Math.sign(d.vx) === Math.sign(d.dx);
  const go = !!next && (Math.abs(d.dx) > w * 0.25 || flick);
  const from = { transform: `translateX(${d.dx}px)`, opacity: d.card.style.opacity || '1' };
  d.card.style.transform = ''; d.card.style.opacity = '';
  if (calm()) { if (go) pickPlace(next); return; }
  if (!go) { d.card.animate([from, { transform: 'none', opacity: 1 }], { duration: 340, easing: 'cubic-bezier(.2,.9,.3,1.12)' }); return; }
  const out = d.card.animate([from, { transform: `translateX(${-dir * w}px)`, opacity: 0.35 }],
    { duration: Math.max(120, Math.min(220, (w - Math.abs(d.dx)) / Math.max(0.6, Math.abs(d.vx)))), easing: 'cubic-bezier(.3,0,.7,.7)', fill: 'forwards' });
  const fromId = currentId();
  pendingSwipe = () => {
    pendingSwipe = null;
    if (currentId() === fromId) { S.swipeIn = true; pickPlace(next); }   // unless a dot or the sheet already went somewhere else
    out.cancel();
  };
  out.onfinish = () => { if (pendingSwipe) pendingSwipe(); };
}


// Refresh when the app comes back to the front and every 15 minutes while
// open; refresh() itself skips the network if the data is under 10 min old.
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
setInterval(() => { if (!document.hidden) refresh(false); }, 15 * 60 * 1000);
// The hourly strip's "Now" and the sun marks move with the clock, not the
// data; re-render each minute so they roll over without a fetch.
setInterval(() => { if (!document.hidden && S.data) render(); }, 60 * 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Open to where you are: the last known place at once, then its fresh forecast.
if (S.loc) { render(); refresh(false); }
else autoLocate(true);
</script>
<!-- Opened from AllisonOS Home: swipe up from the bottom to go back to it. -->
<script src="../home/back.js" defer></script>
