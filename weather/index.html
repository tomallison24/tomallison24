<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather</title>
<meta name="description" content="Signal-style weather for the home screen: the W3 Vivid card from the Home Assistant dashboard, fed by Open-Meteo.">
<meta name="theme-color" content="#0A0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Weather">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<!--
  Weather - the Signal dashboard's W3 "Vivid" card as a standalone app.

  The card is a port of views_signal/favorites.yaml in ha-config (the WEATHER
  block, promoted 2026-09-23): same skies, particle layer, glass chips, hourly
  tray, chevron and 7-day drawer, same numbers and timings. What changed is
  only the plumbing:

    HA                                  HERE
    weather.forecast_home (Met.no)   -> Open-Meteo /v1/forecast, no key
    sensor.signal_weather            -> toForecast(): same short keys
                                        (t c p r h l), same 12h / 7d cut
    sun.sun                          -> current.is_day + daily sunrise/sunset
    input_boolean..._expanded        -> localStorage, per phone
    <ha-icon>                        -> inline MDI paths, so it works offline

  Markup is still deterministic (seeded particles) and the DOM is only
  replaced when the string changes, for the same reason as on the dashboard:
  a repaint must not restart the animations.
-->
<style>
  :root {
    --bg: #0A0A0C;
    --surface: #131316;
    --border: #2A2A2E;
    --text: #FFFFFF;
    --muted: rgba(235, 235, 245, 0.6);
    --accent: #0A84FF;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
    overscroll-behavior-y: none;
  }
  main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg.i { display: inline-block; flex: none; }

  /* ---- The card: ha-card + button-card grid, as W3 styles them ---- */
  .w3-card {
    position: relative; overflow: hidden;
    border-radius: 26px; padding: 18px 16px 14px 16px; color: #FFFFFF;
    display: grid; grid-template-columns: 1fr; row-gap: 14px;
  }
  .w3-drawer { position: relative; overflow: hidden; border-radius: 26px; padding: 6px 16px 10px 16px; color: #FFFFFF; }
  .w3-chevrow { position: relative; z-index: 1; height: 44px; margin: -10px 0; display: flex; align-items: center; justify-content: center; }
  .w3-chev {
    width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.35), 0 1px 2px rgba(0,0,0,0.30);
    color: rgba(255,255,255,0.85);
  }
  .w3-place { display: inline-flex; align-items: center; gap: 4px; }

  .w3-fx { position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .w3-sky { position:absolute; inset:-2px; background-size:100% 180% !important; animation:w3-sky 22s ease-in-out infinite alternate; }
  .w3-sun { position:absolute; top:-90px; right:-90px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle, rgba(255,226,120,0.60) 0%, rgba(255,214,10,0.22) 32%, rgba(255,214,10,0) 64%); animation:w3-pulse 6s ease-in-out infinite alternate; }
  .w3-rays { position:absolute; top:-170px; right:-170px; width:420px; height:420px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(255,255,255,0.13) 0deg 5deg, rgba(255,255,255,0) 5deg 15deg); -webkit-mask-image:radial-gradient(circle, #000 18%, transparent 62%); mask-image:radial-gradient(circle, #000 18%, transparent 62%); animation:w3-spin 80s linear infinite; }
  .w3-moon { position:absolute; top:-70px; right:-70px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(215,225,255,0.35) 0%, rgba(215,225,255,0.10) 35%, rgba(215,225,255,0) 65%); animation:w3-pulse 7s ease-in-out infinite alternate; }
  .w3-star { position:absolute; border-radius:50%; background:#FFFFFF; animation:w3-twinkle ease-in-out infinite alternate; }
  .w3-cloud { position:absolute; left:-45%; border-radius:999px; background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%); filter:blur(6px); animation:w3-drift linear infinite; }
  .w3-drop { position:absolute; top:-40px; width:1.5px; border-radius:2px; background:linear-gradient(180deg, rgba(255,255,255,0), rgba(220,238,255,0.85)); animation:w3-fall linear infinite; }
  .w3-flake { position:absolute; top:-12px; border-radius:50%; background:#FFFFFF; animation:w3-snow linear infinite; }
  .w3-flash { position:absolute; inset:0; background:#EBEBFF; opacity:0; animation:w3-flash 9s linear infinite; }
  .w3-fog { position:absolute; left:-30%; width:160%; border-radius:999px; background:rgba(255,255,255,0.22); filter:blur(14px); animation:w3-fogdrift ease-in-out infinite alternate; }
  .w3-gust { position:absolute; left:-40%; height:1.5px; border-radius:2px; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7), rgba(255,255,255,0)); animation:w3-gust linear infinite; }
  .w3-in { position:relative; z-index:1; text-shadow:0 1px 2px rgba(0,0,0,0.18); animation:w3-rise .7s cubic-bezier(.2,.8,.2,1) both; }
  .w3-hours { position:relative; z-index:1; }
  .w3-ico { display:inline-flex; }
  .w3-spin-slow { animation:w3-spin 30s linear infinite; }
  .w3-bob { animation:w3-bob 4s ease-in-out infinite alternate; }
  .w3-glow { animation:w3-glow 4s ease-in-out infinite alternate; }
  .w3-flicker { animation:w3-flicker 5s linear infinite; }
  @keyframes w3-sky { from { background-position:50% 0%; } to { background-position:50% 100%; } }
  @keyframes w3-pulse { from { transform:scale(1); opacity:.85; } to { transform:scale(1.12); opacity:1; } }
  @keyframes w3-spin { to { transform:rotate(360deg); } }
  @keyframes w3-twinkle { from { opacity:.15; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
  @keyframes w3-drift { from { left:-45%; } to { left:110%; } }
  @keyframes w3-fall { from { transform:translate(0, 0) rotate(12deg); } to { transform:translate(-80px, 380px) rotate(12deg); } }
  @keyframes w3-snow { 0% { transform:translate(0, 0); } 50% { transform:translate(14px, 170px); } 100% { transform:translate(-8px, 340px); } }
  @keyframes w3-flash { 0%, 86%, 100% { opacity:0; } 87% { opacity:.55; } 88% { opacity:.05; } 90% { opacity:.4; } 92% { opacity:0; } }
  @keyframes w3-fogdrift { from { transform:translateX(-8%); } to { transform:translateX(8%); } }
  @keyframes w3-gust { from { left:-40%; } to { left:120%; } }
  @keyframes w3-bob { from { transform:translateY(-2px); } to { transform:translateY(3px); } }
  @keyframes w3-glow { from { filter:drop-shadow(0 0 4px rgba(255,255,255,0.25)); } to { filter:drop-shadow(0 0 14px rgba(255,255,255,0.60)); } }
  @keyframes w3-flicker { 0%, 84%, 100% { opacity:1; } 85% { opacity:.35; } 87% { opacity:1; } 89% { opacity:.5; } 91% { opacity:1; } }
  @keyframes w3-rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes w3-sway { from { transform:rotate(calc(var(--w3-rot) - 10deg)); } to { transform:rotate(calc(var(--w3-rot) + 10deg)); } }
  @media (prefers-reduced-motion: reduce) {
    .w3-fx *, .w3-in, .w3-ico, .w3-col, .w3-sway { animation:none !important; }
  }

  /* ---- App chrome: Signal's own surfaces, not the sky ---- */
  .foot { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 6px 0; }
  .foot button { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); padding: 6px 8px; border-radius: 999px; }
  .foot button:active { background: var(--surface); }
  .spin { animation: w3-spin 1s linear infinite; }

  .msg { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 16px; font-size: 15px; line-height: 1.4; }
  .msg b { display: block; font-size: 17px; margin-bottom: 4px; }
  .msg .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; background: #1F1F23; border: 1px solid var(--border); font-size: 15px; font-weight: 600; }
  .pill.primary { background: var(--accent); border-color: var(--accent); }

  .skeleton { height: 290px; border-radius: 26px; background: linear-gradient(160deg, #1A1D24, #22262F); animation: w3-pulse 1.4s ease-in-out infinite alternate; }

  /* Location sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; margin: 0 auto; max-width: 520px;
    background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom) + 18px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
    max-height: 85vh; overflow-y: auto;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grab { width: 36px; height: 5px; border-radius: 3px; background: #3A3A3F; margin: 0 auto 12px; }
  .sheet h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { width: 30px; height: 30px; border-radius: 999px; background: #1F1F23; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .search { display: flex; align-items: center; gap: 8px; background: #1F1F23; border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; color: var(--muted); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; padding: 11px 0; }
  .list { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
  .list:empty { display: none; }
  .list button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; background: #18181B; font-size: 16px; }
  .list button + button { border-top: 1px solid var(--border); }
  .list button small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .list button:active { background: #232327; }
  .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; margin: 18px 4px 8px; }
  .seg { display: flex; background: #1F1F23; border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .seg button { flex: 1; padding: 7px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #3A3A3F; color: var(--text); }
  .note { font-size: 12px; color: var(--muted); margin: 14px 4px 0; line-height: 1.4; }
</style>
</head>
<body>
<main id="app"><div class="skeleton" aria-hidden="true"></div></main>

<div id="sheetWrap">
  <div class="scrim" data-close></div>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab"></div>
    <h2><span id="sheetTitle">Location</span><button data-close aria-label="Close"></button></h2>
    <label class="search"><span id="searchIcon"></span><input id="q" type="search" placeholder="Search for a city" autocomplete="off" enterkeyhint="search"></label>
    <div class="list" id="results"></div>
    <div class="list" id="gpsList"></div>
    <div class="label">Units</div>
    <div class="seg" id="units">
      <button data-u="us" aria-pressed="true">°F · mph · in</button>
      <button data-u="metric" aria-pressed="false">°C · km/h · mm</button>
    </div>
    <p class="note">Forecast by Open-Meteo. Place names for your current location by BigDataCloud. Your location is sent to those two services only.</p>
  </section>
</div>

// ---- WMO weather code -> HA condition string ----
// Open-Meteo reports WMO codes; the card speaks HA conditions. 0/1 (clear,
// mainly clear) are sunny by day and clear-night after dark, which is the
// split Met.no makes too. Thunderstorm with hail (96/99) stays
// lightning-rainy: the storm is the bigger fact.
function condition(code, isDay) {
  let c;
  if (code <= 1) c = 'sunny';
  else if (code === 2) c = 'partlycloudy';
  else if (code === 3) c = 'cloudy';
  else if (code === 45 || code === 48) c = 'fog';
  else if (code === 65 || code === 82) c = 'pouring';
  else if ([56, 57, 66, 67].includes(code)) c = 'snowy-rainy';
  else if ((code >= 71 && code <= 77) || code === 85 || code === 86) c = 'snowy';
  else if (code >= 95) c = 'lightning-rainy';
  else if (code >= 51 && code <= 81) c = 'rainy';
  else c = 'cloudy';
  if (c === 'sunny' && isDay === 0) c = 'clear-night';
  return c;
}

// ---- State ----
const store = {
  get(k, d) { try { const v = localStorage.getItem('wx.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wx.' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = {
  loc: store.get('loc', null),            // { mode: 'gps' | 'city', lat, lon, name }
  units: store.get('units', 'us'),
  expanded: store.get('expanded', false),
  data: store.get('data', null),          // last Open-Meteo response + { fetchedAt, key }
  loading: false,
  error: null
};

// ---- Fetching ----
const UNITS = {
  us: '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch',
  metric: '&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm'
};
const locKey = () => S.loc ? `${S.loc.lat.toFixed(3)},${S.loc.lon.toFixed(3)},${S.units}` : '';

async function fetchForecast() {
  const { lat, lon } = S.loc;
  const url = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`
    + '&current=temperature_2m,relative_humidity_2m,is_day,weather_code,wind_speed_10m,wind_direction_10m'
    + '&hourly=temperature_2m,weather_code,precipitation,is_day'
    + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset'
    + '&timezone=auto&timeformat=unixtime&forecast_days=8' + UNITS[S.units];
  const r = await fetch(url);
  if (!r.ok) throw new Error('Open-Meteo ' + r.status);
  const j = await r.json();
  if (!j.current || !j.hourly || !j.daily) throw new Error('Unexpected forecast format');
  return j;
}

async function reverseName(lat, lon) {
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    if (!r.ok) return null;
    const j = await r.json();
    return j.city || j.locality || j.principalSubdivision || null;
  } catch (e) { return null; }
}

function locate() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Location is not available in this browser.'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude }),
      e => rej(new Error(e.code === 1 ? 'Location permission was denied.' : 'Could not get your location.')),
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 30 * 60 * 1000 }
    );
  });
}

async function refresh(force) {
  if (!S.loc || S.loading) return render();
  const fresh = S.data && S.data.key === locKey() && Date.now() - S.data.fetchedAt < 10 * 60 * 1000;
  if (fresh && !force) return render();
  S.loading = true; S.error = null; render();
  try {
    if (S.loc.mode === 'gps') {
      const p = await locate();
      const moved = Math.abs(p.lat - S.loc.lat) > 0.02 || Math.abs(p.lon - S.loc.lon) > 0.02;
      S.loc = Object.assign({}, S.loc, p);
      if (moved || !S.loc.name) S.loc.name = (await reverseName(p.lat, p.lon)) || 'My Location';
      store.set('loc', S.loc);
    }
    const j = await fetchForecast();
    S.data = { om: j, fetchedAt: Date.now(), key: locKey() };
    store.set('data', S.data);
  } catch (e) {
    S.error = e.message || String(e);
  }
  S.loading = false;
  render();
}

// ---- Open-Meteo -> the shapes the card reads ----
// entity  ~ weather.forecast_home  (current conditions, live)
// fc      ~ sensor.signal_weather  (hourly: next 12, daily: next 7; t c p r h l)
// sun     ~ sun.sun                (night flag, next rising/setting)
function model(om) {
  const cur = om.current, H = om.hourly, D = om.daily, u = om.current_units || {};
  const now = Date.now() / 1000;
  const r2 = x => Math.round((x || 0) * 100) / 100;
  let c = condition(cur.weather_code, cur.is_day);
  // WMO has no wind code. A clear-to-cloudy sky with a strong sustained wind
  // gets HA's `windy` so the card's gust layer has something to draw.
  const strong = S.units === 'us' ? 25 : 40;
  if (cur.wind_speed_10m >= strong && cur.weather_code <= 3) c = 'windy';

  const hourStart = Math.floor(now / 3600) * 3600;
  const hourly = [];
  for (let i = 0; i < H.time.length && hourly.length < 12; i++) {
    if (H.time[i] < hourStart) continue;
    hourly.push({ t: H.time[i], c: condition(H.weather_code[i], H.is_day[i]), p: Math.round(H.temperature_2m[i]), r: r2(H.precipitation[i]), day: H.is_day[i] });
  }
  const todayIdx = Math.max(0, D.time.findIndex((t, i) => t <= now && (D.time[i + 1] == null || D.time[i + 1] > now)));
  const daily = [];
  for (let i = todayIdx; i < D.time.length && daily.length < 7; i++) {
    daily.push({ t: D.time[i], c: condition(D.weather_code[i], 1), h: Math.round(D.temperature_2m_max[i]), l: Math.round(D.temperature_2m_min[i]), r: r2(D.precipitation_sum[i]) });
  }
  const next = arr => arr.filter(t => t > now).sort((a, b) => a - b)[0];
  const pu = (u.precipitation || (S.units === 'us' ? 'inch' : 'mm')).replace('inch', 'in');
  return {
    entity: {
      state: c,
      attributes: {
        temperature: cur.temperature_2m,
        humidity: cur.relative_humidity_2m,
        wind_speed: cur.wind_speed_10m,
        wind_speed_unit: (u.wind_speed_10m || '').replace('mp/h', 'mph'),
        wind_bearing: cur.wind_direction_10m,
        temperature_unit: S.units === 'us' ? '°F' : '°C',
        precipitation_unit: pu
      }
    },
    fc: { hourly, daily },
    sun: { night: cur.is_day === 0, next_rising: next(D.sunrise), next_setting: next(D.sunset) },
    tz: om.timezone
  };
}

// ---- The card. Each function is its favorites.yaml template, ported. ----
function w3Hero(m) {
  const { entity, fc, sun } = m;
  const today = (fc.daily || [])[0] || {};
  const night = sun.night;
  const c = entity.state;
  const a = entity.attributes;
  const has = list => list.indexOf(c) >= 0;
  const icon = (night && V.icons[c + '-night']) || V.icons[c] || 'weather-cloudy';
  const tint = V.tints[c] || '#FFFFFF';
  const words = V.words[c] || c;
  const temp = a.temperature == null ? '--' : Math.round(a.temperature);
  const hl = today.h != null ? `H:${today.h}°&nbsp;&nbsp;L:${today.l}°` : '';
  const sky = (night && V.vivid[c + '-night']) || V.vivid[c] || V.vivid.cloudy;

  // Seeded, so the markup is identical on every repaint.
  let seed = 11;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  let fx = '';
  const n = (k, f) => { for (let i = 0; i < k; i++) fx += f(i); };

  if (!night && has(['sunny', 'partlycloudy', 'windy', 'windy-variant'])) {
    fx += '<div class="w3-rays"></div><div class="w3-sun"></div>';
  }
  if (night && has(['clear-night', 'sunny', 'partlycloudy', 'windy', 'windy-variant'])) {
    fx += '<div class="w3-moon"></div>';
    n(has(['clear-night', 'sunny']) ? 28 : 14, () => {
      const s = 1 + rnd() * 1.6;
      return `<i class="w3-star" style="left:${(rnd() * 100).toFixed(1)}%;top:${(rnd() * 62).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;animation-duration:${(2 + rnd() * 3).toFixed(2)}s;animation-delay:-${(rnd() * 4).toFixed(2)}s;"></i>`;
    });
  }
  const clouds = ({ partlycloudy: 3, cloudy: 5, rainy: 4, pouring: 5, hail: 4, lightning: 4, 'lightning-rainy': 5, snowy: 3, 'snowy-rainy': 4, windy: 2, 'windy-variant': 2, exceptional: 3 })[c] || 0;
  const ca = night ? 0.28 : (has(['rainy', 'pouring', 'hail', 'lightning', 'lightning-rainy']) ? 0.38 : 0.55);
  n(clouds, () => {
    const w = 140 + rnd() * 160, d = 45 + rnd() * 50;
    return `<div class="w3-cloud" style="top:${(rnd() * 55 - 10).toFixed(1)}%;width:${w.toFixed(0)}px;height:${(w * 0.45).toFixed(0)}px;opacity:${(ca * (0.6 + rnd() * 0.4)).toFixed(2)};animation-duration:${d.toFixed(1)}s;animation-delay:-${(rnd() * d).toFixed(1)}s;"></div>`;
  });
  const drops = ({ rainy: 28, 'lightning-rainy': 40, pouring: 60, 'snowy-rainy': 16, hail: 24 })[c] || 0;
  n(drops, () => {
    const d = (c === 'pouring' ? 0.55 : 0.8) + rnd() * 0.45;
    return `<i class="w3-drop" style="left:${(rnd() * 115).toFixed(1)}%;height:${(10 + rnd() * 12).toFixed(0)}px;opacity:${(0.35 + rnd() * 0.5).toFixed(2)};animation-duration:${d.toFixed(2)}s;animation-delay:-${(rnd() * d).toFixed(2)}s;"></i>`;
  });
  const flakes = ({ snowy: 34, 'snowy-rainy': 16 })[c] || 0;
  n(flakes, () => {
    const s = 2 + rnd() * 3.5, d = 7 + rnd() * 7;
    return `<i class="w3-flake" style="left:${(rnd() * 100).toFixed(1)}%;width:${s.toFixed(1)}px;height:${s.toFixed(1)}px;opacity:${(0.5 + rnd() * 0.5).toFixed(2)};animation-duration:${d.toFixed(1)}s;animation-delay:-${(rnd() * d).toFixed(1)}s;"></i>`;
  });
  if (has(['lightning', 'lightning-rainy'])) fx += '<div class="w3-flash"></div>';
  if (c === 'fog') n(4, i => `<div class="w3-fog" style="top:${10 + i * 22}%;height:${(34 + rnd() * 20).toFixed(0)}px;animation-duration:${(14 + rnd() * 10).toFixed(1)}s;animation-delay:-${(rnd() * 10).toFixed(1)}s;"></div>`);
  if (has(['windy', 'windy-variant'])) n(9, () => {
    const d = 1.6 + rnd() * 1.6;
    return `<i class="w3-gust" style="top:${(10 + rnd() * 80).toFixed(1)}%;width:${(60 + rnd() * 90).toFixed(0)}px;animation-duration:${d.toFixed(2)}s;animation-delay:-${(rnd() * d * 2).toFixed(2)}s;"></i>`;
  });

  const move = has(['lightning', 'lightning-rainy']) ? 'w3-flicker' : (night ? 'w3-glow' : (c === 'sunny' ? 'w3-spin-slow' : 'w3-bob'));
  const chip = (ic, txt, extra, cls) => `<div style="display:flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border-radius:999px;background:rgba(255,255,255,0.16);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.40);font-size:12px;font-weight:600;letter-spacing:-0.08px;white-space:nowrap;">${svg(ic, 15, extra || '').replace('class="i"', `class="i ${cls || ''}"`)}${txt}</div>`;
  const chips = [];
  if (a.humidity != null) chips.push(chip('water-percent', Math.round(a.humidity) + '%'));
  if (a.wind_speed != null) {
    const rot = ((a.wind_bearing || 0) + 180) % 360;
    chips.push(chip('navigation', `${Math.round(a.wind_speed)} ${a.wind_speed_unit || ''}`, `--w3-rot:${rot}deg;transform:rotate(${rot}deg);animation:w3-sway 3s ease-in-out infinite alternate;`, 'w3-sway'));
  }
  if (today.r != null) chips.push(chip('umbrella-outline', today.r > 0 ? `${today.r} ${a.precipitation_unit || ''}` : 'Dry today'));

  const gps = S.loc && S.loc.mode === 'gps';
  return `
    <div class="w3-fx"><div class="w3-sky" style="background:${sky};"></div>${fx}</div>
    <div class="w3-in">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div style="display:flex;flex-direction:column;align-items:flex-start;min-width:0;">
          <button class="w3-place" data-action="location" aria-label="Change location" style="font-size:15px;font-weight:600;letter-spacing:-0.24px;line-height:1.2;max-width:100%;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(S.loc.name || 'My Location')}</span>${gps ? svg('navigation-variant', 12, 'opacity:0.9;') : ''}</button>
          <div style="font-size:68px;font-weight:200;letter-spacing:-2.5px;line-height:0.95;margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(0,0,0,0.18);">${temp}<span style="opacity:0.9;">°</span></div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none;">
          <div class="w3-ico ${move}">${svg(icon, 46, `color:${tint};filter:drop-shadow(0 0 10px ${tint}99);`)}</div>
          <div style="font-size:15px;font-weight:600;letter-spacing:-0.24px;margin-top:6px;line-height:1.2;">${words}</div>
          <div style="font-size:13px;font-weight:500;letter-spacing:-0.08px;opacity:0.9;margin-top:2px;line-height:1.2;">${hl}</div>
        </div>
      </div>
      ${chips.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;">${chips.join('')}</div>` : ''}
    </div>`;
}

function w3Hours(m) {
  const { entity, fc, sun, tz } = m;
  const hrs = (fc.hourly || []).slice(0, 6);
  if (!hrs.length) return '<div style="font-size:13px;opacity:0.75;padding:10px 0;">Forecast unavailable</div>';
  const marks = [];
  if (sun.next_rising) marks.push({ t: sun.next_rising, kind: 'rise' });
  if (sun.next_setting) marks.push({ t: sun.next_setting, kind: 'set' });
  const first = hrs[0].t, last = hrs[hrs.length - 1].t;
  const seq = hrs.map((h, i) => Object.assign({}, h, { kind: 'hour', now: i === 0 }))
    .concat(marks.filter(k => k.t > first && k.t < last))
    .sort((x, y) => x.t - y.t)
    .slice(0, 6);
  const cur = entity.attributes.temperature;
  const unit = entity.attributes.precipitation_unit || '';
  const fmt = t => new Date(t * 1000).toLocaleTimeString([], { hour: 'numeric', timeZone: tz }).replace(' ', '');
  const fmtM = t => new Date(t * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz }).replace(' ', '');
  const col = (i, now) => `display:flex;flex-direction:column;align-items:center;gap:5px;flex:1 1 0;min-width:0;padding:8px 0;border-radius:15px;${now ? 'background:rgba(255,255,255,0.22);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.50);' : ''}animation:w3-rise .6s cubic-bezier(.2,.8,.2,1) ${(0.15 + i * 0.06).toFixed(2)}s both;`;
  const time = 'font-size:12px;font-weight:600;letter-spacing:-0.08px;line-height:1.2;white-space:nowrap;opacity:0.92;';
  const cell = 'height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  const temp = 'font-size:16px;font-weight:600;letter-spacing:-0.24px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap;';
  const rainLabel = r => r > 0 ? `<div style="font-size:10px;font-weight:700;color:#CDEBFF;line-height:1;margin-top:1px;">${r}${unit}</div>` : '';
  const cols = seq.map((x, i) => {
    if (x.kind !== 'hour') {
      const rise = x.kind === 'rise';
      return `<div class="w3-col" style="${col(i, false)}">
        <div style="${time}">${fmtM(x.t)}</div>
        <div style="${cell}">${svg(rise ? 'weather-sunset-up' : 'weather-sunset-down', 22, 'color:#FFD60A;filter:drop-shadow(0 0 6px #FFD60A99);')}</div>
        <div style="${temp}font-size:12px;font-weight:600;">${rise ? 'Sunrise' : 'Sunset'}</div>
      </div>`;
    }
    // Open-Meteo says per hour whether it is day, so no sunrise/sunset maths.
    const dark = x.day === 0;
    const icon = (dark && V.icons[x.c + '-night']) || V.icons[x.c] || 'weather-cloudy';
    const tint = V.tints[x.c] || '#FFFFFF';
    const v = x.now && cur != null ? Math.round(cur) : x.p;
    return `<div class="w3-col" style="${col(i, x.now)}">
      <div style="${time}">${x.now ? 'Now' : fmt(x.t)}</div>
      <div style="${cell}">${svg(icon, 22, `color:${tint};filter:drop-shadow(0 0 6px ${tint}66);`)}${rainLabel(x.r)}</div>
      <div style="${temp}">${v}°</div>
    </div>`;
  });
  return `<div style="display:flex;align-items:stretch;gap:2px;padding:5px;border-radius:20px;background:rgba(255,255,255,0.12);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);box-shadow:inset 0 0.5px 0 rgba(255,255,255,0.35), 0 10px 24px -14px rgba(0,0,0,0.45);">${cols.join('')}</div>`;
}

// Range bars against the week's own min/max, coloured by ABSOLUTE
// temperature through the five-stop Celsius ramp; a dot on Today marks now.
function wDays(m) {
  const { entity, fc, tz } = m;
  const days = (fc.daily || []).slice(0, 7);
  if (!days.length) return '';
  const unit = entity.attributes.precipitation_unit || '';
  const f = (entity.attributes.temperature_unit || '').indexOf('F') >= 0;
  const toC = t => f ? (t - 32) * 5 / 9 : t;
  const stops = [[0, [122, 184, 255]], [10, [90, 200, 250]], [18, [126, 217, 87]], [25, [255, 214, 10]], [32, [255, 159, 10]]];
  const ramp = t => {
    const c = toC(t);
    if (c <= stops[0][0]) return `rgb(${stops[0][1]})`;
    for (let i = 1; i < stops.length; i++) {
      if (c <= stops[i][0]) {
        const k = (c - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]);
        const rgb = stops[i - 1][1].map((a, j) => Math.round(a + (stops[i][1][j] - a) * k));
        return `rgb(${rgb})`;
      }
    }
    return `rgb(${stops[stops.length - 1][1]})`;
  };
  const min = Math.min.apply(null, days.map(d => d.l));
  const max = Math.max.apply(null, days.map(d => d.h));
  const span = Math.max(1, max - min);
  const pct = t => ((t - min) / span * 100).toFixed(1);
  const cur = entity.attributes.temperature;
  const rows = days.map((d, i) => {
    const name = i === 0 ? 'Today' : new Date(d.t * 1000).toLocaleDateString([], { weekday: 'short', timeZone: tz });
    const icon = V.icons[d.c] || 'weather-cloudy';
    const tint = V.tints[d.c] || '#FFFFFF';
    const rain = d.r > 0 ? `<div style="font-size:10px;font-weight:600;color:#BFE3FF;line-height:1;margin-top:1px;">${d.r}${unit}</div>` : '';
    const dot = (i === 0 && cur != null)
      ? `<div style="position:absolute;top:50%;left:${pct(Math.min(Math.max(cur, d.l), d.h))}%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:999px;background:#FFFFFF;box-shadow:0 0 0 2px rgba(0,0,0,0.30);"></div>`
      : '';
    return `<div style="display:grid;grid-template-columns:52px 34px 34px 1fr 34px;align-items:center;column-gap:10px;height:38px;${i ? 'border-top:0.5px solid rgba(255,255,255,0.22);' : ''}">
      <div style="font-size:15px;font-weight:600;letter-spacing:-0.24px;">${name}</div>
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;">${svg(icon, 22, `color:${tint};`)}${rain}</div>
      <div style="font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;opacity:0.6;">${d.l}°</div>
      <div style="position:relative;height:4px;border-radius:999px;background:rgba(0,0,0,0.28);">
        <div style="position:absolute;top:0;bottom:0;left:${pct(d.l)}%;width:${((d.h - d.l) / span * 100).toFixed(1)}%;border-radius:999px;background:linear-gradient(90deg,${ramp(d.l)},${ramp(d.h)});"></div>${dot}
      </div>
      <div style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;">${d.h}°</div>
    </div>`;
  });
  return `<div>${rows.join('')}</div>`;
}

// ---- Render: build strings, touch the DOM only where a string changed ----
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const app = document.getElementById('app');
const parts = {};
function slot(id, tag, cls) {
  let el = document.getElementById(id);
  if (!el) { el = document.createElement(tag); el.id = id; if (cls) el.className = cls; }
  return el;
}
function put(el, html) { if (parts[el.id] !== html) { el.innerHTML = html; parts[el.id] = html; } }

function render() {
  if (!S.loc) return renderWelcome();
  if (!S.data || S.data.key !== locKey()) {
    if (S.error) return renderMsg('Couldn’t load the forecast', esc(S.error), true);
    app.innerHTML = '<div class="skeleton" aria-hidden="true"></div>'; for (const k in parts) delete parts[k];
    return;
  }
  const m = model(S.data.om);
  const night = m.sun.night, c = m.entity.state;
  const sky = (night && V.vivid[c + '-night']) || V.vivid[c] || V.vivid.cloudy;
  const glow = (night && V.glows[c + '-night']) || V.glows[c] || V.glows.cloudy;

  const card = slot('card', 'section', 'w3-card');
  const hero = slot('hero', 'div');
  const hours = slot('hours', 'div', 'w3-hours');
  const chev = slot('chev', 'div', 'w3-chevrow');
  const drawer = slot('drawer', 'section', 'w3-drawer');
  const foot = slot('foot', 'div', 'foot');
  if (!card.contains(hero)) { card.replaceChildren(hero, hours, chev); }
  if (app.firstElementChild !== card) { app.replaceChildren(card, drawer, foot); }

  card.style.background = sky;
  card.style.boxShadow = '0 18px 40px -16px ' + glow;
  put(hero, w3Hero(m));
  put(hours, w3Hours(m));
  put(chev, `<button class="w3-chev" data-action="toggle" aria-label="${S.expanded ? 'Hide' : 'Show'} 7-day forecast" aria-expanded="${S.expanded}">${svg(S.expanded ? 'chevron-up' : 'chevron-down', 18)}</button>`);

  drawer.hidden = !S.expanded;
  drawer.style.background = sky;
  put(drawer, wDays(m));

  const at = new Date(S.data.fetchedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const status = S.loading ? `${svg('refresh', 14, '').replace('class="i"', 'class="i spin"')} Updating…`
    : S.error ? `Offline · showing ${at}`
    : `Updated ${at}`;
  put(foot, `<button data-action="refresh" aria-label="Refresh">${S.loading ? '' : svg('refresh', 14)}${status}</button><span aria-hidden="true">·</span><button data-action="location">${svg('cog-outline', 14)}Location</button>`);
}

function renderMsg(title, body, retry) {
  for (const k in parts) delete parts[k];
  app.innerHTML = `<div class="msg"><b>${title}</b>${body}<div class="row">
    ${retry ? `<button class="pill primary" data-action="refresh">${svg('refresh', 16)}Try again</button>` : ''}
    <button class="pill" data-action="location">${svg('magnify', 16)}Change location</button></div></div>`;
}

function renderWelcome() {
  for (const k in parts) delete parts[k];
  app.innerHTML = `<div class="msg"><b>Weather</b>Use your current location, or search for a city.<div class="row">
    <button class="pill primary" data-action="gps">${svg('crosshairs-gps', 16)}Use my location</button>
    <button class="pill" data-action="location">${svg('magnify', 16)}Search</button></div>
    ${S.error ? `<p class="note" style="margin:12px 0 0;">${esc(S.error)}</p>` : ''}</div>`;
}

// ---- Location sheet ----
const wrap = document.getElementById('sheetWrap');
const q = document.getElementById('q');
const results = document.getElementById('results');
const gpsList = document.getElementById('gpsList');
document.querySelector('.sheet h2 button').innerHTML = svg('close', 18);
document.getElementById('searchIcon').innerHTML = svg('magnify', 18);

function openSheet() {
  gpsList.innerHTML = `<button data-action="gps">${svg('crosshairs-gps', 20, 'color:var(--accent);')}<span>Current Location${S.loc && S.loc.mode === 'gps' ? '<small>In use</small>' : ''}</span></button>`;
  syncUnits();
  wrap.classList.add('open');
}
function closeSheet() { wrap.classList.remove('open'); q.blur(); }
function syncUnits() {
  for (const b of document.querySelectorAll('#units button')) b.setAttribute('aria-pressed', String(b.dataset.u === S.units));
}

let searchTimer, searchSeq = 0;
q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const term = q.value.trim();
  if (term.length < 2) { results.innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    const seq = ++searchSeq;
    try {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(term)}&count=8&language=en&format=json`);
      const j = await r.json();
      if (seq !== searchSeq) return;
      const list = j.results || [];
      results.innerHTML = list.length ? list.map((p, i) =>
        `<button data-pick="${i}">${svg('weather-partly-cloudy', 20, 'color:var(--muted);')}<span>${esc(p.name)}<small>${esc([p.admin1, p.country].filter(Boolean).join(', '))}</small></span></button>`
      ).join('') : '<button disabled><span>No matches</span></button>';
      results._list = list;
    } catch (e) {
      if (seq === searchSeq) results.innerHTML = '<button disabled><span>Search is unavailable offline</span></button>';
    }
  }, 250);
});

async function useGps() {
  closeSheet();
  S.error = null;
  try {
    S.loading = true; render();
    const p = await locate();
    S.loc = { mode: 'gps', lat: p.lat, lon: p.lon, name: (await reverseName(p.lat, p.lon)) || 'My Location' };
    store.set('loc', S.loc);
    S.loading = false;
    refresh(true);
  } catch (e) {
    S.loading = false; S.error = e.message;
    if (S.loc && S.data) render(); else renderWelcome();
  }
}

// ---- Events ----
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action],[data-close],[data-pick],[data-u]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.dataset.pick != null) {
    const p = results._list[+t.dataset.pick];
    S.loc = { mode: 'city', lat: p.latitude, lon: p.longitude, name: p.name };
    store.set('loc', S.loc);
    q.value = ''; results.innerHTML = '';
    closeSheet();
    return refresh(true);
  }
  if (t.dataset.u) {
    if (S.units !== t.dataset.u) { S.units = t.dataset.u; store.set('units', S.units); syncUnits(); refresh(true); }
    return;
  }
  switch (t.dataset.action) {
    case 'toggle': S.expanded = !S.expanded; store.set('expanded', S.expanded); render(); break;
    case 'refresh': refresh(true); break;
    case 'location': openSheet(); break;
    case 'gps': useGps(); break;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// Refresh when the app comes back to the front and every 15 minutes while
// open; refresh() itself skips the network if the data is under 10 min old.
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
setInterval(() => { if (!document.hidden) refresh(false); }, 15 * 60 * 1000);
// The hourly strip's "Now" and the sun marks move with the clock, not the
// data; re-render each minute so they roll over without a fetch.
setInterval(() => { if (!document.hidden && S.data) render(); }, 60 * 1000);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
refresh(false);
</script>
</body>
</html>
