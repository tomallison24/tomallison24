<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Sky": a white cloud over a white sun on sea glass sky blue, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A8D0DC"/>
      <stop offset="0.55" stop-color="#6EA2B7"/>
      <stop offset="1" stop-color="#4A7890"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <circle cx="206" cy="196" r="84" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="32" stroke-linejoin="round">
        <rect x="112" y="282" width="304" height="112" rx="56"/><circle cx="214" cy="290" r="64"/><circle cx="306" cy="268" r="86"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#FFFFFF" mask="url(#cut)"/>
    <g fill="#FFFFFF"><rect x="112" y="282" width="304" height="112" rx="56"/><circle cx="214" cy="290" r="64"/><circle cx="306" cy="268" r="86"/></g>
  </g>
</svg>
