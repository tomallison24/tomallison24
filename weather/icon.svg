<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: the cloud in Weather's own colour (#007095) on a pale tint of it (#C7EEFC); every app has its own, a shade of its room's (Every day: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <rect width="512" height="512" fill="#C7EEFC"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <g fill="#007095">
    <rect x="100" y="276" width="312" height="122" rx="61"/>
    <circle cx="204" cy="284" r="70"/>
    <circle cx="304" cy="258" r="92"/>
  </g>
</svg>
