      <circle cx="248" cy="276" r="150" fill="#fff"/>
      <path d="M300 222c-10-20-30-30-52-30-30 0-50 16-50 40 0 58 106 32 106 92 0 26-22 44-56 44-24 0-46-11-58-33M248 162v228" fill="none" stroke="#000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#FFDBE5"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <rect width="512" height="512" fill="#50092D" mask="url(#cut)"/>
