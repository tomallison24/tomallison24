<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: the coin in Money's own colour (#50092D) on a pale tint of it (#FFDBE5); every app has its own, a shade of its room's (You: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
