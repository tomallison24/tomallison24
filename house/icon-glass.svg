<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in Home's own colour (#916600) on a pale glass of it (#F8E3C1), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FCF2E3"/>
      <stop offset="0.55" stop-color="#F8E3C1"/>
      <stop offset="1" stop-color="#ECD4AA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M256 120L398 236V376a28 28 0 0 1-28 28H142a28 28 0 0 1-28-28V236z" fill="#fff" stroke="#fff" stroke-width="28" stroke-linejoin="round"/>
      <g fill="#000"><rect x="214" y="268" width="38" height="38" rx="9"/><rect x="260" y="268" width="38" height="38" rx="9"/><rect x="214" y="314" width="38" height="38" rx="9"/><rect x="260" y="314" width="38" height="38" rx="9"/></g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#916600" mask="url(#cut)"/>
  </g>
</svg>
