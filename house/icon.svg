<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- "Sand": a white house with its window lit on sand, one of the Sea glass tints (each AllisonOS app has its own). A full-bleed diagonal gradient, a soft glow top left, one white glyph; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#EBD7AD"/>
      <stop offset="0.55" stop-color="#BC9C68"/>
      <stop offset="1" stop-color="#8C6E43"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.18"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M256 120L398 236V376a28 28 0 0 1-28 28H142a28 28 0 0 1-28-28V236z" fill="#fff" stroke="#fff" stroke-width="28" stroke-linejoin="round"/>
      <g fill="#000"><rect x="214" y="268" width="38" height="38" rx="9"/><rect x="260" y="268" width="38" height="38" rx="9"/><rect x="214" y="314" width="38" height="38" rx="9"/><rect x="260" y="314" width="38" height="38" rx="9"/></g>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#FFFFFF" mask="url(#cut)"/>
  </g>
</svg>
