<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1116">
<title>Welcome Lab</title>
<!--
  Welcome Lab: plays the AllisonOS welcome (welcome.js) on demand. Nothing here
  is remembered (no data-auto); each Play runs it from the start.
-->
<style>
  :root { --bg: #0F1116; --text: #fff; --muted: rgba(235,235,245,.62); --tile: rgba(255,255,255,.06); --edge: rgba(255,255,255,.12); color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #F2F4F8; --text: #0B0B0F; --muted: rgba(60,60,67,.62); --tile: rgba(255,255,255,.7); --edge: rgba(0,0,0,.07); color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 34px; margin: 6px 4px 4px; letter-spacing: -0.4px; }
  .lede { color: var(--muted); margin: 0 4px 18px; font-size: 15px; line-height: 1.4; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; margin-bottom: 10px; border: 0; border-radius: 24px; font: inherit; color: inherit;
    background: var(--tile); box-shadow: inset 0 0 0 .5px var(--edge); cursor: pointer; }
  .opt:active { transform: scale(.98); }
  .opt b { display: block; font-size: 17px; }
  .opt small { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; margin-top: 3px; }
  .opt .k { flex: 1; }
  .opt .play { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #0A84FF; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .opt .tag { display: inline-flex; width: 26px; height: 26px; border-radius: 8px; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; background: var(--edge); margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <h1>Welcome Lab</h1>
  <p class="lede">aOS's welcome and update screens, played on demand. Nothing here is remembered. Skip ends each early; try light and dark mode too.</p>
  <button class="opt" data-d="first" type="button"><span class="k"><span class="tag">1</span><b>The AllisonOS welcome</b><small>The name in pastels, folding into aOS¹ with its shine, "The Power of aOS1", the apps bursting out, then the tour.</small></span><span class="play">▶</span></button>
  <button class="opt" data-d="minor" type="button"><span class="k"><span class="tag">.1</span><b>A minor update in an app (example)</b><small>Weather after aOS1.1: aOS with the new .1 rising in under its icon, then what's new in it.</small></span><span class="play">▶</span></button>
  <button class="opt" data-d="major" type="button"><span class="k"><span class="tag">2</span><b>A major update in an app (example)</b><small>Fitness after aOS2: the new number rising in, then "Visit aOS" for what's new.</small></span><span class="play">▶</span></button>
  <button class="opt" data-d="install" type="button"><span class="k"><span class="tag">+</span><b>An app opened in Safari: Weather</b><small>On iPhone, an app opened in Safari rather than from its Home Screen icon shows how to add it.</small></span><span class="play">▶</span></button>
  <button class="opt" data-d="app" type="button"><span class="k"><span class="tag">W</span><b>An app's walkthrough: Weather</b><small>Each app has its own, the first time it is opened.</small></span><span class="play">▶</span></button>
</main>
<script src="welcome.js"></script>   <!-- no data-auto: nothing plays until asked -->
<script>
  const W = AllisonOS.welcome;
  for (const b of document.querySelectorAll('.opt')) b.onclick = () => {
    if (b.dataset.d === 'first') return W.play();
    if (b.dataset.d === 'app') return W.playApp('weather');
    if (b.dataset.d === 'install') { try { sessionStorage.removeItem('aos.later.weather'); } catch {} return W.playInstall('weather'); }
    // examples only, taken out again afterwards
    // the next versions after the newest in the log: x.y -> x.(y+1), and x -> x+1
    const R = W.data.RELEASES, now = W.data.latest(), [M, m = 0] = now.split('.').map(Number);
    const next = b.dataset.d === 'major' ? String(M + 1) : M + '.' + (m + 1);
    const ex = b.dataset.d === 'major'
      ? { v: next, highlights: ['An example highlight: a whole new look', 'Another: everything faster'], notes: ['A smaller note'] }
      : { v: next, notes: ['An example'], apps: { weather: { highlights: ['An example highlight: radar loads faster', 'Another: hourly rain chance'], notes: ['A smaller note, in aOS only'] } } };
    R.unshift(ex);
    const done = () => { const k = R.indexOf(ex); if (k >= 0) R.splice(k, 1); };
    (b.dataset.d === 'major' ? W.playUpdate('fitness', now, next) : W.playUpdate('weather', now, next)).then(done, done);
  };
</script>
</body>
</html>
