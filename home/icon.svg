<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Home-screen icon: the page is the whole icon. Full-bleed square: the phone rounds the corners itself. -->
  <defs>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="0.55" stop-color="#9A5BFF"/>
      <stop offset="1" stop-color="#18C3A5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <g fill="#1E145A" fill-opacity="0.34" filter="url(#shadow)" transform="translate(0 26)">
    <rect x="194" y="194" width="296" height="296" rx="46"/><rect x="534" y="194" width="296" height="296" rx="46"/>
    <rect x="194" y="534" width="296" height="296" rx="46"/><rect x="534" y="534" width="296" height="296" rx="46"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="194" y="194" width="296" height="296" rx="46"/><rect x="534" y="194" width="296" height="296" rx="46"/>
    <rect x="194" y="534" width="296" height="296" rx="46"/><rect x="534" y="534" width="296" height="296" rx="46"/>
  </g>
</svg>
