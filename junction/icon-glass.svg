<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the traffic light in Junction's own colour (#4B3A9F) on a pale glass of it (#E4DFFF), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F1EEFF"/>
      <stop offset="0.55" stop-color="#E4DFFF"/>
      <stop offset="1" stop-color="#D2CBF4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="186" y="96" width="140" height="300" rx="46" fill="#fff"/>
      <path d="M186 150h-38M186 246h-38M186 342h-38M326 150h38M326 246h38M326 342h38" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
      <rect x="240" y="396" width="32" height="60" fill="#fff"/>
      <circle cx="256" cy="158" r="34" fill="#000"/>
      <circle cx="256" cy="246" r="34" fill="#000"/>
      <circle cx="256" cy="334" r="34" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <rect width="512" height="512" fill="#4B3A9F" mask="url(#cut)"/>
  </g>
</svg>
