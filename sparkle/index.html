<html lang="en-US">

<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkle Kingdom</title>
<meta name="description" content="A princess and unicorn adventure for young children, where every coin is earned by learning: reading first, then math and memory, each getting harder as she grows.">
<meta name="theme-color" content="#EEF2F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- design.js sets it for the design: black-translucent in Standard; default in Vintage, where black-translucent's white clock would vanish on the cream -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sparkle">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" href="icon-512.png?v=1">

<!--
  Sparkle Kingdom - a princess and unicorn learning game for a 5-year-old (and her brothers and
  sisters: a player each). The kingdom has lost its colours to a gentle Grey Fog; she rides her
  unicorn across floating islands, reading signposts, mending a bridge and opening a crystal door
  on the way, and plays rounds in Story Tower (reading), the Gem Mine (math) and Star Meadow
  (memory). Every coin is earned by learning, and buys gowns, tiaras and things for her unicorn.

  The pieces: letters.js (the school letters every word she reads is drawn in), engine.js (each
  skill's ladder, review, coins, merging two phones), content.js (the questions), art.js (the
  characters and the Boutique), pictures.js (the word pictures), world.js (the kingdom and backdrops), voice.js (speech and sounds),
  app.js (the screens). The server is ../sparkle/api/ (functions/sparkle/api): each family
  account's players, and the letter sounds a grown-up recorded.

  Five designs, picked in the Parent corner > Design or for every app in aOS (../home/design.js): Vintage
  (mid-century, the default: the <style id="vintage"> block), Standard (Sea glass), and Night Drive, Folk and
  Tron (generated from Vintage by aOS/scripts/make-looks.mjs). They dress the frame - the
  player picker, the Parent corner and its sheets; the kingdom and the game itself are the same
  storybook art in both.
-->
<style>
:root{
  --bg:#EEF2F0; --text:#111114; --muted:rgba(60,60,67,.80); --faint:rgba(60,60,67,.76);
  --accent:#3B7366; --on-accent:#FFFFFF; --cta:linear-gradient(100deg,#6FA597 0%,#8193BC 34%,#BE918F 67%,#BC9C68 100%); --cta-ink:#10181A; --accent-text:#3B7366; --danger-text:#AE2117;
  --sheet:rgba(248,250,249,.94); --hair:rgba(60,60,67,.14); --hair-2:rgba(60,60,67,.09); --fill:rgba(118,118,128,.11);
  --scrim:rgba(0,0,0,.28); --aurora:.40; --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --tile:rgba(255,255,255,.40); --tile-edge:rgba(60,60,67,.10);
  /* the game's own colours (the same in both designs): pastel pink, lilac, mint, gold, sky, and the plum outline */
  --k-ink:#4B2E6F; --k-pink:#FF8FC7; --k-rose:#FF5FA8; --k-lilac:#B79BFF; --k-lav:#EFE8FF; --k-mint:#7FE0C7; --k-gold:#FFC94A; --k-sky:#8FD3FF; --k-cream:#FFF6E9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1213; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.55);
  --accent:#A9D3C7; --on-accent:#10181A; --cta:linear-gradient(100deg,#A9D3C7 0%,#B9C6E0 34%,#E3C5C3 67%,#E9D6B4 100%); --accent-text:#A9D3C7; --danger-text:#FF6961;
  --sheet:rgba(24,31,32,.94); --hair:rgba(255,255,255,.11); --hair-2:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.5); --aurora:.72; --tile:rgba(255,255,255,.05); --tile-edge:rgba(255,255,255,.10);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1213; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.55);
  --accent:#A9D3C7; --on-accent:#10181A; --cta:linear-gradient(100deg,#A9D3C7 0%,#B9C6E0 34%,#E3C5C3 67%,#E9D6B4 100%); --accent-text:#A9D3C7; --danger-text:#FF6961;
  --sheet:rgba(24,31,32,.94); --hair:rgba(255,255,255,.11); --hair-2:rgba(255,255,255,.07); --fill:rgba(255,255,255,.07);
  --scrim:rgba(0,0,0,.5); --aurora:.72; --tile:rgba(255,255,255,.05); --tile-edge:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{overflow-x:clip;max-width:100%}
@supports not (overflow:clip){html{overflow-x:hidden}}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;min-height:100vh;min-height:100dvh;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
.ltr svg{display:inline-block;vertical-align:baseline}

/* ---- the frame: the light behind it (Sea glass), the player picker ---- */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(58px);opacity:var(--aurora)}
.ambient i:nth-child(1){width:110%;aspect-ratio:1;left:-23%;top:-3%;background:radial-gradient(circle,#6FA597 0%,rgba(111,165,151,0) 68%);animation:drift1 34s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:92%;aspect-ratio:1;right:-17%;top:8%;background:radial-gradient(circle,#BE918F 0%,rgba(190,145,143,0) 68%);animation:drift2 41s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:120%;aspect-ratio:1;right:-20%;bottom:-6%;background:radial-gradient(circle,#8193BC 0%,rgba(129,147,188,0) 68%);animation:drift3 47s ease-in-out infinite alternate}
.ambient i:nth-child(4){width:87%;aspect-ratio:1;left:-17%;bottom:14%;background:radial-gradient(circle,#BC9C68 0%,rgba(188,156,104,0) 68%);animation:drift4 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14%,10%,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-12%,16%,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(-16%,-12%,0) scale(1.22)}}
@keyframes drift4{to{transform:translate3d(10%,-14%,0) scale(1.15)}}

.screen{position:relative;min-height:100vh;min-height:100dvh}
#picker{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px)}
#picker .head{display:flex;align-items:flex-start;gap:10px;min-height:110px;padding-right:120px}
#picker h1{margin:4px 0 0;font-size:31px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
#picker .sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.players{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border-radius:26px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-edge);min-height:200px}
.pcard .face{width:122px;height:150px}
.pcard .face svg,.preview svg{width:100%;height:100%}
.pcard .nm svg{height:44px;width:auto;max-width:150px}
.pcard .nm{color:var(--text)}
.pcard.add .plus{width:110px;height:110px;margin-top:14px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--accent-text);font-size:56px;font-weight:300}
.pcard.add b{font-size:16px}
.grown{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;padding:12px 18px;min-height:52px;border-radius:999px;color:var(--muted);font-size:15px;font-weight:600;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-edge);position:relative;overflow:hidden}
.grown .fillbar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--fill)}
.grown span{position:relative}
.grown svg{width:24px;height:24px;position:relative}

/* ---- sheets (Parent corner, a new player, the grown-up check) ---- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet .panel{width:100%;max-width:560px;max-height:94dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border-radius:30px 30px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom) + 22px);color:var(--text);-webkit-user-select:text;user-select:text}
.sheet .shead{position:sticky;top:-16px;z-index:2;display:flex;align-items:center;gap:10px;margin:-16px -18px 8px;padding:14px 18px 10px;background:var(--sheet)}
.sheet .shead h2{flex:1;margin:0;font-size:20px;font-weight:700}
.sbtn{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;font-weight:600;color:var(--accent-text);background:var(--fill)}
.cta{display:block;width:100%;min-height:52px;margin-top:14px;border-radius:17px;background:var(--cta);color:var(--cta-ink);font-weight:700;font-size:17px}
.cta[disabled]{opacity:.45}
.label{margin:18px 4px 6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.group{border-radius:18px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-edge);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-top:1px solid var(--hair-2);width:100%;text-align:left;color:var(--text)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.row .val{color:var(--muted);font-size:15px}
.row input[type="text"],.row input[type="number"]{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--hair);background:var(--fill);font-size:17px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:600;color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.note{margin:8px 4px 0;font-size:13px;color:var(--muted);line-height:1.4}
.swatch{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.seg button.sw{padding:4px;border-radius:50%;min-width:48px}
.seg button.sw[aria-pressed="true"]{background:none;box-shadow:0 0 0 3px var(--accent)}
.preview{width:150px;height:200px;margin:0 auto}
.bars{display:grid;gap:6px}
.bar{display:flex;align-items:center;gap:10px;font-size:14px}
.bar .bn{width:128px;flex:none}
.bar .bt{flex:1;height:12px;border-radius:6px;background:var(--fill);overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.bar .bv{width:64px;white-space:nowrap;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:2px;height:90px;padding:6px 2px 0}
.chart i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
.chips span{padding:4px 10px;border-radius:999px;background:var(--fill);font-size:14px}
.chips span.warn{background:rgba(255,95,168,.18)}
.clips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.clip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--fill);min-height:72px}
.clip b{font-size:22px}
.clip small{font-size:11px;color:var(--muted)}
.clip.has{box-shadow:inset 0 0 0 2px var(--accent)}
.clip.rec{background:rgba(255,95,168,.3)}

/* ---- the game: the same storybook look in both designs ---- */
.game{position:fixed;inset:0;overflow:hidden;background:#E6DBFF;color:var(--k-ink);font-family:"Chalkboard SE",var(--font)}
.hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;pointer-events:none}
.hud > *{pointer-events:auto}
.hud .sp{flex:1}
.pill{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px 0 8px;border-radius:999px;background:rgba(255,255,255,.88);box-shadow:0 2px 0 rgba(75,46,111,.25),inset 0 0 0 3px var(--k-ink);font-weight:800;font-size:20px;color:var(--k-ink);font-variant-numeric:tabular-nums}
.pill svg{width:34px;height:34px}
.rbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(75,46,111,.3),inset 0 0 0 3px var(--k-ink);color:var(--k-ink)}
.rbtn svg{width:34px;height:34px}
.rbtn.me{overflow:hidden;padding:0}
.rbtn{position:relative}
.rbtn .nb{position:absolute;right:-6px;top:-6px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2.5px var(--k-ink);display:grid;place-items:center;animation:bobble 1s ease-in-out infinite alternate}
.rbtn .nb svg{width:24px;height:24px}
.rbtn.me svg{width:64px;height:84px;margin-top:10px}
.timer{height:40px;font-size:16px;padding:0 12px;gap:4px}
.timer svg{width:22px;height:22px}
#map{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
#map::-webkit-scrollbar{display:none}
#mapIn{position:relative;width:max(100vw,min(1000px,160vw));aspect-ratio:2/3}
#mapIn > svg{width:100%;height:100%}
#rider{position:absolute;left:0;top:0;width:15%;pointer-events:none;transform-origin:50% 100%;z-index:3;transition:none;will-change:transform}
#rider .wrap{position:relative;transform:translate(-50%,-92%)}
#rider .un{display:block;position:relative;z-index:1}
#rider .pr{position:absolute;width:40%;left:27%;top:-14%;z-index:0}
#rider.walk .wrap{animation:bob .4s ease-in-out infinite alternate}
#rider.flip .wrap > *{transform:scaleX(-1)}
@keyframes bob{to{transform:translate(-50%,-98%)}}
.kingdom .drift{animation:float 9s ease-in-out infinite alternate}
.kingdom .drift:nth-of-type(2n){animation-duration:12s}
@keyframes float{to{transform:translateX(24px)}}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.flap{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:translateY(-8px) scaleX(.82)}}
.kingdom .find{cursor:pointer}
.kingdom .glow{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.kingdom .place{cursor:pointer}
.quest{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;display:flex;align-items:center;gap:10px;pointer-events:none}
.quest > *{pointer-events:auto}
.qcard{flex:1;display:flex;align-items:center;gap:8px;min-height:64px;padding:8px 14px;border-radius:24px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(75,46,111,.25),inset 0 0 0 3px var(--k-ink)}
.qstop{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--k-lav);box-shadow:inset 0 0 0 2.5px var(--k-ink);font-size:22px;position:relative}
.qstop.done::after{content:'';position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--k-mint) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M5 10.5l3.5 3.5L15 7" fill="none" stroke="%234B2E6F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');box-shadow:inset 0 0 0 2px var(--k-ink)}
.qstop.next{box-shadow:inset 0 0 0 3px var(--k-ink),0 0 0 4px var(--k-gold)}
.qcard .qt{font-weight:800;font-size:15px;margin-left:4px;flex:1;line-height:1.15}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:0 26px;border-radius:999px;background:var(--k-gold);color:var(--k-ink);font-weight:800;font-size:20px;box-shadow:0 4px 0 #D9902A,inset 0 0 0 3px var(--k-ink)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #D9902A,inset 0 0 0 3px var(--k-ink)}
.big.pink{background:var(--k-pink);box-shadow:0 4px 0 #D9579A,inset 0 0 0 3px var(--k-ink)}
.big.mint{background:var(--k-mint);box-shadow:0 4px 0 #3FB596,inset 0 0 0 3px var(--k-ink)}
.big svg{width:30px;height:30px}

/* a round */
#round .bd,#reward .bd,#chapter .bd{position:absolute;inset:0}
#round .bd svg,#reward .bd svg,#chapter .bd svg{width:100%;height:100%}
#round .stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 76px) 14px calc(env(safe-area-inset-bottom) + 16px);gap:12px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.8)}
.dots i.on{background:var(--k-gold)}
.dots i.now{background:#fff}
.ask{display:flex;align-items:flex-end;gap:8px}
.host{flex:none;width:96px;height:96px;cursor:pointer}
.host svg{width:100%;height:100%}
.host.talk{animation:talk .35s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-4px) rotate(-2deg)}}
.bubble{flex:1;min-height:70px;padding:10px 14px;border-radius:24px 24px 24px 6px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink),0 3px 0 rgba(0,0,0,.2);color:var(--k-ink);display:flex;flex-wrap:wrap;align-content:center;gap:4px 10px}
.bubble .w{display:inline-flex;transition:transform .15s}
.bubble .w svg{height:30px;width:auto}
.bubble .w.lit svg{color:var(--k-rose)}
.bubble .w.lit{transform:translateY(-2px)}
.show{flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;border-radius:30px;background:rgba(255,255,255,.95);box-shadow:inset 0 0 0 3px var(--k-ink),0 4px 0 rgba(0,0,0,.18);position:relative}
.show:empty{background:none;box-shadow:none}
.show .read svg{width:auto;height:84px;max-width:100%;color:var(--k-ink)}
.show .read.long svg{height:52px}
.show .read.long{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center}
.show .bigpic{font-size:110px;line-height:1}
.show .gems{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.show .gems svg{width:52px;height:52px}
.show .gems .gone{opacity:.25;filter:grayscale(1)}
.show .gems .lit{animation:hop .5s ease-in-out}
@keyframes hop{50%{transform:translateY(-10px) scale(1.15)}}
.frame10{display:grid;grid-template-columns:repeat(5,52px);gap:4px;padding:6px;border-radius:12px;box-shadow:inset 0 0 0 3px var(--k-ink)}
.frame10 i{width:52px;height:52px;border-radius:10px;background:var(--k-lav);display:grid;place-items:center}
.frame10 i svg{width:42px;height:42px}
.frame10 i.lit{background:var(--k-gold)}
.carts{display:flex;gap:14px;justify-content:center;width:100%}
.cart{flex:1;max-width:170px;min-height:140px;padding:8px;border-radius:20px;background:#FFE1EE;box-shadow:inset 0 0 0 3px var(--k-ink);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px}
.cart svg{width:30px;height:30px}
.tens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tens .bag{width:56px;height:70px;border-radius:14px 14px 22px 22px;background:var(--k-lilac);box-shadow:inset 0 0 0 3px var(--k-ink);display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px}
.drum{position:absolute;right:10px;bottom:10px;width:70px;height:70px;border-radius:50%;background:var(--k-pink);box-shadow:inset 0 0 0 3px var(--k-ink),0 3px 0 #D9579A;display:grid;place-items:center}
.drum svg{width:44px;height:44px}
.drum.hit{animation:drumhit .18s ease-out}
@keyframes drumhit{40%{transform:scale(.86)}}
.drum .beats{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;display:flex;gap:5px;pointer-events:none}
.drum .beats i{width:12px;height:12px;border-radius:50%;background:var(--k-pink);box-shadow:inset 0 0 0 2px var(--k-ink)}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices.two{grid-template-columns:repeat(2,1fr)}
.choices.four{grid-template-columns:repeat(4,1fr)}
.choice{position:relative;min-height:96px;border-radius:26px;background:#fff;box-shadow:inset 0 0 0 3.5px var(--k-ink),0 5px 0 rgba(75,46,111,.35);display:flex;align-items:center;justify-content:center;padding:8px;color:var(--k-ink);transition:transform .12s}
.choice:active{transform:translateY(3px)}
.choice .emo{font-size:58px;line-height:1}
.choice svg{height:60px;width:auto;max-width:100%}
.choice.word svg{height:46px}
.choice.cart{min-height:64px;font-weight:800;font-size:18px}
.choice.right{background:#C9F7DF;animation:yay .5s}
.choice.wrong{background:#FFE0E8;animation:no .4s}
.choice.dim{opacity:.35}
.choice.hint{box-shadow:inset 0 0 0 4px var(--k-gold),0 0 0 5px var(--k-gold),0 5px 0 rgba(75,46,111,.35)}
@keyframes yay{40%{transform:scale(1.08)}}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wand{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px;margin:0 auto}
.wand button{aspect-ratio:1;border-radius:28px;box-shadow:inset 0 0 0 3.5px var(--k-ink),0 5px 0 rgba(75,46,111,.35);display:grid;place-items:center;transition:transform .15s,filter .15s}
.wand button svg{width:62%;height:62%}
.wand button.lit{transform:scale(1.1);filter:brightness(1.25) drop-shadow(0 0 14px #fff)}
.wand button:active{transform:scale(.95)}
.signs{display:flex;gap:16px;justify-content:center;width:100%}
.signs .choice{flex:1;max-width:170px;min-height:110px;background:var(--k-cream)}
.bridge{display:flex;flex-direction:column;align-items:center;gap:14px}
.planks{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px}
.planks i{width:30px;height:62px;border-radius:6px;box-shadow:inset 0 0 0 3px var(--k-ink);background:rgba(255,255,255,.4)}
.planks i.on{background:#E9B872;animation:yay .3s}
.stars-burst{position:fixed;inset:0;pointer-events:none;z-index:80}
.stars-burst i{position:absolute;width:30px;height:30px}
.stars-burst i svg{width:100%;height:100%}
.fly{animation:burst 1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(160deg);opacity:0}}
.tog{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 8px);z-index:21}

/* the end of a round, the castle, the intro */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(env(safe-area-inset-top) + 70px) 20px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.cheer{width:min(78vw,340px)}
.cheer svg{width:100%}
.dance{animation:dance .6s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes dance{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(-6px)}}
.dash{animation:dash 1.6s ease-in-out}
@keyframes dash{0%{transform:translateX(-120vw)}60%{transform:translateX(8vw)}100%{transform:translateX(0)}}
.praise{max-width:360px;padding:12px 18px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink);font-weight:800;font-size:20px;line-height:1.25}
.earn{display:flex;align-items:center;gap:8px;padding:4px 18px 4px 8px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink);font-size:30px;font-weight:900;color:var(--k-ink)}
.earn svg{width:46px;height:46px}
.giftbox{width:150px;height:150px;animation:wiggle 1s ease-in-out infinite}
.giftbox svg{width:100%;height:100%}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.reveal{width:180px;height:220px;animation:yay .6s}
.reveal svg{width:100%;height:100%}
#castle .room{position:absolute;inset:0;background:linear-gradient(#FFE1F0,#EBDDFF 60%,#D7C6FF)}
#castle .room::before{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:#C8B2F5;border-top:5px solid var(--k-ink)}
.dress{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 70px);height:40%;display:flex;align-items:flex-end;justify-content:center}
.dress .pr{height:100%}
.dress .pr svg{height:100%;width:auto}
.dress .un{height:62%;margin-left:-30px}
.dress .un svg{height:100%;width:auto}
.shelf{position:absolute;left:0;right:0;bottom:0;height:calc(52% - env(safe-area-inset-top));background:#FFF6FB;border-radius:30px 30px 0 0;box-shadow:inset 0 3px 0 var(--k-ink);display:flex;flex-direction:column}
.tabs{display:flex;gap:6px;padding:12px 12px 6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;min-height:48px;padding:0 16px;border-radius:999px;background:var(--k-lav);box-shadow:inset 0 0 0 2.5px var(--k-ink);font-weight:800;color:var(--k-ink);font-size:16px}
.tabs button[aria-pressed="true"]{background:var(--k-pink)}
.items{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 12px calc(env(safe-area-inset-bottom) + 14px);align-content:start}
.item{position:relative;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink),0 4px 0 rgba(75,46,111,.25);padding:4px 4px 30px;height:150px;overflow:hidden}
.item .pv{height:100%;display:flex;justify-content:center}
.item .pv svg{height:118%;width:auto;margin-top:-4px}
.item.u .pv svg{height:90%;margin-top:12px}
.item .price{position:absolute;left:0;right:0;bottom:4px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:17px}
.item .price svg{width:24px;height:24px}
.item.on{background:#C9F7DF}
.item.locked .pv{opacity:.5}
.item.ask{box-shadow:inset 0 0 0 4px var(--k-gold),0 0 0 4px var(--k-gold)}
.treasures{padding:8px 16px;display:grid;gap:10px;align-content:start;overflow:auto}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:800}
.trow .tt{width:100%;font-size:15px}
.trow .tk{width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--k-ink);display:grid;place-items:center;font-size:26px}
.trow .tk.no{opacity:.3}
.trow .tk svg{width:40px;height:40px}
.trow .tk.crit svg{width:100%;height:100%}
#intro .center{background:linear-gradient(#FFD9EE,#E6DBFF 60%,#CBEBFF)}
.story{max-width:380px;padding:14px 18px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink);font-size:19px;font-weight:700;line-height:1.35}
.intro-art{display:flex;align-items:flex-end;justify-content:center;height:38vh}
.intro-art .pr{height:100%}
.intro-art .pr svg,.intro-art .un svg{height:100%;width:auto}
.intro-art .un{height:66%;margin-left:-24px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);z-index:90;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink),0 4px 0 rgba(0,0,0,.2);font-weight:800;color:var(--k-ink);white-space:nowrap;animation:yay .4s}
.gatebox{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(75,46,111,.35)}
.gatebox .gpanel{padding:16px 14px calc(env(safe-area-inset-bottom) + 18px);border-radius:32px 32px 0 0;background:#FFF6FB;box-shadow:inset 0 3px 0 var(--k-ink);display:flex;flex-direction:column;gap:12px;color:var(--k-ink)}
/* pictures (drawn: pics-*.js) */
.bigpic .emo{font-size:110px;line-height:1}
.titem .emo{font-size:52px;line-height:1}
.card .emo{font-size:40px}
.show .storybook svg{width:150px;height:150px}
.show .bigpic svg{width:150px;height:150px}
.show .bigpic.small svg{width:110px;height:110px}
.choice.pic svg,.choice .pic{width:78px;height:78px;max-width:none}
/* spelling: gem tiles into slots */
.slots{display:flex;gap:8px;justify-content:center;width:100%}
.slots i{width:58px;height:74px;border-radius:14px;border-bottom:5px solid var(--k-ink);display:grid;place-items:center;background:rgba(183,155,255,.18)}
.slots i.on{background:#FFF0F8;animation:yay .35s}
.slots i svg{height:64px;width:auto}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:4px 0}
.tile{width:74px;height:84px;border-radius:24px 24px 30px 30px;background:var(--c,#FF8FC7);box-shadow:inset 0 0 0 3.5px var(--k-ink),inset 0 -8px 0 rgba(0,0,0,.12),0 5px 0 rgba(75,46,111,.35);display:grid;place-items:center;color:var(--k-ink);transition:transform .12s,opacity .2s}
.tile svg{height:62px;width:auto}
.tile.used{opacity:0;transform:scale(.6);pointer-events:none}
.tile.wrong{animation:no .4s}
.tile.hint{box-shadow:inset 0 0 0 3.5px var(--k-ink),0 0 0 5px var(--k-gold),0 5px 0 rgba(75,46,111,.35)}
/* Flower Match */
.show.cardsbox{padding:8px;align-items:flex-start}
.cards{display:grid;gap:7px;width:100%}
.card{position:relative;aspect-ratio:.82;border-radius:16px;perspective:600px}
.card .back,.card .face{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .35s;box-shadow:inset 0 0 0 3px var(--k-ink)}
.card .back{background:#B5E8D5}
.card .face{background:#fff;transform:rotateY(180deg)}
.card.up .back,.card.done .back{transform:rotateY(180deg)}
.card.up .face,.card.done .face{transform:rotateY(0)}
.card.done .face{background:#C9F7DF}
.card .face svg{width:82%;height:82%}
.card .face .ltr svg,.card .face > svg[aria-label]:not(.pic){width:auto;height:70%}
.card.swap{animation:swap .7s ease-in-out 2;z-index:2}
@keyframes swap{50%{transform:translateY(-14px) scale(1.08)}}
.dots6{display:grid;grid-template-columns:repeat(3,14px);gap:5px}
.dots6 i{width:14px;height:14px;border-radius:50%;background:var(--k-rose);box-shadow:inset 0 0 0 2px var(--k-ink)}
/* What's Missing */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px;border-radius:24px;background:#F3EAFF;box-shadow:inset 0 0 0 3px var(--k-ink)}
.titem svg{width:64px;height:64px}
.cover{position:absolute;inset:0;display:grid;place-items:center;border-radius:30px;background:rgba(255,255,255,.75);animation:yay .5s}
.cover svg{width:80%}
.praise.note{display:flex;align-items:center;gap:10px;font-size:17px;text-align:left}
/* how to play: her friend explains, a hand shows one, then her turn */
.demoveil{position:absolute;inset:calc(env(safe-area-inset-top) + 66px) 0 0;z-index:20}
.demotag{position:absolute;left:max(14px,env(safe-area-inset-left));top:6px;display:flex;align-items:center;gap:8px;padding:8px 18px 8px 12px;border-radius:999px;background:var(--k-gold);box-shadow:inset 0 0 0 3px var(--k-ink);font-weight:900;font-size:18px;color:var(--k-ink);white-space:nowrap}
.demotag svg{width:26px;height:26px}
.dots.demorow{min-height:44px}
.demoskip{position:absolute;right:max(14px,env(safe-area-inset-right));top:6px;min-height:44px;padding:0 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--k-ink);font-weight:800;font-size:15px;color:var(--k-ink)}
.howcard{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border-radius:30px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink),0 6px 0 rgba(75,46,111,.25);text-align:center;color:var(--k-ink);font-size:19px;font-weight:700;line-height:1.3}
.howcard b{font-size:22px;font-weight:900}
.howcard .hh{height:140px}.howcard .hh svg{height:100%;width:auto}
.hand{position:fixed;left:50%;top:70%;width:58px;z-index:21;pointer-events:none;transform:translate(-22%,-8%);transition:left .6s ease-in-out,top .6s ease-in-out}
.hand svg{width:100%;height:auto;filter:drop-shadow(0 3px 0 rgba(75,46,111,.3))}
.hand.tap svg{transform:scale(.86)}
#howBtn{margin-right:8px}
/* a chapter of the story */
.chbook{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 12px;border-radius:24px;background:var(--k-gold);box-shadow:0 4px 0 #D9A21E,inset 0 0 0 3px var(--k-ink);font-weight:900;font-size:20px;color:var(--k-ink);animation:wiggle 1.4s ease-in-out infinite}
.chbook svg{width:44px;height:44px}
.chtitle{padding:6px 18px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 3px var(--k-ink);font-weight:900;font-size:18px;color:var(--k-ink)}
.chtitle small{display:block;font-size:13px;font-weight:800;opacity:.7}
.charts{display:flex;align-items:flex-end;justify-content:center;height:34vh;gap:4px}
.charts .pr{height:100%}.charts .hs{height:62%}
.charts svg{height:100%;width:auto}
.chpage{display:flex;gap:6px}.chpage i{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px var(--k-ink)}.chpage i.on{background:var(--k-pink)}
.rank{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--k-ink);font-weight:900;font-size:15px;color:var(--k-ink)}
.rank svg{width:26px;height:26px}
.dress.inroom{align-items:center;padding:0 12px}
.roomview{position:relative;width:min(100%,460px);aspect-ratio:4/3;max-height:100%}
.roomview>svg{width:100%;height:100%;border-radius:22px;box-shadow:0 0 0 3px var(--k-ink)}
.roomview .pr{position:absolute;left:6%;bottom:4%;height:66%}
.roomview .pr svg{height:100%;width:auto}
.roompick{grid-column:1/-1;display:flex;gap:6px}
.roompick button{flex:1;min-height:44px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--k-ink);font-weight:800;color:var(--k-ink);font-size:15px}
.roompick button[aria-pressed="true"]{background:var(--k-mint)}
.item.r .pv{align-items:center;padding:4px}
.item.r .pv svg{height:100%;width:100%;margin:0}
#castleRank{display:flex;justify-content:center;min-width:0}
#castleRank .rank{font-size:14px;line-height:1.1;text-align:left}
.stories{grid-column:1/-1;display:flex;flex-direction:column;gap:12px}
.stories .tt{font-weight:900;color:var(--k-ink)}
.chrow{display:flex;gap:8px;flex-wrap:wrap}
.chrow button{width:46px;height:56px;border-radius:8px 12px 12px 8px;box-shadow:inset 0 0 0 3px var(--k-ink),inset 6px 0 0 rgba(75,46,111,.25);font-weight:900;font-size:18px;color:var(--k-ink)}
.chrow button.no{opacity:.35}
.praise.note svg{flex:none}
.qstop svg{width:30px;height:30px}
/* ---- iPad and other big screens (an iPhone, even sideways, is never this tall): the same game, bigger ---- */
@media (min-width:700px) and (min-height:600px){
  #picker{max-width:780px}
  #picker h1{font-size:40px}
  .players{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:40px}
  .pcard{width:230px;min-height:270px}
  .pcard .face{width:160px;height:196px}
  .host{width:124px;height:124px}
  .bubble{min-height:90px;padding:14px 20px}
  .bubble .w svg{height:42px}
  .show .read svg{height:130px}
  .show .read.long svg{height:72px}
  .show .bigpic svg{width:230px;height:230px}
  .show .bigpic.small svg{width:150px;height:150px}
  .show .gems,.frame10{grid-template-columns:repeat(5,68px)}
  .show .gems svg,.frame10 i{width:68px;height:68px}
  .frame10 i svg{width:54px;height:54px}
  .tens .bag{width:72px;height:90px;font-size:24px}
  .cart svg{width:40px;height:40px}
  .choice{min-height:130px}
  .choice svg{height:96px}
  .choice.word svg{height:70px}
  .tile{width:96px;height:108px}
  .tile svg{height:80px}
  .slots i{width:76px;height:96px}
  .slots i svg{height:84px}
  .titem svg{width:96px;height:96px}
  .drum{width:96px;height:96px}
  .drum svg{width:60px;height:60px}
  .wand{max-width:min(560px,calc(100dvh - 330px))}
  .story,.praise{max-width:600px;font-size:24px}
  .chtitle{font-size:22px}
  .howcard{left:50%;right:auto;width:min(600px,90vw);transform:translate(-50%,-50%);font-size:24px}
  .howcard .hh{height:180px}
  .gatebox .gpanel{width:min(760px,100%);margin:0 auto}
  .hand{width:76px}
  .items{grid-template-columns:repeat(4,1fr)}
}
/* sideways: the question across the top, what to look at on the left, the answers on the right; Flower Match
   and the wand take the whole stage; the castle's room on the left and its shelf on the right */
@media (min-width:900px) and (min-height:600px) and (orientation:landscape){
  #round .stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:14px 24px;padding:calc(env(safe-area-inset-top) + 80px) max(28px,calc((100vw - 1280px) / 2)) calc(env(safe-area-inset-bottom) + 24px)}
  #round .stage > .dots,#round .stage > .ask{grid-column:1/-1}
  #round .stage > .show{min-height:0}
  #round .stage > #choices{align-self:center}
  #round .choices,#round .choices.two{grid-template-columns:1fr;gap:14px}
  #round .choices.four{grid-template-columns:repeat(2,1fr)}
  #round .choices .choice{min-height:150px}
  #round .tiles{gap:14px}
  #round .stage.k-match > .show,#round .stage.k-wand > .show{grid-column:1/-1}
  #round .stage.k-match > #choices,#round .stage.k-wand > #choices{display:none}
  #round .stage.noshow > .show{display:none}
  #round .stage.noshow > #choices{grid-column:1/-1;align-self:start;margin-top:4vh}
  #round .stage.noshow .choices{grid-template-columns:repeat(3,1fr)}
  #round .stage.noshow .choices .choice{min-height:220px}
  #round .stage.noshow .choice svg{height:130px}
  .stage.k-match .show{padding:12px}
  .stage.k-match .cards{height:100%;grid-template-columns:repeat(var(--wide),1fr)!important;grid-auto-rows:minmax(0,1fr)}
  .stage.k-match .card{aspect-ratio:auto}
  .dress{top:calc(env(safe-area-inset-top) + 76px);bottom:24px;right:50%;height:auto;align-items:center}
  .shelf{left:50%;top:calc(env(safe-area-inset-top) + 76px);height:auto;border-radius:30px 0 0 0;box-shadow:inset 3px 3px 0 var(--k-ink)}
  .items{grid-template-columns:repeat(3,1fr)}
  .charts,.intro-art{height:40vh}
}
/* Pattern Parade: the floats in a row */
.parade{display:flex;justify-content:center;align-items:flex-end;gap:3px;width:100%;padding:0 6px}
.parade .fl{flex:1 1 0;min-width:0;max-width:84px;display:block}
.parade .fl svg{width:100%;height:auto;display:block}
.parade .fl.gap{animation:bobble 1s ease-in-out infinite alternate}
@keyframes bobble{to{transform:translateY(-6px)}}
.parade.grow{gap:14px}
.parade .grp{display:flex;flex-wrap:wrap;max-width:96px;gap:2px;align-items:flex-end;padding:6px;border-radius:16px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 2.5px var(--k-ink)}
.parade .grp svg{width:28px;height:28px}
.parade .grp.gap{background:none;box-shadow:none;width:64px}
.parade .grp.gap svg{width:64px;height:auto}
.choice.shape svg{width:84px;height:84px}
.choice.many .many{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:120px}
.choice.many svg{width:32px;height:32px}
/* the Unicorn Bakery */
.bake{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.bake .recipe{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:18px;background:#FFFDF5;box-shadow:inset 0 0 0 3px var(--k-ink),0 3px 0 rgba(75,46,111,.2)}
.bake .recipe .need{display:flex;align-items:center;gap:2px}
.bake .recipe i svg{width:40px;height:40px;display:block}
.bake .recipe .grp{display:flex;flex-wrap:wrap;max-width:120px}
.bake .recipe .grp svg{width:30px;height:30px}
.bake .recipe b{font-size:30px}
.bowlbox{position:relative;width:min(92vw,340px)}
.bowlbox .bowl svg{width:100%;height:auto;display:block}

}

/* Tron: light cycles, after the Tron: Ares mode in Tesla's cars - a red Light Cycle and its red trail on a black grid,
   the cabin lit red. Red light on black at night, on clean white by day: Orbitron headings (Exo 2 for Cyrillic), Exo 2 for
   the rest (SIL Open Font License, ../home/fonts); an identity disc, a white square and a red light trail for the shapes,
   a grid floor under them, and a glow on what's lit. */
@font-face{font-family:"Orbitron";font-style:normal;font-weight:700;font-display:swap;src:url("../home/fonts/orbitron-700-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Exo 2";font-style:normal;font-weight:400 700;font-display:swap;src:url("../home/fonts/exo-2-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Exo 2";font-style:normal;font-weight:400 700;font-display:swap;src:url("../home/fonts/exo-2-cyrillic.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:is(.title,.head h1,.top h1,header h1,.masthead h1,.hx-title,.sheethead h2,.ptitle){font-family:"Orbitron","Exo 2","Avenir Next",system-ui,sans-serif;font-weight:700;letter-spacing:.02em;font-size-adjust:.5}
:root{--tr-line:#D0101E;--tr-hot:#2A2E35;--tr-glow:.35;--tr-grid:rgba(208,16,30,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tr-line:#FF2A2A;--tr-hot:#E9EDF1;--tr-glow:1;--tr-grid:rgba(255,42,42,.28)}}
:root[data-theme="dark"]{--tr-line:#FF2A2A;--tr-hot:#E9EDF1;--tr-glow:1;--tr-grid:rgba(255,42,42,.28)}

:root :is(.ambient i,.aurora b,.atoms b):nth-child(1){background:radial-gradient(circle,var(--tr-line) 0 7%,transparent 7.5% 30%,var(--tr-line) 31% 35%,transparent 36% 55%,var(--tr-line) 56% 63%,transparent 64%);filter:drop-shadow(0 0 calc(var(--tr-glow) * 12px) var(--tr-line));opacity:1}
:root :is(.ambient i,.aurora b,.atoms b):nth-child(2){background:transparent;border-radius:4px;box-shadow:inset 0 0 0 3px var(--tr-hot),0 0 calc(var(--tr-glow) * 10px) color-mix(in srgb,var(--tr-hot) 60%,transparent)}
:root :is(.ambient i,.aurora b,.atoms b):nth-child(3){background:linear-gradient(90deg,transparent,var(--tr-line) 35%,var(--tr-line)) center/100% 22% no-repeat;border-radius:0;filter:drop-shadow(0 0 calc(var(--tr-glow) * 8px) var(--tr-line))}
:is(.ambient,.aurora,.atoms)::after{content:'';position:absolute;left:-30%;right:-30%;top:62%;height:110px;pointer-events:none;
  background:linear-gradient(90deg,var(--tr-grid) 1px,transparent 1px) 50% 0/24px 100%,linear-gradient(var(--tr-grid) 1px,transparent 1px) 0 0/100% 14px;
  transform:perspective(140px) rotateX(58deg);transform-origin:top;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
:is(.fab,.okbtn){box-shadow:0 0 calc(var(--tr-glow) * 16px) color-mix(in srgb,var(--tr-line) 70%,transparent)}
</style>

<body>
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- the frame: who's playing -->
  <section id="picker" class="screen" aria-label="Sparkle Kingdom">
    <div class="head"><div><h1>Sparkle Kingdom</h1><p class="sub">Who's playing?</p></div></div>
    <div class="players" id="players"></div>
    <button type="button" class="grown" id="grownBtn" aria-label="Grown-ups: hold for the Parent corner"><i class="fillbar"></i>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18l2-11 5 5 2-7 2 7 5-5 2 11z"/></svg><span>Grown-ups: press and hold</span></button>
  </section>

  <!-- the kingdom -->
  <section id="world" class="game" translate="no" hidden aria-label="The kingdom">
    <div id="map"><div id="mapIn"></div></div>
    <div class="hud">
      <button type="button" class="rbtn me" id="meBtn" aria-label="Change player"></button>
      <div class="pill" id="coins" aria-label="Coins"></div>
      <span class="sp"></span>
      <div class="pill timer" id="timer" aria-label="Minutes played"></div>
      <button type="button" class="rbtn" id="castleBtn" aria-label="Your castle"></button>
    </div>
    <div class="quest"><div class="qcard" id="quest" role="button" tabindex="0" aria-label="Today's quest"></div></div>
  </section>

  <!-- a round in a land -->
  <section id="round" class="game" translate="no" hidden aria-label="A round">
    <div class="bd" id="roundBd"></div>
    <div class="hud"><button type="button" class="rbtn" id="roundBack" aria-label="Back to the kingdom"></button><span class="sp"></span><button type="button" class="rbtn" id="howBtn" aria-label="How to play"></button><div class="pill" id="roundCoins"></div></div>
    <div class="stage" id="stage"></div>
  </section>

  <!-- the end of a round -->
  <section id="reward" class="game" translate="no" hidden aria-label="Well done">
    <div class="bd" id="rewardBd"></div>
    <div class="center" id="rewardIn"></div>
  </section>

  <!-- a chapter of the story -->
  <section id="chapter" class="game" translate="no" hidden aria-label="A new chapter">
    <div class="bd" id="chapterBd"></div>
    <div class="center" id="chapterIn"></div>
  </section>

  <!-- the castle: dress up and the Royal Boutique -->
  <section id="castle" class="game" translate="no" hidden aria-label="Your castle">
    <div class="room"></div>
    <div class="hud"><button type="button" class="rbtn" id="castleBack" aria-label="Back to the kingdom"></button><span class="sp" id="castleRank"></span><div class="pill" id="castleCoins"></div></div>
    <div class="dress" id="dress"></div>
    <div class="shelf"><div class="tabs" id="shelfTabs" role="toolbar" aria-label="What to show"></div><div class="items" id="items"></div></div>
  </section>

  <!-- her castle, cut away like a dollhouse: tap a room to go in -->
  <section id="home" class="game" translate="no" hidden aria-label="Your castle">
    <div class="hud"><button type="button" class="rbtn" id="homeBack" aria-label="Back to the kingdom"></button><span class="sp" id="homeRank"></span><div class="pill" id="homeCoins"></div></div>
    <div class="cutaway" id="cutaway"></div>
  </section>

  <!-- the stables: her unicorn to feed, wash, play with and put to bed -->
  <section id="stable" class="game" translate="no" hidden aria-label="The stables">
    <div class="hud"><button type="button" class="rbtn" id="stableBack" aria-label="Back to the castle"></button><span class="sp"></span><div class="pill" id="stableCoins"></div></div>
    <div class="stall" id="stall"></div>
    <div class="needs" id="needs"></div>
    <div class="care"><div class="tabs" id="careTabs" role="toolbar" aria-label="What to do"></div><div class="tray" id="careTray"></div></div>
  </section>

  <!-- her bedroom: tap things to play; Decorate to move them, buy more, change the walls and floor -->
  <section id="bedroom" class="game" translate="no" hidden aria-label="Your bedroom">
    <div class="hud"><button type="button" class="rbtn" id="bedBack" aria-label="Back to the castle"></button><span class="sp"></span><div class="pill" id="bedCoins"></div><button type="button" class="rbtn" id="bedEdit" aria-label="Decorate" aria-pressed="false"></button></div>
    <div class="broom"><div class="broomIn" id="broomIn"></div></div>
    <div class="bedbar" id="bedbar"></div>
    <div class="bshelf" id="bshelf" hidden><div class="tabs" id="bedTabs" role="toolbar" aria-label="What to show"></div><div class="items" id="bedItems"></div></div>
  </section>

  <!-- the story, the first time -->
  <section id="intro" class="game" translate="no" hidden aria-label="The story"><div class="center" id="introIn"></div></section>

  <script src="letters.js"></script>
  <script src="engine.js"></script>
  <script src="content.js"></script>
  <script src="art.js"></script>
  <script src="pictures.js"></script>
  <script src="chapters.js"></script>
  <script src="rooms.js"></script>
  <script src="bedroom.js"></script>
  <script src="kitchen.js"></script>
  <script src="stable-art.js"></script>
  <script src="care.js"></script>
  <script src="world.js"></script>
  <script src="voice.js"></script>
  <script src="../home/account.js"></script>
  <script src="app.js"></script>
  <script src="../home/welcome.js" data-app="sparkle" data-auto defer></script>
</body>
</html>
