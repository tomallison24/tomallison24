<!doctype html>
<html lang="en-US" data-look="vintage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker cards</title>
<meta name="description" content="Five compact ways to draw the Sonos speaker cards in Home, next to today's record.">
<!--
  labs/speakers: a test page for the owner, not an app. Home's speaker card today (house/media.js: a 96px glass
  record with the album art as its label) next to five more compact ways to draw it: Sleeve, Cover edge, Fill,
  Tiles and Quiet stack. Sample readings only (the same six players as Home's preview); nothing reaches Home
  Assistant. Vintage or Sea glass, dark. Album covers are drawn, not real art. See ../index.html.
-->
<style>
  :root {
    --page: linear-gradient(180deg, #4A391E 0%, #3E301B 40%, #33281A 100%); --page-solid: #3E301B;
    --card: #2F2822; --card-edge: rgba(255,240,215,0.07); --text: #FFF7EA; --muted: rgba(255,240,220,0.62); --faint: rgba(255,240,220,0.38);
    --chip: rgba(255,240,215,0.08); --track: rgba(255,240,215,0.14); --btn: rgba(255,240,215,0.09); --btn-edge: rgba(255,240,215,0.14);
    --ink: #2A1E0C; --shadow: 0 14px 30px -18px rgba(0,0,0,0.7); --r: 26px;
    color-scheme: dark;
  }
  html[data-look="glass"] {
    --page: radial-gradient(120% 60% at 80% 0%, #2A3446 0%, #1A212B 55%, #141A22 100%); --page-solid: #1A212B;
    --card: rgba(255,255,255,0.05); --card-edge: rgba(255,255,255,0.10); --text: #FFFFFF; --muted: rgba(235,235,245,0.62); --faint: rgba(235,235,245,0.36);
    --chip: rgba(255,255,255,0.08); --track: rgba(255,255,255,0.14); --btn: rgba(255,255,255,0.08); --btn-edge: rgba(255,255,255,0.16);
    --ink: #10181A; --shadow: 0 14px 30px -18px rgba(0,0,0,0.6); --r: 28px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--page-solid); }
  body { margin: 0; min-height: 100vh; background: var(--page); background-attachment: fixed; color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  main { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 48px); }
  @media (min-width: 900px) { main { max-width: 1400px; } .designs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; } }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 6px 0 4px; }
  .lede { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
  .bar { position: sticky; top: 0; z-index: 5; margin: 0 -16px 8px; padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
    background: color-mix(in srgb, var(--page-solid) 82%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--chip); }
  .seg button { flex: 1; height: 32px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--page-solid); }
  .jump { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump a { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--text); font-size: 13px; font-weight: 600; text-decoration: none; }

  section.design { padding-top: 22px; scroll-margin-top: 110px; }
  .dh { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .dh h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .dh .size { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dh .size b { color: var(--text); }
  .why { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  .lbl { display: flex; justify-content: space-between; margin: 14px 4px 8px; font-size: 13px; font-weight: 700; letter-spacing: 1.6px; color: var(--muted); }
  .lbl span { letter-spacing: 0; font-weight: 500; }
  .list { display: grid; gap: 12px; }

  /* ---- shared parts ---- */
  .card { position: relative; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--card-edge), var(--shadow); overflow: hidden; isolation: isolate; }
  html[data-look="glass"] .card { -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); }
  /* a faint pool of the speaker's colour, as Home's sky */
  .card::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 0% 0%, rgba(var(--a),0.20), transparent 60%); opacity: var(--glow, 1); }
  .card.idle { --glow: .35; } .card.offline { --glow: 0; }
  .card.offline > * { opacity: .45; }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--text); opacity: .86; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 21px; font-weight: 400; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(var(--a),0.22); font-size: 12px; font-weight: 600; }
  .tag svg { width: 12px; height: 12px; }
  .txt { min-width: 0; }
  .pp { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); box-shadow: inset 0 0 0 1px var(--btn-edge); transition: transform .15s; }
  .pp.on { background: rgb(var(--a)); color: var(--ink); box-shadow: 0 6px 16px -6px rgba(var(--a),0.8); }
  .pp:active { transform: scale(.92); }
  .pp:disabled { opacity: .35; }
  .nx { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); box-shadow: inset 0 0 0 1px var(--btn-edge); }
  .nx:disabled { opacity: .35; }
  .pp svg { width: 18px; height: 18px; } .nx svg { width: 15px; height: 15px; }

  /* covers: drawn, not real art */
  .art { background-size: cover; background-position: center; display: grid; place-items: center; color: rgba(255,255,255,0.9); }
  .art svg { width: 40%; height: 40%; max-width: 30px; max-height: 30px; }
  .art.moon { background: radial-gradient(circle at 66% 34%, #F6E7BC 0 15%, rgba(246,231,188,0.35) 16%, transparent 24%), linear-gradient(170deg, #263452 0%, #6B4D6A 55%, #D08348 100%); }
  .art.blue { background: linear-gradient(90deg, transparent 0 62%, rgba(255,255,255,0.85) 62% 64%, transparent 64%), linear-gradient(160deg, #0F2D5A 0%, #2D6CA8 60%, #7FB3D8 100%); }
  .art.none { background: radial-gradient(circle at 35% 30%, rgba(var(--a),0.95), rgba(var(--a),0.45)); color: rgba(20,20,24,0.75); }

  /* slider: a hairline and a small knob, in the speaker's colour */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: none; --p: 50%; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgb(var(--a)) var(--p), var(--track) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 6px rgba(0,0,0,0.45); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: rgb(var(--a)); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #FFF; }
  input[type=range]:disabled { opacity: .35; }

  /* ---- 0 · Today: the record ---- */
  .today { padding: 18px 18px 16px; display: grid; gap: 14px; }
  .today .top { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .rec { position: relative; width: var(--s, 96px); height: var(--s, 96px); border-radius: 50%; flex: none;
    background: repeating-radial-gradient(circle, rgba(255,255,255,0.045) 0 1px, transparent 1px 3px), radial-gradient(circle, #0E0E10 0%, #18181C 30%, #0D0D0F 31%, #1B1B20 60%, #0F0F12 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 14px 26px -14px rgba(0,0,0,0.8); }
  .rec .art { position: absolute; inset: 27%; border-radius: 50%; }
  .rec .art svg { max-width: 18px; }
  .rec.spin { animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ctl { display: flex; align-items: center; gap: 10px; }
  .ctl input { flex: 1; }
  .hair { width: 1px; height: 28px; background: var(--track); }

  /* ---- 1 · Sleeve: square cover, the record peeking out while it plays ---- */
  .sleeve { padding: 14px 14px 10px 14px; }
  .sleeve .top { display: flex; align-items: center; gap: 14px; }
  .sl { position: relative; width: 84px; height: 64px; flex: none; }
  .sl .art { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 10px; z-index: 1; box-shadow: 0 8px 18px -10px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08); }
  .sl .rec { --s: 58px; position: absolute; left: 3px; top: 3px; transition: left .7s cubic-bezier(.2,.8,.2,1); }
  .sl .rec::after { content: ''; position: absolute; inset: 40%; border-radius: 50%; background: rgba(var(--a),0.9); }
  .sl.out .rec { left: 24px; }
  .sleeve .txt { flex: 1; }
  .sleeve .title { font-size: 19px; }
  .sleeve .bot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .sleeve .bot input { flex: 1; }
  .sleeve .vn { width: 30px; text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- 2 · Cover edge: the art bleeds to the card's edge, everything in one row of height ---- */
  .edge { display: grid; grid-template-columns: 104px 1fr; min-height: 104px; }
  .edge > .art { border-radius: 0; height: 100%; min-height: 104px; }
  .edge > .art svg { max-width: 34px; max-height: 34px; }
  .edge .body { padding: 11px 14px 8px 14px; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .edge .title { font-size: 18px; }
  .edge .ctl { gap: 8px; margin-top: 2px; }
  .edge .pp { width: 36px; height: 36px; } .edge .pp svg { width: 15px; height: 15px; }
  .edge .nx { width: 30px; height: 30px; } .edge .nx svg { width: 13px; height: 13px; }

  /* ---- 3 · Fill: the card is the volume; drag across it ---- */
  .fill { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; min-height: 72px; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
  .fill .lvl { position: absolute; inset: 0 auto 0 0; width: var(--v); z-index: -1; transition: width .12s;
    background: linear-gradient(90deg, rgba(var(--a),0.16), rgba(var(--a),0.34)); box-shadow: inset -2px 0 0 rgba(var(--a),0.9); }
  .fill.idle .lvl, .fill.offline .lvl { background: linear-gradient(90deg, rgba(var(--a),0.06), rgba(var(--a),0.14)); box-shadow: inset -2px 0 0 rgba(var(--a),0.35); }
  .fill .art { width: 48px; height: 48px; border-radius: 12px; flex: none; position: relative; cursor: pointer; box-shadow: 0 6px 14px -8px rgba(0,0,0,0.8); }
  .fill .art .st { position: absolute; inset: 0; display: grid; place-items: center; border-radius: inherit; background: rgba(0,0,0,0.38); color: #fff; }
  .fill .art .st svg { width: 18px; height: 18px; max-width: none; max-height: none; }
  .fill .txt { flex: 1; }
  .fill .eyebrow { font-size: 11.5px; }
  .fill .title { font-size: 17px; }
  .fill .vn { flex: none; font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
  .fill .vn small { font-size: 12px; color: var(--muted); }
  .fill.dragging .vn { color: rgb(var(--a)); }

  /* ---- 4 · Tiles: two across, the cover is the card ---- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { padding: 8px; display: grid; gap: 8px; }
  .tile .cov { position: relative; aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; }
  .tile .cov .art { position: absolute; inset: 0; }
  .tile .cov .eyebrow { position: absolute; left: 10px; top: 9px; font-size: 10.5px; letter-spacing: 1.6px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.6); max-width: 70%; }
  .tile .cov .pp { position: absolute; right: 8px; bottom: 8px; width: 38px; height: 38px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); background: rgba(20,16,12,0.45); color: #fff; }
  .tile .cov .pp.on { background: rgb(var(--a)); color: var(--ink); }
  .tile .cov .pp svg { width: 15px; height: 15px; }
  .tile .txt { padding: 0 4px; }
  .tile .title { font-size: 15.5px; font-weight: 600; }
  .tile .sub { font-size: 12.5px; }
  .tile input { height: 22px; padding: 0 2px; }
  .tile input::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -6px; }

  /* ---- 5 · Quiet stack: only what is playing gets a card ---- */
  .quiet { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; --a: 200,190,170; }
  .quiet .h { width: 100%; font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: var(--muted); }
  .qchip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 6px; border-radius: 999px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--btn-edge); font-size: 14px; font-weight: 600; }
  .qchip i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--a),0.85); color: var(--ink); }
  .qchip i svg { width: 12px; height: 12px; }
  .qchip.off { opacity: .45; }
  .qchip small { font-weight: 500; color: var(--muted); }
  .grp .names { display: flex; gap: 6px; margin-top: 8px; }
  .grp .mini { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .grp .mini b { width: 54px; font-weight: 600; color: var(--text); opacity: .8; }
  .grp .mini input { flex: 1; height: 22px; }
  .grp .mini input::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5px; }
  .grp .more { margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }

  .note { margin: 10px 4px 0; font-size: 12.5px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { .rec.spin { animation: none; } .sl .rec, .fill .lvl { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Speaker cards</h1>
  <p class="lede">Today's record next to five more compact ways to draw the speakers in Home. Sample readings: tap play, drag volume. Nothing here reaches your speakers.</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Look">
      <button data-look="vintage" aria-pressed="true">Vintage</button>
      <button data-look="glass" aria-pressed="false">Sea glass</button>
    </div>
    <nav class="jump" aria-label="Designs"></nav>
  </div>
  <div class="designs" id="designs"></div>
</main>
<script>
'use strict';
const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.2v13.6a1 1 0 0 0 1.55.83l9.8-6.8a1 1 0 0 0 0-1.66l-9.8-6.8A1 1 0 0 0 4 5.2z"/><rect x="17" y="4" width="3.4" height="16" rx="1.2"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3.5v11.2a3.3 3.3 0 1 1-2-3V7.1l-8 1.8v8.3a3.3 3.3 0 1 1-2-3V6.2a1 1 0 0 1 .78-.98l10-2.25A1 1 0 0 1 19 3.5z"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8"/></svg>',
  group: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="11" height="18" rx="2.5"/><circle cx="14.5" cy="14" r="2.6"/><path d="M5 6v12" stroke-linecap="round"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9.5a12 12 0 0 1 16 0M7.5 13a7 7 0 0 1 9 0"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/><path d="M3 3l18 18"/></svg>',
};
const LOOK_ACC = {   // Vintage: mustard, teal, burnt orange, olive (MEDIA_V in house/media.js); Sea glass: each player's pastel
  vintage: { kt: '227,167,47', lo: '47,140,134', of: '216,87,42', ar: '47,140,134', mv: '184,69,43', nm: '196,170,120' },
  glass: { kt: '226,194,166', lo: '190,182,222', of: '176,196,224', ar: '178,204,230', mv: '224,186,198', nm: '172,204,206' },
};
// Home's preview: Kitchen and Office grouped on Harvest Moon, the Lounge paused, the Arc on the TV, the Move asleep, the Nest Mini idle.
const SP = [
  { id: 'kt', name: 'Kitchen', mood: 'playing', title: 'Harvest Moon', sub: 'Neil Young · Spotify', art: 'moon', vol: 38, with: 'With Office' },
  { id: 'lo', name: 'Lounge', mood: 'paused', title: 'Kind of Blue', sub: 'Miles Davis · AirPlay', art: 'blue', vol: 27 },
  { id: 'of', name: 'Office', mood: 'playing', title: 'Harvest Moon', sub: 'Neil Young · Spotify', art: 'moon', vol: 22, with: 'Following Kitchen' },
  { id: 'ar', name: 'Arc Sub', mood: 'tv', title: 'TV', sub: 'Sound from the TV · Dolby 5.1', art: '', vol: 41 },
  { id: 'mv', name: 'Move', mood: 'offline', title: 'Unavailable', sub: 'Asleep or out of range', art: '', vol: 0 },
  { id: 'nm', name: 'Nest Mini', mood: 'idle', title: 'Not playing', sub: 'Idle', art: '', vol: 50 },
];
const byId = id => SP.find(s => s.id === id);
let look = 'vintage';
const acc = s => LOOK_ACC[look][s.id];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const playing = s => s.mood === 'playing';
const live = s => s.mood === 'playing' || s.mood === 'paused';
const cls = s => `card ${s.mood === 'idle' ? 'idle' : ''} ${s.mood === 'offline' ? 'offline' : ''}`;
const style = s => `style="--a:${acc(s)}"`;
const art = (s, extra = '') => `<div class="art ${s.art || 'none'} ${extra}">${s.art ? '' : s.mood === 'tv' ? I.tv : I.music}</div>`;
const ppBtn = (s, k = '') => `<button class="pp ${k} ${playing(s) ? 'on' : ''}" data-pp="${s.id}" aria-label="${playing(s) ? 'Pause' : 'Play'} ${esc(s.name)}"${s.mood === 'offline' || s.mood === 'tv' ? ' disabled' : ''}>${playing(s) ? I.pause : I.play}</button>`;
const nxBtn = s => `<button class="nx" aria-label="Next"${!live(s) ? ' disabled' : ''}>${I.next}</button>`;
const range = (s, k = '') => `<input type="range" class="${k}" min="0" max="100" value="${s.vol}" data-vol="${s.id}" style="--p:${s.vol}%" aria-label="${esc(s.name)} volume"${s.mood === 'offline' ? ' disabled' : ''}>`;
const tag = s => s.with ? `<div><span class="tag">${I.group}${esc(s.with)}</span></div>` : '';

const DESIGNS = [
  { id: 'today', name: 'Today', why: 'The record: the art as its label, turning while it plays. Fun, but the 96px disc sets every card\'s height, idle or not.',
    list: () => `<div class="list">${SP.map(s => `<div class="${cls(s)} today" ${style(s)}>
      <div class="top"><div class="rec ${playing(s) ? 'spin' : ''}">${art(s)}</div>
        <div class="txt"><div class="eyebrow">${esc(s.name)} ›</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div>${tag(s)}</div></div>
      <div class="ctl">${ppBtn(s)}${nxBtn(s)}<i class="hair"></i>${range(s)}</div></div>`).join('')}</div>` },

  { id: 'sleeve', name: 'Sleeve', why: 'The cover as a square sleeve; while it plays the record slides half out and turns. Keeps the vinyl wink at a third of the size.',
    list: () => `<div class="list">${SP.map(s => `<div class="${cls(s)} sleeve" ${style(s)}>
      <div class="top"><div class="sl ${live(s) ? 'out' : ''}"><div class="rec ${playing(s) ? 'spin' : ''}"></div>${art(s)}</div>
        <div class="txt"><div class="eyebrow">${esc(s.name)} ›</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.with ? s.sub + ' · ' + s.with : s.sub)}</div></div>
        ${ppBtn(s)}</div>
      <div class="bot">${nxBtn(s)}${range(s)}<span class="vn" data-vn="${s.id}">${s.vol}</span></div></div>`).join('')}</div>` },

  { id: 'edge', name: 'Cover edge', why: 'The art runs to the card\'s edge, full height, like a now-playing bar. Everything sits beside it, so the card is only as tall as the cover.',
    list: () => `<div class="list">${SP.map(s => `<div class="${cls(s)} edge" ${style(s)}>${art(s)}
      <div class="body"><div class="txt"><div class="eyebrow">${esc(s.name)} ›</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.with ? s.with : s.sub)}</div></div>
        <div class="ctl">${ppBtn(s)}${nxBtn(s)}${range(s)}</div></div></div>`).join('')}</div>` },

  { id: 'fill', name: 'Fill', why: 'The whole card is the volume, as Control Center: drag sideways anywhere on it. Tap the cover to play or pause. One slim row each.',
    list: () => `<div class="list">${SP.map(s => `<div class="${cls(s)} fill" data-fill="${s.id}" style="--a:${acc(s)};--v:${s.vol}%" role="slider" aria-label="${esc(s.name)} volume" aria-valuenow="${s.vol}" aria-valuemin="0" aria-valuemax="100" tabindex="0">
      <i class="lvl"></i><div class="art ${s.art || 'none'}" data-pp="${s.id}" role="button" aria-label="${playing(s) ? 'Pause' : 'Play'} ${esc(s.name)}">${s.art ? '' : s.mood === 'tv' ? I.tv : I.music}${live(s) ? `<span class="st">${playing(s) ? I.pause : I.play}</span>` : ''}</div>
      <div class="txt"><div class="eyebrow">${esc(s.name)}${s.with ? ' · ' + esc(s.with) : ''}</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div></div>
      <div class="vn" data-vn="${s.id}">${s.mood === 'offline' ? '–' : s.vol}<small>${s.mood === 'offline' ? '' : '%'}</small></div></div>`).join('')}</div>
      <p class="note">Drag left or right on a card to set its volume; scroll as normal up and down.</p>` },

  { id: 'tiles', name: 'Tiles', why: 'Two across, the cover is the tile with play on it. Six speakers fit in three rows; the rest is a tap away in the player.',
    list: () => `<div class="tiles">${SP.map(s => `<div class="${cls(s)} tile" ${style(s)}>
      <div class="cov">${art(s)}<div class="eyebrow">${esc(s.name)}</div>${ppBtn(s)}</div>
      <div class="txt"><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.with || s.sub)}</div></div>${range(s)}</div>`).join('')}</div>` },

  { id: 'quiet', name: 'Quiet stack', why: 'Only what is playing gets a card (here as Sleeve); speakers grouped together share one; the idle and offline ones fold into a row of chips.',
    list: () => {
      const kt = byId('kt'), of = byId('of'), rest = SP.filter(s => !['kt', 'of'].includes(s.id));
      const active = rest.filter(s => live(s) || s.mood === 'tv'), quiet = rest.filter(s => !live(s) && s.mood !== 'tv');
      const sleeve = (s, names, extra = '') => `<div class="${cls(s)} sleeve ${extra}" ${style(s)}>
        <div class="top"><div class="sl ${live(s) ? 'out' : ''}"><div class="rec ${playing(s) ? 'spin' : ''}"></div>${art(s)}</div>
          <div class="txt"><div class="eyebrow">${names} ›</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div></div>${ppBtn(s)}</div>
        <div class="bot">${nxBtn(s)}${range(s)}<span class="vn" data-vn="${s.id}">${s.vol}</span></div>`;
      // A group drives every member: Kitchen leads; the members' own levels below, small.
      const group = sleeve(kt, 'Kitchen + Office', 'grp') + `<div class="mini"><b>Kitchen</b>${range(kt)}</div><div class="mini"><b>Office</b>${range(of)}</div></div>`;
      return `<div class="list">${group}${active.map(s => sleeve(s, esc(s.name)) + '</div>').join('')}
        <div class="card quiet"><div class="h">NOT PLAYING</div>${quiet.map(s => `<button class="qchip ${s.mood === 'offline' ? 'off' : ''}" style="--a:${acc(s)}" aria-label="${esc(s.name)}, ${esc(s.sub)}"><i>${s.mood === 'offline' ? I.off : I.music}</i>${esc(s.name)}${s.mood === 'offline' ? ' <small>asleep</small>' : ''}</button>`).join('')}</div></div>
        <p class="note">Mix and match: this works with any of the other cards in place of Sleeve.</p>`;
    } },
];

const $ = s => document.querySelector(s);
function render() {
  const keep = window.scrollY;
  $('#designs').innerHTML = DESIGNS.map(d => `<section class="design" id="d-${d.id}">
    <div class="dh"><h2>${DESIGNS.indexOf(d) ? DESIGNS.indexOf(d) + ' · ' : ''}${d.name}</h2><span class="size" data-size="${d.id}"></span></div>
    <p class="why">${d.why}</p>
    <div class="lbl">SPEAKERS<span>${SP.filter(playing).length} playing</span></div>
    <div class="host" data-host="${d.id}">${d.list()}</div></section>`).join('');
  $('.jump').innerHTML = DESIGNS.map(d => `<a href="#d-${d.id}">${d.name}</a>`).join('');
  measure();
  window.scrollTo(0, keep);
}
// How tall the six speakers stand in each design, against today's.
function measure() {
  const h = id => Math.round(document.querySelector(`[data-host="${id}"]`).getBoundingClientRect().height);
  const base = h('today');
  for (const d of DESIGNS) {
    const v = h(d.id);
    document.querySelector(`[data-size="${d.id}"]`).innerHTML = d.id === 'today' ? `<b>${v}px</b> for six` : `<b>${v}px</b> · ${Math.round((1 - v / base) * 100)}% shorter`;
  }
}
function setVol(id, v) {
  const s = byId(id); s.vol = Math.max(0, Math.min(100, Math.round(v)));
  document.querySelectorAll(`[data-vol="${id}"]`).forEach(e => { if (+e.value !== s.vol) e.value = s.vol; e.style.setProperty('--p', s.vol + '%'); });
  document.querySelectorAll(`[data-vn="${id}"]`).forEach(e => { e.innerHTML = e.closest('.fill') ? `${s.vol}<small>%</small>` : s.vol; });
  document.querySelectorAll(`[data-fill="${id}"]`).forEach(e => { e.style.setProperty('--v', s.vol + '%'); e.setAttribute('aria-valuenow', s.vol); });
}
document.addEventListener('input', e => { if (e.target.dataset.vol) setVol(e.target.dataset.vol, +e.target.value); });
document.addEventListener('click', e => {
  const lk = e.target.closest('[data-look]');
  if (lk && lk.tagName === 'BUTTON') { look = lk.dataset.look; document.documentElement.dataset.look = look; document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === lk)); render(); return; }
  const pp = e.target.closest('[data-pp]');
  if (pp && !pp.disabled && !fillMoved) { const s = byId(pp.dataset.pp); if (s.mood === 'playing') s.mood = 'paused'; else if (s.mood === 'paused' || s.mood === 'idle') s.mood = 'playing'; else return;
    if (s.id === 'kt' || s.id === 'of') { const o = byId(s.id === 'kt' ? 'of' : 'kt'); o.mood = s.mood; }   // a group plays and pauses together
    if (s.mood === 'playing' && !s.art && s.id === 'nm') { s.title = 'Morning Mix'; s.sub = 'Spotify'; }
    render(); }
});
// Fill: drag sideways anywhere on the card; up and down still scrolls (touch-action: pan-y).
let drag = null, fillMoved = false;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('[data-fill]'); fillMoved = false;
  if (!c || c.classList.contains('offline')) return;
  drag = { c, id: c.dataset.fill, x: e.clientX, v: byId(c.dataset.fill).vol, w: c.getBoundingClientRect().width };
});
document.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x;
  if (!fillMoved && Math.abs(dx) < 6) return;
  fillMoved = true; drag.c.classList.add('dragging'); setVol(drag.id, drag.v + dx / drag.w * 100);
});
const endDrag = () => { if (drag) drag.c.classList.remove('dragging'); drag = null; setTimeout(() => { fillMoved = false; }, 0); };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => { const c = e.target.closest && e.target.closest('[data-fill]'); if (!c) return;
  const d = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key]; if (d) { e.preventDefault(); setVol(c.dataset.fill, byId(c.dataset.fill).vol + d); } });
render();
window.addEventListener('resize', measure);
</script>
</body>
</html>
