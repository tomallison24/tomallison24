<!doctype html>
<html lang="en-US" data-look="vintage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker volume</title>
<meta name="description" content="Five ways to draw the volume control on Home's Quiet stack speaker cards.">
<!--
  labs/speakers/volume: a test page for the owner, not an app. The Quiet stack speaker card (picked from
  ../index.html) with five volume controls in place of the plain slider: Wedge, Meter, Groove, Tuner and Knob.
  Sample readings only; nothing reaches Home Assistant. Vintage or Sea glass, dark. See ../../index.html.
-->
<style>
  :root {
    --page: linear-gradient(180deg, #4A391E 0%, #3E301B 40%, #33281A 100%); --page-solid: #3E301B;
    --card: #2F2822; --card-edge: rgba(255,240,215,0.07); --text: #FFF7EA; --muted: rgba(255,240,220,0.62); --faint: rgba(255,240,220,0.38);
    --chip: rgba(255,240,215,0.08); --track: rgba(255,240,215,0.14); --btn: rgba(255,240,215,0.09); --btn-edge: rgba(255,240,215,0.14);
    --knob-hi: #6A5845; --knob-lo: #2A221B; --needle: #F2E6CF;
    --ink: #2A1E0C; --shadow: 0 14px 30px -18px rgba(0,0,0,0.7); --r: 26px;
    color-scheme: dark;
  }
  html[data-look="glass"] {
    --page: radial-gradient(120% 60% at 80% 0%, #2A3446 0%, #1A212B 55%, #141A22 100%); --page-solid: #1A212B;
    --card: rgba(255,255,255,0.05); --card-edge: rgba(255,255,255,0.10); --text: #FFFFFF; --muted: rgba(235,235,245,0.62); --faint: rgba(235,235,245,0.36);
    --chip: rgba(255,255,255,0.08); --track: rgba(255,255,255,0.14); --btn: rgba(255,255,255,0.08); --btn-edge: rgba(255,255,255,0.16);
    --knob-hi: rgba(255,255,255,0.30); --knob-lo: rgba(255,255,255,0.06); --needle: #FFFFFF;
    --ink: #10181A; --shadow: 0 14px 30px -18px rgba(0,0,0,0.6); --r: 28px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--page-solid); }
  body { margin: 0; min-height: 100vh; background: var(--page); background-attachment: fixed; color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  main { max-width: 440px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 48px); }
  @media (min-width: 900px) { main { max-width: 1400px; } .designs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 28px; } }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; margin: 6px 0 4px; }
  .lede { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
  .lede a { color: var(--text); }
  .bar { position: sticky; top: 0; z-index: 5; margin: 0 -16px 8px; padding: calc(env(safe-area-inset-top) + 8px) 16px 10px;
    background: color-mix(in srgb, var(--page-solid) 82%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .seg { display: flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--chip); }
  .seg button { flex: 1; height: 32px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--page-solid); }
  .jump { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump a { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--text); font-size: 13px; font-weight: 600; text-decoration: none; }
  section.design { padding-top: 22px; scroll-margin-top: 110px; }
  .dh h2 { margin: 0; font-size: 22px; font-weight: 700; }
  .why { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  .list { display: grid; gap: 12px; }
  .note { margin: 10px 4px 0; font-size: 12.5px; color: var(--faint); }

  /* ---- the Quiet stack card (Sleeve) ---- */
  .card { position: relative; border-radius: var(--r); background: var(--card); box-shadow: inset 0 0 0 1px var(--card-edge), var(--shadow); overflow: hidden; isolation: isolate; padding: 14px 14px 10px; }
  html[data-look="glass"] .card { -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%); }
  .card::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 0% 0%, rgba(var(--a),0.20), transparent 60%); }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: .86; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: 19px; font-weight: 400; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top { display: flex; align-items: center; gap: 14px; }
  .txt { flex: 1; min-width: 0; }
  .bot { display: flex; align-items: center; gap: 12px; margin-top: 8px; min-height: 36px; }
  .bot .vc { flex: 1; }
  .vn { width: 28px; text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pp { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); box-shadow: inset 0 0 0 1px var(--btn-edge); transition: transform .15s; }
  .pp.on { background: rgb(var(--a)); color: var(--ink); box-shadow: 0 6px 16px -6px rgba(var(--a),0.8); }
  .pp:active { transform: scale(.92); } .pp:disabled { opacity: .35; }
  .nx { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--btn); box-shadow: inset 0 0 0 1px var(--btn-edge); }
  .nx:disabled { opacity: .35; }
  .pp svg { width: 18px; height: 18px; } .nx svg { width: 15px; height: 15px; }
  .art { display: grid; place-items: center; color: rgba(255,255,255,0.9); }
  .art svg { width: 26px; height: 26px; }
  .art.moon { background: radial-gradient(circle at 66% 34%, #F6E7BC 0 15%, rgba(246,231,188,0.35) 16%, transparent 24%), linear-gradient(170deg, #263452 0%, #6B4D6A 55%, #D08348 100%); }
  .art.blue { background: linear-gradient(90deg, transparent 0 62%, rgba(255,255,255,0.85) 62% 64%, transparent 64%), linear-gradient(160deg, #0F2D5A 0%, #2D6CA8 60%, #7FB3D8 100%); }
  .art.none { background: radial-gradient(circle at 35% 30%, rgba(var(--a),0.95), rgba(var(--a),0.45)); color: rgba(20,20,24,0.75); }
  .sl { position: relative; width: 84px; height: 64px; flex: none; }
  .sl .art { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 10px; z-index: 1; box-shadow: 0 8px 18px -10px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.08); }
  .rec { position: absolute; left: 3px; top: 3px; width: 58px; height: 58px; border-radius: 50%; transition: left .7s cubic-bezier(.2,.8,.2,1);
    background: repeating-radial-gradient(circle, rgba(255,255,255,0.045) 0 1px, transparent 1px 3px), radial-gradient(circle, #0E0E10 0%, #18181C 30%, #0D0D0F 31%, #1B1B20 60%, #0F0F12 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
  .rec::after { content: ''; position: absolute; inset: 40%; border-radius: 50%; background: rgba(var(--a),0.9); }
  .rec.spin { animation: spin 9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sl.out .rec { left: 24px; }
  .sl .st { position: absolute; left: 4px; bottom: 4px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(15,12,9,0.6); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .sl .st.on { background: rgb(var(--a)); color: var(--ink); }
  .sl .st svg { width: 11px; height: 11px; }
  .mini { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); min-height: 28px; }
  .mini > b { width: 54px; flex: none; font-weight: 600; color: var(--text); opacity: .8; }
  .mini .vc { flex: 1; }
  .quiet { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; --a: 200,190,170; }
  .quiet .h { width: 100%; font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: var(--muted); }
  .qchip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 6px; border-radius: 999px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--btn-edge); font-size: 14px; font-weight: 600; }
  .qchip i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--a),0.85); color: var(--ink); }
  .qchip i svg { width: 12px; height: 12px; }
  .qchip.off { opacity: .45; }
  .qchip small { font-weight: 500; color: var(--muted); }

  /* ---- volume controls: one shell, five drawings. --v is 0..1 ---- */
  .vc { position: relative; height: 32px; touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none; outline: none; }
  .vc.sm { height: 24px; }
  .vc:focus-visible { box-shadow: 0 0 0 2px rgba(var(--a),0.7); border-radius: 8px; }

  /* Before: the plain hairline and knob */
  .vc-line::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
    background: linear-gradient(90deg, rgb(var(--a)) calc(var(--v) * 100%), var(--track) 0); }
  .vc-line i { position: absolute; top: 50%; left: calc(var(--v) * (100% - 20px)); width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: #FFF; box-shadow: 0 1px 6px rgba(0,0,0,0.45); }
  .vc-line.sm i { width: 14px; height: 14px; margin-top: -7px; left: calc(var(--v) * (100% - 14px)); }

  /* 1 Wedge: the volume icon's ramp, filled to the level, with a cut mark */
  .vc-wedge .w, .vc-wedge .w b { position: absolute; inset: 5px 0 5px 0; clip-path: polygon(0 calc(100% - 3px), 0 100%, 100% 100%, 100% 0); border-radius: 0 4px 4px 0; }
  .vc-wedge.sm .w { inset: 4px 0; }
  .vc-wedge .w { background: var(--track); }
  .vc-wedge .w b { inset: 0; background: linear-gradient(90deg, rgba(var(--a),0.55), rgb(var(--a))); clip-path: polygon(0 calc(100% - 3px), 0 100%, 100% 100%, 100% 0); -webkit-mask: linear-gradient(90deg, #000 calc(var(--v) * 100%), transparent 0); mask: linear-gradient(90deg, #000 calc(var(--v) * 100%), transparent 0); }
  .vc-wedge i { position: absolute; top: 1px; bottom: 1px; left: calc(var(--v) * 100%); width: 4px; margin-left: -2px; border-radius: 2px; background: var(--needle); box-shadow: 0 0 0 1px rgba(0,0,0,0.25), 0 1px 5px rgba(0,0,0,0.4); }
  .vc-wedge.sm i { width: 3px; margin-left: -1.5px; }

  /* 2 Meter: a VU ladder; the lit bars move with the music while it plays */
  .vc-meter { display: flex; align-items: flex-end; gap: 3px; padding: 4px 0; }
  .vc-meter.sm { gap: 2px; padding: 3px 0; }
  .vc-meter b { flex: 1; height: var(--h); border-radius: 2px; background: var(--track); transform-origin: 50% 100%; }
  .vc-meter b.on { background: rgb(var(--a)); }
  .vc-meter b.on.hot { background: color-mix(in srgb, rgb(var(--a)) 55%, #FFF); }
  .playing .vc-meter b.on { animation: vu var(--d) ease-in-out var(--dl) infinite alternate; }
  @keyframes vu { from { transform: scaleY(1); } to { transform: scaleY(.45); } }

  /* 3 Groove: the line swells as it gets louder, and runs while it plays */
  .vc-groove svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .vc-groove path { fill: none; stroke-width: 2.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .vc-groove .base { stroke: var(--track); }
  .vc-groove .lit { stroke: rgb(var(--a)); clip-path: inset(-20px calc((1 - var(--v)) * 100%) -20px 0); }
  .vc-groove i { position: absolute; left: calc(var(--v) * 100%); top: var(--y, 50%); width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--needle); box-shadow: 0 0 0 3px rgba(var(--a),0.35), 0 1px 5px rgba(0,0,0,0.45); }
  .vc-groove.sm i { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; }

  /* 4 Tuner: a radio dial's scale slides under a fixed needle */
  .vc-tuner { --u: 7px; height: 38px; overflow: hidden; touch-action: pan-y;
    -webkit-mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
  .vc-tuner.sm { --u: 5px; height: 26px; }
  .vc-tuner .scale { position: absolute; left: 50%; top: 4px; height: 30px; width: calc(100 * var(--u) + 1px); transform: translateX(calc(var(--vv) * var(--u) * -1)); transition: transform .08s linear;
    background: repeating-linear-gradient(90deg, var(--faint) 0 1px, transparent 1px calc(var(--u) * 10)) 0 0 / 100% 14px no-repeat,
                repeating-linear-gradient(90deg, var(--track) 0 1px, transparent 1px var(--u)) 0 4px / 100% 7px no-repeat; }
  .vc-tuner.sm .scale { top: 2px; height: 22px; }
  .vc-tuner .scale span { position: absolute; top: 16px; transform: translateX(-50%); font-size: 10px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vc-tuner.sm .scale span { top: 12px; font-size: 9px; }
  .vc-tuner .needle { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgb(var(--a)); box-shadow: 0 0 8px rgba(var(--a),0.8); }
  .vc-tuner .needle::before { content: ''; position: absolute; left: -4px; top: 0; border: 5px solid transparent; border-top-color: rgb(var(--a)); border-bottom: 0; }

  /* 5 Knob: a hi-fi volume knob, turned by dragging up or right; the arc shows the level */
  .vc-knob { --k: 58px; width: var(--k); height: var(--k); flex: none; touch-action: none; cursor: ns-resize; border-radius: 50%; }
  .vc-knob.sm { --k: 38px; height: var(--k); }
  .vc-knob .ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 225deg, rgb(var(--a)) 0 calc(var(--v) * 270deg), var(--track) 0 270deg, transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); }
  .vc-knob.sm .ring { -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
  .vc-knob .cap { position: absolute; inset: 7px; border-radius: 50%; transform: rotate(calc(-135deg + var(--v) * 270deg));
    background: repeating-conic-gradient(rgba(255,255,255,0.07) 0 5deg, rgba(0,0,0,0.10) 5deg 10deg), radial-gradient(circle at 50% 20%, var(--knob-hi), var(--knob-lo) 75%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 6px 12px -6px rgba(0,0,0,0.8); }
  .vc-knob.sm .cap { inset: 5px; }
  .vc-knob .cap::before { content: ''; position: absolute; left: 50%; top: 3px; width: 3px; height: 26%; margin-left: -1.5px; border-radius: 2px; background: rgb(var(--a)); box-shadow: 0 0 6px rgba(var(--a),0.8); }
  .vc-knob .n { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 10px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; pointer-events: none; }
  .vc-knob.sm .n { display: none; }
  .knobs { display: flex; gap: 18px; margin-top: 10px; padding-left: 2px; }
  .knobs label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .vc.dragging + .vn, .vc.dragging .n { color: rgb(var(--a)); }

  @media (prefers-reduced-motion: reduce) { .rec.spin, .playing .vc-meter b.on { animation: none; } .sl .rec, .vc-tuner .scale { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Speaker volume</h1>
  <p class="lede">The Quiet stack card you picked, with five volume controls in place of the plain slider. Drag any of them; tap play to see the ones that move with the music. <a href="../">Back to the cards</a></p>
  <div class="bar">
    <div class="seg" role="group" aria-label="Look">
      <button data-look="vintage" aria-pressed="true">Vintage</button>
      <button data-look="glass" aria-pressed="false">Sea glass</button>
    </div>
    <nav class="jump" aria-label="Volume controls"></nav>
  </div>
  <div class="designs" id="designs"></div>
</main>
<script>
'use strict';
const I = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5.2v13.6a1 1 0 0 0 1.55.83l9.8-6.8a1 1 0 0 0 0-1.66l-9.8-6.8A1 1 0 0 0 4 5.2z"/><rect x="17" y="4" width="3.4" height="16" rx="1.2"/></svg>',
  music: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3.5v11.2a3.3 3.3 0 1 1-2-3V7.1l-8 1.8v8.3a3.3 3.3 0 1 1-2-3V6.2a1 1 0 0 1 .78-.98l10-2.25A1 1 0 0 1 19 3.5z"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9.5a12 12 0 0 1 16 0M7.5 13a7 7 0 0 1 9 0"/><circle cx="12" cy="17" r="1.3" fill="currentColor"/><path d="M3 3l18 18"/></svg>',
};
const LOOK_ACC = {
  vintage: { grp: '227,167,47', kt: '227,167,47', of: '216,87,42', lo: '47,140,134', ar: '47,140,134', mv: '184,69,43', nm: '196,170,120' },
  glass: { grp: '226,194,166', kt: '226,194,166', of: '176,196,224', lo: '190,182,222', ar: '178,204,230', mv: '224,186,198', nm: '172,204,206' },
};
// The group's level is its loudest member's; moving it moves every member by the same amount (as Sonos does).
const SP = {
  kt: { id: 'kt', name: 'Kitchen', mood: 'playing', vol: 38 }, of: { id: 'of', name: 'Office', mood: 'playing', vol: 22 },
  lo: { id: 'lo', name: 'Lounge', mood: 'paused', title: 'Kind of Blue', sub: 'Miles Davis · AirPlay', art: 'blue', vol: 27 },
  ar: { id: 'ar', name: 'Arc Sub', mood: 'tv', title: 'TV', sub: 'Sound from the TV · Dolby 5.1', art: '', vol: 41 },
  mv: { id: 'mv', name: 'Move', mood: 'offline' }, nm: { id: 'nm', name: 'Nest Mini', mood: 'idle' },
};
const GRP = { id: 'grp', names: 'Kitchen + Office', title: 'Harvest Moon', sub: 'Neil Young · Spotify', art: 'moon', members: ['kt', 'of'] };
Object.defineProperty(GRP, 'mood', { get: () => SP.kt.mood, set: m => { SP.kt.mood = SP.of.mood = m; } });
Object.defineProperty(GRP, 'vol', { get: () => Math.max(SP.kt.vol, SP.of.vol) });
const get = id => id === 'grp' ? GRP : SP[id];
let look = 'vintage';
const acc = id => LOOK_ACC[look][id];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const playing = s => s.mood === 'playing';
const live = s => s.mood === 'playing' || s.mood === 'paused';

// ---- the five drawings ----
const METER_N = 20;   // one bar for every 5%
const rnd = (i, k) => { const x = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return x - Math.floor(x); };
const KINDS = {
  line: { name: 'Before', why: 'Today\'s hairline and white knob, for comparison: it works, but it is the slider every app has.', inner: () => '<i></i>' },
  wedge: { name: 'Wedge', why: 'The volume icon\'s ramp: thin when quiet, tall when loud, filled to the level with a cut mark you drag. Reads as volume before you read the number.',
    inner: () => '<span class="w"><b></b></span><i></i>' },
  meter: { name: 'Meter', why: 'A VU ladder of 20 bars rising left to right, each one 5%. Tap a bar to set the level there, or drag across them; slide off the left end for silent. While the speaker plays, the lit bars bounce like a level meter; paused, they hold still.',
    inner: (id, sm) => Array.from({ length: METER_N }, (_, i) => `<b style="--h:${Math.round(28 + 72 * i / (METER_N - 1))}%;--d:${(0.32 + rnd(i, id.length) * 0.5).toFixed(2)}s;--dl:-${(rnd(i, 3) * 0.6).toFixed(2)}s"></b>`).join('') },
  groove: { name: 'Groove', why: 'A record groove that swells as it gets louder: calm at the quiet end, wide at the loud end, and it runs while the music plays. The dot rides the line.',
    inner: () => '<svg viewBox="0 0 200 32" preserveAspectRatio="none" aria-hidden="true"><path class="base"/><path class="lit"/></svg><i></i>' },
  tuner: { name: 'Tuner', why: 'An old radio\'s dial: the scale slides under a fixed needle as you drag, numbers every ten. Fine control, and the needle shows the level without a separate number.',
    inner: () => `<div class="scale">${Array.from({ length: 11 }, (_, i) => `<span style="left:calc(${i * 10} * var(--u))">${i * 10}</span>`).join('')}</div><i class="needle"></i>` },
  knob: { name: 'Knob', why: 'A hi-fi volume knob: drag up or right to turn it, the arc lights to the level. The card becomes one row, with play on the cover and next in the full player.',
    inner: (id, sm) => `<i class="ring"></i><i class="cap"></i>${sm ? '' : '<span class="n"></span>'}` },
};
const vc = (kind, id, sm = false, dis = false) => `<div class="vc vc-${kind}${sm ? ' sm' : ''}" data-vc="${id}" data-kind="${kind}" role="slider" tabindex="${dis ? -1 : 0}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(id === 'grp' ? GRP.names : get(id).name)} volume"${dis ? ' aria-disabled="true"' : ''}>${KINDS[kind].inner(id, sm)}</div>`;

function groovePath(v, phase, k) {
  // amplitude grows to the right (louder), and with the level itself a little
  let d = '';
  for (let x = 0; x <= 200; x += 2) {
    const amp = 1 + (x / 200) * (7 + v * 5);
    const y = 16 + amp * Math.sin(x / 200 * Math.PI * 2 * 6.5 + phase + k);
    d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(2);
  }
  return d;
}
function paint(el) {
  const id = el.dataset.vc, v = get(id).vol, f = v / 100, kind = el.dataset.kind;
  el.style.setProperty('--v', f); el.setAttribute('aria-valuenow', v);
  if (kind === 'meter') { const lit = Math.round(v / 5); el.querySelectorAll('b').forEach((b, i) => { b.classList.toggle('on', i < lit); b.classList.toggle('hot', i < lit && i >= 17); }); }   // a level a speaker reports between steps (38) lights the nearest (40); the number stays exact
  if (kind === 'tuner') el.style.setProperty('--vv', v);
  if (kind === 'knob') { const n = el.querySelector('.n'); if (n) n.textContent = v; }
  if (kind === 'groove') drawGroove(el, el.closest('.playing') ? performance.now() / 600 : 0);
  const vn = el.parentElement.querySelector(`[data-vn="${id}"]`); if (vn) vn.textContent = v;
}
function drawGroove(el, t) {
  const f = get(el.dataset.vc).vol / 100, d = groovePath(f, t, el.dataset.vc.length);
  el.querySelectorAll('path').forEach(p => p.setAttribute('d', d));
  const x = f * 200, amp = 1 + (x / 200) * (7 + f * 5), y = 16 + amp * Math.sin(x / 200 * Math.PI * 2 * 6.5 + t + el.dataset.vc.length);
  el.style.setProperty('--y', (y / 32 * 100).toFixed(1) + '%');
}
(function loop() {   // the grooves of what is playing run
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('.playing .vc-groove').forEach(el => drawGroove(el, performance.now() / 600));
  requestAnimationFrame(loop);
})();

// ---- the card ----
const art = s => `<div class="art ${s.art || 'none'}">${s.art ? '' : s.mood === 'tv' ? I.tv : I.music}</div>`;
const ppBtn = s => `<button class="pp ${playing(s) ? 'on' : ''}" data-pp="${s.id}" aria-label="${playing(s) ? 'Pause' : 'Play'}"${s.mood === 'tv' ? ' disabled' : ''}>${playing(s) ? I.pause : I.play}</button>`;
const nxBtn = s => `<button class="nx" aria-label="Next"${!live(s) ? ' disabled' : ''}>${I.next}</button>`;
function card(kind, s, names) {
  const knob = kind === 'knob', grp = s.id === 'grp';
  const sleeve = `<div class="sl ${live(s) ? 'out' : ''}"><div class="rec ${playing(s) ? 'spin' : ''}"></div>${art(s)}${knob && s.mood !== 'tv' ? `<button class="st ${playing(s) ? 'on' : ''}" data-pp="${s.id}" aria-label="${playing(s) ? 'Pause' : 'Play'}">${playing(s) ? I.pause : I.play}</button>` : ''}</div>`;
  const head = `<div class="top">${sleeve}<div class="txt"><div class="eyebrow">${esc(names)} ›</div><div class="title">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div></div>${knob ? vc(kind, s.id) : ppBtn(s)}</div>`;
  const row = knob ? '' : `<div class="bot">${nxBtn(s)}${vc(kind, s.id)}${kind === 'tuner' ? '' : `<span class="vn" data-vn="${s.id}"></span>`}</div>`;
  const members = !grp ? '' : knob
    ? `<div class="knobs">${GRP.members.map(m => `<label>${vc(kind, m, true)}${esc(SP[m].name)}</label>`).join('')}</div>`
    : GRP.members.map(m => `<div class="mini"><b>${esc(SP[m].name)}</b>${vc(kind, m, true)}</div>`).join('');
  return `<div class="card ${playing(s) ? 'playing' : ''}" style="--a:${acc(s.id)}">${head}${row}${members}</div>`;
}
function stack(kind) {
  const quiet = [SP.mv, SP.nm];
  return `<div class="list">${card(kind, GRP, GRP.names)}${card(kind, SP.lo, 'Lounge')}${card(kind, SP.ar, 'Arc Sub')}
    <div class="card quiet"><div class="h">NOT PLAYING</div>${quiet.map(s => `<button class="qchip ${s.mood === 'offline' ? 'off' : ''}" style="--a:${acc(s.id)}"><i>${s.mood === 'offline' ? I.off : I.music}</i>${esc(s.name)}${s.mood === 'offline' ? ' <small>asleep</small>' : ''}</button>`).join('')}</div></div>`;
}

const ORDER = ['wedge', 'meter', 'groove', 'tuner', 'knob', 'line'];
const $ = s => document.querySelector(s);
function render() {
  const keep = window.scrollY;
  $('#designs').innerHTML = ORDER.map((k, n) => `<section class="design" id="v-${k}"><div class="dh"><h2>${k === 'line' ? '' : n + 1 + ' · '}${KINDS[k].name}</h2></div>
    <p class="why">${KINDS[k].why}</p>${stack(k)}${k === 'knob' ? '<p class="note">Kitchen + Office: the big knob turns the group, the small ones each speaker.</p>' : ''}</section>`).join('');
  $('.jump').innerHTML = ORDER.map(k => `<a href="#v-${k}">${KINDS[k].name}</a>`).join('');
  document.querySelectorAll('.vc').forEach(paint);
  window.scrollTo(0, keep);
}
function setVol(id, v) {
  v = Math.max(0, Math.min(100, Math.round(v)));
  if (id === 'grp') { const d = v - GRP.vol; for (const m of GRP.members) SP[m].vol = Math.max(0, Math.min(100, SP[m].vol + d)); }
  else SP[id].vol = v;
  document.querySelectorAll('.vc').forEach(el => { if (el.dataset.vc === id || el.dataset.vc === 'grp' || (id === 'grp' && GRP.members.includes(el.dataset.vc))) paint(el); });
}

// Where the finger is, as a level. The meter goes in 5% steps: a bar is 5%, the one under the finger and every one before it lit; left of the first, silent.
const at = (d, x) => { const f = (x - d.r.left) / d.r.width; return d.kind === 'meter' ? (f <= 0 ? 0 : Math.min(METER_N, Math.floor(f * METER_N) + 1) * 5) : f * 100; };
// Dragging: the bars, wedge, groove and line follow the finger; the tuner and the knob turn by how far you move.
let drag = null, moved = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.vc'); moved = false;
  if (!el || el.getAttribute('aria-disabled')) return;
  const r = el.getBoundingClientRect(), kind = el.dataset.kind;
  drag = { el, id: el.dataset.vc, kind, x: e.clientX, y: e.clientY, v: get(el.dataset.vc).vol, r, rel: kind === 'tuner' || kind === 'knob' };
  if (kind === 'knob') { el.setPointerCapture(e.pointerId); e.preventDefault(); }
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!moved) { if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return; if (drag.kind !== 'knob' && Math.abs(dy) > Math.abs(dx)) { drag = null; return; } }   // a vertical move is a scroll
  moved = true; drag.el.classList.add('dragging');
  if (drag.kind === 'knob') setVol(drag.id, drag.v + (dx - dy) * 100 / 160);
  else if (drag.kind === 'tuner') setVol(drag.id, drag.v - dx / parseFloat(getComputedStyle(drag.el).getPropertyValue('--u')));
  else setVol(drag.id, at(drag, e.clientX));
});
document.addEventListener('pointerup', e => {
  if (drag && !moved && !drag.rel) setVol(drag.id, at(drag, e.clientX));   // a tap on the bars, wedge, groove or line sets the level there
  if (drag) drag.el.classList.remove('dragging');
  drag = null; setTimeout(() => { moved = false; }, 0);
});
document.addEventListener('pointercancel', () => { if (drag) drag.el.classList.remove('dragging'); drag = null; });
document.addEventListener('keydown', e => {
  const el = e.target.closest && e.target.closest('.vc'); if (!el) return;
  const d = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5 }[e.key];
  if (d) { e.preventDefault(); const v = get(el.dataset.vc).vol + d; setVol(el.dataset.vc, el.dataset.kind === 'meter' ? Math.round(v / 5) * 5 : v); }
});
document.addEventListener('click', e => {
  const lk = e.target.closest('.seg [data-look]');
  if (lk) { look = lk.dataset.look; document.documentElement.dataset.look = look; document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b === lk)); render(); return; }
  const pp = e.target.closest('[data-pp]');
  if (pp && !pp.disabled && !moved) { const s = get(pp.dataset.pp); s.mood = s.mood === 'playing' ? 'paused' : 'playing'; render(); }
});
render();
</script>
</body>
</html>
