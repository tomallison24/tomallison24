<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in Fitness's own colour (#9D1E63) on a pale glass of it (#FEDCE5), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFEFF3"/>
      <stop offset="0.55" stop-color="#FEDCE5"/>
      <stop offset="1" stop-color="#F2C5D5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <g transform="rotate(-30 256 256) translate(256 256) scale(.86) translate(-256 -256)" fill="#9D1E63">
      <rect x="150" y="238" width="212" height="36" rx="18"/>
      <rect x="96" y="172" width="54" height="168" rx="22"/><rect x="362" y="172" width="54" height="168" rx="22"/>
      <rect x="58" y="204" width="44" height="104" rx="18"/><rect x="410" y="204" width="44" height="104" rx="18"/>
    </g>
  </g>
</svg>
