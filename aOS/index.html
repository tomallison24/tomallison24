<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aOS">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1116" media="(prefers-color-scheme: dark)">
<title>aOS</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<!--
  aOS - the home of every AllisonOS app, laid out like an app store.

  - The aOS mark: aOS with the version as a superscript, shining, and "The
    Power of aOS1"; a tap replays the AllisonOS welcome.
  - Apps: every AllisonOS app as a tile, as the Home app's automations (glass,
    three across, a glow of the app's colour behind it), with its tagline (or
    "New in aOS1.1" when the latest release changed it). A tap opens the app's
    address: in Safari it shows how to add it to the Home Screen.
  - What's new in aOS: the release log, newest first, with what changed in
    each app.
  - Appearance: System, Light or Dark, for aOS. Each app on the Home Screen
    keeps its own, asked in its walkthrough.

  The welcome, the walkthroughs, the update screens and the release log are all
  in ../home/welcome.js, which every app loads; this page reads its data. With
  data-app="aos" it shows how to add aOS in Safari, and from the Home Screen
  the AllisonOS welcome the first time and the welcome's major-update screens.

  No build step: this file is the whole app and sw.js keeps it working offline.
-->
<style>
  :root {
    --bg: #F2F4F8; --text: #0B0B0F; --muted: rgba(60,60,67,.62); --tile: rgba(255,255,255,.7); --edge: rgba(0,0,0,.07); --dot: rgba(0,0,0,.08);
    --accent: #0A84FF;
    --pastel: linear-gradient(100deg, #6FA597 0%, #8193BC 34%, #BE918F 67%, #BC9C68 100%); --glow: rgba(129,147,188,.32);
    --ag-bg: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42));
    --ag-edge: inset 0 0 0 0.5px rgba(28,32,40,0.1), inset 0 1px 0.5px rgba(255,255,255,0.9), 0 10px 24px -12px rgba(30,40,60,0.28);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0F1116; --text: #fff; --muted: rgba(235,235,245,.62); --tile: rgba(255,255,255,.06); --edge: rgba(255,255,255,.1); --dot: rgba(255,255,255,.12);
   
    --pastel: linear-gradient(100deg, #A9D3C7 0%, #B9C6E0 34%, #E3C5C3 67%, #E9D6B4 100%); --glow: rgba(185,198,224,.5);
    --ag-bg: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03));
    --ag-edge: inset 0 0 0 0.5px rgba(255,255,255,0.26), inset 0 1px 0.5px rgba(255,255,255,0.5), inset 0 -1px 1px rgba(255,255,255,0.1), 0 10px 24px -12px rgba(0,0,0,0.7);
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0F1116; --text: #fff; --muted: rgba(235,235,245,.62); --tile: rgba(255,255,255,.06); --edge: rgba(255,255,255,.1); --dot: rgba(255,255,255,.12);
   
    --pastel: linear-gradient(100deg, #A9D3C7 0%, #B9C6E0 34%, #E3C5C3 67%, #E9D6B4 100%); --glow: rgba(185,198,224,.5);
    --ag-bg: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.03));
    --ag-edge: inset 0 0 0 0.5px rgba(255,255,255,0.26), inset 0 1px 0.5px rgba(255,255,255,0.5), inset 0 -1px 1px rgba(255,255,255,0.1), 0 10px 24px -12px rgba(0,0,0,0.7);
    color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  main { max-width: 560px; margin: 0 auto; }
  /* the pastel colour fields behind everything, faint */
  .fields { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .fields i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .18; }
  .fields i:nth-child(1) { background: #A9D3C7; left: -30vmax; top: -30vmax; }
  .fields i:nth-child(2) { background: #E3C5C3; right: -35vmax; top: 20vh; }
  .fields i:nth-child(3) { background: #B9C6E0; left: -20vmax; bottom: -40vmax; }

  /* the hero: the aOS mark, shining */
  .hero { display: flex; flex-direction: column; align-items: center; padding: 34px 0 24px; text-align: center; }
  .mark { position: relative; font-size: 72px; font-weight: 800; letter-spacing: -2.4px; line-height: 1; }
  .ink { background: linear-gradient(110deg, transparent 0 38%, rgba(255,255,255,.95) 48%, transparent 58% 100%), var(--pastel); background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0;
    -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: shine 4s cubic-bezier(.45,0,.2,1) 1s infinite; }
  @keyframes shine { 0% { background-position: 130% 0, 0 0; } 40%, 100% { background-position: -30% 0, 0 0; } }
  .mark sup { position: relative; display: inline-block; font-size: .5em; letter-spacing: 0; margin-left: 2px; top: -.78em; vertical-align: 0; filter: drop-shadow(0 0 12px var(--glow)); }
  .star { position: absolute; width: 12px; height: 12px; opacity: 0; animation: twinkle 3s ease-in-out infinite; }
  .star:nth-of-type(1) { right: -26px; top: -30px; animation-delay: .6s; }
  .star:nth-of-type(2) { right: 6px; top: -46px; width: 8px; height: 8px; animation-delay: 1.5s; }
  .star:nth-of-type(3) { right: -40px; top: 2px; width: 9px; height: 9px; animation-delay: 2.3s; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 15% { opacity: .9; transform: scale(1) rotate(45deg); } 35% { opacity: 0; transform: scale(.4) rotate(90deg); } }
  .power { margin-top: 14px; font-size: 15px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }   /* never capitals: aOS keeps its lowercase a */
  .power sup { font-size: .75em; letter-spacing: 0; }
  .replay { margin-top: 18px; height: 38px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 600; background: var(--tile); box-shadow: inset 0 0 0 .5px var(--edge); }
  .replay:active { transform: scale(.97); }

  h2 { font-size: 22px; margin: 26px 4px 10px; letter-spacing: -.3px; display: flex; align-items: baseline; justify-content: space-between; }
  h2 small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .group { border-radius: 24px; background: var(--tile); box-shadow: inset 0 0 0 .5px var(--edge); overflow: hidden; }
  /* the apps: the Home app's automation tiles (design D) - square Liquid Glass, three across,
     a soft glow of the app's own colour behind each; a tap opens the app's address */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .agw { position: relative; isolation: isolate; }
  .ag-glow { position: absolute; inset: 14%; z-index: -1; border-radius: 999px; pointer-events: none; filter: blur(16px);
    background: radial-gradient(closest-side, rgba(var(--c),0.9), rgba(var(--c),0)); opacity: .3; transition: opacity .5s, inset .5s; }
  .agw:active .ag-glow { opacity: .8; inset: 4%; }
  .ag { position: relative; width: 100%; text-decoration: none; -webkit-tap-highlight-color: transparent; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 13px; border-radius: 26px; text-align: left; color: inherit;
    background: var(--ag-bg); -webkit-backdrop-filter: blur(18px) saturate(180%); backdrop-filter: blur(18px) saturate(180%);
    box-shadow: var(--ag-edge); transition: transform .2s cubic-bezier(.22,1,.36,1); }
  .ag:active { transform: scale(0.96); }
  .ag img { width: 42px; height: 42px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.18); }
  .ag b { display: block; font-size: 14px; font-weight: 600; line-height: 1.2; }
  .ag small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 11px; line-height: 1.25; color: var(--muted); margin-top: 2px; }
  .ag small sup { font-size: .75em; line-height: 0; }
  /* what's new in aOS */
  .rel { padding: 16px; }
  .rel + .rel { border-top: .5px solid var(--edge); }
  .rel h3 { margin: 0; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
  .rel h3 sup { font-size: .65em; }
  .rel h3 small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .rel ul { margin: 8px 0 0; padding: 0 0 0 18px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .rel li.hi { color: var(--text); font-weight: 600; list-style: none; margin-left: -18px; padding-left: 18px; position: relative; }
  .rel li.hi::before { content: '★'; position: absolute; left: 0; font-size: 11px; top: 3px; background: var(--pastel); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .rel .rt { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
  .rel h4 { margin: 12px 0 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  /* appearance */
  .seg { display: flex; padding: 3px; border-radius: 999px; background: var(--dot); margin: 0 4px; }
  .seg button { flex: 1; height: 36px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--bg); box-shadow: 0 2px 8px rgba(0,0,0,.14), inset 0 0 0 .5px var(--edge); }
  .foot { text-align: center; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 34px; }

  .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .ink, .star { animation: none; } .star { opacity: 0; } }
</style>
</head>
<body>
<div class="fields"><i></i><i></i><i></i></div>
<main>
  <section class="hero">
    <div class="mark" id="mark"></div>
    <div class="power" id="power"></div>
    <button class="replay" id="replay" type="button">Replay the welcome</button>
  </section>

  <h2>Apps <small id="count"></small></h2>
  <div class="tiles" id="apps"></div>

  <h2 id="whats-new">What's new in aOS</h2>
  <div class="group" id="rels"></div>

  <h2>Appearance</h2>
  <div class="seg" id="theme" role="group" aria-label="Appearance"></div>

  <p class="foot">Part of the Allison Corporation</p>
</main>

<script src="../home/welcome.js" data-app="aos" data-auto></script>
<script>
'use strict';
(() => {
  const W = AllisonOS.welcome, D = W.data, $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const STAR = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" fill="currentColor"/></svg>';
  const icon = id => `../${id}/icon-512.png`;
  const appUrl = id => new URL(`../${id}/`, location.href).href;
  const v = D.latest();

  // the mark
  $('mark').innerHTML = `<span class="ink">aOS</span><sup class="ink">${esc(v)}</sup>${STAR}${STAR}${STAR}`;
  $('power').innerHTML = `The Power of aOS<sup>${esc(v)}</sup>`;
  $('replay').onclick = () => W.play();

  // the apps
  $('count').textContent = D.APPS.length + ' apps';
  // each app's own colour, from its icon, for the glow behind its tile
  const HUE = { mail: '240,120,200', calendar: '255,84,112', news: '110,140,255', weather: '70,150,255', notes: '40,200,170', podcasts: '190,90,240', travel: '255,150,60', places: '70,200,120', fitness: '140,155,180', house: '125,105,245' };
  const now = D.RELEASES[0];
  const changed = id => { const e = D.entry((now.apps || {})[id]); return e.highlights.length + e.notes.length > 0; };
  const sub = id => changed(id) ? `New in aOS<sup>${esc(now.v)}</sup>` : esc((D.TOURS[id] || {}).tag || '');
  $('apps').innerHTML = D.APPS.map(id => `<div class="agw" style="--c:${HUE[id] || '190,194,204'}"><i class="ag-glow"></i>
    <a class="ag" href="${appUrl(id)}?via=aos" target="_blank" rel="noopener" data-id="${id}" aria-label="${esc(D.NAMES[id])}"><img src="${icon(id)}" alt=""><span><b>${esc(D.NAMES[id])}</b><small>${sub(id)}</small></span></a></div>`).join('');

  // a tap opens the app's address (target _blank) with ?via=aos: there it shows how to add it,
  // even in the in-app Safari view an installed aOS opens it in

  // what's new in aOS
  // the log, by version: the highlights (starred), the rest, then each app's changes
  const li = (n, hi) => `<li${hi ? ' class="hi"' : ''}>${esc(n)}</li>`;
  const block = x => { const e = D.entry(x); return [...e.highlights.map(n => li(n, 1)), ...e.notes.map(n => li(n))].join(''); };
  $('rels').innerHTML = D.RELEASES.map(r => `<div class="rel"><h3><span>aOS<sup>${esc(r.v)}</sup></span><small>${esc(r.date || '')}</small></h3>
    ${r.title ? `<p class="rt">${esc(r.title)}</p>` : ''}${block(r) ? `<ul>${block(r)}</ul>` : ''}
    ${Object.entries(r.apps || {}).sort(([a], [b]) => D.APPS.indexOf(a) - D.APPS.indexOf(b)).map(([id, x]) => block(x) ? `<h4>${esc(D.NAMES[id] || id)}</h4><ul>${block(x)}</ul>` : '').join('')}</div>`).join('');

  // appearance
  const paintSeg = () => { const t = W.theme.read(); for (const b of $('theme').children) b.setAttribute('aria-pressed', String(b.dataset.t === t)); };
  $('theme').innerHTML = W.theme.list.map(([t, n]) => `<button type="button" data-t="${t}">${n}</button>`).join('');
  $('theme').onclick = e => { const b = e.target.closest('button'); if (b) { W.theme.set(b.dataset.t); paintSeg(); } };
  paintSeg();

})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
