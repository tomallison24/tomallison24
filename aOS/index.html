<!--
  aOS - the home of every AllisonOS app, as an app store, in a mid-century modern look
  (Vintage, the second <style>) or, picked under the account, the original Sea glass
  (the first <style>): look.js applies the choice before the page is drawn.

  - Today: the family card first - the family icon, "The Allison Family", a
    greeting by name and everyone in the family (signed in) - then postcards, as a bento (one tall, two halves, one wide, again):
    an app the newest release brought (its `added`) and what's new in aOS (the mark, #mark) first,
    for 30 days after the release; then a mix that changes every day - the app of the day, other
    apps, setting up Home, your family account (aOS/app.js, "Today"). Signed out, a card at the top asks you to sign in.
  - Apps: every app as a card glowing in its own colour, with its tagline (or
    "New in aOS1.1" when the latest release changed it) and Get.
  - Search: by name, tagline or what the walkthrough says.
  - An app's page: Get, its facts as chips, What's New (and Version History),
    Preview (drawn from its walkthrough cards), What it needs, About.
  - Get: opens the app's own address with ?via=aos (in the in-app Safari view
    an installed aOS opens links in), which shows only its install steps,
    animated; the view's ✕ comes back here.
  - The avatar: your account (#acct: the owner's set-up, an invite's Join,
    Sign in; signed in, the owner's tools - the Home Assistant address, invites,
    the family), Appearance, Updates (#whats-new, the release log without silent
    releases) and Replay the welcome. An invite link (#invite=) or the owner's
    first set-up opens it by itself; ../aOS/#whats-new opens it at Updates.

  The welcome, the walkthroughs, the update screens and the release log are all
  in ../home/welcome.js, which every app loads; this page reads its data. With
  data-app="aos" it shows how to add aOS in Safari, and from the Home Screen
  the AllisonOS welcome the first time and the welcome's major-update screens.

  No build step: this file is the whole app and sw.js keeps it working offline.
-->
<style>
  /* Sea glass, not iOS: mist and sand grounds, a sea-glass accent, pastel for the

  :root { --bg: #EEF2F0; --card: rgba(255,255,255,.78); --solid: #FAFBFA; --text: #10181A; --muted: rgba(16,24,26,.64); --line: rgba(16,24,26,.08); --dot: rgba(16,24,26,.06);

    --pastel: linear-gradient(100deg, #6FA597 0%, #8193BC 34%, #BE918F 67%, #BC9C68 100%);
    --blob1: rgba(111,165,151,.22); --blob2: rgba(190,145,143,.18); --blob3: rgba(129,147,188,.18); color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0D1213; --card: rgba(255,255,255,.055); --solid: #161C1D; --text: #EEF4F2; --muted: rgba(238,244,242,.58); --line: rgba(255,255,255,.07); --dot: rgba(255,255,255,.07);
    --glass: rgba(22,28,29,.72); --edge: rgba(255,255,255,.09); --accent: #A9D3C7; --sand: #E9D6B4; --on: #0D1213;
    --pastel: linear-gradient(100deg, #A9D3C7 0%, #B9C6E0 34%, #E3C5C3 67%, #E9D6B4 100%);
    --blob1: rgba(169,211,199,.10); --blob2: rgba(227,197,195,.08); --blob3: rgba(185,198,224,.08); color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0D1213; --card: rgba(255,255,255,.055); --solid: #161C1D; --text: #EEF4F2; --muted: rgba(238,244,242,.58); --line: rgba(255,255,255,.07); --dot: rgba(255,255,255,.07);
    --glass: rgba(22,28,29,.72); --edge: rgba(255,255,255,.09); --accent: #A9D3C7; --sand: #E9D6B4; --on: #0D1213;
    --pastel: linear-gradient(100deg, #A9D3C7 0%, #B9C6E0 34%, #E3C5C3 67%, #E9D6B4 100%);
    --blob1: rgba(169,211,199,.10); --blob2: rgba(227,197,195,.08); --blob3: rgba(185,198,224,.08); color-scheme: dark; }

  /* the tabs: one scrolling page each */

  .tab[hidden] { display: none; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 2px 20px; }

    box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--edge), 0 8px 20px rgba(0,0,0,.12); }

  /* Today: postcards, laid out as a bento - one tall, two halves, one wide */
  #stories { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .story { position: relative; display: block; cursor: pointer; grid-column: span 2; height: 420px; border-radius: 30px; overflow: hidden; text-align: left; color: #fff; background: #222;
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.07), 0 16px 34px rgba(0,0,0,.14); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .story:active { transform: scale(.975); }
  .story .art { position: absolute; inset: 0; background: radial-gradient(90% 70% at 78% 30%, rgba(var(--c), .9), rgba(var(--c), .28) 58%, #0C1112 100%); }
  .story .art::after { content: ''; position: absolute; inset: 6px; border-radius: 24px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); pointer-events: none; }
  .story .art img { position: absolute; width: 120px; height: 120px; border-radius: 30px; right: 26px; top: 186px; box-shadow: 0 0 0 10px rgba(255,255,255,.08), 0 0 60px 16px rgba(var(--c), .55); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }

  .story .foot { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 22px; background: rgba(12,16,17,.38); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); }
  .story .foot img { width: 42px; height: 42px; border-radius: 12px; }
  .story .foot span { flex: 1; min-width: 0; } .story .foot b { display: block; font-size: 15px; } .story .foot i { display: block; font-style: normal; font-size: 13px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* halves: the icon on top, the title under it, no band */
  .story.half { grid-column: span 1; height: 250px; }
  .story.half .art img { width: 64px; height: 64px; border-radius: 17px; left: 18px; right: auto; top: 56px; box-shadow: 0 0 0 6px rgba(255,255,255,.08), 0 0 40px 10px rgba(var(--c), .5); }
  .story.half .art svg { width: 150px; height: 150px; left: auto; right: -30px; bottom: -20px; }

  .story.wide .foot { display: none; }
  .story.plain { color: var(--text); background: var(--solid); box-shadow: inset 0 0 0 1px var(--edge), 0 16px 34px rgba(0,0,0,.08); }

  .story.plain .art::after { box-shadow: inset 0 0 0 1px var(--edge); }
  .story.plain .chip { background: var(--dot); }
  .story.plain .mk { position: absolute; left: 0; right: 0; top: 112px; text-align: center; font-size: 92px; font-weight: 800; letter-spacing: -3px; }
  .story.plain.half .mk { top: 62px; font-size: 50px; letter-spacing: -1.5px; }
  /* Meet Ipsy: the stem cell itself on the card, telling what it can do in a speech bubble (aOS/app.js, home/ipsy.js) */
  .story .art .ipsy-stage { position: absolute; right: 6px; top: 118px; width: 196px; height: 196px; }
  .story .art .ipsy-host .ipsy-cell, .hero .art .ipsy-host .ipsy-cell, .ipsy-forms .ipsy-cell { position: static; inset: auto; width: 100%; height: 100%; color: inherit; }
  .ipsy-say { position: absolute; left: 22px; top: 158px; max-width: 48%; margin: 0; padding: 11px 14px; border-radius: 20px 20px 6px 20px; background: rgba(255,255,255,.92); color: #10181A;
    font-size: 15px; font-weight: 650; line-height: 1.3; box-shadow: 0 10px 24px rgba(0,0,0,.18); }

  .hero.ipsy .art .ipsy-hero { position: absolute; right: 4px; top: calc(env(safe-area-inset-top) + 74px); width: 200px; height: 200px; }
  .hero.ipsy .ipsy-say { left: 22px; top: calc(env(safe-area-inset-top) + 120px); }

  .row::before { content: ''; position: absolute; left: -30px; top: 50%; width: 130px; height: 130px; margin-top: -65px; border-radius: 50%; background: radial-gradient(rgba(var(--c), .32), transparent 65%); pointer-events: none; }
  .row img { position: relative; width: 58px; height: 58px; border-radius: 17px; flex: 0 0 58px; }

  .row .t span { flex: 1; min-width: 0; } .row b { display: block; font-size: 17px; font-weight: 650; } .row i { display: block; font-style: normal; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .get { position: relative; flex: 0 0 auto; min-width: 70px; height: 32px; padding: 0 16px; border-radius: 11px; background: var(--pastel); color: #10181A; font-size: 15px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(111,165,151,.3), inset 0 1px 0 rgba(255,255,255,.5); }

  .sec a, .sec button { color: var(--accent); font-size: 15px; font-weight: 600; }

  /* the dock: one glass bar, three equal stops, a pastel indicator that slides */
  .bar { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 20; max-width: 420px; margin: 0 auto; }
  .tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 6px; border-radius: 26px; background: var(--glass); -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5);
    box-shadow: inset 0 0 0 1px var(--edge), 0 14px 34px rgba(0,0,0,.16); --i: 0; }
  .tabs .ind { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 3); border-radius: 20px; background: var(--pastel); opacity: .9;
    transform: translateX(calc(var(--i) * 100%)); transition: transform .45s cubic-bezier(.3,1.3,.5,1); box-shadow: 0 6px 16px rgba(111,165,151,.35); }

  .tabs button svg { width: 20px; height: 20px; }

  .find input { flex: 1; border: 0; background: none; color: var(--text); font: inherit; outline: none; }

  /* pages that slide in: an app, a story, the account */
  .page { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; transform: translateX(100%); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
  .page.on { transform: none; }
  .page.up { transform: translateY(100%); } .page.up.on { transform: none; }
  .page .in { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 66px) 18px calc(env(safe-area-inset-bottom) + 40px); }

    background: var(--glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: inset 0 0 0 1px var(--edge), 0 6px 18px rgba(0,0,0,.12); font-size: 22px; }
  .back { left: 14px; } .close { right: 14px; font-size: 16px; }
  /* an app: centred, its colour as a halo, the facts as chips */
  .apphead { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 6px; }
  .apphead::before { content: ''; position: absolute; top: -60px; left: 50%; width: 320px; height: 260px; margin-left: -160px; background: radial-gradient(rgba(var(--c), .35), transparent 65%); pointer-events: none; }
  .apphead img { position: relative; width: 112px; height: 112px; border-radius: 30px; box-shadow: 0 0 0 8px var(--card), 0 16px 34px rgba(var(--c), .4); }

  .apphead .gone[hidden] { display: none; }
  .apphead .gone-note { margin: 4px auto 0; max-width: 280px; color: var(--muted); font-size: 14px; }
  .strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 20px 0 0; }
  .strip div { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); font-size: 13.5px; }
  .strip small { color: var(--muted); font-size: 12px; } .strip b { font-size: 14px; } .strip i { font-style: normal; }
  .strip svg { width: 17px; height: 17px; color: var(--accent); }
  .wn { padding: 14px 16px; border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); }
  .wn small { color: var(--muted); font-size: 14px; } .wn ul { margin: 8px 0 0; padding-left: 20px; } .wn li { margin: 4px 0; } .wn p { margin: 6px 0 0; }
  .shots { display: flex; gap: 12px; overflow-x: auto; margin: 0 -18px; padding: 4px 18px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .shots::-webkit-scrollbar { display: none; }
  .shot { flex: 0 0 200px; height: 380px; border-radius: 30px; scroll-snap-align: start; position: relative; overflow: hidden; padding: 24px 18px; color: #fff;
    background: radial-gradient(120% 65% at 50% 0%, rgba(var(--c), .85), rgba(var(--c), .22) 60%, #0C1112 100%); box-shadow: inset 0 0 0 6px rgba(255,255,255,.06); }
  .shot svg { width: 104px; height: 104px; display: block; margin: 34px auto 24px; color: rgba(255,255,255,.92); }
  .shot b { display: block; font-size: 18px; line-height: 1.2; text-align: center; } .shot p { font-size: 13px; line-height: 1.4; text-align: center; opacity: .82; margin: 8px 0 0; }
  .desc p { margin: 0 0 10px; } .muted { color: var(--muted); }
  .info { border-radius: 22px; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); padding: 2px 16px; }
  .info div { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); } .info div:last-child { border-bottom: 0; }
  .info div span:first-child { color: var(--muted); }
  .need { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-radius: 18px; background: var(--card); margin-top: 8px; box-shadow: inset 0 0 0 1px var(--edge); }
  .need em { font-style: normal; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 8px; white-space: nowrap; }
  .need .ok { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); } .need .once { background: color-mix(in srgb, var(--sand) 20%, transparent); color: var(--sand); }
  .need span { flex: 1; font-size: 15px; }

  /* a story, opened */
  .hero { position: relative; height: 380px; margin: calc(-1 * (env(safe-area-inset-top) + 66px)) -18px 20px; color: #fff; overflow: hidden; border-radius: 0 0 34px 34px; }
  .hero .art { position: absolute; inset: 0; background: radial-gradient(90% 70% at 78% 35%, rgba(var(--c), .9), rgba(var(--c), .28) 58%, #0C1112 100%); }
  .hero .art img { position: absolute; width: 120px; height: 120px; border-radius: 30px; right: 26px; top: calc(env(safe-area-inset-top) + 96px); box-shadow: 0 0 0 10px rgba(255,255,255,.08), 0 0 60px 16px rgba(var(--c), .55); }
  .hero .txt { position: absolute; left: 22px; right: 22px; bottom: 26px; }
