<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Mid-century modern, as a tinted tile: its drawing in Places's own colour (#517E21) on a pale tint of it (#D5EFD0); every app has its own, a shade of its room's (Out and about: aOS/app.js, ROOM_HUE). A small mustard sun and burnt-orange pill in the corners are the Vintage mark. Flat shapes, full-bleed; the phone rounds the corners. -->
  <defs><mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M256 420C222 382 140 300 140 214a116 116 0 0 1 232 0c0 86-82 168-116 206z" fill="#fff"/>
      <circle cx="256" cy="212" r="44" fill="#000"/>
    </mask></defs>
  <rect width="512" height="512" fill="#D5EFD0"/>
  <circle cx="424" cy="88" r="44" fill="#E3A72F"/>
  <rect x="46" y="432" width="88" height="24" rx="12" fill="#D8572A" transform="rotate(-18 90 444)"/>
  <g>
    <ellipse cx="256" cy="430" rx="64" ry="14" fill="#517E21" fill-opacity="0.45"/>
    <rect width="512" height="512" fill="#517E21" mask="url(#cut)"/>
  </g>
</svg>
