<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sea glass, as a tinted tile: the drawing in Places's own colour (#517E21) on a pale glass of it (#D5EFD0), the same colour it has in every look (aOS/app.js, ROOM_HUE). A full-bleed diagonal gradient, a soft glow top left; the phone rounds the corners. -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ECF8EA"/>
      <stop offset="0.55" stop-color="#D5EFD0"/>
      <stop offset="1" stop-color="#C5E1BB"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#10181A" flood-opacity="0.08"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M256 420C222 382 140 300 140 214a116 116 0 0 1 232 0c0 86-82 168-116 206z" fill="#fff"/>
      <circle cx="256" cy="212" r="44" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <ellipse cx="256" cy="430" rx="64" ry="14" fill="#517E21" fill-opacity="0.45"/>
    <rect width="512" height="512" fill="#517E21" mask="url(#cut)"/>
  </g>
</svg>
