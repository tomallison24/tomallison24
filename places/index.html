<!--
  Places - where you want to go and where you've been, as a home-screen web app.

  Data: your places live in this browser's localStorage and, signed in,
  in the family's Google Sheet, Notes', through aOS. Search and place details come from
  OpenStreetMap (Photon for search, Overpass for opening hours, phone and
  website); the map is CARTO's, drawn by Leaflet (vendor/). Directions open
  in Apple Maps. See README.md.
  Two designs, picked in Settings > Design (the gear, ../home/design.js, as in
  Clock): Vintage (mid-century modern, the default: the <style id="vintage">
  block) and Standard (Sea glass: that block switched off, the frosted glass
  above it). The old Places Vintage address opens this same app.
-->
<style>
:root{
  --bg:#EEF2F0; --text:#111114; --muted:rgba(60,60,67,.80); --faint:rgba(60,60,67,.76);
  --accent:#3B7366; --on-accent:#FFFFFF; --cta:linear-gradient(100deg,#6FA597 0%,#8193BC 34%,#BE918F 67%,#BC9C68 100%); --cta-ink:#10181A; --accent-text:#3B7366; --danger:#E5281D; --danger-text:#AE2117; --star:#F5A623; --want:#0A84FF; --been:#F5A623;
  --glass:rgba(255,255,255,.58); --gb-edge:rgba(255,255,255,.95); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 60%);
  --hair:rgba(60,60,67,.14); --fill:rgba(118,118,128,.11); --hi:rgba(255,255,255,.8); --lift:rgba(40,40,80,.08); --lift-strong:rgba(40,40,80,.16);
  --blur:blur(30px) saturate(180%); --ease:cubic-bezier(.22,1,.36,1); --aurora:.40; --icon:#3B7366;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --lgs-top:rgba(255,255,255,.68); --lgs-bottom:rgba(255,255,255,.50); --lgs-rim:rgba(255,255,255,.92); --lgs-edge:rgba(255,255,255,.62);
  --lgs-row:rgba(255,255,255,.44); --lgs-field:rgba(255,255,255,.62); --lgs-filter:blur(28px) saturate(200%) brightness(1.06); --lgs-scrim:rgba(0,0,0,.10);
  --seg-thumb:rgba(255,255,255,.92); --bar-solid:rgba(247,249,248,.97); --tint-mix:16%; --sel-ink:#24493F;
  /* Cards: very faint tiles, the same in every AllisonOS app (a whisper of fill, a hairline edge, no shadow) */
  --tile:rgba(255,255,255,.40); --tile-edge:rgba(60,60,67,.10);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#0D1213; --text:#FFFFFF; --muted:rgba(235,235,245,.62); --faint:rgba(235,235,245,.55);
  --accent:#A9D3C7; --on-accent:#10181A; --cta:linear-gradient(100deg,#A9D3C7 0%,#B9C6E0 34%,#E3C5C3 67%,#E9D6B4 100%); --accent-text:#A9D3C7; --danger:#FF453A; --danger-text:#FF453A; --star:#FFB340;
  --glass:rgba(16,22,23,.46); --gb-edge:rgba(255,255,255,.16); --gb-shine:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);
  --hair:rgba(255,255,255,.11); --fill:rgba(255,255,255,.07); --hi:rgba(255,255,255,.10); --lift:rgba(0,0,0,.38); --lift-strong:rgba(0,0,0,.5);
  --aurora:.72; --icon:#A9D3C7;
  --lgs-top:rgba(40,50,51,.60); --lgs-bottom:rgba(20,27,28,.52); --lgs-rim:rgba(255,255,255,.20); --lgs-edge:rgba(255,255,255,.12);
  --lgs-row:rgba(255,255,255,.07); --lgs-field:rgba(255,255,255,.10); --lgs-filter:blur(28px) saturate(180%) brightness(.92); --lgs-scrim:rgba(0,0,0,.30);
  --seg-thumb:rgba(255,255,255,.14); --bar-solid:rgba(18,24,25,.96); --tint-mix:42%; --sel-ink:#FFFFFF;
  --tile:rgba(255,255,255,.05); --tile-edge:rgba(255,255,255,.10);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
a{color:var(--accent-text)}

.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;display:block;border-radius:50%;filter:blur(58px);opacity:var(--aurora)}
.ambient i:nth-child(1){width:110%;aspect-ratio:1;left:-24%;top:-4%;background:radial-gradient(circle,#BE918F 0%,rgba(190,145,143,0) 68%);animation:drift1 34s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:92%;aspect-ratio:1;right:-18%;top:10%;background:radial-gradient(circle,#6FA597 0%,rgba(111,165,151,0) 68%);animation:drift2 41s ease-in-out infinite alternate}
.ambient i:nth-child(3){width:120%;aspect-ratio:1;right:-20%;bottom:-6%;background:radial-gradient(circle,#8193BC 0%,rgba(129,147,188,0) 68%);animation:drift3 47s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14%,10%,0) scale(1.18)}}
@keyframes drift2{to{transform:translate3d(-12%,16%,0) scale(1.12)}}
@keyframes drift3{to{transform:translate3d(-16%,-12%,0) scale(1.22)}}
@media (prefers-reduced-motion:reduce){.ambient i{animation:none}}
/* The page has two: this aurora (the one after .app) and, in the header, the atomic shapes of the
   Vintage design (#vintage below), which show only there */
.top > .ambient{display:none}

.app{position:relative;max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.top{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;display:flex;flex-direction:column;gap:10px}
.titlerow{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.title{margin:0;flex:1;font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.03em}
.title small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--faint);margin-top:3px}
.acts{display:flex;gap:8px;align-items:center}
.glass{background:var(--gb-shine),var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--gb-edge);box-shadow:inset 0 1px 0 var(--hi),0 10px 30px var(--lift)}
.iconbtn{width:38px;height:38px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;color:var(--icon);transition:transform .18s var(--ease)}
.iconbtn:active{transform:scale(.9)}
.iconbtn[aria-pressed="true"]{color:var(--accent-text)}
.seg{display:flex;border-radius:999px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:999px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button b{font-weight:700;font-size:13px;opacity:.75}
.seg button[aria-pressed="true"]{color:var(--text)}
.seg:not(.slides) button[aria-pressed="true"]{background:var(--seg-thumb)}
.slides{position:relative;isolation:isolate}
.slides > :not(.slthumb){position:relative;z-index:1}
.slthumb{position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;z-index:0;pointer-events:none;background:var(--gb-shine),var(--seg-thumb);
  box-shadow:inset 0 0 0 1px var(--gb-edge),inset 0 1px 0 var(--hi),0 3px 10px var(--lift);transition:opacity .25s ease,scale .25s var(--ease)}
.slthumb.off{opacity:0;scale:.7}
.opts > .slthumb{background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),var(--glass))}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 0;font-size:16px;color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:5px 2px;margin:-3px -2px -1px}   /* room for the chips' 44-point tap layer, inside the scroller */
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--sel-ink);background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent);border-color:color-mix(in srgb,var(--accent) 40%,var(--gb-edge))}

.list{padding:4px 14px 0;display:flex;flex-direction:column;gap:14px}
.group{border-radius:24px;overflow:hidden;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--tile-edge)}
.group h2{margin:0;padding:12px 16px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px}
.row + .row{border-top:.5px solid var(--hair)}
.row:active{background:var(--fill)}
.row .em{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--fill);flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex:none;text-align:right;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.stars{color:var(--star);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--hair)}
.price{font-weight:600;color:var(--text);opacity:.75}
.when{font-weight:600;color:var(--accent-text)}
.empty{padding:40px 24px;text-align:center;color:var(--muted);border-radius:24px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--tile-edge)}
.empty strong{display:block;font-size:18px;color:var(--text);margin-bottom:6px}

#map{position:fixed;left:0;right:0;bottom:0;top:0;z-index:1}
.mapmode .list{display:none}
.mapmode .top{background:none}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);font-size:14px;line-height:1}
.pin.want{background:var(--want)}
.pin.been{background:var(--been)}
.me{width:16px;height:16px;border-radius:50%;background:#0A84FF;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,132,255,.25)}
.leaflet-container{background:var(--bg);font:inherit}
.leaflet-control-attribution{font-size:10px;background:rgba(0,0,0,.35)!important;color:#ddd!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:#fff!important}
/* businesses on the map: dots, their card, and the zoom-in note */
.osm-dot{cursor:pointer}
/* The one card that keeps a blur: the search results dropping down over the map, so the map's
   streets and labels don't fight the text. */
.mapres{max-height:46vh;overflow-y:auto;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.maphint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:4;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;pointer-events:none}
/* The business card: the same clear glass as the sheets and the toast; its tip is the bottom of the
   card's gradient under the same blur, so the two read as one piece. */
.bizpop .leaflet-popup-content-wrapper{border-radius:22px;background:linear-gradient(180deg,var(--lgs-top),var(--lgs-bottom));color:var(--text);
  -webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 12px 30px var(--lift-strong)}
.bizpop .leaflet-popup-tip{background:var(--lgs-bottom);-webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);box-shadow:inset 0 0 0 1px var(--lgs-edge),0 3px 14px var(--lift)}
.bizpop .leaflet-popup-content{margin:12px 14px;font:inherit;min-width:200px}
.bizcard b{display:block;font-size:16px;font-weight:700;margin-bottom:2px}
.bizcard small{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.bizacts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bizacts button{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--accent-text);background:var(--gb-shine),var(--lgs-field);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 1px 3px var(--lift)}
.bizacts button:active{background:var(--lgs-row)}
.bizacts button:first-child{color:var(--cta-ink);background:var(--cta);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),inset 0 1px 1px rgba(255,255,255,.5),0 6px 18px color-mix(in srgb,var(--accent) 34%,transparent)}
.bizacts button:first-child:active{background: var(--cta); filter: brightness(.94); }
.mapbtns{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:4;display:flex;flex-direction:column;gap:8px}

/* The dock: the Map | List pill on the left and + on the right, floating at the bottom, as in Travel and Podcasts */
.dock{position:fixed;left:0;right:0;max-width:560px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 18px;pointer-events:none}
.dock > *{pointer-events:auto}
.tabs{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;box-shadow:inset 0 1px 0 var(--hi),0 10px 30px var(--lift-strong)}
.tab{height:44px;border-radius:999px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:14.5px;color:var(--muted);transition:color .2s,transform .18s var(--ease)}
.tab:active{transform:scale(.94)}
.tab svg{width:19px;height:19px}
.tab[aria-selected="true"]{color:var(--text)}
.tabs:not(.slides) .tab[aria-selected="true"]{background:var(--seg-thumb)}
.fab{position:relative;width:58px;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  color:var(--cta-ink);background:var(--cta);box-shadow:inset 0 0 0 1px rgba(255,255,255,.34),0 10px 26px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .18s var(--ease)}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke-width:2.2}

/* ---- sheets: Liquid Glass, as in Notes and Weather ---- */
.sheetwrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--lgs-scrim);animation:fade .25s both}
.sheet{position:relative;width:calc(100% - 16px);max-width:544px;margin:0 8px 8px;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;
  max-height:calc(100dvh - env(safe-area-inset-top,0px) - 32px);background:linear-gradient(180deg,var(--lgs-top),var(--lgs-bottom));
  -webkit-backdrop-filter:var(--lgs-filter);backdrop-filter:var(--lgs-filter);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1.5px 1px var(--lgs-rim),0 24px 60px var(--lift-strong);animation:up .32s var(--ease) both}
.sheet.full{height:calc(100dvh - env(safe-area-inset-top,0px) - 32px)}
@keyframes up{from{transform:translateY(calc(100% + 24px))}}
@keyframes fade{from{opacity:0}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--hair);margin:6px auto 0;flex:none}
.sheethead{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 10px}
.sheethead h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center}
.sheethead h2:first-child{text-align:left;padding-left:8px}
.sheethead .iconbtn{width:44px;height:44px;color:var(--text);background:var(--gb-shine),var(--lgs-field);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 4px 14px var(--lift)}
.sheethead .ok{color:var(--cta-ink);background:var(--cta)}
.sheethead .ghost{visibility:hidden}
.sheetbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:6px 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12px);mask-image:linear-gradient(180deg,transparent,#000 12px)}
.box,.rgroup{border-radius:26px;background:var(--tile);box-shadow:inset 0 0 0 .5px var(--tile-edge)}
.box{padding:12px 16px}
.rgroup{overflow:hidden}
.field{display:flex;flex-direction:column;gap:8px}
.label{margin:0 10px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.hint{margin:0 10px;font-size:12.5px;line-height:1.5;color:var(--faint)}
.plain{width:100%;border:0;outline:0;background:none;padding:4px 0;font-size:16px;color:var(--text)}
textarea.plain{resize:none;min-height:72px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);background:var(--lgs-field);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim),0 1px 3px var(--lift)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{color:var(--sel-ink);font-weight:600;background:var(--gb-shine),color-mix(in srgb,var(--accent) var(--tint-mix),transparent)}
.opts.slides .opt[aria-checked="true"]{background:none;box-shadow:none}
.rate{display:flex;gap:6px}
.rate button{font-size:30px;line-height:1;color:var(--hair);transition:transform .15s var(--ease)}
.rate button.on{color:var(--star)}
.rate button:active{transform:scale(.85)}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type="date"]{border:0;border-radius:999px;padding:7px 13px;background:var(--lgs-field);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim);font-size:15px}
.linkbtn{color:var(--accent-text);font-weight:600;font-size:14px;padding:4px 6px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;font-size:16px}
.rowbtn + .rowbtn{border-top:.5px solid var(--hair)}
.rowbtn:active{background:var(--lgs-field)}
.rowbtn .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--lgs-field);color:var(--icon);flex:none;font-size:17px}
.rowbtn .sub{display:block;font-size:13px;color:var(--muted)}
.btn{min-height:48px;border-radius:26px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--cta-ink);background:var(--cta);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.quiet{color:var(--text);background:var(--lgs-row);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim)}
.btn.danger{color:var(--danger-text);background:var(--lgs-row);box-shadow:inset 0 0 0 1px var(--lgs-edge),inset 0 1px 1px var(--lgs-rim);font-weight:500}
.info{display:flex;flex-direction:column;gap:8px;font-size:15px}
.info div{display:flex;gap:10px;align-items:flex-start}
.info .k{flex:none;width:22px;text-align:center}
.info .v{flex:1;min-width:0;white-space:pre-line;overflow-wrap:anywhere}
.meta{margin:2px 0 0;font-size:14px;color:var(--muted)}
.result{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px}
.result + .result{border-top:.5px solid var(--hair)}
.result:active{background:var(--lgs-field)}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>   <!-- Vintage's atomic shapes (first, so ../home/sky.js puts its stars here) -->
    <div class="titlerow">
      <h1 class="title">Places<small id="sub"></small></h1>
      <div class="acts">
        <button class="iconbtn glass" id="setBtn" type="button" aria-label="Settings"><svg class="i gear" viewBox="0 0 24 24" stroke-width="1.7" aria-hidden="true" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="3"/><path d="M12 3.5l1.3 2.3 2.6-.7.6 2.6 2.6.6-.7 2.6 2.3 1.3-2.3 1.3.7 2.6-2.6.6-.6 2.6-2.6-.7L12 20.5l-1.3-2.3-2.6.7-.6-2.6-2.6-.6.7-2.6L3.5 12l2.3-1.3-.7-2.6 2.6-.6.6-2.6 2.6.7z"/></svg></button>
      </div>
    </div>
    <div class="seg glass" id="seg" role="group" aria-label="Which list">
      <button type="button" data-tab="want" aria-pressed="true">Want to go <b id="nWant">0</b></button>
      <button type="button" data-tab="been" aria-pressed="false">Been <b id="nBeen">0</b></button>
    </div>
    <label class="search glass" id="filterWrap">
      <svg class="i" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
      <input id="filter" type="search" placeholder="Search your places and businesses" autocomplete="off" enterkeyhint="search" aria-label="Search your places and businesses">
      <span class="spinner" id="filterSpin" hidden></span>
    </label>
    <div class="group mapres" id="mapResults" hidden></div>
    <div class="chips" id="chips" role="group" aria-label="Sort and filter"></div>
  </header>
  <main class="list" id="list"></main>
</div>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>   <!-- Standard's Sea glass aurora, behind everything -->
<div id="map" hidden></div>
<div class="mapbtns" id="mapBtns" hidden>
  <button class="iconbtn glass" id="locBtn" type="button" aria-label="Show where I am"><svg class="i" viewBox="0 0 24 24"><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3"/><circle cx="12" cy="12" r="6.2"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg></button>
  <button class="iconbtn glass" id="fitBtn" type="button" aria-label="Show all places"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
</div>
<div class="maphint glass" id="mapHint" role="status" hidden></div>
<!-- The dock, as in the other apps: the floating Map | List pill, and + -->
<div class="dock">
  <nav class="tabs glass" id="views" role="tablist" aria-label="Map or list">
    <button class="tab" type="button" role="tab" data-view="map" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><path d="M9 4.5L3.8 6.6v12.9L9 17.4l6 2.1 5.2-2.1V4.5L15 6.6z"/><path d="M9 4.5v12.9M15 6.6v12.9"/></svg>Map</button>
    <button class="tab" type="button" role="tab" data-view="list" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11"/><circle cx="4.6" cy="6.5" r="1" fill="currentColor"/><circle cx="4.6" cy="12" r="1" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1" fill="currentColor"/></svg>List</button>
  </nav>
  <button class="fab" id="fab" type="button" aria-label="Add a place"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<!-- Add a place -->
<div class="sheetwrap" id="addSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet full" role="dialog" aria-modal="true" aria-labelledby="addLbl">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheethead"><h2 id="addLbl">Add a place</h2><button class="iconbtn" data-close type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="sheetbody">
      <form class="search glass" id="findForm" autocomplete="off" action="#" style="background:var(--lgs-field)">
        <svg class="i" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="M16.2 16.2l4.3 4.3"/></svg>
        <input id="find" type="search" placeholder="Name, type or address" enterkeyhint="search" aria-label="Search for a place">
        <span class="spinner" id="findSpin" hidden></span>
      </form>
      <div class="rgroup" id="results" hidden></div>
      <div class="rgroup">
        <button class="rowbtn" type="button" id="addHere"><span class="ic">📍</span><span>Add where I am</span></button>
        <button class="rowbtn" type="button" id="addPaste"><span class="ic">📋</span><span>Paste a map link<span class="sub">In Maps: Share, then Copy</span></span></button>
        <button class="rowbtn" type="button" id="addBlank"><span class="ic">✏️</span><span>Type it in</span></button>
      </div>
      <div class="box" id="pasteBox" hidden><textarea class="plain" id="pasteText" placeholder="Touch and hold, then Paste the link here" aria-label="Map link"></textarea><button class="linkbtn" id="pasteGo" type="button">Add</button></div>
    </div>
  </div>
</div>

<!-- A place -->
<div class="sheetwrap" id="placeSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet full" role="dialog" aria-modal="true" aria-labelledby="plLbl">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheethead">
      <button class="iconbtn" data-close type="button" aria-label="Cancel"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 id="plLbl">Place</h2>
      <button class="iconbtn ok" id="plSave" type="button" aria-label="Save"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button>
    </div>
    <div class="sheetbody">
      <div class="box">
        <input class="plain" id="plName" placeholder="Name" aria-label="Name" style="font-size:20px;font-weight:700">
        <p class="meta" id="plMeta"></p>
      </div>
      <div class="opts" id="plStatus" role="radiogroup" aria-label="Want to go or been">
        <button class="opt" type="button" role="radio" data-st="want" aria-checked="true">Want to go</button>
        <button class="opt" type="button" role="radio" data-st="been" aria-checked="false">Been</button>
      </div>
      <div class="field" id="plRateField">
        <p class="label">Your rating</p>
        <div class="box"><div class="rate" id="plRate" role="radiogroup" aria-label="Rating"></div></div>
      </div>
      <div class="field">
        <p class="label">Price</p>
        <div class="opts" id="plPrice" role="radiogroup" aria-label="Price"></div>
      </div>
      <div class="field">
        <p class="label" id="plDateLbl">Planned for</p>
        <div class="box"><div class="inrow"><input type="date" id="plDate" aria-label="Date"><button class="linkbtn" id="plDateClear" type="button">Clear</button><button class="linkbtn" id="plToday" type="button">Today</button><button class="linkbtn" id="plAgain" type="button">Went again today</button></div></div>
        <p class="hint" id="plDateHint" hidden></p>
        <p class="hint" id="plCal" hidden>📅 Added from the Family calendar.</p>
      </div>
      <div class="field">
        <p class="label">Notes and tags</p>
        <div class="box"><textarea class="plain" id="plNotes" placeholder="What to order, who recommended it… Add #tags like #brunch" aria-label="Notes"></textarea></div>
      </div>
      <div class="field" id="plInfoField" hidden>
        <p class="label">From OpenStreetMap</p>
        <div class="box"><div class="info" id="plInfo"></div></div>
      </div>
      <div class="rgroup" id="plMapRow">
        <button class="rowbtn" type="button" id="plDirections"><span class="ic">🧭</span><span>Directions</span></button>
        <button class="rowbtn" type="button" id="plOpen"><span class="ic">🗺️</span><span>Open in Apple Maps</span></button>
      </div>
      <button class="btn danger" id="plDelete" type="button">Delete place</button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="sheetwrap" id="setSheet" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="setLbl">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheethead"><h2 id="setLbl">Settings</h2><button class="iconbtn ok" data-close type="button" aria-label="Done"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2.2"><path d="M4.6 12.8l4.3 4.3a.7.7 0 0 0 1 0L19.4 7.6"/></svg></button></div>
    <div class="sheetbody">
      <div id="setBody"></div>   <!-- the sections, written by renderSettings (../home/settings.js) -->
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAct" type="button" hidden>Undo</button></div>
