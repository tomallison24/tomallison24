<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Home-screen icon. Full-bleed square: iOS rounds the corners itself.
       A white note card with a ticked box on a mint -> blue sky, so it sits
       beside Mail (sunrise) and News (white page) as its own app. -->
  <defs>
    <linearGradient id="sky" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4BE3B8"/>
      <stop offset="0.5" stop-color="#1FB5D6"/>
      <stop offset="1" stop-color="#2E6BFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0B2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect x="222" y="190" width="580" height="660" rx="96" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="302" y="292" width="96" height="96" rx="30" fill="#2E6BFF"/>
  <path d="M326 342l24 24 44-50" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="440" y="318" width="282" height="44" rx="22" fill="#1E2A5A" fill-opacity="0.85"/>
  <rect x="302" y="470" width="420" height="40" rx="20" fill="#1E2A5A" fill-opacity="0.22"/>
  <rect x="302" y="566" width="360" height="40" rx="20" fill="#1E2A5A" fill-opacity="0.22"/>
  <rect x="302" y="662" width="260" height="40" rx="20" fill="#1E2A5A" fill-opacity="0.22"/>
</svg>
